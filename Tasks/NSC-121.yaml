  "notes": "AUTHORED BY GER 2026-09-25 from Vincent's decision, relayed by the Documentation Agent, which explicitly flagged that the phrase he approved was its own shorthand - that honesty is why AC-001 can separate what he decided from what he did not. NEW CONTRACT RATHER THAN A NSC-116 REVISION, AND THE REASON IS MEASURED AT THE BLOB: NSC-116 VAL-001 asserts that 'the enemy's distance from the wizard strictly increases while fleeing'. A sheltering enemy moves laterally or toward the wizard, so folding sheltering into NSC-116 would have forced that assertion to be weakened - and that assertion is the thing that makes NSC-116's gate a real test rather than an eyeball. Scoping a gate down to fit new work is the move I refused twice elsewhere on 2026-09-25 and it would have been wrong here too. NSC-116 stays four resources, five ACs, one gate. THE INVARIANT IN AC-004 IS WHAT MAKES THE SPLIT SAFE: with no shelter in range this task changes nothing NSC-116 asserts, and VAL-001 proves that directly. NOT ESTABLISHED: no Unity was run, no Astra design job was commissioned, the search radius and minimum cover height have no measured defaults yet, and whether an enemy used as a shield should itself be allowed to shelter at the same moment is left to the implementer. confidence is MEDIUM for those reasons and because AC-006's GDD tension is open.",
