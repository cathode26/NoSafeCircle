      "requirement": "DECIDED BY GER - WHAT COUNTS AS COVER, CHOSEN SO THAT NO NEW AUTHORING IS NEEDED. Static cover is any collider under a room's GameplayGeometry category whose top is at or above a serialized minimum height with a stated default. THIS DELIBERATELY REUSES THE GEOMETRY THE ROOMS ALREADY CARRY - shelves, collapsed furniture and archive bays are already authored as GameplayGeometry BoxColliders - so this task adds no cover volumes, no tags and no scene authoring, and it works in every committed room on the day it lands. A shelter of the other kind is any other live enemy carrying NSC-091's EnemyTargetKnowledge. Neither kind is registered, tagged or authored specially; both are discovered at runtime."
