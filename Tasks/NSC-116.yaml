    },
    {
      "criterion_id": "AC-004",
      "reference": "NSC-031 Floor Run/Restart: a zero-health restart must not leave enemies in a flee state",
      "requirement": "DECIDED BY GER - FLEE SHAPE AND END CONDITION. A fleeing enemy moves away from the charging wizard until it is beyond the radius, driving NSC-092's NavMeshAgent movement rather than moving the transform directly, then resumes its normal NSC-091/NSC-092 behaviour. Fleeing ends when the charge is released, is cancelled, drops below the threshold, or the wizard dies mid-charge; in every one of those cases the enemy resumes normal behaviour rather than remaining stuck in flight. No enemy is left fleeing after the thing it fled from is gone."
    },
    {
      "criterion_id": "AC-005",
      "reference": "GDD Section 3; the tension was put to Vincent by the Documentation Agent before he decided",
      "requirement": "THE GDD TENSION IS RECORDED RATHER THAN RESOLVED SILENTLY. The GDD's stated goal is that \"charging becomes unsafe once they close the distance\", which implies enemies CLOSING. Fleeing does the opposite: it makes charging safer and turns the fireball into crowd control rather than a damage combo. Both are coherent games and they are not the same game. Vincent chose fleeing with that tension put to him in the same turn. IF THE GDD SENTENCE IS FOUND TO BE LOAD-BEARING ELSEWHERE, THAT IS A CONTRACT QUESTION TO RAISE - it must not be resolved by quietly reverting this behaviour to closing the distance."
