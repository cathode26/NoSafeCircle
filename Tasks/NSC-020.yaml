n the same fixture. Call DoorInteractable.ResetDoor, return the wizard to its approach-side initial position through PlayerMovement.ResetMovement, reopen, cross through real physics again, and verify exactly one event per run. On the clean candidate, load the committed DoorPrototype scene without saving and, for each of D1 through D5, verify that the runtime-created ForwardCrossingTrigger's near face in door-local Z is at or beyond that door's doorwayBlocker forward face plus twice the scene Player's CharacterController radius, and that each door's local +Z axis points toward the next room or, for D5, the escape side. Verify the focused tests and the committed-scene check leave HEAD, tracked files, and untracked files unchanged. Finally, in human Play Mode at gameplay-camera scale, open D1 and step to the threshold then retreat without locking; walk fully through and verify the door locks behind the freely moving wizard; repeat after a zero-health restart. D5 victory presentation is not claimed by this gate.",
