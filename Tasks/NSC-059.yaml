  "acceptance_criteria": [
    {
      "criterion_id": "AC-001",
      "reference": "Engineering Standards §5.4 Reuse and tool selection",
      "requirement": "Review code-bearing gameplay work that already has completion evidence and classify each relevant subsystem as Keep, Refactor, or Defer for direct references, local C# events, deVoid Signals, DOTween/fader use, Addressables/content loading, and pooling."
    },
    {
      "criterion_id": "AC-002",
      "reference": "Engineering Standards — consider, don't force",
      "requirement": "Every Refactor recommendation cites exact repository paths and a concrete maintenance, lifecycle, duplication, performance, or testability benefit. A library's existence by itself is never sufficient justification."
    },
    {
      "criterion_id": "AC-003",
      "reference": "Engineering Standards §5.1/§5.3 communication boundaries",
      "requirement": "Explicitly identify local C# event/direct-reference relationships that should remain local rather than being converted to deVoid Signals."
    },
    {
      "criterion_id": "AC-004",
      "reference": "TaskGraph evidence authority",
      "requirement": "Treat completed-task contracts and evidence as historical behavior authority. Recommend additive follow-up task keys/targets for worthwhile refactors rather than changing old completion evidence or pretending the original work was incomplete."
    },
    {
      "criterion_id": "AC-005",
      "reference": "Engineering Standards §8 Addressables and §10 pooling",
      "requirement": "Do not recommend Addressables or pooling retrofits where the current code has no meaningful dynamic-loading/lifetime or repeated-spawn cost problem; record Defer/Keep when no concrete benefit exists."
    }
  ],
  "completion_gates": [
