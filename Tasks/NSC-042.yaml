  "notes": "This is an explicit follow-up to NSC-039 and must not block closing NSC-039 once its sorting foundation is conformant. Scope is straight-wall visual continuity and scalable repetition. Final wall art, decorative variation, corners, junctions, end caps, and room-specific wall dressing are out of scope unless a minimal treatment is required to prove seamless straight-wall repetition. *** REVISION 2, 2026-09-27: THE VALIDATION POLICY ENTRY IS REMOVED AND TWO DEAD RESOURCES ARE DROPPED. *** The entry bound EditMode to a single class, DoorPrototypeSceneBuilderTests, DELETED at eee0a6ac, so the platform could only ever discover zero tests. I DID NOT SUBSTITUTE A CLASS, and the reason is a rule I wrote for a tool and must obey myself: a replacement filter must be REACHABLE FROM THE TASK'S OWN GATES. NSC-042's three gates name NO fixture at all - VAL-001 and VAL-002 say only \"Unity validation confirms...\" and VAL-003 is a human check at the gameplay camera - and the one test file this task owned was the deleted one. There is nothing for a filter to point at, so pointing it anywhere would be an invention. A MISSING ENTRY AND A STALE ENTRY HAVE THE SAME EFFECT on candidate validation - policy_entry_commit.py's own docstring says the candidate stays retained either way - so the choice is made on which misleads a reader less, and an entry naming a deleted class actively misleads: a real run against it was observed to exit 30 with a generic \"zero passed tests\" message that does not name the missing class. WHAT IS NOT FIXED: this task still has no way to be re-validated in Unity. That is a real cost and it is recorded rather than hidden. WHY THIS IS SAFE ON A DELIVERED TASK, AND WHY I PREVIOUSLY REFUSED IT: I had concluded that ANY revision un-delivers, from current_conformance.py's needs_replan/contract_changed message. THAT WAS WRONG AND THE FUNCTION'S OWN DOCSTRING SAYS SO IN ITS FIRST LINE - _delivered_scope_unchanged: \"A revision or provenance edit does not undo an approved delivery. A changed acceptance criterion or completion gate still needs a new decision.\" It compares exactly five fields - kind, type, execution_scope, acceptance_criteria, completion_gates - and :485's ancestry test short-circuits the staleness branch, which CLAUDE.md already documents. I read the condition and never read the semantics, with the file open. Corrected by the Pipeline Maintainer, which also measured 13 tasks currently conformant AFTER a post-delivery revision against a control of 48 whose revisions match. This revision touches notes, provenance and exclusive_resources ONLY - none of the five - so the approved delivery stands and earns at most one more advisory.",
