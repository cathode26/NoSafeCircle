  "notes": "AUTHORED 2026-09-27 FROM agent-state/intent-NSC-132-enemy-pursuit-sight-fallback-and-leash-detour.md, at game main 214bc37e. *** THE ID SHIFTED AND THAT MATTERS FOR ANYONE HOLDING A REFERENCE: the intent file reserves NSC-132 for this work, and this contract is NSC-131. new_task_commit.py requires new ids to be contiguous from the highest existing task, which was NSC-129, and the intent reserved for NSC-131 (player navmesh pathfinding) was ruled NOT to need a contract because its fix merged at 214bc37e. So intent-NSC-132 maps to task NSC-131, and intent-NSC-131 maps to no task at all and never will. *** ONLY HALF OF THE INTENT IS HERE. Its half (b), the leash tripping on a legitimate detour, IS ALREADY FIXED: Vincent settled the anchor as TOWED on 2026-09-27, the Game Agent implemented it, and the ordinary-chase give-up is gone at main - read at source before this was written. This contract carries half (a), the sight fallback, only. THE DESIGN DECISION IS GER'S AND IS RECORDED RATHER THAN LEFT OPEN: a sight-blocked enemy INVESTIGATES - it closes on the wizard's detected position without acquiring, and acquires only when the view actually clears. WHAT WAS RULED OUT AND WHY: approaching the last-glimpsed point, which the intent listed as an option, IS NOT AVAILABLE IN THE REPORTED CASE - the enemy never acquired, so there is no glimpse and LastKnownPosition holds nothing from a sighting. A criterion naming it would have been unsatisfiable exactly where the defect lives, which is the failure this contract family has already paid for once. THE MECHANISM IS THE IMPLEMENTER'S, NOT THIS CONTRACT'S: whether this is a new state, a flag, or a movement-side behaviour, what anything is named, and how the approach point is chosen are all open. THE PARENT IS NSC-010 (Enemies) AND NOT NSC-014, DELIBERATELY: NSC-014 is a DECOMPOSED aggregate whose decomposition_children name exactly NSC-091 and NSC-092, so parenting a third task under it would assert that this behaviour was part of that decomposition's scope - it was not, and taskcontrol validate refuses it outright. NSC-010 is the coarse Enemies umbrella and already parents every recent enemy behaviour task including NSC-114, NSC-116, NSC-121 and NSC-129, so this is the conventional home rather than a way around a guard. WHY THE RESOURCE LIST IS SUFFICIENT WITHOUT NAMING A MECHANISM: at least one route to the required outcome exists entirely inside the one implementation file this task declares, because EnemyPursuitMovement.HandleSearching already sets the agent's destination to LastKnownPosition and reports arrival, so knowledge-side state alone can produce motion. That is offered as evidence the list is adequate, NOT as a requirement to take that route - and if the chosen mechanism needs EnemyPursuitMovement.cs, that file is declared by NSC-017, NSC-092 and NSC-125 and this contract must be revised to add it rather than written outside its resources. CONTENTION, MEASURED: EnemyTargetKnowledge.cs is declared by exactly TWO other contracts, NSC-091 and NSC-111, parsed from the exclusive_resources arrays of all 128 task files with DoorPrototypeGlobalSceneBuilder.cs at 13 owners as a control - a whole-file grep says six and NSC-015, NSC-088, NSC-112 and NSC-125 are prose only. Both have a delivery record and there are ZERO candidate refs in canonical, so the three-way contention is not live today. NSC-111's control record reads awaiting_human, which is un-revisable, and nothing here touches it - its criterion (3) requires the give-up for a REDIRECTED enemy and that path is preserved. confidence is MEDIUM because the behaviour is a design choice made under the 80-percent rule rather than one Vincent specified, and because AC-003's no-oscillation bound is the clause most likely to need a number once someone watches it. NOT ESTABLISHED: no Unity was run; whether the other melee enemies behave the same way is unmeasured, since only ba-melee-1 was instrumented; and why the route to a point four units north detours as far west as x = -3.167 is still unexplained and is not this task's to answer. *** REVISION 2, 2026-09-27, AND IT IS A CORRECTION TO THIS CONTRACT RATHER THAN A CHANGE OF SCOPE. *** TWO FIXTURE PATHS ADDED ON A GER RULING (option A of an A/B the Game Agent put to me): Tests/EnemySightFallbackPlayModeTests.cs and its .meta, six component tests that drive UpdateTargetKnowledge directly and build their own occluder. THE RULING GOT STRONGER, NOT WEAKER, WHEN THE ROOM REPRODUCTION WAS REFUTED: with the real room no longer reproducing the defect, a fixture that constructs its own occluder is the only thing left that can prove the behaviour, so folding it into the room fixture would have deleted the only surviving evidence. It also fails DIFFERENTLY from the world-loading fixture - a world-setup fault cannot condemn both - and it can assert a NEGATIVE across ten ticks, which is the only way AC-003's no-oscillation clause is checkable at all. WHAT WAS REFUTED AND BY WHOM: the Game Agent reported the room reproduction passing at its work commit, then withdrew the causal claim itself when its baseline at 214bc37e measured 3.8780 against 3.8781 - the reproduction was already green before a line was written. THAT WITHDRAWAL IS WHY THIS REVISION EXISTS. AND THE MECHANISM BEHIND IT IS NOT THE ONE FIRST REPORTED, WHICH MATTERS BECAUSE IT DECIDES WHAT ANYONE BUILDS NEXT: the first account was that the props dropped below the sight ray. Re-measured at e02d54e9^ versus main, ba_shelf_bank_z_middle went size y 2.730 -> 1.502 and z 1.656 -> 0.580, and it STILL SPANS y=1.0 - as do ba_shelf_bank_z_start and fr_landmark_bone_throne. 7 of 41 collider tops remain above that height, independently reproduced. So THE DIMENSION THAT BROKE SIGHT IS DEPTH, NOT HEIGHT: the box became 65 percent thinner and the ray between two particular points now passes through where 1.656 units of collider used to be. A fix aimed at restoring height would not restore cover. That check is in local space and assumes the prop sits at y=0 with both eyes near 1.0, and it is stated here as an approximation rather than a proof. NSC-130 CARRIES THE CONSEQUENCE, not this task: one BoxCollider is serving both movement blocking and sight occlusion, and the base-footprint rule is correct for the first and destructive to the second. AC-004 HERE IS UNCHANGED AND IS NOW GUARDING A LIVE REGRESSION RATHER THAN A HYPOTHETICAL ONE - the cheap wrong fix it forbids is the thing that has already happened, accidentally, from a different change Vincent asked for, before any criterion existed to catch it. *** REVISION 3, 2026-09-27: REV 2'S STATED REASON FOR REPAIRING VAL-001 WAS PARTLY FALSE, AND THE REQUIREMENT SURVIVES IT UNCHANGED. *** Rev 2 recorded that the reported case stopped reproducing because the room no longer provided a landmark-scale occluder. A live eight-direction raycast run in the built world refutes that for the Bone Archive: ba-melee-1 has 2 of 8 walkable approach directions sight-blocked, +X+Z and +X-Z, and 6 clear. THE ROOM STILL HAS COVER. What changed is that +X - the direction the existing fixture's placement helper tries first - flipped from blocked to clear, which explains the green baseline exactly. The requirement is unchanged and better supported: the gate depended on the dressing AND on one helper's direction order at once. WHY THE WORDING MATTERED ENOUGH TO SPEND A REVISION ON: left standing, rev 2 told every future reader the rooms have no cover, which is false for the Bone Archive and would stop someone looking for the room that genuinely has none. AND THAT ROOM EXISTS AND IS NAMED: fr-melee-1 in the FINAL ROOM has ZERO of 8 directions sight-blocked, and neither the Game Agent nor I had looked at it. **WHETHER THAT IS THE SAME COLLIDER-RESHAPE REGRESSION OR A SEPARATE DEFECT IN A DIFFERENT ROOM IS NOT ESTABLISHED, and the run's own author flagged that rather than papering over it.** It is not this task's to answer and no criterion 