  "notes": "AUTHORED 2026-09-27 FROM agent-state/intent-NSC-132-enemy-pursuit-sight-fallback-and-leash-detour.md, at game main 214bc37e. *** THE ID SHIFTED AND THAT MATTERS FOR ANYONE HOLDING A REFERENCE: the intent file reserves NSC-132 for this work, and this contract is NSC-131. new_task_commit.py requires new ids to be contiguous from the highest existing task, which was NSC-129, and the intent reserved for NSC-131 (player navmesh pathfinding) was ruled NOT to need a contract because its fix merged at 214bc37e. So intent-NSC-132 maps to task NSC-131, and intent-NSC-131 maps to no task at all and never will. *** ONLY HALF OF THE INTENT IS HERE. Its half (b), the leash tripping on a legitimate detour, IS ALREADY FIXED: Vincent settled the anchor as TOWED on 2026-09-27, the Game Agent implemented it, and the ordinary-chase give-up is gone at main - read at source before this was written. This contract carries half (a), the sight fallback, only. THE DESIGN DECISION IS GER'S AND IS RECORDED RATHER THAN LEFT OPEN: a sight-blocked enemy INVESTIGATES - it closes on the wizard's detected position without acquiring, and acquires only when the view actually clears. WHAT WAS RULED OUT AND WHY: approaching the last-glimpsed point, which the intent listed as an option, IS NOT AVAILABLE IN THE REPORTED CASE - the enemy never acquired, so there is no glimpse and LastKnownPosition holds nothing from a sighting. A criterion naming it would have been unsatisfiable exactly where the defect lives, which is the failure this contract family has already paid for once. THE MECHANISM IS THE IMPLEMENTER'S, NOT THIS CONTRACT'S: whether this is a new state, a flag, or a movement-side behaviour, what anything is named, and how the approach point is chosen are all open. THE PARENT IS NSC-010 (Enemies) AND NOT NSC-014, DELIBERATELY: NSC-014 is a DECOMPOSED aggregate whose decomposition_children name exactly NSC-091 and NSC-092, so parenting a third task under it would assert that this behaviour was part of that decomposition's scope - it was not, and taskcontrol validate refuses it outright. NSC-010 is the coarse Enemies umbrella and already parents every recent enemy behaviour task including NSC-114, NSC-116, NSC-121 and NSC-129, so this is the conventional home rather than a way around a guard. WHY THE RESOURCE LIST IS SUFFICIENT WITHOUT NAMING A MECHANISM: at least one route to the required outcome exists entirely inside the one implementation file this task declares, because EnemyPursuitMovement.HandleSearching already sets the agent's destination to LastKnownPosition and reports arrival, so knowledge-side state alone can produce motion. That is offered as evidence the list is adequate, NOT as a requirement to take that route - and if the chosen mechanism needs EnemyPursuitMovement.cs, that file is declared by NSC-017, NSC-092 and NSC-125 and this contract must be revised to add it rather than written outside its resources. CONTENTION, MEASURED: EnemyTargetKnowledge.cs is declared by exactly TWO other contracts, NSC-091 and NSC-111, parsed from the exclusive_resources arrays of all 128 task files with DoorPrototypeGlobalSceneBuilder.cs at 13 owners as a control - a whole-file grep says six and NSC-015, NSC-088, NSC-112 and NSC-125 are prose only. Both have a delivery record and there are ZERO candidate refs in canonical, so the three-way contention is not live today. NSC-111's control record reads awaiting_human, which is un-revisable, and nothing here touches it - its criterion (3) requires the give-up for a REDIRECTED enemy and that path is preserved. confidence is MEDIUM because the behaviour is a design choice made under the 80-percent rule rather than one Vincent specified, and because AC-003's no-oscillation bound is the clause most likely to need a number once someone watches it. NOT ESTABLISHED: no Unity was run; whether the other melee enemies behave the same way is unmeasured, since only ba-melee-1 was instrumented; and why the route to a point four units north detours as far west as x = -3.167 is still unexplained and is not this task's to answer.",
