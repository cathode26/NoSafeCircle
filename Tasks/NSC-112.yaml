{
  "acceptance_criteria": [
    {
      "criterion_id": "AC-001",
      "reference": "NSC-088 AC-005; Docs/GDD/No_Safe_Circle_GDD.md:64,87,89,534,599-611",
      "requirement": "Create SpectralDecoy.cs and SpectralDecoyPhantom.cs in Assets/NoSafeCircle/DoorPrototype/Scripts/, each with its .meta file. SpectralDecoy owns input acceptance, route validation, the PlayerMana spend, cooldown, the one active phantom, the set of affected enemies, reset, suspension and cleanup. When a cast succeeds, it discovers every enabled EnemyTargetKnowledge on an active GameObject in the loaded scenes at that moment, for example with Object.FindObjectsByType<EnemyTargetKnowledge>(FindObjectsSortMode.None). It calls TryRedirectToSpectralDecoy on each and records only the successful calls. It adds no enemy registry, tag, layer or collider. SpectralDecoyPhantom owns the runtime phantom GameObject, its NavMeshAgent movement, lifetime, SpriteRenderer feedback and cleanup. The phantom is not parented under the Player. It has no Collider, CharacterController, Rigidbody, PlayerHealth, EnemyHealth, damage behavior, tag or new physics layer. Its NavMeshAgent uses NoObstacleAvoidance, so it neither pushes nor physically blocks the wizard or enemies."
    },
    {
      "criterion_id": "AC-002",
      "reference": "NSC-088 AC-006; Docs/GDD/No_Safe_Circle_GDD.md:64,83-92",
      "requirement": "SpectralDecoy exposes public bool TryCast(), ResetSpectralDecoy(), SuspendGameplayInput() and EnableGameplayInput(), plus read-only active, cooldown and gameplay-enabled state. TryCast reads PlayerMovement.PointerWorldTarget only while PlayerMovement.HasPointerWorldTarget is true. It never polls pointer hardware, never projects through a Camera, and never calls a PlayerMovement destination or movement-restriction method. It validates the route before spending mana. A successful cast calls PlayerMana.Spend(float) exactly once before creating the phantom. These cases refuse without spending mana or restarting cooldown: no pointer target, an invalid route, an active cooldown, suspended input, or a phantom that already exists. Insufficient mana goes through PlayerMana.Spend and its existing CastDenied event. A valid cast that finds no eligible pursuer still spends mana, creates the visible phantom and starts cooldown, and the UI shows distinct placeholder feedback that no pursuer was lured."
    },
    {
      "criterion_id": "AC-003",
      "reference": "NSC-088 AC-007; NSC-089; NSC-090; NSC-017",
      "requirement": "A successful cast creates the phantom at a valid point on NSC-089's configured NavMesh. It gives the phantom the current shared pointer target as its only destination, and only when NavMesh.CalculatePath reports a complete path for the project agent type. Proposed defaults: travel speed 4.0 units per second, tunable from 3.0 to 5.0, and endpoint sampling tolerance 1.0 unit, tunable from 0.25 to 1.5. The phantom follows the shared door-passability result: it can use complete routes through open or broken doorways and continue into another room, but a sealed or locked door makes that route invalid. It never opens, closes, locks, breaks or damages a door, and never reports a player crossing. If passability changes and the remaining route becomes incomplete, the phantom stays at its last reachable position until it expires. A redirected enemy that already has EnemyLockedDoorAttack keeps using that production component when a locked door blocks its route to the phantom; this child implements no door attacks. When the phantom reaches its destination, it holds position, still visible and still the redirected enemies' CurrentTarget, until its lifetime ends."
    },
    {
      "criterion_id": "AC-004",
      "reference": "NSC-088 AC-008; Docs/GDD/No_Safe_Circle_GDD.md:17-25,50-58,79,83-92,108,534",
      "requirement": "Create Assets/NoSafeCircle/DoorPrototype/Scripts/SpectralDecoyCooldownUI.cs and its .meta file. Proposed serialized defaults: 30 mana, tunable from 25 to 40; 4.0 seconds active lifetime, tunable from 3.5 to 5.0; and 24 seconds cooldown, tunable from 18 to 35. All values must be positive, and cooldown must be at least the lifetime. Lifetime and cooldown both start when the phantom is created. One cast may buy a complete five-second door-opening window; that is intended. SpectralDecoyCooldownUI reads only SpectralDecoy's public state. It shows ready, active and cooldown progress. It flashes when a cast is refused for any reason other than mana, and it shows distinct feedback when a successful cast redirected no enemy."
    },
    {
      "criterion_id": "AC-005",
      "reference": "NSC-088 AC-009",
      "requirement": "SpectralDecoyPhantom presents a translucent teal-violet, wizard-shaped SpriteRenderer silhouette. It pulses visibly in scale and leaves sparse afterimages owned by the spell. It leaves the wizard immediately rather than lingering over them, and the flare at the cast origin is offset toward the destination. Each redirected enemy shows a teal-violet switch pulse owned by the spell; the proposed default is 0.3 seconds, tunable from 0.2 to 0.5. Authored phantom art is allowed but not required. Tinted reuse of existing SpriteRenderer content at runtime is fully acceptable. Either way, the phantom must read as a wizard-shaped decoy that a player can tell apart from the real wizard and from the Lantern Wraith lantern wisp at the fixed gameplay camera. If authored sprites exist, an art task owns them and their .meta files: this child does not claim them, must work when they already exist, and must not assert that it adds them. No authored prefab is created. Every phantom, afterimage, flare, pulse and other runtime resource has an explicit cleanup path."
    },
    {
      "criterion_id": "AC-006",
      "reference": "NSC-088 AC-010; Docs/GDD/No_Safe_Circle_GDD.md:75-79,116,528-535",
      "requirement": "Existing production components use the redirected CurrentTarget without being edited. EnemyPursuitMovement makes Melee enemies follow the phantom. A production Ranged enemy built from EnemyPursuitMovement, RangedEnemyKeepDistanceMovement and RangedEnemyAttack uses the phantom for approach, retreat, wind-up, and the direction of each newly launched projectile. A projectile already in flight when the switch happens keeps its original direction. The phantom has no Collider, so a projectile passes through it and can still hit a wizard standing behind it on the same line. A wall, shelf, table, pew or column collider still stops the projectile without changing wizard or decoy target knowledge. This child does not edit EnemyTargetKnowledge.cs, EnemyPursuitMovement.cs, EnemyLockedDoorAttack.cs, RangedEnemyKeepDistanceMovement.cs, RangedEnemyAttack.cs, RangedEnemyProjectile.cs, PlayerHealth.cs, EnemyHealth.cs or any attack tuning."
    },
    {
      "criterion_id": "AC-007",
      "reference": "NSC-088 AC-011; Docs/GDD/No_Safe_Circle_GDD.md:98-104",
      "requirement": "ResetSpectralDecoy ends the active phantom by calling EnemyTargetKnowledge.EndSpectralDecoyRedirect on each affected enemy. It clears cooldown, removes all spell feedback, and restores the enabled floor-start state. SuspendGameplayInput ends the phantom the same way and removes feedback. It then rejects Input Action and TryCast requests but keeps the elapsed cooldown. EnableGameplayInput allows later casts. These methods are safe even if TitleScreenController calls SuspendGameplayInput before SpectralDecoy.Awake runs. Add optional serialized SpectralDecoy references to TitleScreenController and WizardGameEntryController. TitleScreenController.SuspendGameplayInput calls SpectralDecoy.SuspendGameplayInput when the reference is assigned. WizardGameEntryController.EnterWorld calls SpectralDecoy.EnableGameplayInput after movement and interaction are enabled. A missing optional reference does not make game entry invalid. SpectralDecoy is not added to gameplayInputBehaviours."
    },
