{
  "acceptance_criteria": [
    {
      "criterion_id": "AC-001",
      "reference": "Docs/GDD/No_Safe_Circle_GDD.md:511-520, 524-532; PROPOSAL within_current_GDD: revalidated close-range strike",
      "requirement": "Create Assets/NoSafeCircle/DoorPrototype/Scripts/Enemies/MeleeEnemyAttack.cs and Assets/NoSafeCircle/DoorPrototype/Scripts/Enemies/MeleeEnemyAttack.cs.meta, with focused Play Mode coverage in Assets/NoSafeCircle/DoorPrototype/Tests/MeleeEnemyAttackPlayModeTests.cs and Assets/NoSafeCircle/DoorPrototype/Tests/MeleeEnemyAttackPlayModeTests.cs.meta. MeleeEnemyAttack begins one serialized wind-up, impact, and cooldown cycle only when EnemyTargetKnowledge.State is Pursuing, EnemyTargetKnowledge.CurrentTarget is within the serialized close attack range, and EnemyHealth.IsDefeated is false. At impact it rechecks the same target, Pursuing state, range, and defeat state. An invalid impact completes without damage. MeleeEnemyAttack does not pause, slow, reposition, or otherwise configure enemy locomotion; on the current production path EnemyPursuitMovement therefore continues updating movement during wind-up unless Vincent approves a later locomotion-owner revision."
    },
    {
      "criterion_id": "AC-002",
      "reference": "Docs/GDD/No_Safe_Circle_GDD.md:515, 520; Player Health ownership",
      "requirement": "For one valid impact, MeleeEnemyAttack uses the PlayerHealth component on EnemyTargetKnowledge.CurrentTarget.gameObject and calls PlayerHealth.TakeDamage(float) exactly once with a serialized positive damage value. It does not write PlayerHealth.CurrentHealth, create duplicate player-health state, or apply per-frame contact damage. Straight-line movement is not claimed to evade a started wind-up; range revalidation supports separation created by obstacle cornering, Frost-assisted movement, Force Wave displacement, or defeat."
    },
    {
      "criterion_id": "AC-003",
      "reference": "Docs/GDD/No_Safe_Circle_GDD.md:690-691; floor restart ownership",
      "requirement": "MeleeEnemyAttack exposes public ResetAttack(), which cancels a current wind-up or pending impact, clears cooldown, returns the component to its initial idle state, and prevents delayed damage from the cancelled cycle. The focused Play Mode tests invoke ResetAttack() during early wind-up, during late wind-up immediately before the scheduled impact, and during cooldown and verify that a later valid attack can begin normally."
    },
    {
      "criterion_id": "AC-004",
      "reference": "Docs/GDD/No_Safe_Circle_GDD.md:562-568, 670-674; NSC-039, NSC-077, and NSC-089 handoffs",
      "requirement": "Create Assets/NoSafeCircle/DoorPrototype/Editor/MeleeEnemyGameplayPrefabBuilder.cs and Assets/NoSafeCircle/DoorPrototype/Editor/MeleeEnemyGameplayPrefabBuilder.cs.meta. Its public static MeleeEnemyGameplayPrefabBuilder.BuildMeleeEnemyGameplayPrefab() production entry point, exposed at the Editor menu path No Safe Circle/Build Melee Enemy Gameplay Prefab, exclusively materializes Assets/NoSafeCircle/DoorPrototype/Generated/MeleeEnemyGameplay.prefab and Assets/NoSafeCircle/DoorPrototype/Generated/MeleeEnemyGameplay.prefab.meta. The prefab and its meta file are builder output and must not be hand-written or reconstructed. Create Assets/NoSafeCircle/DoorPrototype/Tests/Editor/MeleeEnemyGameplayPrefabTests.cs and Assets/NoSafeCircle/DoorPrototype/Tests/Editor/MeleeEnemyGameplayPrefabTests.cs.meta for a non-saving temporary builder seam and deliberate read-only conformance checks against the exact generated prefab."
    },
    {
      "criterion_id": "AC-005",
      "reference": "Docs/GDD/No_Safe_Circle_GDD.md:75-79, 88, 526-532, 673-685; Resources, Feedback, and Failure",
      "requirement": "Create Assets/NoSafeCircle/DoorPrototype/Tests/MeleeEnemyPursuitPlayModeTests.cs and Assets/NoSafeCircle/DoorPrototype/Tests/MeleeEnemyPursuitPlayModeTests.cs.meta. The generated prefab uses the project-configured NavMesh agent type, radius, and height established by NSC-089 and does not edit ProjectSettings. The builder serializes only Melee-specific movement tuning such as speed, acceleration, angular speed, stoppingDistance, autoBraking, obstacleAvoidanceType, and avoidancePriority. Its serialized stoppingDistance is below MeleeEnemyAttack's close attack range, and its serialized speed is present before EnemyStatusEffectMovement.Awake records BaselineSpeed. In later-encounter tuning, production PlayerMovement cannot preserve indefinite distance during an unobstructed retreat that starts and remains within LoseTargetDistance. NSC-015 code supplies no per-enemy slot or offset destination."
    },
    {
      "criterion_id": "AC-006",
      "reference": "Docs/GDD/No_Safe_Circle_GDD.md:522, 576, 686; Enemy Health/Defeat ownership",
      "requirement": "Create Assets/NoSafeCircle/DoorPrototype/Scripts/Enemies/MeleeEnemyDefeatResponse.cs and Assets/NoSafeCircle/DoorPrototype/Scripts/Enemies/MeleeEnemyDefeatResponse.cs.meta, with focused coverage in Assets/NoSafeCircle/DoorPrototype/Tests/MeleeEnemyDefeatResponsePlayModeTests.cs and Assets/NoSafeCircle/DoorPrototype/Tests/MeleeEnemyDefeatResponsePlayModeTests.cs.meta. On EnemyHealth.Defeated, MeleeEnemyDefeatResponse calls MeleeEnemyAttack.ResetAttack(), stops EnemyPursuitMovement participation, and removes this defeated enemy's NavMeshAgent avoidance obstruction without destroying or replacing the persistent GameObject. It exposes public ResetDefeatResponse(), which restores only the movement-disable state it owns. After ResetDefeatResponse(), EnemyHealth.ResetHealth(), and EnemyPursuitMovement.ResetPursuit() have all run in any order, the same GameObject is alive, its agent is on the NavMesh at its reset placement, and it can later acquire and pursue again. SpriteRenderer treatment and physical body collision remain pending Vincent's decisions."
    },
    {
      "criterion_id": "AC-007",
      "reference": "Docs/GDD/No_Safe_Circle_GDD.md:593, 687-693; reusable enemy prefab activation",
      "requirement": "Assets/NoSafeCircle/DoorPrototype/Generated/MeleeEnemyGameplay.prefab contains and wires one NavMeshAgent, EnemyTargetKnowledge, EnemyPursuitMovement, EnemyStatusEffectMovement, EnemyHealth, MeleeEnemyAttack, MeleeEnemyDefeatResponse, EnemyLockedDoorAttack, and the read-only NSC-077 enemy animation output (EnemyAnimationController with the generated MeleeEnemyAnimator.controller). It exposes EnemyTargetKnowledge.Initialize(Transform) for the wizard target and EnemyHealth.Initialize(ActiveEnemyRegistry) for activation. It contains no scene registry reference, wizard scene reference, spawn placement, encounter count, room identity, door target, input action, or spell behavior. Do not edit NSC-077's EnemyAnimationController, EnemyAnimationAssetBuilder or generated enemy animation assets. EnemyAnimationController already follows this enemy's own movement and current target, so no separate walk-direction script is created."
    }
