  "notes": "D1B.2 should produce two ordered responsibility splits without allocating child IDs here. Split 1 owns MeleeEnemyAttack, ResetAttack, and MeleeEnemyAttackPlayModeTests; it depends on NSC-004, NSC-012, NSC-089, NSC-091, and NSC-092 and has no art dependency. Its tests construct real production components and do not require the assembled prefab. Split 2 depends on split 1 and is the sole owner of logical:enemy-locomotion-behavior-surface; it owns MeleeEnemyDefeatResponse, Melee-specific movement serialization, MeleeEnemyGameplayPrefabBuilder, the generated prefab, prefab conformance, EnemyLockedDoorAttack wiring and conformance, production-input retreat/group tests, Frost baseline-speed proof, and human review. It additionally depends on NSC-003, NSC-011, NSC-013, NSC-017, NSC-039, and NSC-077. D1B.2 still produces exactly two ordered splits. A third split is justified only if Vincent approves separate attack or defeat art that does not edit locomotion. No split edits EnemyTargetKnowledge.cs, EnemyPursuitMovement.cs, EnemyStatusEffectMovement.cs, PlayerMovement.cs, PlayerHealth.cs, EnemyHealth.cs, ActiveEnemyRegistry.cs, ProjectSettings, NSC-077 outputs, room/scene assets, Input Actions, encounters, doors, or spells. NSC-017 owns EnemyLockedDoorAttack.cs and its behavior; split 2 only attaches the existing component to the generated prefab and wires it to the EnemyPursuitMovement and EnemyTargetKnowledge already present there, without editing NSC-017's file. NSC-007 already owns Charged Fireball's multiple-Melee damage gate, but its target-discovery mechanism and any new dependency edge require separate approval; no Collider, layer, tag, or query API is invented here. Gate mapping from revision 5 is old VAL-001 to new VAL-005, old VAL-002 to new VAL-001, and old VAL-003/VAL-004 to new VAL-002. Split 2 must not be dispatched until Vincent answers the body-blocking, wind-up locomotion, and defeated-enemy visual and collision decisions, because each can change split 2's components or files. The attack-feedback decision gates only VAL-007 approval. Split 1 does not wait for any of these decisions. Revision 7 (2026-09-16): NSC-094 is superseded by NSC-077 revision 3, which delivers EnemyAnimationController and the generated MeleeEnemyAnimator.controller for the existing scene MeleeEnemy. This prefab reuses them, so the conditional MeleeEnemyWalkDirection script and its resource claims are removed.",
