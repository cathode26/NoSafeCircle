  "notes": "D1B.2 should produce two ordered responsibility splits without allocating child IDs here. Split 1 owns MeleeEnemyAttack, ResetAttack, and MeleeEnemyAttackPlayModeTests; it depends on NSC-004, NSC-012, NSC-089, NSC-091, and NSC-092 and has no art dependency. Its tests construct real production components and do not require the assembled prefab. Split 2 depends on split 1 and is the sole owner of logical:enemy-locomotion-behavior-surface; it owns MeleeEnemyDefeatResponse, Melee-specific movement serialization, MeleeEnemyGameplayPrefabBuilder, the generated prefab, prefab conformance, EnemyLockedDoorAttack wiring and conformance, production-input retreat/group tests, Frost baseline-speed proof, and human review. It additionally depends on NSC-003, NSC-011, NSC-013, NSC-017, NSC-039, and NSC-077. D1B.2 still produces exactly two ordered splits. A third split is justified only if Vincent approves separate attack or defeat art that does not edit locomotion. No split edits EnemyTargetKnowledge.cs, EnemyPursuitMovement.cs, EnemyStatusEffectMovement.cs, PlayerMovement.cs, PlayerHealth.cs, EnemyHealth.cs, ActiveEnemyRegistry.cs, ProjectSettings, NSC-077 outputs, room/scene assets, Input Actions, encounters, doors, or spells. NSC-017 owns EnemyLockedDoorAttack.cs and its behavior; split 2 only attaches the existing component to the generated prefab and wires it to the EnemyPursuitMovement and EnemyTargetKnowledge already present there, without editing NSC-017's file. NSC-007 owns Charged Fireball's multiple-Melee damage gate and its settled target discovery: a flat horizontal distance test against active, non-defeated EnemyHealth objects, with no enemy colliders (SPELL_DECISIONS.md S4; NSC-007 AC-007). This task adds no Collider, layer, tag, query API, or Fireball dependency edge. Gate mapping from revision 5 is old VAL-001 to new VAL-005, old VAL-002 to new VAL-001, and old VAL-003/VAL-004 to new VAL-002. Split 2 must not be dispatched until Vincent answers the body-blocking, wind-up locomotion, and defeated-enemy visual and collision decisions, because each can change split 2's components or files. The attack-feedback decision gates only VAL-007 approval. Split 1 does not wait for any of these decisions. Revision 7 (2026-09-16): NSC-094 is superseded by NSC-077 revision 3, which delivers EnemyAnimationController and the generated MeleeEnemyAnimator.controller for the existing scene MeleeEnemy. This prefab reuses them, so the conditional MeleeEnemyWalkDirection script and its resource claims are removed. Revision 10 (2026-09-17): the Fireball target-discovery sentence now states the settled rule instead of pending approval; no scope, resource, criterion, or gate change. Revision 11 (2026-09-17): AC-002 and VAL-001 record NSC-088 revision 4 INT-003 (a CurrentTarget without PlayerHealth, such as the Spectral Decoy phantom, takes no damage and causes no exception); split 1 owns it. No scope, resource, dependency or split change. Revision 12, 2026-09-17: Vincent answered the four open melee questions, firing all three revision triggers revision 11 had written into itself. AC-001's locomotion-owner revision is approved (rooted wind-up, suppression owned by EnemyPursuitMovement, facing still permitted); AC-006's two pending decisions are resolved (a set of at least two stylised death looks selected at random, burned gated to fire kills only if a distinct fire damage type exists, ground-line aligned, artwork from a separate task and approved by Vincent; no physical body collision once defeated); AC-008 adds the living enemy's solid body, which no criterion covered; AC-009 takes ownership of the demo-leash removal and its three spawn re-clearances, which were otherwise a direct edit to a builder eleven tasks claim with no contract behind it. VAL-008 checks the doorway-crowding consequence of solid bodies instead of assuming it away. The Lantern Wraith's death looks are deliberately NOT here: the Art Director established that blood, decapitation and severed arms belong to the Dungeon Brute and would read as a bug on a spectral enemy, so the wraith's four looks belong to the wraith task. Claiming the global scene builder makes this task contend with eleven others and with NSC-092 on EnemyPursuitPlayModeTests; that is resolved by sequencing, not by narrowing the claim. Revision 13, 2026-09-18: death-look selection changes from random to an ordered, first-match-wins rule driven by how the enemy died - Vincent's \"you get killed with 1 shot, then you are decapitated\" and \"if you need multiple shots to kill you, you lose an arm\". This needs EnemyHealth to expose the number of damaging hits taken in the enemy's current life, reset by ResetHealth(); that is the only mechanism added. Two ambiguities are answered here rather than left to a crew: hits are counted over the whole life, not just the killing blow, and damage-over-time ticks do not count. The rule is ordered because a one-shot fire kill would otherwise match two rules, and every look must be reachable because an earlier draft of this mapping left four of the twelve sprites unable to appear in play. Sprite identity, look and variant tags and selection weights are NSC-099's.",
