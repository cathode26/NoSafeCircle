      "requirement": "Create Assets/NoSafeCircle/DoorPrototype/Scripts/Enemies/MeleeEnemyDefeatResponse.cs and Assets/NoSafeCircle/DoorPrototype/Scripts/Enemies/MeleeEnemyDefeatResponse.cs.meta, with focused coverage in Assets/NoSafeCircle/DoorPrototype/Tests/MeleeEnemyDefeatResponsePlayModeTests.cs and Assets/NoSafeCircle/DoorPrototype/Tests/MeleeEnemyDefeatResponsePlayModeTests.cs.meta. On EnemyHealth.Defeated, MeleeEnemyDefeatResponse calls MeleeEnemyAttack.ResetAttack(), calls EnemyLockedDoorAttack.ResetAttack() and disables that component so no pending locked-door attack can damage a door after defeat, stops EnemyPursuitMovement participation, and removes this defeated enemy's NavMeshAgent avoidance obstruction without destroying or replacing the persistent GameObject. It exposes public ResetDefeatResponse(), which restores only the movement-disable state it owns and re-enables EnemyLockedDoorAttack. After ResetDefeatResponse(), EnemyHealth.ResetHealth(), and EnemyPursuitMovement.ResetPursuit() have all run in any order, the same GameObject is alive, its agent is on the NavMesh at its reset placement, and it can later acquire and pursue again. Vincent's decisions of 2026-09-17 resolve both items previously left pending here. SpriteRenderer treatment: on defeat the renderer swaps to one death sprite drawn from a serialized set of at least two distinct death looks for this enemy, and ResetDefeatResponse() restores the living sprite. Evaluate these rules in order and take the FIRST match, so a kill that satisfies two rules has one defined outcome. For the Dungeon Brute: (1) a fire killing blow, only where the project defines fire as a distinct damage type, selects burned; (2) a kill by exactly one damaging hit whose damage alone is at least a serialized fraction of that enemy's MAXIMUM HEALTH selects blasted, whose flat-on-its-back pose with the cleaver thrown clear is a knockback read. Express that threshold relative to max health, never as an absolute damage value: an absolute number goes stale silently the moment damage is rebalanced - nothing fails, the death looks just quietly change - and one relative threshold works across enemy types with different health pools. **Blasted is the exception inside the one-shot bucket, not its default.** Vincent named decapitated as the one-shot death; a threshold low enough that most one-shot kills clear it would make blasted the normal one-shot death and decapitated rare, inverting his own rule while satisfying every gate. The threshold is tuned with the rarity weights under Vincent's review, not fixed by this contract; (3) a kill by exactly one damaging hit selects decapitated; (4) a kill by more than one damaging hit selects dismembered; (5) a death with ZERO damaging hits, or one whose hit count is unknown, selects blasted - a kill that never routes through TakeDamage, such as a crushing hazard, a scripted kill, a despawn-as-death, an out-of-bounds cleanup or a direct Kill() in a test, matches neither the one-hit nor the many-hit branch, and without this rule the selector returns nothing and the corpse has no sprite at all. Blasted carries it because its flat-on-its-back pose is source-agnostic. For the Lantern Wraith, which has no head to remove, no arm to lose and no fire case: (1) a kill by exactly one damaging hit selects shattered - the lantern bursting open, which is sudden - with dissipated as its rarer variant; (2) a kill by more than one damaging hit selects unravelled or snuffed, both quiet and progressive, with draining and hollowed as the rarer variants; (3) a death with zero or unknown damaging hits selects dissipated, the wraith's most neutral death. Both catch-alls name looks that are already reachable through their own rules, so they add no reachability burden - they only guarantee the selector always returns something. **Every look must be reachable in normal play**: a rule set under which any of the twelve can never appear fails this criterion, because Vincent asked for all of the art. Where a look has more than one variant, choose between them at random each time so the same rule does not produce an identical corpse twice. **The look and its variant are chosen once, at the moment the enemy dies, and cached on that corpse.** They are never recomputed while the corpse is displayed - not on enable, not per frame, and not when a pooled corpse is re-shown - because a randomly chosen variant re-rolled mid-display would change the sprite while the player is looking at it. **Hit counting is over the enemy's whole current life, not just the killing blow** - an enemy chipped once and then finished has taken two damaging hits and dies a multiple-hit death - and the count resets with EnemyHealth.ResetHealth(). **Damage-over-time ticks do not count as damaging hits** where such a system exists; if burn ticks counted, a burning enemy could almost never die a one-shot death and decapitated would quietly become rare. This task introduces neither a damage-type system nor a damage-over-time system; both clauses are conditional on those existing. Every death sprite is ground-line aligned the way NSC-077 and NSC-095 revision 4 align their frames, so a defeated body does not float, and a death look may extend past the living footprint with separate pieces - a thrown weapon or a detached part - which is affordable precisely because a defeated body carries no collision. Physical body collision: a defeated enemy has no physical body collision at all, in addition to the NavMeshAgent avoidance removal already required above, so a corpse never blocks a doorway. The visual identity of the death looks is produced by a separate art task and approved by Vincent; this task's automated gates verify the selection mechanism, the set's minimum size, the shared ground-line alignment and the collision state, and never the artwork."
