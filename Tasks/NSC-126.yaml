      "requirement": "Building a room twice produces the same accents: no duplicates, and no accent objects left behind from a previous build. The builders are run repeatedly during authoring and by their own Edit Mode tests, so a caller that appends on every invocation would accumulate silently and would be visible only as a slow drift in the committed scene."
    },
