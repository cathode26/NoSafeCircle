      "requirement": "NO VERTICAL OFFSET IS BAKED INTO THE BUILDER TO COMPENSATE FOR ART MISALIGNMENT, AND NO SPRITE PIVOT IS EDITED BY THIS TASK. AC-003 already fixes each accent's Y as whatever ArchitecturalWallAccentPlacement.ComputeGroundContactAnchorY returns for that sprite; this criterion forbids adding any further constant, per-role nudge or hand-tuned correction on top of it. THE REASON IS MEASURED AND IT IS NOT HYPOTHETICAL: the Art Director measured on main 7c9c290e that wall_straight.png carries pivot y 0 with transparent padding beneath its masonry while wall_corner.png, wall_door_jamb.png and wall_end_cap.png carry ground-line pivots of 0.100000, 0.147727 and 0.112500 - each sprite's pivot being exactly its own ground line. Against the same cell origin all three therefore land in the SAME place, a uniform 19.00 px (0.297 world unit) LOWER than the straight wall they abut, and the entire seam comes from wall_straight.png's own 19 px of transparent pad rather than from any difference among the accents. That is an ART defect and its fix is a crop plus a .meta pivot, which is the Art Director's and is already precedented on main at 55bd6f32. A builder-side offset would hide it, make the art unfixable without breaking the builder, and put a second source of truth for ground contact into code. If the accents render misaligned, that is the expected result to REPORT, with the render, not to correct here."
