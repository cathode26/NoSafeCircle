  "notes": "Authored 2026-09-25 by the GER Agent after the Producer Agent measured that ArchitecturalWallAccentPlacement has ZERO production callers and zero menu entry points - the only one of 21 Editor classes with neither - so wall_corner, wall_door_jamb and wall_end_cap are placed only inside NSC-120's own test. Confirmed independently by resolving each sprite's .meta guid and sweeping every .cs, .asset, .unity and .prefab on main: zero non-source references each. NSC-120 IS CORRECTLY CONFORMANT and so is NSC-109; neither is defective and this is not evidence debt. The gap is that a capability was contracted without naming its caller, which can pass every gate and change nothing the player sees. AUTHORED AS A NEW CONTRACT RATHER THAN AS AN ADDED CRITERION because both candidate hosts are delivered - NSC-109 is conformant on DEL-NSC-109-b44a34ce481e and NSC-120 on DEL-NSC-120-ea5ec3af4f96 - and adding a criterion to either would void its delivery record. This task claims the five builders as a SECOND claimant. Four of the five carry only conformant claimants (NSC-044/045/046/047/048 and NSC-109), where the lock has nothing to exclude because a conformant task is never dispatched again. RuinedEntrySceneBuilder.cs IS DIFFERENT AND IS STATED HERE RATHER THAN GLOSSED: NSC-100 also claims it and is not_delivered, so this task and NSC-100 genuinely contend on that one file and will serialize. That is the collision guard doing its job, not a defect, and it is the reason this contract does not claim NSC-100 cannot run.",
