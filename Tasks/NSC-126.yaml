      "criterion_id": "AC-001",
      "reference": "NSC-120 ArchitecturalWallAccentPlacement.Place and BuildRectangularRoomGeometry; NSC-109 AC-001",
      "requirement": "Each of the five committed room builders - RuinedEntrySceneBuilder.cs, BoneArchiveSceneBuilder.cs, ChapelOfAshSceneBuilder.cs, LowerVaultSceneBuilder.cs and FinalRoomSceneBuilder.cs - calls ArchitecturalWallAccentPlacement.BuildRectangularRoomGeometry with that room's own committed room bounds, its floor Y and its committed door openings, then calls ArchitecturalWallAccentPlacement.Place, parenting every returned accent under one named child object of that room's root. THE DOOR OPENINGS PASSED ARE THE ROOM'S EXISTING AUTHORED DOOR DATA. This task introduces no new literal door coordinates, no new room bounds and no second source of truth for either; where a builder does not already expose its openings in those terms, it converts what it already has rather than restating it."
    },
    {
      "criterion_id": "AC-002",
      "reference": "ArchitecturalWallAccentPlacement.Place summary: 'Visual only: adds no collider, resizes no existing collider and paints no Tilemap cell'; NSC-047 AC-002; NSC-044",
      "requirement": "THE ACCENTS ARE VISUAL ONLY AND THIS TASK CHANGES NO WALKABILITY. It adds no collider, resizes or moves no existing collider, paints no Tilemap cell, and changes no room bounds, blockout footprint or any other geometry the NavMesh bake reads. The placement helper already states this about itself; this criterion makes it the CALLER's obligation as well, because NSC-047 AC-002 and NSC-044 derive walking-boundary and circuit invariants from their blockout colliders and a decorative accent must not perturb them. A run that changes the baked walkable surface fails this criterion even if every accent is correctly placed."
    },
    {
      "criterion_id": "AC-003",
      "reference": "ArchitecturalWallAccentPlacement.ComputeGroundContactAnchorY; NSC-109 AC-001 pivot measurements",
      "requirement": "Every placed accent sits at the world Y that ArchitecturalWallAccentPlacement.ComputeGroundContactAnchorY returns for its own sprite and the room's floor Y, so its rendered bottom edge lands exactly on the floor. THE PIVOTS ARE NOT ASSUMED TO BE ZERO: NSC-109 AC-001 measured these sprites importing at pivot y 0.1, 0.147727 and 0.1125, which is why that helper exists. A caller that uses the floor Y directly as the transform Y does not satisfy this criterion even though the accents would look approximately right."
    },
    {
      "criterion_id": "AC-004",
