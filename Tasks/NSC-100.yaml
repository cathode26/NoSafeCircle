  "notes": "This task adopts the WorldSprites sorting layer that already exists as an orphan entry in ProjectSettings/TagManager.asset (uniqueID 1043912875) but is not yet referenced by any code; it does not create the layer, per AC-001. Repointing WorldSpriteSortingLayerName will cause RepairWorldSpritePrefabConvention to silently migrate existing world-sprite Prefab assets onto the new layer on their next repair pass; that migration is intended (VAL-003), and is exactly why RoomSceneComposer must fail loudly on a mismatch rather than repair one. AC-004 restates that the -100/-90/0 sorting-order band values are NSC-039's design and are out of scope to retune. AC-005 discharges NSC-069's downstream_integration_obligations INT-003 by writing the negative sorting-layer case NSC-069 revision 8 removed as unwritable; NSC-069 itself is not edited by this task. A cascade grep for the literal sorting-layer name \"Default\" across Tasks/ and Docs/ found NSC-044 through NSC-048 and NSC-069 as expected, plus one additional active task, NSC-075, whose AC text quotes the current shared band as 'the shared sortingLayerName \"Default\" and sortingOrder 0'; that task's prose will go stale once this task lands and is flagged here for the GER Agent rather than edited, since NSC-075 is outside this task's exclusive_resources and outside the named cascade. AC-003 REBUILT ON A MEASURED PREMISE, 2026-09-23. The Pipeline Runner's crew returned blocked_by_design after 1740s and two attempts, on one issue: AC-003 required sortingOrder == 0 for every renderer under either category root, justified by \"neither category root holds background-band content\". That sentence is false. Re-proved at source rather than taken, and it is wider than reported - FOUR room builders place FloorTilemap under Visuals at -100, not three; BoneArchive escapes only by being a stub with no floor. Because the validator is reached from DoorSequenceBuilder.BuildCanonical, which throws on first failure, the canonical rebuild would have stopped at the first room with a floor. The decisive point is ownership: NSC-100 owns no room builder, so the criterion was satisfiable only by editing four files outside its exclusive_resources - out of scope by construction, the same reasoning that kept the five dressing contracts from being bent around the prefab-builder gap. AC-001, AC-005 and AC-006 were implemented correctly and passed and are untouched. Revising was safe because the crew produced NO candidate - status prepared, candidate None - so nothing was pinned, and prepared_refresh.py:98-100 re-pins both source_commit and task_contract_sha256 in any case. WITHDRAWAL PROPAGATED, 2026-09-23 - MY DEFECT, ONE HOUR AFTER THE FIX IT FOLLOWS. Revision 3 withdrew AC-003's flat sortingOrder == 0 rule and left THREE other places requiring it, which made the contract unsatisfiable rather than merely inconsistent: AC-005 demanded a test proving a renderer at sortingOrder 50 FAILS validation, asserting the specific rule broken, while AC-003 had just stopped validating sortingOrder at all; VAL-001 listed that same case among the negative cases that must pass; and AC-004 still said the task \"only validates that VisualsRoot/GameplayGeometryRoot content is at order 0\". The Pipeline Runner caught it before burning a second ~29-minute run and named AC-005 and VAL-001; A SWEEP OF THE WHOLE CONTRACT FOUND AC-004 AS WELL, which nobody had flagged - a pointer is where to look, not the extent of the problem. \"Propagate every change, then re-grep\" was already my own recorded rule and I did not apply it to my own edit. Deliberately untouched: AC-002's clause about band values staying unchanged, AC-006's spriteSortPoint case, VAL-003's prefab repair and VAL-004. SCOPE WIDENED BY TWO FILES, 2026-09-23 rev 5. The criteria were correct at rev 4 and the validator said so; the RESOURCE SCOPE was too narrow for the task to achieve its own purpose. RuinedEntrySceneBuilder.cs:157 hardcodes sortingLayerName = \"Default\" inside a helper called six times, and it is the only room builder that does - the other three read the constant. Because DoorSequenceBuilder.BuildCanonical throws on the first failing room, repointing the constant without fixing that line stops the canonical scene building for everyone. DoorPrototypeSceneBuilderTests.cs pins the same literal at 1268, 1408 and 1510. Reported by the Pipeline Runner after two runs and 46 minutes of provider time; every claim re-proved at source here rather than taken. WIDEN RATHER THAN SPLIT IS MY JUDGEMENT AND NOT A MEASUREMENT: a builder hardcoding the value this task exists to repoint is an instance of the same defect, not a separate concern, and a split would add an id, a contract and a landing order after 46 minutes already spent. Checked before deciding: exclusive_resources is not in INVARIANT_FIELDS and contract_commit.py:249 reconciles RESOURCE_GROUPS.yaml, so this is supported rather than a hand edit. OWNERSHIP CONSEQUENCES, STATED SO NOBODY RE-DERIVES THEM: DoorPrototypeSceneBuilderTests.cs was already claimed by NSC-038, NSC-039, NSC-042 and NSC-052, so a fifth claimant is the ordinary additive branch; RuinedEntrySceneBuilder.cs was claimed only by NSC-044, which is not_delivered and parked, so this makes it shared and the two cannot hold active admissions at the same time. NSC-044's geometry, cell sets and sorting ORDERS remain NSC-044's - this task changes one layer-name line and nothing else in that file.",
