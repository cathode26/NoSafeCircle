s and two test files - IT OWNS NO ROOM BUILDER - so a criterion satisfiable only by editing four unowned files is out of scope by construction. DRAW ORDER WITHIN THE LAYER BELONGS TO EACH ROOM'S OWN BUILDER AND ITS OWN CONTRACT, AND NOTHING IN THIS TASK MAY ASSERT A VALUE FOR IT. If a future task wants a draw-order invariant across rooms, it owns the room builders or it does not write the rule. FOR THE RECORD, AND CORRECTED BECAUSE A CITATION NOBODY OPENS IS HOW A WRONG REFERENCE BECOMES DURABLE: -100 is BackgroundGroundSortingOrder, declared at DoorPrototypeSceneBuilder.cs:64 and NOT in DoorPrototypeGlobalSceneBuilder as an earlier revision of this criterion said. It is a `private const`, so nothing outside that file can reference it by name - do not write a test or a builder that tries, which is the shape that left NSC-045 unrecoverable."
