      "requirement": "REPOINT THE ONE ROOM BUILDER THAT HARDCODES THE LAYER, AND THE THREE TEST ASSERTIONS THAT PIN IT AS A LITERAL. Without this the task cannot achieve its own purpose: RuinedEntrySceneBuilder.cs:173 (revision 5 said :157; it drifted) is `renderer.sortingLayerName = \"Default\";` inside CreateVisualTilemap, which that file calls six times, so the moment AC-001 repoints DoorPrototypeSceneBuilder.WorldSpriteSortingLayerName those six tilemaps stay behind on the old layer. IT IS THE ONLY ROOM BUILDER THAT DOES THIS - re-measured on main at 660275dd6 2026-09-25, the sibling builders all read the constant and between them do so at seven sites - ChapelOfAshSceneBuilder:135, :232 and :346, FinalRoomSceneBuilder:128, and LowerVaultSceneBuilder:114, :230 and :330. Revision 5 cited :124, :121 and :98 and every one of those had drifted, so IDENTIFY THESE SITES BY WHAT THEY DO, NOT BY LINE NUMBER, and re-measure before relying on any number in this criterion. THE CONSEQUENCE IS FATAL RATHER THAN COSMETIC: AC-003's validator reports the error, RoomSceneComposer.TryComposeRoom fails, and DoorSequenceBuilder.BuildCanonical throws on the FIRST failing room - it is a bare `foreach` over catalog.Rooms with `if (!TryComposeRoom) throw` - so DoorPrototypeSceneBuilder.Build() stops producing the canonical scene AT ALL, for every task, not just this one. Change that one line to read the constant exactly as its three siblings do; do not restructure the helper and do not touch RuinedEntry's geometry, cell sets, rotations or sorting ORDERS, which belong to NSC-044. SEPARATELY, AND THIS INVENTORY IS NOW REPO-WIDE RATHER THAN ONE FILE, WHICH IS THE CORRECTION THAT MATTERS: revision 5 measured only DoorPrototypeSceneBuilderTests.cs and said \"those are the only three in the file\", which was true of that file and false of the repository, so a crew fixed three of seven and the candidate failed a guard on a file this task did not own. Swept every committed .cs at 660275dd6: SEVEN assertions of the literal \"Default\" against a sortingLayerName, in THREE files - DoorPrototypeSceneBuilderTests.cs:1275, :1415 and :1556 (revision 5 cited :1268, :1408 and :1510; all three drifted); Tests/Editor/Rooms/ChapelOfAshSceneTests.cs:771, :847 and :910; and Tests/Editor/TitleScreenSceneBuilderTests.cs:145. ALL THREE FILES ARE NOW OWNED BY THIS TASK so the fix is inside its own scope; a scope override cannot grant a path the contract does not own. TitleScreenSceneBuilderTests.cs:145 IS NAMED FOR THE TITLE SCREEN AND ASSERTS ON THE WORLD GRID: the test calls DoorPrototypeSceneBuilder.BuildInMemoryForTests() and reads IsometricVisualGrid/WallTilemap, a tilemap this task's own builder authors and AC-002 moves, so do not skip it on the strength of its name. Its very next line already asserts walls.sortingLayerName == player.sortingLayerName, which is the durable form this criterion requires and survives the repoint untouched - copy that pattern. ChapelOfAshSceneTests.cs:771, :847 and :910 assert the literal on a wizard SpriteRenderer, a TilemapRenderer and a blockout SpriteRenderer, and ChapelOfAshSceneBuilder sets exactly those renderers from DoorPrototypeSceneBuilder.WorldSpriteSortingLayerName at :135, :232 and :346, so the repoint moves them and the literals break. NOT PROVEN BY A UNITY RUN: only TitleScreenSceneBuilderTests.cs:145 has been observed failing; the ChapelOfAsh three are included because the builder assignment sites were measured, not because a run failed them. Three other test files - LowerVaultSceneTests.cs:633, RuinedEntrySceneTests.cs:270 and RoomSceneComposerTests.cs:106 - ASSIGN the literal as setup rather than asserting it; they are deliberately NOT in this inventory and are not to be changed under this criterion. 1268 and 1408 read FRESHLY BUILT objects and 1510 reads a repaired Prefab asset, so all three break on the repoint. Change each to assert DoorPrototypeSceneBuilder.WorldSpriteSortingLayerName rather than a literal, which is