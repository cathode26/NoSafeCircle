      "requirement": "Define the phantom's lifetime, attackability or destruction, failure and expiry behavior, mana cost and any cooldown so repeated casts do not guarantee escape. Spell-owned active state must reset on a floor restart and stop accepting casts when gameplay is suspended."
    },
    {
      "criterion_id": "AC-005",
      "reference": "Door and Pursuit Rules",
      "requirement": "Define whether the phantom can traverse open or broken doors, what happens at sealed or locked doors, and whether it persists across rooms without changing the established door-passability and persistent-enemy rules."
    }
