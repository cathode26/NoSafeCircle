  "notes": "PROPOSAL selected design: F sends one non-colliding NavMesh phantom toward one shared pointer waypoint. Every active, non-defeated enemy already pursuing the wizard may redirect, including stretched pursuers outside DetectionDistance; searching, wandering, idle, or defeated enemies do not. Redirected enemies skip only wizard lose-distance evaluation: the existing scene leash still ends the redirect and searches the enemy start position. Normal expiry restores wizard pursuit at or inside LoseTargetDistance and otherwise searches the wizard position saved at the switch. Starting tuning is 30 mana, 4.0-second lifetime, and 24-second cooldown; the cooldown is intended to limit reuse, and a well-timed cast may buy a complete door-opening opportunity after enemy travel time. The phantom has no Collider or PlayerHealth, so it neither blocks projectiles nor safely absorbs them. Current DoorPrototype scene Melee enemies have LOS acquisition and a short leash; current legacy Lantern Wraith casters have no EnemyTargetKnowledge and ignore the decoy until NSC-030 installs production Ranged Enemy prefabs. DemoRunFlow proximity contact damage also remains independent of CurrentTarget. Existing foundations are PlayerMovement.PointerWorldTarget, PlayerMana.Spend, EnemyTargetKnowledge, EnemyPursuitMovement, RangedEnemyKeepDistanceMovement, RangedEnemyAttack, RangedEnemyProjectile, TitleScreenController, WizardGameEntryController, and DoorPrototypeGlobalSceneBuilder; no Spectral Decoy implementation already exists. The decomposition must assign EnemyTargetKnowledge.cs and SpectralDecoyEnemyTargetKnowledgePlayModeTests exclusively to the enemy-pursuit-owned split. The dependent spell split receives every other listed resource. The graph apply must add the resulting owning work IDs and reconciliation keys to each applicable RESOURCE_GROUPS.yaml entry. No external game source was consulted. 2026-09-17 rev5 (GER Orchestrator decisions F1-F8, applying the Codex revision-4 contract check verbatim, no design change): added the DoorPrototypeSceneBuilder.cs Build()/BuildInMemoryForTests() facade to exclusive_resources and to the Wizard Combat child's decomposition claim per GDD line 632's paired builder/scene lock; tightened VAL-001 through VAL-006 with a mid-travel route-closure case, cross-scene discovery, leash/expiry/mismatched-Transform return-invariant cases, an unassigned-optional-reference EnterWorld case, an exhaustive InputSystem_Actions.inputactions binding proof, and a phantom-versus-lantern-wisp plus SpectralDecoyCooldownUI non-overlap review; added the cooldown UI's HUD non-overlap requirement to AC-013 and its automated proof to VAL-005. Revision 6 (2026-09-17): depends_on adds NSC-009 and NSC-077 (closure review of revision 5), and INT-005/INT-006 record NSC-030 revision 10's proof split. ART PROHIBITION LIFTED, 2026-09-23, VINCENT'S OWN DECISION IN THE GER AGENT'S SESSION. He said Spectral Decoy is being added and asked that whatever blocks it be changed, naming the Art Director's objection as the thing to remedy. That objection was the Art Director declining to author Spectral Decoy art because this contract forbade importing any - it cited AC-007, which is 1,164 characters of NavMesh pathing and says nothing about art; the real clause was AC-009 and the substance of the objection was correct. AC-009 now PERMITS authored art without REQUIRING it, so the code is never blocked on the art, and the legibility requirement the prohibition was protecting is stated directly instead of implied by a restriction. The sprites, if made, belong to a separate art task and are deliberately absent from this contract's exclusive_resources. RECORDED SO A LATER READER CANNOT MISREAD IT: this is a design change made on his direct word, not an agent widening a contract, and it was taken BEFORE this task's decomposition is applied on purpose - NSC-088 is needs_execution_decomposition with zero children and a concrete plan, and its decomposition_requirement_sha256 covers its requirements, so revising after a decomposition would leave two children carrying a withdrawn prohibition and the parent reporting aggregate_requirements_changed.",
