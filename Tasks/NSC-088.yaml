      "reference": "Chapel of Ash cover and Ranged Enemy attack ownership",
      "requirement": "Keep projectile collision with an authored wall, shelf, table, pew, or column separate from enemy target selection. Cover blocks a shot only when its gameplay collider and projectile-occlusion rule do so; hiding behind cover alone does not add an unapproved visibility-based target-loss rule."
    },
    {
