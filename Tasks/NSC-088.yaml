      "reference": "Enemy Detection, Pursuit, and Target Loss",
      "requirement": "Define which Melee and Ranged Enemies can switch from the wizard to the phantom, when they switch back, and how the choice interacts with existing distance-based target loss, last-known-position search, reacquisition, and door traversal. The phantom does not silently erase an enemy's knowledge of the wizard."
    },
