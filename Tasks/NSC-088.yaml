      "reference": "Vincent's Spectral Decoy direction",
      "requirement": "The wizard can create a travelling phantom that moves down a different available corridor while the wizard takes another route, giving pursuing enemies a possible target to follow. The cast input and route-control rule require Vincent's design decision before implementation."
