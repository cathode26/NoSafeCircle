  "kind": "feature",
  "notes": "PROPOSAL selected design: F sends one non-colliding NavMesh phantom toward one shared pointer waypoint. Every active, non-defeated enemy already pursuing the wizard may redirect, including stretched pursuers outside DetectionDistance; searching, wandering, idle, or defeated enemies do not. Redirected enemies skip only wizard lose-distance evaluation: the existing scene leash still ends the redirect and searches the enemy start position. Normal expiry restores wizard pursuit at or inside LoseTargetDistance and otherwise searches the wizard position saved at the switch. Starting tuning is 30 mana, 4.0-second lifetime, and 24-second cooldown; the cooldown is intended to limit reuse, and a well-timed cast may buy a complete door-opening opportunity after enemy travel time. The phantom has no Collider or PlayerHealth, so it neither blocks projectiles nor safely absorbs them. Current DoorPrototype scene Melee enemies have LOS acquisition and a short leash; current legacy Lantern Wraith casters have no EnemyTargetKnowledge and ignore the decoy until NSC-030 installs production Ranged Enemy prefabs. DemoRunFlow proximity contact damage also remains independent of CurrentTarget. Existing foundations are PlayerMovement.PointerWorldTarget, PlayerMana.Spend, EnemyTargetKnowledge, EnemyPursuitMovement, RangedEnemyKeepDistanceMovement, RangedEnemyAttack, RangedEnemyProjectile, TitleScreenController, WizardGameEntryController, and DoorPrototypeGlobalSceneBuilder; no Spectral Decoy implementation already exists. The decomposition must assign EnemyTargetKnowledge.cs and SpectralDecoyEnemyTargetKnowledgePlayModeTests exclusively to the enemy-pursuit-owned split. The dependent spell split receives every other listed resource. The graph apply must add the resulting owning work IDs and reconciliation keys to each applicable RESOURCE_GROUPS.yaml entry. No external game source was consulted. 2026-09-17 rev5 (GER Orchestrator decisions F1-F8, applying the Codex revision-4 contract check verbatim, no design change): added the DoorPrototypeSceneBuilder.cs Build()/BuildInMemoryForTests() facade to exclusive_resources and to the Wizard Combat child's decomposition claim per GDD line 632's paired builder/scene lock; tightened VAL-001 through VAL-006 with a mid-travel route-closure case, cross-scene discovery, leash/expiry/mismatched-Transform return-invariant cases, an unassigned-optional-reference EnterWorld case, an exhaustive InputSystem_Actions.inputactions binding proof, and a phantom-versus-lantern-wisp plus SpectralDecoyCooldownUI non-overlap review; added the cooldown UI's HUD non-overlap requirement to AC-013 and its automated proof to VAL-005. Revision 6 (2026-09-17): depends_on adds NSC-009 and NSC-077 (closure review of revision 5), and INT-005/INT-006 record NSC-030 revision 10's proof split. ART PROHIBITION LIFTED, 2026-09-23, VINCENT'S OWN DECISION IN THE GER AGENT'S SESSION. He said Spectral Decoy is being added and asked that whatever blocks it be changed, naming the Art Director's objection as the thing to remedy. That objection was the Art Director declining to author Spectral Decoy art because this contract forbade importing any - it cited AC-007, which is 1,164 characters of NavMesh pathing and says nothing about art; the real clause was AC-009 and the substance of the objection was correct. AC-009 now PERMITS authored art without REQUIRING it, so the code is never blocked on the art, and the legibility requirement the prohibition was protecting is stated directly instead of implied by a restriction. The sprites, if made, belong to a separate art task and are deliberately absent from this contract's exclusive_resources. RECORDED SO A LATER READER CANNOT MISREAD IT: this is a design change made on his direct word, not an agent widening a contract, and it was taken BEFORE this task's decomposition is applied on purpose - NSC-088 is needs_execution_decomposition with zero children and a concrete plan, and its decomposition_requirement_sha256 covers its requirements, so revising after a decomposition would leave two children carrying a withdrawn prohibition and the parent reporting aggregate_requirements_changed. PLAYMODE ORDER-DEPENDENCE CLOSED PROSPECTIVELY, 2026-09-23. The Pipeline Runner measured and reproduced an order-dependence in the PlayMode suite: one fixture running before another makes three of the latter's tests fail, reproduced down to an eleven-test run. ITS CONSEQUENCE IS AIMED AT THE EVIDENCE SYSTEM RATHER THAN AT ANY ONE TEST - a scoped green can pass precisely because the filter excluded the polluter, which is the check-that-answers-from-a-copy shape applied to delivery records. MEASURED ON THE CONTRACT AXIS, WHICH IS THE HALF NOBODY HAD DONE: sixteen filter-gates across thirteen contracts; ONLY NSC-047's VAL-003 required a broader-suite run, and only of the Edit Mode suite; five gates touch PlayMode and four of those had no broader-suite clause. ALL FOUR WERE UNDELIVERED WITH NO SELECTED RECORD, SO NO EXISTING DELIVERY RECORD WAS EXPOSED THROUGH A CONTRACT GATE AND THE RISK WAS PROSPECTIVE - which is exactly when closing it costs nothing to re-verify. THE FIRST SWEEP OF THIS WAS MY OWN AND IT WAS WRONG: it tested for the phrase \"complete suite\" and NSC-047 says \"complete Edit Mode suite\", so it reported zero broader-suite clauses where there was one. Caught by opening the gate text rather than trusting the pattern, which is the only reason the NSC-047 conclusion below is not also wrong. NSC-047 IS NOT EDITED: its gate evidence is an Edit Mode fixture and the measured pollution is PlayMode-to-PlayMode, so it is insulated twice, and VAL-003 is a completion gate - editing it would un-deliver the only conformant room for a clause it does not need. THE ADDED CLAUSE COSTS ONE FULL PLAYMODE RUN PER DELIVERY on these four tasks; Unity time is the scarce resource in this fleet and that cost lands on the Game Agent, which has been told rather than left to discover it. ORDER-DEPENDENCE REPAIRED AT SOURCE WITHIN THE HOUR; THE OBLIGATION KEPT AND ITS PREMISE CORRECTED, 2026-09-23. The Game Agent fixed the leak at 1989950fa - verified here as an ancestor of main, with the cleanup scene present in the offending fixture - taking the full unfiltered PlayMode suite from eight failures to one, and bisected rather than reasoned: 258 to 14 to 11 tests all reproduced the same three failures, and excluding only the three scene-loading tests took that group to 8/8. IT ASKED WHETHER THE DOUBLING I ADDED AN HOUR EARLIER WAS NOW UNNECESSARY AND LEFT THE CALL WITH ME, WHILE ARGUING AGAINST ITS OWN FIX by naming the two unowned test files that no gate can catch. THE CLAUSE I WROTE ASSERTED A DURABLE PROPERTY AND JUSTIFIED IT WITH A DATED FACT, AND THE FACT WENT STALE IN ABOUT AN HOUR - which is my own recorded rule that a gate encoding a fact goes stale silently, firing on my own text. So the factual sentence is now stated as history with the repair named, and the requirement stands on three grounds that do not depend on the fixed defect: filtering can always hide a polluter; the scene-restore house pattern is followed by seven of eight fixtures and enforced on none, so a ninth can reintroduce it; and two of the test files involved are owned by no contract at all. THE COST IS UNCHANGED at one full PlayMode run per delivery on this task, and it is now a run that passes rather than one that would have failed. CLAUSE MADE STATE-INDEPENDENT, 2026-09-23 - THIRD REVISION OF IT IN ONE SESSION AND DELIBERATELY THE LAST. It bound itself to a world-state twice: revision one asserted the PlayMode suite \"has been measured order-dependent\", which was false within the hour once the Game Agent repaired it; revision two asserted the scene-restore pattern was \"ENFORCED ON NONE\", which the same agent was in the act of falsifying by writing a convention guard. THE REMEDY FOR A CLAUSE THAT KEEPS GOING STALE IS NOT A THIRD CORRECTION OF THE SAME KIND, IT IS TO STOP ASSERTING STATES. Both remaining present-tense world-facts are now a DATED OBSERVATION plus a DURABLE CONDITIONAL, so the requirement holds whatever the enforcement and ownership states turn out to be, and a future change to either no longer requires editing this gate. THE GAME AGENT DID NOT ASK FOR THIS and said explicitly it was not arguing the hedge away; it supplied the material for the new second ground by naming what its own guard cannot reach - a fixture polluting by other means, a helper loading a scene on a fixture's behalf, and files no contract owns - and it broke its guard on purpose against the pre-fix commit before trusting it, asserting a minimum population inside the guard because its first probe reported zero single-loaders from a broken subprocess call rather than a clean codebase. That is the haystack check this file's own rules ask for, carried inside the guard instead of remembered.",
