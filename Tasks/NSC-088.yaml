      "requirement": "SpectralDecoyPhantom presents a translucent teal-violet wizard-shaped SpriteRenderer silhouette with a visibly pulsing scale and sparse spell-owned afterimages so it remains distinguishable from the wizard and Lantern Wraith projectile at the fixed gameplay camera. It departs immediately instead of lingering over the wizard; the cast-origin flare is offset toward the destination. Each successfully redirected enemy receives a spell-owned teal-violet switch pulse with a PROPOSAL 0.3-second default tunable from 0.2 to 0.5. AUTHORED ART IS PERMITTED FOR THE PHANTOM AND IS NOT REQUIRED BY THIS TASK. An earlier revision said \"The implementation reuses available SpriteRenderer content or creates only spell-owned runtime feedback; it imports no art and creates no authored prefab\", and THAT PROHIBITION IS WITHDRAWN on Vincent's own decision, taken 2026-09-23 in the GER Agent's session when he asked that Spectral Decoy be added and that the Art Director's objection to authoring its art be remedied - the objection was grounded in this sentence and nowhere else. IT BECOMES A PERMISSION RATHER THAN A REQUIREMENT, AND THE ORDER MATTERS: a hard requirement for authored art would block this CODE task on an ART task, so runtime-tinted reuse of available SpriteRenderer content REMAINS FULLY LEGAL and this task may be implemented, reviewed and delivered with it. WHAT THE WITHDRAWN SENTENCE WAS REALLY PROTECTING IS KEPT INTACT AND IS STATED HERE AS THE DURABLE REQUIREMENT: whichever route is taken, the phantom must read as a WIZARD-SHAPED DECOY that a player can tell apart from the real wizard AND from the Lantern Wraith lantern-wisp at the fixed gameplay camera, which is what VAL-006 judges. THE ART ITSELF IS NOT THIS TASK'S TO MAKE OR TO OWN. If authored art is produced, an ART TASK OWNS ITS SPRITES AND THEIR .meta FILES and this task claims none of them: those paths are not in this contract's exclusive_resources and MUST NOT BE ADDED TO IT, because exclusive_resources is a contention lock and two tasks claiming one path collide. THIS TASK MUST TOLERATE THEIR PRE-EXISTENCE AND MUST NOT ASSERT THAT IT ADDS THEM - a subset rule, not an equality rule, for the same reason NSC-102's VAL-003 had to be rewritten: a gate asserting that a task ADDS a path already on main becomes unsatisfiable the moment anyone else lands it. THE LOOK IS THE ART DIRECTOR'S PICK and this contract does not specify it beyond the legibility requirement above; the teal-violet translucency named earlier in this criterion is the runtime-reuse baseline, not a constraint on authored art. It still creates no authored PREFAB - that half of the withdrawn sentence is retained deliberately, because a prefab is a scene-wiring artifact this task's builder lock already governs, and nothing about art requires one. Every phantom, afterimage, flare, pulse and other runtime-created resource still has an explicit cleanup path. Every phantom, afterimage, flare, pulse, and other runtime-created resource has an explicit cleanup path."
