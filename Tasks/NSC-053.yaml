  "notes": "Selected within-current-GDD behavior: a two-limit keep-distance band with approach, sustained hold, direct retreat, deterministic reachable side fallback, and hold when fully cornered. Exact distance limits, retreat distance, sampling tolerance, side-selection order, and reevaluation conditions remain implementation/playtesting values. The configured band width and the gap from far distance to LoseTargetDistance must each exceed the configured NavMeshAgent's measured stopping overshoot so the enemy can settle without visible approach/retreat oscillation and still has an observable approach interval. Tuning hypothesis only: once NSC-009 establishes Force Wave's radius, keep the close limit greater than that radius so reaching a Ranged Enemy remains risky. RangedEnemyKeepDistanceMovement does not rely on EnemyPursuitMovement.Tick(float) as a production entry point. If Vincent requires NSC-054 to perform a pre-fire line-of-sight check, this hold behavior must be reviewed again for cover stalemate before LOS-seeking movement is authorized. This task does not decide firing, line-of-sight policy, attack timing, projectiles, Player Health damage, locked-door attack form, prefab assembly, retreat-facing presentation, encounters, rooms, doors, or spell tuning.",
