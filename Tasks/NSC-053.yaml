      "criterion_id": "AC-001",
      "reference": "NSC-016 AC-001; GDD - Required Enemy Roster; Enemy Detection, Pursuit, and Target Loss",
      "requirement": "Create Assets/NoSafeCircle/DoorPrototype/Scripts/Enemies/RangedEnemyKeepDistanceMovement.cs and Assets/NoSafeCircle/DoorPrototype/Scripts/Enemies/RangedEnemyKeepDistanceMovement.cs.meta. RangedEnemyKeepDistanceMovement declares NavMeshAgent, EnemyTargetKnowledge, and EnemyPursuitMovement as required companion components and resolves its own references to them before its first keep-distance decision, so AddComponent order cannot leave its own references null. EnemyPursuitMovement remains enabled and remains the sole production driver that advances EnemyTargetKnowledge.UpdateTargetKnowledge once per frame, whether RangedEnemyKeepDistanceMovement is enabled or disabled. RangedEnemyKeepDistanceMovement does not call EnemyTargetKnowledge.UpdateTargetKnowledge or EnemyPursuitMovement.Tick(float), does not enable or disable EnemyPursuitMovement, does not copy target-acquisition or search state, and does not require an edit to a file owned by NSC-089, NSC-091, NSC-092, or NSC-013."
