    {
      "criterion_id": "AC-002",
      "reference": "NSC-016 AC-001; GDD - Required Enemy Roster; Enemy Detection, Pursuit, and Target Loss",
      "requirement": "RangedEnemyKeepDistanceMovement exposes public ConfigureDistances(float closeDistance, float farDistance). The method uses the same Vector3.Distance metric as EnemyTargetKnowledge and throws ArgumentException unless closeDistance is greater than zero, closeDistance is strictly less than farDistance, and farDistance is strictly less than the current EnemyTargetKnowledge.LoseTargetDistance. The component rechecks that relationship before making each keep-distance decision. If a later EnemyTargetKnowledge.ConfigureDistances call makes the configured band invalid, the component clears its own active path and holds without issuing another destination until valid configuration is restored."
    },
    {
      "criterion_id": "AC-003",
      "reference": "NSC-016 AC-001; GDD - Required Enemy Roster",
      "requirement": "While EnemyTargetKnowledge.State is Pursuing and CurrentTarget is non-null, RangedEnemyKeepDistanceMovement leaves approach movement toward CurrentTarget in effect when the target is farther than the far limit, clears the targetward path and holds while the target remains inside the inclusive distance band, and selects a complete reachable NavMesh path that increases distance from the target when nearer than the close limit. It retains a selected retreat or side-reposition destination until that destination is reached, becomes invalid, or the target crosses a distance boundary, preventing per-frame destination and direction churn. If the direct retreat path is blocked, it deterministically selects a complete reachable side path that increases separation. If no reachable candidate increases separation, it clears the path and holds without moving toward the wizard, warping, or repeatedly changing destination. Because EnemyPursuitMovement sets the NavMeshAgent destination to CurrentTarget every frame while Pursuing, each hold, retreat, or side-reposition decision takes effect after that update and before the NavMeshAgent moves in the same frame, regardless of component order on the GameObject."
    },
    {
      "criterion_id": "AC-004",
      "reference": "NSC-016 AC-005; GDD - Required Enemy Roster",
      "requirement": "Approach, hold, retreat, and side repositioning continue when no Melee Enemy component or GameObject exists. RangedEnemyKeepDistanceMovement does not query for a Melee Enemy, an active Melee Enemy count, or encounter composition."
    },
    {
      "criterion_id": "AC-005",
      "reference": "NSC-016 AC-006; GDD - Spell and Enemy Interactions; Runtime Implementation",
      "requirement": "RangedEnemyKeepDistanceMovement moves the enemy only by setting a destination on the existing NavMeshAgent or clearing that agent's path. It never assigns, caches, or restores NavMeshAgent.speed, acceleration, velocity, or updatePosition; never calls NavMeshAgent.Move or NavMeshAgent.Warp; and never writes Transform.position. EnemyStatusEffectMovement.ApplyFrostSlowdown(float, float) therefore slows actual approach, retreat, and side repositioning through the shared NavMeshAgent speed. Attack wind-up, cooldown, projectile speed, and projectile lifetime remain outside this task."
    },
    {
      "criterion_id": "AC-006",
      "reference": "GDD - Enemy Detection, Pursuit, and Target Loss; Door and Pursuit Rules",
      "requirement": "RangedEnemyKeepDistanceMovement changes destination behavior only while EnemyTargetKnowledge.State is Pursuing. It does not override last-known-position movement, bounded wander/search, reacquisition, idle handoff, target reset, or shared door-passability state owned by EnemyTargetKnowledge and EnemyPursuitMovement. A cover collider or doorway crossing does not cause this component to clear, suspend, or replace CurrentTarget; target loss remains controlled by EnemyTargetKnowledge's distance-based transition."
    },
    {
      "criterion_id": "AC-007",
      "reference": "GDD - Floor-run restart ownership; NSC-055 AC-002",
      "requirement": "RangedEnemyKeepDistanceMovement exposes public ResetKeepDistanceMovement(), which clears its retained retreat or side-reposition destination and clears its current NavMeshAgent path without resetting EnemyTargetKnowledge or warping the enemy. Disabling or destroying RangedEnemyKeepDistanceMovement performs the same cleanup while the NavMeshAgent is still present. While disabled, RangedEnemyKeepDistanceMovement issues no destination, so EnemyPursuitMovement's existing destination behavior applies unchanged; this enabled state is the handoff point used by INT-002. RangedEnemyKeepDistanceMovement never enables, disables, or stops EnemyPursuitMovement and never assigns NavMeshAgent.isStopped. Stopping all movement on defeat belongs to INT-001, and floor-restart invocation belongs to INT-003."
    },
    {
