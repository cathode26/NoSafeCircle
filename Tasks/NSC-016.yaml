      "criterion_id": "AC-002",
      "reference": "Required Enemy Roster",
      "requirement": "Shows a readable attack wind-up, then spawns a slow moving projectile. The attack is not hitscan and does not apply instant damage when the wind-up begins or ends."
    },
    {
      "criterion_id": "AC-003",
      "reference": "Runtime Implementation; Chapel of Ash cover requirement",
      "requirement": "After it is spawned, the projectile collides with gameplay cover such as walls, pews, and columns. A projectile that hits cover stops or despawns and cannot damage the player through or after that cover. This task does not require a clear line of sight before the enemy starts or releases an attack."
    },
    {
      "criterion_id": "AC-004",
      "reference": "Required Enemy Roster",
      "requirement": "A projectile that reaches the player requests damage only through the shared Player Health damage interface, currently PlayerHealth.TakeDamage, and the ranged-enemy scripts do not store a second copy of player health."
    },
    {
      "criterion_id": "AC-005",
      "reference": "Required Enemy Roster",
      "requirement": "Movement and projectile attacks continue to work when no Melee Enemy is alive. The Ranged Enemy does not query for or require a Melee Enemy component, object, or count before it can pursue, reposition, or attack."
    },
    {
      "criterion_id": "AC-006",
      "reference": "Spell and Enemy Interactions",
      "requirement": "Frost Field changes only the movement speed used for approach, retreat, and repositioning. Frost does not pause, cancel, lengthen, or otherwise change the attack wind-up, attack cooldown, projectile speed, or projectile lifetime."
    },
    {
      "criterion_id": "AC-007",
      "reference": "Environment Presentation and Authoring Direction; Enemy health and defeat ownership; Active Enemy Registry",
      "requirement": "Creates a reusable world-space SpriteRenderer Ranged Enemy prefab and connects the shared pursuit, keep-distance movement, projectile attack, Enemy Health/Defeat, and Active Enemy Registry behavior. The ranged-enemy scripts do not duplicate health, defeat, or registry bookkeeping. Defeat stops movement and attacks and unregisters the enemy exactly once through the shared interfaces."
    },
    {
      "criterion_id": "AC-008",
      "reference": "Section 2 — Floor-run restart ownership",
      "requirement": "The ranged-attack component exposes a public reset method that cancels an active wind-up, clears its attack timer or cooldown state, and destroys or despawns every projectile still owned by that enemy. The Floor Run/Restart Orchestrator calls this method instead of editing attack fields or projectile objects directly."
    }
  ],
