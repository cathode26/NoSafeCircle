  "notes": "Visual dressing may add presentation objects only; geometry and navigation remain authoritative. Governing visual direction: Docs/Art/Environment/DUNGEON_ART_DIRECTION.md, Vincent-approved project direction dated 2026-09-13. The supplied images are inspiration only; all art and layouts must be original. DEPENDENCY REPOINTED 2026-09-22 (contract revision 3): depends_on NSC-078 becomes NSC-102. This task consumes nine prop files and references PropCatalog.json nowhere, so it never needed the 45-entry NSC-078; NSC-102 publishes exactly those nine with proved Sprite import settings and a measured ground-line pivot. NSC-078 keeps catalog authorship for all forty-five entries and remains this project’s prop-acquisition task; nothing about its scope, gates or spend controls changed beyond releasing those nine files’ paths. RESOURCE-SHAPE REVISION, 2026-09-23: the four asset .meta paths are added to exclusive_resources and the folder-meta hazard is recorded in AC-003. Nothing else changed - no criterion or gate was added, removed or reworded beyond that clause, and the dressing design is untouched. Authored after a sweep found that all five room-dressing tasks - NSC-079, NSC-080, NSC-081, NSC-082 and NSC-083 - carried a file-only resource list, which derives an empty allowed-roots set and makes any generated sibling fatal at materialization. None of the five has ever run: there is no dressing prefab on main and none of them holds a candidate record, so this revision strands nothing. WORTH RECORDING BECAUSE IT WAS NEARLY MISSED IN THE OTHER DIRECTION: a sweep of the five room SCENES for references to the forty-five selected props returns zero, and that is the contract working rather than a gap - AC-003 forbids editing the blockout scene and VAL-001 requires proving it without opening the room's .unity file at all, because the dressing is a PREFAB. A measurement of the wrong artifact reads exactly like a missing feature. VAL-002 CERTIFICATION, 2026-09-23: the visual approval on this gate is the Art Director's. Decision provenance is Documentation Agent on Vincent's delegation, 2026-09-23 07:10Z; his own word does not exist and is not claimed. Wording is the Art Director's own, since they hold the gate. TWO THINGS THEY REFUSED THAT I HAD OFFERED, both recorded because the refusals are the valuable part: their 19-39 saturation band, because it was measured on isolated prop sprites against transparency while this gate judges a gameplay frame of mostly floor, wall and lighting - a correctly dressed room would fail it; and any global band at all, because the five rooms have deliberately different palettes chained off one base flagstone under NSC-064. A true measurement promoted to a case nobody measured, baked into five contracts, would have failed later as an inexplicable red. The screenshot-or-contact-sheet choice is also gone: the two answer different questions and an OR lets the gate be satisfied by the panel that cannot see the defect.",
