      "reference": "Room ownership boundary",
      "requirement": "Own only this room's dressing prefab, catalog, builder, and focused tests; do not edit the blockout scene, common builders, another room, doors, navigation, or the canonical scene. EVERY OWNED ASSET'S .meta IS OWNED WITH IT, AND AN EARLIER REVISION LISTED ONLY THE FOUR ASSETS. Unity writes a .meta beside every asset it imports, so this task's four assets are eight committed files. The omission is not cosmetic and this is measured at source rather than argued: Pipeline/AssistantControl/unity_materialization.py's _generated_resource_roots admits a resource to the Unity builder's allowed roots ONLY when git cat-file -t reports a tree for it, so a resource list containing files alone derives an EMPTY root set - and the companion folder metas it would otherwise supply are computed only FROM those roots, so they are empty too. After that, any file generated beside the owned ones is fatal at materialization. That is the shape that nearly froze NSC-044. THE THREE OUTPUT DIRECTORIES DO NOT EXIST ON MAIN AND ARE DELIBERATELY NOT CLAIMED HERE. Measured: Art/Environment/RoomDressing, Editor/Environment and Tests/Editor/Environment are all absent, while their parent Art/Environment is present with its own .meta. So the FIRST of the five room-dressing tasks to land creates all three, and Unity generates a folder .meta for each. Five tasks claiming one path would be a resource collision, so none claims them and the question of who commits them is named here rather than assumed away: the established remedy is the one used for the prop folders, which were committed separately at 9bd49c7ee as proper folder assets - folderAsset: yes with DefaultImporter, never GUID-only stubs, which import as Cubemaps in Unity 6000.1 - so that no task had to create them. Until that is done for these three, the first dressing task to run needs its contract revised to claim them at that time. EVERY LATER TASK MUST TOLERATE THEIR PRE-EXISTENCE AND MUST NOT ASSERT THAT IT ADDS THEM: 