      "reference": "Door and Pursuit Rules; Runtime Implementation",
      "requirement": "Modify Assets/NoSafeCircle/DoorPrototype/Scripts/Enemies/EnemyPursuitMovement.cs so the NavMesh locomotion owner exposes a read-only BlockingLockedDoor property. While EnemyTargetKnowledge.State is Pursuing, identify the locked DoorInteractable that blocks the route to EnemyTargetKnowledge.CurrentTarget and whose approach-side point is reachable by a complete NavMesh path. While that result is non-null, set the NavMeshAgent destination to a reachable approach-side point associated with that door instead of continuing toward CurrentTarget.position; DoorInteractable.InteractionPosition is an existing candidate, while the exact sampled point remains an implementation detail. Expose the selected point through a read-only BlockingDoorApproachPoint property whose value is meaningful only while BlockingLockedDoor is non-null. The observable result must be the locked door between the enemy and wizard whose approach side the enemy can reach by a complete NavMesh path (when more than one locked door lies between them, only the one nearest the enemy along its route qualifies), and null when the wizard is reachable, the relevant door is open or broken, a nearby locked door is not between the enemy and wizard, or the path to that door's approach side is incomplete. Clear the result when qualification ends. Do not add witnessed-crossing or line-of-sight-to-crossing state."
    },
    {
      "criterion_id": "AC-002",
