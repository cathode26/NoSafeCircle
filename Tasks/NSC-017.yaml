  "notes": "Exact attack reach, interval, absolute damage, and resulting breach time are implementation/playtest tuning not fixed by the GDD. Initial hypotheses are 0.5-1.5 world units of reach, 0.6-1.2 seconds per full attack interval, and 5-15 absolute durability points per hit against the snapshot default maximum durability of 100; none is a completion requirement. Breach time scales with the number of attackers that actually reach the door. Frost Field does not change door-attack timing in required scope; that remains a stretch goal requiring Vincent's approval. Only Pursuing qualifies under this revision. A SearchingLastKnownPosition enemy whose last known position is unreachable beyond a locked door may stall indefinitely under the current NSC-092 implementation; NSC-017 neither treats HasTarget as active tracking nor repairs that separate search-arrival gap. Local proof is limited to enemies whose NavMeshAgent is driven by EnemyPursuitMovement. Ranged Enemy door approach, attack form, and interaction with keep-distance movement remain unresolved design. The temporary fixture bakes before creating the door and therefore cannot prove that the canonical builder's bake order leaves a broken doorway walkable; INT-003 owns that built-scene proof. NSC-021 VAL-001 and NSC-051 INT-001 remain in their current contracts and may consume NSC-017 evidence without being transferred. Existing EnemyPursuitPlayModeTests and EnemyPursuitDoorCrossingPlayModeTests are regression-only checks that must remain green but are not exclusive resources or NSC-017 completion evidence. The snapshot contains prerequisite source files but no TaskGraph delivery records for NSC-013, NSC-050, NSC-051, NSC-052, NSC-091, or NSC-092.",
