  "notes": "Revision 2, 2026-09-18, on Vincent's instruction \"turn NSC-098 in the art and glow task\". This contract was revision 1 a verbatim copy of NSC-007's mechanics, minted to route around a wedged worker record; carrying two identical fireballs was the wrong outcome, so the id is repurposed instead of retired and NSC-007 keeps the mechanics unchanged along with its four dependents. The three additions all came from Vincent playing the build: the art was never in NSC-007 (its AC-008 says placeholder primitives and \"no art asset beyond this task's listed files\"), the projectile does not grow with charge (NSC-007 AC-002 scales cost, damage and impact area only, and pins the contact radius), and no charge glow exists anywhere in it - a keyword sweep of NSC-007 found zero occurrences of glow, visual, VFX or particle. INVARIANT WART, stated so nobody is misled: reconciliation_key cannot change across a revision, so it remains \"fireball-second-mint\", which describes this contract's history and not its content. depends_on is NSC-007 and that dependency is real, not bookkeeping: Fireball.cs and FireballProjectile.cs do not exist at HEAD, so there is nothing to bind art to or read charge state from until the mechanics land. This task therefore cannot run before NSC-007 delivers, and repurposing this id means there is no longer a second fireball id that could run the mechanics tonight - NSC-007's worker-record wedge is the blocker and it belongs to the Pipeline Maintainer. The 28 sprites are already generated and approved (Vincent's cap of 100, spend recorded by the Art Director), so this task makes no PixelLab call. It claims Fireball.cs and FireballProjectile.cs because a read-only accessor may be needed; the contention with NSC-007 is resolved by the dependency, not by narrowing the claim. Art files are claimed individually rather than as a directory, deliberately: a folder claim serialises against everything beneath it, which is a declared-contention artifact worth avoiding.",
