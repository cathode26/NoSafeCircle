  "acceptance_criteria": [
    {
      "criterion_id": "AC-001",
      "reference": "Art Director package C:/nscrev/reports/art-director/fireball-20260917 (final48, 28 sprites, 64 px per world unit, 48-colour lock); Vincent's spend approval 2026-09-17, cap 100",
      "requirement": "Import the approved fireball sprite set into Assets/NoSafeCircle/DoorPrototype/Art/Spells/Fireball/Source as transparent PNGs and record each one in source-inventory.json with its key, frame index, PixelLab id, prompt, canvas size, alpha bounding box and sha256 of the committed bytes, in the shape NSC-095's PixelLab128 inventory uses. The set is exactly 28 files: core_still, spark_still, impact_still, scorch, gather_0..5, hold_0..5, projectile_0..3 and impact_0..7. Every sprite imports at 64 pixels per world unit - the standard the merged wizard art and the approved door art use - so the effect sits in scale with the characters rather than at its native canvas size. This task introduces no PixelLab call and generates no art; the sprites already exist and are approved."
    },
    {
      "criterion_id": "AC-002",
      "reference": "Vincent 2026-09-18: the placeholder primitives were never meant to ship; NSC-007 AC-008",
      "requirement": "Replace NSC-007's programmer placeholders with the imported art. Create Assets/NoSafeCircle/DoorPrototype/Scripts/FireballPresentation.cs to own every fireball visual: the charge gather (gather_0..5) while a charge is building, the charge hold loop (hold_0..5) once full charge is reached, the in-flight projectile loop (projectile_0..3), the detonation burst (impact_0..7) at the detonation point, and the scorch decal left behind. NSC-007's placeholder primitive or generated sprite is removed in the same change, so exactly one fireball visual exists afterwards. Presentation reads state and never drives it: this component must not spend mana, start or cancel a charge, create or destroy projectiles, apply damage, or alter any timing or radius the mechanics own. If the required state is not publicly readable, add only a read-only accessor - never a behaviour change - to Assets/NoSafeCircle/DoorPrototype/Scripts/Fireball.cs or Assets/NoSafeCircle/DoorPrototype/Scripts/FireballProjectile.cs."
    },
    {
      "criterion_id": "AC-003",
      "reference": "Vincent 2026-09-18: \"The fireball that shot out wasnt bigger.\" NSC-007 AC-002 scales mana cost, damage and impact area with charge, and says nothing about the projectile's size",
      "requirement": "The in-flight projectile must be visibly larger at higher charge tiers. Its rendered size is derived from the tier the mechanics already carry - tap, partial charge, full charge - and increases monotonically across them, so a full-charge shot reads as bigger than a tap at a glance and at gameplay distance, not only in a frame-by-frame comparison. The detonation burst scales with that tier's configured impact area so the visible explosion matches the radius that actually deals damage; a burst that looks larger than the area it damages, or smaller, is a failure of this criterion. **The projectile's gameplay contact radius and every damage value stay exactly as NSC-007 configures them** - this criterion changes what the player sees, never what the projectile hits. Serialize the per-tier visual scales rather than hard-coding them."
    },
    {
      "criterion_id": "AC-004",
      "reference": "Vincent 2026-09-18: \"We also want the player to like glow when they are charged up like in DBZ\"",
      "requirement": "Create Assets/NoSafeCircle/DoorPrototype/Scripts/FireballChargeGlow.cs, a component on the wizard that makes charging readable on the caster's own body. It reads NSC-007 AC-008's existing public charging state and normalized charge progress and nothing else - it polls no input, spends no mana and never writes charge state. The glow builds with charge progress rather than switching on at a threshold, is visibly stronger at full charge than at partial, and clears immediately when the charge ends for any reason: cast, cancellation by damage, refused cast, ResetFireball, SuspendGameplayInput, component disable or destruction. It must not obscure the wizard's silhouette or his facing direction, and it must not change his sorting relative to walls, doors or enemies - the NSC-039 sorting band and the isometric transparency sort axis stay as they are. A tap cast, which never enters a charge, produces no glow."
    },
    {
      "criterion_id": "AC-005",
      "reference": "NSC-007 AC-009 and AC-010's builder-wiring pattern",
      "requirement": "Update DoorPrototypeGlobalSceneBuilder.BuildPlayer to add FireballChargeGlow and FireballPresentation to the Player and assign their references deterministically, the same way it adds Fireball. The production builder materializes the wiring into Assets/Scenes/DoorPrototype.unity; implementation code and tests never hand-edit or reconstruct the serialized scene. Running the builder twice produces an equivalent hierarchy, references and component values - raw scene bytes are not the equivalence oracle, since every rebuild assigns new fileIDs."
    }
  ],
