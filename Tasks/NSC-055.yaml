      "reference": "NSC-016 AC-007 Enemy Health/Defeat; NSC-015 MeleeEnemyDefeatResponse pattern",
      "requirement": "Create Assets/NoSafeCircle/DoorPrototype/Scripts/Enemies/LanternWraithDefeatResponse.cs (+.meta). On EnemyHealth's Defeated event it disables RangedEnemyKeepDistanceMovement; disables EnemyPursuitMovement and clears its path with NavMeshAgent.ResetPath(), matching NSC-053 INT-001's required defeat behavior (\"stops RangedEnemyKeepDistanceMovement and EnemyPursuitMovement, clears movement paths and active projectiles, and cannot reactivate direct pursuit\"); disables RangedEnemyAttack, whose OnDisable calls RangedEnemyAttack.ResetAttack() and stops any active wind-up and every owned RangedEnemyProjectile; and stops the NavMeshAgent. It does not call ActiveEnemyRegistry.Unregister itself, because EnemyHealth.Defeat() already calls activeEnemyRegistry.Unregister(gameObject) exactly once. It exposes public ResetDefeatResponse(), which re-enables RangedEnemyKeepDistanceMovement, EnemyPursuitMovement, and RangedEnemyAttack and resumes the NavMeshAgent, for floor restart (NSC-033 AC-004; downstream_integration_obligations INT-003)."
    },
