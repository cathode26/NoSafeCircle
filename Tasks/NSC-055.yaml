      "requirement": "The generated prefab presents the Lantern Wraith using NSC-077's delivered assets read-only. A Visual child, created the same way DoorPrototypeSceneBuilder.CreateWorldSpriteVisual creates it, has a SpriteRenderer following the NSC-039 world-sprite sorting and ground-contact pivot convention, in NSC-077's uniform camera-facing Visual box (64 pixels per unit, 2x2 world units, uniform scale 1, world rotation fixed to the camera rotation Euler (30, -45, 0)); it shows the Lantern Wraith's south idle still. The prefab root carries an Animator using the exact generated asset at Assets/NoSafeCircle/DoorPrototype/Art/Enemies/Generated/LanternWraithAnimator.controller and an EnemyAnimationController. No clip, controller, or sprite is copied; NSC-077's generated assets are not edited. This task makes one scoped edit to Assets/NoSafeCircle/DoorPrototype/Scripts/Enemies/EnemyAnimationController.cs: in ResolveFacingTarget(), for EnemyAnimationKind.LanternWraith, when this GameObject has no EnemyLanternWispCaster component (the production prefab never does) but has an EnemyTargetKnowledge with a non-null CurrentTarget, idle facing targets that CurrentTarget; the existing EnemyLanternWispCaster.FacingTarget path for the legacy stationary wraith is otherwise unchanged, and no other method or the MeleeEnemy branch is edited."
    },
    {
