      "requirement": "Create Assets/NoSafeCircle/DoorPrototype/Generated/LanternWispProjectile.prefab (+.meta), builder output only, compatible with RangedEnemyProjectile's required components and serialized fields, as a glowing teal ghost-light orb placeholder: unlit or emissive, art-bible teal #30e0cb, no fire colors, at the size of NSC-077's scene stand-in orb (EnemyLanternWispCaster.CastAtWizard's LanternWisp primitive sphere, Visual.transform.localScale = Vector3.one * 0.45f). It is assigned to RangedEnemyAttack's serialized projectileTemplate field. LanternWraithGameplay.prefab (not the projectile prefab) includes a child Transform named WispOrigin at the lantern's height and offset, assigned to RangedEnemyAttack's serialized projectileOrigin field, and a child GameObject named LanternFlare assigned to RangedEnemyAttack's serialized windUpFeedback field: its SpriteRenderer is a placeholder teal flare using a builder-generated sprite asset (Assets/NoSafeCircle/DoorPrototype/Generated/LanternFlareSprite.asset + .meta), the SpriteRenderer stays enabled so RangedEnemyAttack.Tick's feedbackRenderer.enabled check passes, and the LanternFlare GameObject itself is active only during wind-up (matching RangedEnemyAttack.Awake and CancelWindUp, which call windUpFeedback.SetActive(false) outside wind-up). RangedEnemyProjectile's speed, lifetimeSeconds, collisionRadius, and damage fields, and RangedEnemyAttack's windUpSeconds and cooldownSeconds fields, keep their delivered values and ownership; this task changes none of them."
    },
    {
      "criterion_id": "AC-005",
      "reference": "NSC-017 INT-001; GER Orchestrator decision E3, 2026-09-17",
      "requirement": "This revision does not attach EnemyLockedDoorAttack to the generated prefab and adds no dependency on NSC-017. A Lantern Wraith that loses sight of the wizard behind a locked door uses only its existing EnemyTargetKnowledge target-loss and search behavior. Locked-door wiring is deferred (downstream_integration_obligations INT-002)."
