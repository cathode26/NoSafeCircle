      "reference": "NSC-016 AC-007; NSC-054 INT-003; NSC-015 AC-004 builder pattern",
      "requirement": "Create Assets/NoSafeCircle/DoorPrototype/Editor/LanternWraithGameplayPrefabBuilder.cs (+.meta), an Editor menu command at No Safe Circle/Build Lantern Wraith Gameplay Prefab exposing public static LanternWraithGameplayPrefabBuilder.BuildLanternWraithGameplayPrefab(), plus a deterministic non-saving in-memory seam for tests, following MeleeEnemyGameplayPrefabBuilder (NSC-015 AC-004). Its production entry point exclusively owns and materializes all three generated assets and their metadata: Assets/NoSafeCircle/DoorPrototype/Generated/LanternWraithGameplay.prefab, Assets/NoSafeCircle/DoorPrototype/Generated/LanternWispProjectile.prefab, and Assets/NoSafeCircle/DoorPrototype/Generated/LanternFlareSprite.asset (each +.meta); none is hand-authored or reconstructed. The generated prefab contains and wires exactly one NavMeshAgent, EnemyTargetKnowledge, EnemyPursuitMovement, EnemyStatusEffectMovement, EnemyHealth, RangedEnemyKeepDistanceMovement, RangedEnemyAttack, and LanternWraithDefeatResponse (AC-002) on a single GameObject, without duplicating health, defeat, or registry state. It exposes EnemyTargetKnowledge.Initialize(Transform) for the wizard target and EnemyHealth.Initialize(ActiveEnemyRegistry) for activation. It contains no scene registry reference, wizard scene reference, spawn placement, encounter count, room identity, door target, input action, or spell behavior, and no EnemyLockedDoorAttack component (AC-005)."
    },
