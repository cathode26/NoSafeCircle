  "notes": "This child connects the named components into the reusable prefab. Encounter placement and the rule requiring Melee support remain outside this proposal. Human-approved audit correction: the assembled-prefab Play Mode coverage must also prove that keep-distance movement and projectile attack operate together on the same live GameObject; the focused component tests remain owned by NSC-053 and NSC-054. Revision 3 (2026-09-16): NSC-094 is superseded by NSC-077 revision 3, which supplies the Ranged Enemy idle and walk animation as LanternWraithAnimator.controller driven by EnemyAnimationController; this prefab reuses them read-only. Vincent decided on 2026-09-16 that the Ranged Enemy is the Lantern Wraith and that its projectile is a teal lantern wisp with unchanged gameplay, so this prefab presents the Lantern Wraith. Revision 4 (2026-09-17): applies the GER Orchestrator's decisions E1-E6 (C:/nscrev/ger-contract-revisions-20260916/followups-20260917/NSC-055_REV4_DECISIONS.md, from the revision 3 Codex check). Names the production builder, generated prefab, Lantern Wisp projectile template, projectile origin, wind-up feedback, and defeat-response component (NSC-054 INT-003); proves registration and defeat cleanup through an NSC-015 VAL-006-style test harness only, transferring production activation to NSC-030 AC-005 (INT-001); promotes NSC-077's read-only Lantern Wraith presentation (Visual, LanternWraithAnimator.controller, EnemyAnimationController) into acceptance criteria and gates (AC-003, VAL-003, VAL-004, VAL-006); and explicitly defers Ranged Enemy locked-door behavior pending Vincent's decision (NSC-017 INT-001), adding no NSC-017 dependency (AC-005, INT-002). Revision 5 (2026-09-17): applies the GER Orchestrator's decisions G1-G6 from the revision 4 Codex check (C:/nscrev/ger-contract-revisions-20260916/followups-20260917/NSC-055_REV4_DECISIONS.md, \"NSC-055 revision 5\"; G7 assigns a change to NSC-033 revision 9, in drafting, not to NSC-055). VAL-003 splits into two mandatory Edit Mode checks, a builder-seam check and a committed-asset check against both generated prefabs, and only VAL-008's Windows controller run may execute the production builder (G1). LanternWraithDefeatResponse also disables EnemyPursuitMovement and clears its NavMeshAgent path on defeat, matching NSC-053 INT-001, and VAL-001 proves a partial reset cannot reactivate the enemy (G2). NSC-055 depends on NSC-088 and VAL-005 proves the assembled prefab operates against a TryRedirectToSpectralDecoy-redirected CurrentTarget (G3; this dependency should narrow to NSC-088's specific enemy-redirect decomposition child once NSC-088 decomposes, which has not happened as of this revision). NSC-055 claims and makes one scoped edit to EnemyAnimationController.cs, adding an EnemyTargetKnowledge.CurrentTarget idle-facing fallback for the production Lantern Wraith, which has no legacy EnemyLanternWispCaster; VAL-007 proves it and VAL-008's regression run adds NSC-077's EnemyAnimationPlayModeTests without joining it to NSC-055's own policy filters (G4). VAL-004 adds committed LanternWispProjectile.prefab conformance assertions for its components, color, scale, collision setup, and unchanged RangedEnemyProjectile/RangedEnemyAttack serialized values (G5). AC-001 now states the builder exclusively owns and materializes all three generated assets (G6). NSC-077 INT-002 naming this task's LanternWispProjectile.prefab as the wisp-art replacement target is deferred until NSC-077 is integrated, per the decisions file; not applied here.",
