  "notes": "Created 2026-09-17 at Vincent's direct request after he diagnosed the defect in play. The cause is measured, not inferred: a 2-unit blocker in a 3-unit opening, ten open sightlines across five doors, one builder expression. depends_on is deliberately empty so this is dispatchable immediately - it is on Vincent's filming path. The door sprite family it binds is the output of NSC-065 (art direction and selection, needs_testing), but the selection was settled by Vincent's own approval on 2026-09-17 rather than by NSC-065's record, so a dependency on NSC-065 would block this task on bookkeeping rather than on substance; GER Agent decision, recorded here rather than queued to him during a quiet period. Claiming DoorPrototypeSceneBuilder.cs and the generated scene puts this task in contention with 27 and 31 other contracts respectively; that is honest - it edits both - and is resolved by sequencing rather than by narrowing the claim, per the ownership rule learned on 2026-09-17 that an unclaimed file has no contention protection at all. The sweep fixture is a NEW file owned solely by this task rather than an addition to DoorPrototypeSceneBuilderTests.cs, which five other tasks claim. The art's damaged, opening and broken states are excluded because the code cannot reach them; writing a seven-state gate against a four-state code path would produce an unbuildable gate, the same failure shape that cost NSC-069 three revisions on 2026-09-17. Revision 2, 2026-09-17: AC-002 rewritten to bind by DoorPassabilityState rather than by sprite name, after the Art Director read the state list off the enum. Revision 1's wording (\"final for the final door\") would have permitted a crew to render the closed gold-glow leaf for an OPEN final door - the win-condition door, in footage being recorded tonight. DoorPassabilityState was verified at HEAD to be exactly {Sealed, Open, Locked, Broken} with no Final member, so final is a skin on a closed state selected by isFinalDoor, not a state. VAL-002 gained the two assertions that catch the mistake. The approval reference also moves to Docs/Art/Doors/APPROVAL.md, which is committed, rather than to a report path outside the repository. Revision 3, 2026-09-18: closes a write-authority gap in revision 2's AC-002 that blocked run task-orch-nsc097-20260918-1. The criterion demanded runtime, state-driven sprite binding while the task could only write an Editor-only builder, so it was unbuildable as written; the implementer returned BLOCKED rather than exceeding its authority, which is the correct outcome and cost no candidate. The fix authorizes one new runtime component instead of write authority on DoorInteractable.cs, because that file is claimed by seven other tasks while a new path has zero contention - and because DoorInteractable already raises Opened after deactivating the door visual, so a subscriber can re-enable it without that file changing at all. That ordering is now stated in the criterion and gated in VAL-002, so a future reorder fails a test rather than silently making doors invisible when opened. Nothing else in the contract changes: AC-001's seal, AC-003's opening scale, both INT obligations and every resource from revision 2 are unaltered. Revision 4, 2026-09-22: two defects, both raised by the Game Agent while this task sat prepared. VAL-002 opened \"In the same Edit Mode fixture\" and then made Play-Mode assertions naming no file, while the dispatch scope plan already named DoorwayTraversalPlayModeTests.cs - so a crew reading only the contract could not tell where the Play-Mode half lived; the gate now names it. And the contract claimed four door .png.meta files in exclusive_resources that no executor can write, which is a promise no crew could keep; those four are removed and the correct import settings are stated as a dispatch precondition instead. The .cs.meta entries stay: those are sidecars for files this task creates and ExecutionCrew owns them deterministically. Who performs the Unity reimport was open with Vincent at the time of this revision.",
