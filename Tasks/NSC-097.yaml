      "criterion_id": "AC-001",
      "reference": "Game Agent probe at main b7e46c320, C:/nscrev/reports/door-crack-probe/FINDING.md; Vincent's play report 2026-09-17",
      "requirement": "Size the doorway blocker from the wall opening, not from the door art leaf. At HEAD Assets/NoSafeCircle/DoorPrototype/Editor/DoorPrototypeSceneBuilder.cs sets the BoxCollider to (2, 2.5, 0.3) under a comment reading \"sized to the door's footprint\", while wall collision does not begin until 1.5 units either side of centre, so a 2-unit blocker sits in a 3-unit opening. The measured consequence is that rays at 1.25 units either side of centre are blocked by nothing on both jambs of all five doors - ten open sightlines. The blocker must span the full opening including both jambs, so that while it is enabled no ray, projectile or line-of-sight query passes between the leaf and the wall. Derive the span from the authored opening width rather than replacing one hard-coded literal with another, so a later change to the opening cannot silently reopen the gap. This is a builder correction applied once, not a per-door fix."
    },
    {
      "criterion_id": "AC-002",
      "reference": "Vincent's approval 2026-09-17, recorded at Docs/Art/Doors/APPROVAL.md (committed 841fd8133); Art Director state list read off DoorPassabilityState rather than sprite names; DoorPassabilityState verified at Assets/NoSafeCircle/DoorPrototype/Scripts/World/DoorEnemyPassability.cs:10 to be exactly {Sealed, Open, Locked, Broken}",
      "requirement": "Bind the approved bonestone door sprites by the door's state as the CODE expresses it, not by sprite filename, replacing the placeholder rectangle the scene draws today. DoorPassabilityState at Assets/NoSafeCircle/DoorPrototype/Scripts/World/DoorEnemyPassability.cs holds exactly Sealed, Open, Locked and Broken; DoorInteractable separately carries isFinalDoor. Bind Sealed to door_bonestone_sealed, Locked to door_bonestone_locked, and Open to door_bonestone_open. door_bonestone_final is NOT a state: the art is a closed leaf with a gold glow, so it binds only where isFinalDoor is true AND the door is closed, and it must never be displayed for an open passage - an open final door shows the open sprite. Getting this wrong renders the win-condition door as shut after the player has opened it. Do not bind door_bonestone_damaged, door_bonestone_opening or door_bonestone_broken: damaged belongs to NSC-052's breach feedback and waits on a damage threshold, opening belongs to a state model that does not exist in code, and broken is out of scope by Vincent's instruction of 2026-09-17 (\"A broken door occurs later, dont use it now\"). Binding a sprite no state can reach would ship a gate that cannot pass. **Create Assets/NoSafeCircle/DoorPrototype/Scripts/DoorStateSpriteBinder.cs plus its .meta, a new runtime MonoBehaviour owned by this task, to perform the binding.** Revision 2 was defective: it required state-driven binding while authorizing only DoorPrototypeSceneBuilder.cs, an Editor-only construction-time class that has no standing lifetime and cannot respond to a door changing state during Play. The binder subscribes to DoorInteractable's existing public events - **Opened**, **Locked** and **ResetCompleted** - and sets the SpriteRenderer's sprite for the state the door has entered. The builder's job is unchanged and construction-time: create the renderer, attach the binder, and assign its four sprite references deterministically. **DoorInteractable.cs is explicitly NOT writable by this task and must not be modified.** Seven other tasks claim it - NSC-019, NSC-020, NSC-041, NSC-049, NSC-050, NSC-051 and NSC-052 - and it does not need to change, because of the ordering below. **Load-bearing ordering, verified at HEAD:** DoorInteractable.Complete() calls `doorVisual.SetActive(false)` and only then raises `Opened`, so the binder's Opened handler runs after the visual has been deactivated and **must re-enable it** before showing the open sprite - otherwise the door renders the correct sprite on a hidden object and simply vanishes when opened, which is what revision 2 would have shipped. This ordering is a dependency on another task's file: if a future change raises `Opened` before deactivating the visual, this binder breaks. VAL-002 gates that rather than trusting it. **Critical coupling a reader of this criterion alone would not guess: `doorVisual` and `doorwayBlocker` are the SAME GameObject.** The builder adds the blocker as a BoxCollider on the visual (`visual.AddComponent<BoxCollider>()`) and assigns both private fields from it, so re-enabling the visual to show the open sprite also re-activates the object carrying the gameplay collider. An open door stays passable only because `doorwayBlocker.enabled` was set false before the event and `enabled` survives the deactivate/reactivate cycle. **The binder must therefore change GameObject activity and the sprite only, and must never touch collider state.** A binder that re-enables the collider alongside its object produces an open door that blocks the wizard and stops projectiles - reintroducing, through this task's art half, the exact defect AC-001 exists to remove."
    },
    {
      "criterion_id": "AC-003",
      "reference": "Art Director measurement 2026-09-17: the sprite's opening is 1.00 x 1.30 world units against a 1.64-unit wizard; GER Agent decision 2026-09-17 on which remedy to take",
      "requirement": "The bound door must present an opening the wizard can actually cross. Differencing the sealed and open sprites isolates a painted opening of 1.00 x 1.30 world units, while the wizard stands 1.64 units tall, so at native binding he does not fit through the door he is required to walk through. Bind the sprite at a scale that yields an opening of at least 2.0 units wide and tall enough to clear the wizard with margin; the measured zero-generation binding is approximately 1.54x, giving an opening near 2.0 units and an arch near 3 units. GER Agent decision, taken rather than queued: scale the existing approved art rather than re-author it, because re-authoring costs PixelLab generations and delays filming, and the proportion is plausible for a vault gate. If the proportion is later rejected the remedy is a revision of this criterion, not a rebuild. AC-001's blocker span must be derived from the resulting opening, so the two criteria agree by construction rather than by coincidence."
    }
