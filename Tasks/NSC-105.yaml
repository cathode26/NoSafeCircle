      "criterion_id": "AC-001",
      "requirement": "INTRODUCE A FLOOR IDENTITY ABOVE THE ROOM CATALOG. Today there is exactly one catalog and one canonical scene: RoomSceneCatalog.LoadOrBuildAsset() returns a single asset, and DoorSequenceBuilder.cs:15 declares `internal const string CanonicalScenePath = \"Assets/Scenes/DoorPrototype.unity\"` with :19 `if (targetScene.path != CanonicalScenePath) return;`. Add an identity for a FLOOR - a named set of composition owners with their bounds, its door sequence and its scene - so more than one floor can exist and be resolved by name. THIS IS AN ADDITION ABOVE THE CATALOG, NOT A REWRITE OF IT: a floor OWNS a catalog, and the catalog keeps meaning exactly what it means today."
    },
    {
      "criterion_id": "AC-002",
      "requirement": "MAKE THE SCENE PATH FLOOR-SCOPED WHILE KEEPING ITS REFUSAL. BuildCanonical composes the floor it is given and resolves that floor's scene path. THE EARLY-RETURN'S PROTECTIVE BEHAVIOUR IS RETAINED AND NOT REMOVED: a scene that is not a registered floor scene must still be refused rather than composed into. Deleting the guard instead of scoping it is the failure this criterion exists to prevent - it currently stops the builder writing into an arbitrary open scene, and that protection is worth MORE once there is more than one scene it could legitimately write to, not less."
    },
    {
      "criterion_id": "AC-003",
      "requirement": "SEPARATE THE PHYSICAL SPACE FROM THE COMPOSITION OWNER. Add a string SpaceId naming a physical space; RoomId remains the COMPOSITION OWNER and keeps its present meaning. Internal connections between spaces are `passage` openings that EMIT NO DOOR ANCHORS, so RoomSceneComposer's catalog-ownership refusal at :386 - \"'<room>' does not own a door anchor for '<door>' per the catalog\" - is never reached by an internal connection. DoorId stays the progression gate and is never used for an internal connection."
    },
    {
      "criterion_id": "AC-004",
      "requirement": "MAKE ROOM COUNT AND ORDER FLOOR-SCOPED, AND PROVE THE EXISTING FLOOR STILL VALIDATES. ValidateFixedRoomOrder hardcodes both: :167-171 returns \"Catalog must contain exactly 5 rooms, found N\", and :173-179 returns \"Room at catalog index i must be 'X' but was 'Y'\" against a literal RuinedEntry/BoneArchive/ChapelOfAsh/LowerVault/FinalRoom array. Both must validate against the FLOOR's declared owner list and order instead of a literal. THE EXISTING FIVE-ROOM FLOOR MUST STILL VALIDATE, UNCHANGED AND IN THE SAME ORDER - that regression is what proves the rule was SCOPED rather than WEAKENED. A floor whose catalog does not match its own declared list must still be refused, with an error naming the mismatch."
    },
    {
      "criterion_id": "AC-005",
      "requirement": "MAKE THE BOUNDARY-DOOR COUNT A PER-FLOOR DECLARATION. FinalRoomSceneTests.cs:138 asserts `AreEqual(1, doors.Count(door => door.IsFinal), \"D5 must remain the only final door.\")`. A floor with a way IN and a way OUT carries TWO boundary doors, so a global \"exactly one\" cannot hold once a second floor exists. Replace the global constant with a count the FLOOR declares, and keep the assertion's force: a floor must carry exactly the number it declares, no more and no fewer. THE EXISTING FLOOR DECLARES EXACTLY ONE, so that assertion holds unchanged. DO NOT DELETE THAT TEST AND DO NOT WEAKEN IT TO ACCEPT ANY COUNT: an assertion satisfied by one or by two proves nothing."
    },
    {
      "criterion_id": "AC-006",
      "requirement": "BRIDGE D3, BECAUSE \"REPLACE THE FIRST THREE\" IS NOT THREE. Measured on main 2026-09-23: the first three rooms in catalog order are RuinedEntry, BoneArchive and ChapelOfAsh - NSC-044, NSC-045, NSC-046 - and all three are not_delivered with selected_record (none), so replacing them costs NO delivery record. BUT D3 IS ChapelOfAsh -> LowerVault, AND NSC-047 IS CONFORMANT WITH RECORD DEL-NSC-047-3e5bb5b0d65b AND HOLDS D3's ENTRY ANCHOR. Removing ChapelOfAsh leaves that anchor with no partner, and ValidateFixedRoomOrder's count rule then stops the canonical scene composing for EVERY room rather than only the three. THIS TASK MUST NOT LEAVE D3 UNPARTNERED. Either the existing five-room floor is retained intact as a floor of its own - the cheapest option, and the one that keeps NSC-047's conformance surface untouched - or this task specifies D3's replacement explicitly. WHICH IS CHOSEN IS VINCENT'S AND IS NOT DECIDED HERE; what is required here is that neither is left implicit."
