        "reason": "Rev 3 adds AC-007 and closes the half of AC-001 that was never there. AC-001 constrains the VERTICAL extent only, so a wide thin slab satisfies it while blocking movement far outside the art - and Vincent found exactly that in the editor on shared_rubble_pile_a, saying 'this box collider seems wrong'. He was right. Census re-measured independently across all 41 prefabs of e02d54e9: X UNCHANGED on 41 of 41, Y changed on 41, Z changed on 40, so 40 props went from a cube to a wide thin slab, and shared_rubble_pile_a went 2.766x2.330x2.766 to 2.766x1.282x2.213 - still blocking 2.766 units of width. ONE ASYMMETRY PRODUCES BOTH LIVE DEFECTS: too thin in Z so sight stops being blocked (AC-006), still full width in X so movement is blocked outside the art (AC-007). AC-007 requires the movement volume's horizontal footprint to come from where the art meets the ground, on BOTH axes independently, and never from the sprite's alpha bounding box - VAL-001 must fail a prop wider than its ground on EACH axis separately, because a one-axis check passes the very slab that caused this. I DID NOT ADOPT THE REPORTED MECHANISM: the account was that the camera projection smears an object's HEIGHT into its sprite width, which is the third mechanism claim in this thread that did not survive checking, since a world-vertical edge maps to screen-vertical under a yaw rotation. AC-007 rests instead on the argument that holds whatever the projection does - an alpha bounding box is the outline of the whole object at every height, so its width is an UPPER BOUND on ground footprint and never a measurement of it. The projection question is left open in writing rather than guessed. Found and reported by the Game Agent; the census is theirs and I reproduced it exactly.",
