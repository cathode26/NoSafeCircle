  "notes": "AUTHORED 2026-09-27 FROM agent-state/intent-NSC-130-prop-collider-shape-and-sight-layer.md, at game main 214bc37e. THIS CONTRACT DELIBERATELY DOES NOT RE-SPECIFY THE 41 PREFAB RESHAPES - they merged at c7b5f48a and CLAUDE.md is explicit that a defect needs no task id and that a record which only PROVES is rank 3. What is authored here is the set of assertions, which RELEASES something: the Game Agent reverted one prefab to full sprite height on purpose and every suite stayed green, so the blindness is measured rather than suspected. TWO FIELDS THAT LOOK LIKE ONE AND ARE NOT: the verifier already checks renderer.sortingLayerName (draw order); the field every sight and projectile query reads is gameObject.layer (physics), and nothing checks it. AC-003 is about the second. NO PETNIP FIGURE APPEARS IN THIS CONTRACT AND THAT IS DELIBERATE. Vincent's shipped isometric game at F:/Petnip/MoveProblems/client is an approved free reference and its collider polygons cover only the lower part of each sprite, but it is one 2D project on Unity 2019.4 while this is 3D on 6000.1.8f1, and a fraction copied across would die the first time an artist changes a sprite. The SHAPE RULE is copied; no number is. ALSO DELIBERATELY ABSENT: any requirement that props carry a solid base PLUS a walk-through trigger. That is true of chest.prefab alone in the reference project; the pickups there are trigger-only, so a blanket clause would have been false of most of the population. WHAT THE WALK-THROUGH TRIGGER SHOULD DRIVE IN THIS GAME IS STILL VINCENT'S AND IS UNANSWERED - it is not in this contract and its absence is a decision, not an omission. NOT ESTABLISHED: no Unity was run; the sprite-extent source the verifier should read (renderer bounds versus the sprite asset's rect) is the implementer's choice and is not specified here; and whether every prop prefab currently obeys AC-003's layer relation is unmeasured - the first run of VAL-001 is what will say.",
