        "reason": "Rev 4: AC-007 was unsatisfiable as I wrote it, and the agent about to implement it said so before building anything. Rev 3 required the footprint on 'both horizontal axes, independently'. A sprite is ONE view - its base gives one outline and the two ground axes are two unknowns - so any rule that reads a base width and writes both X and Z is choosing a convention and calling it a measurement, which is the precise fault AC-007 exists to stop. THE CRITERION WOULD HAVE FORCED THE THING IT FORBIDS. Rev 4 keeps the outcome and adds the only honest alternative: each axis is either measured from the art, or is a CONVENTION NAMED IN THIS CONTRACT'S PROVENANCE with its reason, and never a bare number in a gate. VAL-001 now checks each axis separately and, where an axis is set by a named convention, asserts against THAT NAMED CONVENTION rather than inventing a second measurement, so a convention cannot pass itself off as evidence. A clean escape exists and is deliberately NOT assumed: if the art draws bases as isometric diamonds, a diamond's screen width and screen height are two measurements for two unknowns. The Game Agent is testing that against a prop whose footprint is independently known and explicitly declined to assert it first, having had a projection mechanism refuted earlier tonight. Their corroborating census - collider X equals the sprite alpha-bbox width in 41 of 41, 19 of 41 over 1.25x their art base, worst ca_pew_x_end at 3.29x - is cited with its owner and NOT re-derived by me; I verified the cube-to-slab census, not this one, and the 15 percent base slice behind it is itself a convention and is named as one. Third revision to this contract in about two hours, each catching a real defect before an implementer met it, and with no candidate, delivery record or pin in existence the churn costs nothing.",
