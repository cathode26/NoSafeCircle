      "reference": "PropPrefabVerifier.cs on main 214bc37e; the reshaping itself merged at c7b5f48a and needs no contract",
      "requirement": "THE COLLIDER'S VERTICAL EXTENT IS COMPARED AGAINST THE PROP'S OWN DRAWN SPRITE AND A FULL-HEIGHT COLLIDER FAILS. What must hold: for every prop prefab not on the verifier's declared walk-through list, the verifier reads the collider's vertical extent and that prefab's own drawn sprite extent and FAILS when the collider spans the whole sprite. A prop's solid mass is its base; its upper body is drawn, not walked into. THIS IS A RELATION BETWEEN TWO THINGS ON THE SAME PREFAB AND CARRIES NO FIGURE. No fraction, ratio or threshold from any other project enters this contract: a number would die the first time an artist changes a sprite, and the relation survives that. WHY THIS CRITERION EXISTS AT ALL, since the 41 reshapes already merged: the Game Agent reverted one prefab's collider to full sprite height ON PURPOSE and every suite stayed green. That mutation is the measurement - the suite is blind here - so this criterion RELEASES a guard rather than proving work already done. *** AND THIS CRITERION MUST NOT BE READ ALONE. SEE AC-006, ADDED IN REVISION 2. *** Shrinking the movement collider to the base is correct AND it is what removed sight cover from the game, because one BoxCollider was serving both jobs. Satisfying this criterion without satisfying AC-006 is a regression Vincent can see, and it has already happened once."
