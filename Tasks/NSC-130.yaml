      "criterion_id": "AC-001",
      "reference": "PropPrefabVerifier.cs on main 214bc37e; the reshaping itself merged at c7b5f48a and needs no contract",
      "requirement": "THE COLLIDER'S VERTICAL EXTENT IS COMPARED AGAINST THE PROP'S OWN DRAWN SPRITE AND A FULL-HEIGHT COLLIDER FAILS. What must hold: for every prop prefab not on the verifier's declared walk-through list, the verifier reads the collider's vertical extent and that prefab's own drawn sprite extent and FAILS when the collider spans the whole sprite. A prop's solid mass is its base; its upper body is drawn, not walked into. THIS IS A RELATION BETWEEN TWO THINGS ON THE SAME PREFAB AND CARRIES NO FIGURE. No fraction, ratio or threshold from any other project enters this contract: a number would die the first time an artist changes a sprite, and the relation survives that. WHY THIS CRITERION EXISTS AT ALL, since the 41 reshapes already merged: the Game Agent reverted one prefab's collider to full sprite height ON PURPOSE and every suite stayed green. That mutation is the measurement - the suite is blind here - so this criterion RELEASES a guard rather than proving work already done."
    },
    {
      "criterion_id": "AC-002",
      "reference": "CLAUDE.md: break the guard on purpose; an unbroken test is a CLAIM, not evidence",
      "requirement": "THE GUARD IS PROVEN BY BREAKING IT, IN THE TEST ITSELF. What must hold: a prop whose collider is set to span its whole drawn sprite makes the verifier FAIL, and the same prop with its base-only collider makes the verifier PASS. Both directions are asserted, and the failing case names the prop and what was wrong with it rather than only reporting that something failed. A check that has never been observed to fail is indistinguishable from one that cannot fail, and this exact guard has already been silently absent once."
    },
    {
      "criterion_id": "AC-003",
      "reference": "SightOcclusionLayers.cs on main; its own comment states the layer policy",
      "requirement": "THE PHYSICS LAYER A PROP SITS ON IS VERIFIED AGAINST THE SAME POLICY THAT SIGHT QUERIES READ - AND IT IS A DIFFERENT FIELD FROM THE ONE ALREADY CHECKED. The verifier today checks the RENDERER's sortingLayerName, which is draw order. The layer every sight and projectile query reads is the GameObject's physics layer, and nothing checks it. What must hold: a prop drawn below eye height sits on the layer that sight and projectile queries exclude, and a prop drawn at or above eye height sits on a layer they do not exclude - stated against SightOcclusionLayers' own published policy and its EyeOffset, not against a height I invent. A knee-high prop left on the blocking layer stops an enemy seeing through it, which is the same family as the freeze defect NSC-131 exists for."
    },
    {
      "criterion_id": "AC-004",
      "reference": "SightOcclusionLayers.cs ExcludeLowDressing: it returns the base mask unchanged when the named layer does not resolve",
      "requirement": "THE EXCLUSION IS PROVEN TO EXCLUDE, BECAUSE IT FAILS OPEN BY DESIGN. ExcludeLowDressing returns the mask unchanged when the named layer does not resolve, so a renamed or deleted layer silently restores the old block-everything behaviour with no error anywhere. What must hold: the named layer resolves, and the mask the helper returns actually has that layer's bit cleared - asserted as the RELATION between the returned mask and the resolved layer rather than against a hardcoded index. A fail-open default is correct behaviour and an untested fail-open default is a silent regression waiting for a rename."
    },
    {
      "criterion_id": "AC-005",
      "reference": "PropPrefabVerifier.cs: the declared walk-through list and its two-directional check",
      "requirement": "NOTHING THE VERIFIER ALREADY CATCHES MAY STOP BEING CAUGHT. What must hold after this change: a prop with no collider still fails unless it is on the declared walk-through list with a reason; a prop ON that list that has acquired a collider still fails; a trigger-only collider on a prop expected to be solid still fails; and a non-positive extent still fails. These are named because the new height and layer checks run inside the same loop over the same prefabs and the same renderer, which is exactly where a rewrite quietly drops a branch."
    }
  ],
