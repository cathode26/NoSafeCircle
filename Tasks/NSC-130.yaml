        "date": "2026-09-27",
        "reason": "Rev 6: AC-006 claimed prefab-only checkability for an angle-dependent property, and that claim was my convenience rather than a measurement. I wrote 'checkable from the prefab alone' so the criterion would stay inside the existing EditMode gate without adding a platform, and rev 2 even recorded that as a feature. It is the defect. A 1.66 x 0.58 slab blocks a ray crossing it BROADSIDE and misses one running along its length, so occlusion is a function of the ray's angle to the box and of nothing the prefab holds. THE DEMONSTRATION IS THE GAME AGENT'S OWN PROXY, WHICH IT WITHDREW BEFORE IT REACHED ANYTHING: scoring rooms by 'crosses eye height AND at least 0.80 on the thinner horizontal axis' ranks Bone Archive ZERO and Final Room ONE, while the live eight-direction raycast measures Bone Archive 2 of 8 blocked and Final Room 0 of 8 - exactly inverted against the thing it stood in for. AC-006 now BANS any scalar threshold on depth, thickness, footprint area or aspect ratio, in the criterion and in the gate, because no such number exists and a gate built on one passes and fails for unrelated reasons. It splits into (a) a prefab-checkable NECESSARY condition - crossing eye height, asserted with no threshold, since a prop that does not cross it CANNOT occlude - and (b) an actual sight query in a loaded scene returning OBSTRUCTED for at least one approach. VAL-001 now rejects a prefab-only assertion and rejects any scalar standing in for a raycast. The platform for (b) is the implementer's choice and I did NOT bind one: a policy filter naming a class nobody has written discovers zero tests, and zero discovered tests read as a pass - if (b) lands outside EditMode this contract needs a revision to add the platform and filter, and I will rebind on their word. ALSO RECORDED: Ruined Entry has ZERO props crossing eye height across 19 catalog placements, reached from the dressing catalogs by prop_id rather than from my filename-prefix count, so it is a second method and not a restatement - and since crossing eye height is necessary, zero crossing means zero cover. Two limits stated by the measurer and not smoothed over: Lower Vault's figure is a FLOOR because 20 of its 62 placements name prop_ids with no prefab, and 30 prop_ids are unresolved across all five rooms with no established explanation - a live data-integrity question about the dressing catalogs, recorded as a lead and NOT adopted as this task's scope.",
