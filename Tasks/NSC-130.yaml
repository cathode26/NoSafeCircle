      "requirement": "*** THE MOVEMENT VOLUME'S HORIZONTAL FOOTPRINT IS DERIVED FROM THE ART'S BASE, NEVER FROM THE SPRITE'S BOUNDING BOX. *** WHAT MUST HOLD: for every prop expected to be solid, the horizontal extent of the movement volume corresponds to where the object meets the ground in its own art, on EACH horizontal axis, and is not taken from the sprite's alpha bounding box. *** AND EACH AXIS IS EITHER MEASURED OR IS A NAMED CONVENTION. REVISED 2026-09-27 BECAUSE 'BOTH AXES INDEPENDENTLY' MAY NOT BE SATISFIABLE FROM THE ART AT ALL. *** A sprite is ONE view: its base yields one outline, and the two ground axes are two unknowns, so a rule that reads a base width and writes both X and Z is choosing a convention - square, or keep-the-ratio - and presenting it as a measurement. **THAT SUBSTITUTION IS THE EXACT FAULT THIS CRITERION EXISTS TO STOP, so the criterion must not require it by accident.** WHAT MUST HOLD INSTEAD, and it is checkable: for each horizontal axis, either the art supplies a measurement for that axis and the volume uses it, OR the value comes from a convention that is NAMED IN THIS CONTRACT'S PROVENANCE with its reason - never a bare number in a gate. **A CONVENTION IS NOT A MEASUREMENT AND MUST NOT BE SPELLED LIKE ONE.** Raised by the Game Agent against this criterion before implementing it, and it is right. IF THE ART DRAWS ITS BASES AS ISOMETRIC DIAMONDS, BOTH AXES ARE RECOVERABLE AND NO CONVENTION IS NEEDED - a diamond has a screen width and a screen height, which is two measurements for two unknowns. **THAT IS UNTESTED IN THIS ART AND IS NOT ASSUMED HERE.** The Game Agent is testing it against a prop whose true footprint is independently known; if it holds, the convention half of this criterion simply never fires. MEASURED, AND THIS IS WHY THE CRITERION SAYS BOTH AXES: across all 41 prefabs of e02d54e9, X was UNCHANGED on 41 of 41 while Y changed on 41 and Z changed on 40. **Every prop went from a cube to a wide thin slab** - 40 of them kept their full original width while losing depth. shared_rubble_pile_a went 2.766 x 2.330 x 2.766 to 2.766 x 1.282 x 2.213, so a rubble pile still blocks 2.766 units of width; that is the prop Vincent was looking at. lv_iron_rail_x is now 4.55 times wider than it is deep. WHY A SPRITE'S BOUNDING BOX CANNOT SUPPLY THIS, AND IT IS THE DURABLE PART OF THE CRITERION: an alpha bounding box is the silhouette of the WHOLE object at every height - overhangs, tops, arms and all - so its width is an UPPER BOUND on the ground footprint and never a measurement of it. A wide-topped shelf or a candelabra with arms has a silhouette far wider than the ground it stands on. The base rows of the art are the only source that measures the right thing. **WHAT IS NOT ESTABLISHED, deliberately: the exact projection account. A peer reported that the camera's pitch and yaw smear an object's HEIGHT sideways into its sprite width. That specific claim is not settled here - a world-vertical edge maps to screen-vertical under a yaw rotation - and this criterion does not rest on it.** The silhouette-versus-footprint argument above holds whatever the projection does, which is why it is the one stated. If someone establishes the projection mechanism, it belongs in a note and not in this requirement. AND THIS IS A THIRD PROPERTY, SEPARATE FROM AC-001'S VERTICAL EXTENT AND AC-006'S SIGHT VOLUME. All three are required at once: base-only height, a ground-derived footprint, and sight occlusion that survives both. CORROBORATION REPORTED BY THE GAME AGENT AND NOT RE-DERIVED BY ME, recorded as theirs: collider X equals the sprite's alpha bounding-box width **TO THE THREE-DECIMAL PRECISION THE PREFAB FORMAT STORES**, in 41 of 41 rows, so X was copied from the silhouette and never measured. **THE WORD 'EXACTLY' WAS WITHDRAWN BY THE MEASUREMENT'S OWN AUTHOR AND THE FINDING SURVIVES INTACT:** at full precision 3 rows are bit-identical, 37 differ by at most 0.0005, and one - fr_landmark_bone_throne, 2.5620 agains