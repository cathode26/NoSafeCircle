  "notes": "AUTHORED 2026-09-27 FROM agent-state/intent-NSC-130-prop-collider-shape-and-sight-layer.md, at game main 214bc37e. THIS CONTRACT DELIBERATELY DOES NOT RE-SPECIFY THE 41 PREFAB RESHAPES - they merged at c7b5f48a and CLAUDE.md is explicit that a defect needs no task id and that a record which only PROVES is rank 3. What is authored here is the set of assertions, which RELEASES something: the Game Agent reverted one prefab to full sprite height on purpose and every suite stayed green, so the blindness is measured rather than suspected. TWO FIELDS THAT LOOK LIKE ONE AND ARE NOT: the verifier already checks renderer.sortingLayerName (draw order); the field every sight and projectile query reads is gameObject.layer (physics), and nothing checks it. AC-003 is about the second. NO PETNIP FIGURE APPEARS IN THIS CONTRACT AND THAT IS DELIBERATE. Vincent's shipped isometric game at F:/Petnip/MoveProblems/client is an approved free reference and its collider polygons cover only the lower part of each sprite, but it is one 2D project on Unity 2019.4 while this is 3D on 6000.1.8f1, and a fraction copied across would die the first time an artist changes a sprite. The SHAPE RULE is copied; no number is. ALSO DELIBERATELY ABSENT: any requirement that props carry a solid base PLUS a walk-through trigger. That is true of chest.prefab alone in the reference project; the pickups there are trigger-only, so a blanket clause would have been false of most of the population. WHAT THE WALK-THROUGH TRIGGER SHOULD DRIVE IN THIS GAME IS STILL VINCENT'S AND IS UNANSWERED - it is not in this contract and its absence is a decision, not an omission. NOT ESTABLISHED: no Unity was run; the sprite-extent source the verifier should read (renderer bounds versus the sprite asset's rect) is the implementer's choice and is not specified here; and whether every prop prefab currently obeys AC-003's layer relation is unmeasured - the first run of VAL-001 is what will say. *** REVISION 2, 2026-09-27: AC-006 ADDED, AND IT EXISTS BECAUSE THIS CONTRACT AS I FIRST WROTE IT CONTAINED A CONTRADICTION I DID NOT SEE. *** AC-001 requires the solid collider to cover only the base. Sight occlusion reads that same collider. So satisfying AC-001 removes sight cover from every landmark-scale prop, and that is not hypothetical - e02d54e9 had already merged when I authored rev 1, and the reported sight-blocked enemy case stopped reproducing because of it. I authored a contract whose two halves fight, an hour before anyone noticed. FOUND BY THE GAME AGENT, WHICH WITHDREW ITS OWN CAUSAL CLAIM TO GET THERE: its baseline measured the reproduction already green without its fix, 3.8780 against 3.8781, and it traced the cause to its own merged collider reshape rather than defending the result. IT ALSO GOT THE MECHANISM WRONG AND THAT HALF IS MINE TO CORRECT: the account was that props dropped below the sight ray. Re-measured at e02d54e9^ versus main, the three tallest props STILL SPAN eye height and 7 of 41 tops remain above it, independently reproduced - what changed decisively is DEPTH, z 1.656 to 0.580 on the shelf the freeze was measured behind, a 65 percent reduction. A fix aimed at restoring height would restore nothing, which is exactly why AC-006 names the footprint. That check is in local prefab space and assumes the prop sits at y=0 with both eyes near 1.0; it is an approximation, stated as one. THE PLATFORM DOES NOT CHANGE: AC-006 is written to be checkable from the prefab, so the EditMode gate and the existing validation policy filter still cover it and no PlayMode entry is needed. WHAT IS STILL NOT ESTABLISHED: whether a second collider, a dedicated sight volume or a layer arrangement is the right implementation - that is deliberately left open - and whether any prop in the tree currently satisfies AC-006 at all. On today's measurement most do not, so expect the first run of VAL-001 to fail, and that failure is the point.",
