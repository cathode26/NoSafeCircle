        "reason": "Rev 5 is a precision qualifier on a cited census and changes no requirement. Rev 4 carried the Game Agent's figure as 'collider X equals the sprite alpha bounding-box width in 41 of 41 rows exactly'. Its author went back to full precision BECAUSE I had cited it under their name without re-deriving it, and withdrew the word 'exactly': 3 rows are bit-identical, 37 differ by at most 0.0005, and one - fr_landmark_bone_throne at 2.5620 against 2.5625 - sits on that bound, the residuals being the prefab YAML's three-decimal storage rather than a real disagreement. AC-007 now carries the honest form: equal to the three-decimal precision the prefab format stores, in 41 of 41. THE FINDING AND EVERY REQUIREMENT ARE UNCHANGED - X was copied from the silhouette and never measured, which is what AC-007 exists to stop. Worth a revision for one word because an over-strong number invites a reader who finds a single 0.0005 to discard a correct census, and this contract has spent four revisions removing exactly that class of wording. It also names a real cost: taking a figure on attribution is right when it supports rather than redirects a criterion, but it puts the burden of precision on someone who published at two decimal places for a different purpose.",
