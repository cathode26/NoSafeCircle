  "notes": "AUTHORED 2026-09-27 FROM agent-state/intent-NSC-130-prop-collider-shape-and-sight-layer.md, at game main 214bc37e. THIS CONTRACT DELIBERATELY DOES NOT RE-SPECIFY THE 41 PREFAB RESHAPES - they merged at c7b5f48a and CLAUDE.md is explicit that a defect needs no task id and that a record which only PROVES is rank 3. What is authored here is the set of assertions, which RELEASES something: the Game Agent reverted one prefab to full sprite height on purpose and every suite stayed green, so the blindness is measured rather than suspected. TWO FIELDS THAT LOOK LIKE ONE AND ARE NOT: the verifier already checks renderer.sortingLayerName (draw order); the field every sight and projectile query reads is gameObject.layer (physics), and nothing checks it. AC-003 is about the second. NO PETNIP FIGURE APPEARS IN THIS CONTRACT AND THAT IS DELIBERATE. Vincent's shipped isometric game at F:/Petnip/MoveProblems/client is an approved free reference and its collider polygons cover only the lower part of each sprite, but it is one 2D project on Unity 2019.4 while this is 3D on 6000.1.8f1, and a fraction copied across would die the first time an artist changes a sprite. The SHAPE RULE is copied; no number is. ALSO DELIBERATELY ABSENT: any requirement that props carry a solid base PLUS a walk-through trigger. That is true of chest.prefab alone in the reference project; the pickups there are trigger-only, so a blanket clause would have been false of most of the population. WHAT THE WALK-THROUGH TRIGGER SHOULD DRIVE IN THIS GAME IS STILL VINCENT'S AND IS UNANSWERED - it is not in this contract and its absence is a decision, not an omission. NOT ESTABLISHED: no Unity was run; the sprite-extent source the verifier should read (renderer bounds versus the sprite asset's rect) is the implementer's choice and is not specified here; and whether every prop prefab currently obeys AC-003's layer relation is unmeasured - the first run of VAL-001 is what will say. *** REVISION 2, 2026-09-27: AC-006 ADDED, AND IT EXISTS BECAUSE THIS CONTRACT AS I FIRST WROTE IT CONTAINED A CONTRADICTION I DID NOT SEE. *** AC-001 requires the solid collider to cover only the base. Sight occlusion reads that same collider. So satisfying AC-001 removes sight cover from every landmark-scale prop, and that is not hypothetical - e02d54e9 had already merged when I authored rev 1, and the reported sight-blocked enemy case stopped reproducing because of it. I authored a contract whose two halves fight, an hour before anyone noticed. FOUND BY THE GAME AGENT, WHICH WITHDREW ITS OWN CAUSAL CLAIM TO GET THERE: its baseline measured the reproduction already green without its fix, 3.8780 against 3.8781, and it traced the cause to its own merged collider reshape rather than defending the result. IT ALSO GOT THE MECHANISM WRONG AND THAT HALF IS MINE TO CORRECT: the account was that props dropped below the sight ray. Re-measured at e02d54e9^ versus main, the three tallest props STILL SPAN eye height and 7 of 41 tops remain above it, independently reproduced - what changed decisively is DEPTH, z 1.656 to 0.580 on the shelf the freeze was measured behind, a 65 percent reduction. A fix aimed at restoring height would restore nothing, which is exactly why AC-006 names the footprint. That check is in local prefab space and assumes the prop sits at y=0 with both eyes near 1.0; it is an approximation, stated as one. THE PLATFORM DOES NOT CHANGE: AC-006 is written to be checkable from the prefab, so the EditMode gate and the existing validation policy filter still cover it and no PlayMode entry is needed. WHAT IS STILL NOT ESTABLISHED: whether a second collider, a dedicated sight volume or a layer arrangement is the right implementation - that is deliberately left open - and whether any prop in the tree currently satisfies AC-006 at all. On today's measurement most do not, so expect the first run of VAL-001 to fail, and that failure is the point. *** REVISION 3, 2026-09-27: AC-007 ADDED, AND IT CLOSES THE HALF OF AC-001 THAT WAS NEVER THERE. *** AC-001 constrains the VERTICAL extent only, so a wide thin slab satisfies it while blocking movement far outside the art - and Vincent found exactly that in the editor, on shared_rubble_pile_a, saying \"this box collider seems wrong\". He was right. Census re-measured independently across all 41 prefabs of e02d54e9: X UNCHANGED on 41 of 41, Y changed on 41, Z changed on 40, so 40 props went from a cube to a wide thin slab. THAT ONE ASYMMETRY PRODUCES BOTH LIVE DEFECTS AT ONCE - too thin in Z so it stops occluding sight (AC-006), still full width in X so it blocks movement outside the art (AC-007) - which is why they are separate criteria on one root cause rather than one clause. Found and reported by the Game Agent, whose census I reproduced exactly. I DID NOT ADOPT ITS STATED MECHANISM: it reported that the camera projection smears an object's HEIGHT into its sprite width, and that is the THIRD mechanism account in this thread that did not survive checking - a world-vertical edge maps to screen-vertical under a yaw rotation. AC-007 therefore rests on the silhouette-versus-footprint argument, which holds whatever the projection does: an alpha bounding box is the outline of the whole object at every height, so its width is an upper bound on ground footprint and never a measurement of it. THE PROJECTION QUESTION IS LEFT OPEN IN WRITING RATHER THAN GUESSED. Both prior mechanism accounts in this thread were confidently stated and both were wrong in the dimension, so the standing lesson for this contract family is to write the criterion on the argument that survives being wrong about the mechanism. *** REVISION 4, 2026-09-27: AC-007 WAS UNSATISFIABLE AS I WROTE IT, AND THE AGENT ABOUT TO IMPLEMENT IT SAID SO BEFORE BUILDING ANYTHING. *** Rev 3 required the footprint on 'both horizontal axes, independently'. A sprite is one view: its base gives one outline and the two ground axes are two unknowns, so any rule that reads a base width and writes both X and Z is choosing a convention and calling it a measurement - which is the precise fault AC-007 exists to stop. THE CRITERION WOULD HAVE FORCED THE THING IT FORBIDS. Rev 4 keeps the outcome and adds the only honest alternative: each axis is either measured from the art or is a CONVENTION NAMED IN THIS CONTRACT'S PROVENANCE with its reason, and never a bare number in a gate. A possible clean escape exists and is deliberately NOT assumed: if the art draws its bases as isometric diamonds, a diamond's screen width and screen height are two measurements for two unknowns and both axes are recoverable. The Game Agent is testing that against a prop whose footprint is independently known and explicitly declined to assert it first, having had a projection mechanism refuted earlier the same night - which is the right instinct and worth recording as such. THIS IS THE THIRD REVISION TO THIS CONTRACT IN ABOUT TWO HOURS AND EVERY ONE CAUGHT A REAL DEFECT BEFORE AN IMPLEMENTER MET IT: rev 2 the collider-versus-sight contradiction, rev 3 the missing footprint half, rev 4 an unsatisfiable requirement. No candidate, no delivery record and no pin exists for this task, so the churn costs nothing; an unsatisfiable criterion reaching a crew costs a run. WHAT IS STILL NOT ESTABLISHED: whether the diamond recovery holds; and the alpha-bbox census (X equals silhouette width in 41 of 41, 19 of 41 over 1.25x, worst 3.29x) is the Game Agent's measurement, cited with its owner and NOT re-derived by me - I verified the cube-to-slab census, not this one. *** REVISION 5, 2026-09-27: A PRECISION QUALIFIER ON A CITED CENSUS, AND IT CHANGES NO REQUIREMENT. *** Rev 4 carried the Game Agent's figure as *collider X equals the sprite's alpha bounding-box width in 41 of 41 rows exactly*. Its author went back to full precision BECAUSE I had cited it under their name without re-deriving it, and withdrew the word 'exactly': 3 rows are bit-identical, 37 differ by at most 0.0005, and one sits on that bound, with the residuals being the prefab format's three-decimal storage rather than a real disagreement. The honest form now stands in AC-007. THE FINDING IS UNCHANGED AND SO IS EVERY REQUIREMENT IN THIS CONTRACT - X was copied from the silhouette and never measured, which is what AC-007 exists to stop. WHY A REVISION FOR ONE WORD: an over-strong number invites a reader who finds one 0.0005 to discard a correct census, and this contract has spent four revisions removing exactly that class of wording. IT ALSO DEMONSTRATES THE COST OF CITING WITHOUT RE-DERIVING, WHICH IS A REAL COST AND WORTH NAMING: taking a figure on attribution is the right call when it supports rather than redirects a criterion, but it puts the burden of precision on someone who published at two decimal places for a different purpose. They carried it; the trade is not free. *** REVISION 6, 2026-09-27: AC-006 CLAIMED PREFAB-ONLY CHECKABILITY FOR AN ANGLE-DEPENDENT PROPERTY, AND THAT CLAIM WAS MY CONVENIENCE RATHER THAN A MEASUREMENT. *** I wrote it so the criterion would stay inside the existing EditMode gate without adding a platform, and rev 2 even recorded that as a feature. It is the defect. A 1.66 x 0.58 slab blocks a ray crossing it broadside and misses one running along its length, so occlusion is a function of the ray's angle to the box and of nothing the prefab holds. THE DEMONSTRATION IS THE GAME AGENT'S OWN REFUTED PROXY, WHICH IT WITHDREW BEFORE IT REACHED ANYTHING: scoring rooms by 'crosses eye height AND at least 0.80 on the thinner horizontal axis' ranks Bone Archive ZERO and Final Room ONE, while the live eight-direction raycast measures Bone Archive 2 of 8 and Final Room 0 of 8 - inverted against the thing it stood in for. AC-006 now bans any scalar threshold on depth, thickness, area or aspect ratio, in the criterion and in the gate, and splits into a prefab-checkable NECESSARY condition plus a real sight query. WHAT THE POLICY WOULD NEED: the validation policy entry for this task is EditMode with PropPrefabVerifierTests. If the sight-query half of AC-006 lands in a PlayMode fixture instead, THIS CONTRACT NEEDS A REVISION TO ADD THAT PLATFORM AND FILTER - I am not binding a platform for a fixture nobody has written, because a filter naming a class that does not exist discovers zero tests and zero discovered tests read as a pass. Tell me where it lands and I will rebind it. ALSO CONFIRMED BY A SECOND METHOD AND WORTH KEEPING: RUINED ENTRY HAS ZERO PROPS CROSSING EYE HEIGHT, from 19 catalog placements - reached from the dressing catalogs by prop_id rather than from my filename-prefix count, so it is corroboration and not a restatement. Since crossing eye height is necessary, ZERO crossing means ZERO cover, and that room therefore has none at all. Per-direction measurement for its melee spawn is still unmeasured and is nobody's task. TWO LIMITS THE MEASURER STATED AND I AM NOT SMOOTHING OVER: Lower Vault's figure is a FLOOR, not a count, because 20 of its 62 placements name prop_ids with no prefab under Resources/Props; and 30 prop_ids are unresolved across all five rooms with no established explanation. That second one is a live data-integrity question about the dressing catalogs and it is NOT this task's - it is recorded here as a lead, not adopted as scope.",
