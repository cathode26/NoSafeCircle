      "criterion_id": "AC-001",
      "reference": "NSC-021 AC-001; GDD §2 Close and Lock",
      "requirement": "DoorInteractable uses the Door-owned forward-side crossing state from NSC-020 to close and lock an open door automatically without another player command."
    },
    {
      "criterion_id": "AC-002",
      "reference": "NSC-021 AC-002; GDD §2 Player Health ownership",
      "requirement": "When locking finishes, DoorInteractable calls the Player Health restore method supplied by NSC-004 with its configured fixed recovery amount; it does not edit Player Health fields."
    },
    {
      "criterion_id": "AC-003",
      "reference": "NSC-021 AC-003; GDD §3 Door and Pursuit Rules",
      "requirement": "The door's player blocker prevents backward player movement after the door locks and continues preventing backward movement after the door breaks; the player cannot reopen or unlock the door."
    },
    {
      "criterion_id": "AC-004",
      "reference": "NSC-021 AC-004; GDD §3 Locked-door attack and durability ownership",
      "requirement": "While the door is locked, DoorInteractable stores current durability and exposes a public door-damage method for enemy attacks. Accepted damage reduces current durability and changes the door from locked to broken when durability reaches zero. Calls made while the door is sealed, open, or already broken do not reduce durability or trigger another state transition, and callers cannot edit durability or semantic door state directly."
    },
    {
      "criterion_id": "AC-005",
      "reference": "NSC-021 AC-005; GDD §3 Door and Pursuit Rules",
      "requirement": "A broken DoorInteractable remains in its broken/open semantic state and cannot close, relock, or return to an earlier semantic state during the current run. Its player blocker continues preventing backward travel. Publishing the broken state as forward-passable to enemy navigation is owned by the door-passability child."
    },
    {
      "criterion_id": "AC-006",
      "reference": "NSC-021 AC-008; GDD §2 Floor-run restart ownership",
      "requirement": "Expose a public DoorInteractable lifecycle-reset method that restores DoorInteractable-owned open, locked, and broken state, sealed geometry, the player blocker, and current durability to the serialized maximum. NSC-020 remains the owner of doorway-crossing state and its own reset method; this child does not create or directly overwrite a second crossing-state field."
    },
    {
      "criterion_id": "AC-007",
      "reference": "NSC-021 AC-009; GDD §4 Dungeon Encounter Agent",
      "requirement": "Expose a serialized maximum-durability value on each door component so level authoring can configure each door while DoorInteractable retains ownership of current durability and damage handling."
    }
  ],
