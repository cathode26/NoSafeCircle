      "criterion_id": "AC-001",
      "reference": "NSC-014 AC-001; GDD - Enemy Detection, Pursuit, and Target Loss",
      "requirement": "Create Assets/NoSafeCircle/DoorPrototype/Scripts/Enemies/EnemyTargetKnowledge.cs. Store Detection Distance and Lose Target Distance in private serialized fields, validate that Detection Distance is strictly smaller than Lose Target Distance, and expose only the read-only target and search state needed by enemy movement and tests."
    },
    {
      "criterion_id": "AC-002",
      "reference": "NSC-014 AC-002; GDD - Enemy Detection, Pursuit, and Target Loss",
      "requirement": "EnemyTargetKnowledge acquires the wizard as its current target when the wizard enters Detection Distance. It does not inspect doorway-crossing events or clear an acquired target because the wizard crossed an open doorway."
    },
    {
      "criterion_id": "AC-003",
      "reference": "NSC-014 AC-003; GDD - Enemy Detection, Pursuit, and Target Loss",
      "requirement": "When the tracked wizard exceeds Lose Target Distance, EnemyTargetKnowledge records the player's last known position and changes from active pursuit to the last-known-position search state solely because of the distance comparison, never because of a random roll."
    },
    {
      "criterion_id": "AC-004",
      "reference": "NSC-014 AC-004; GDD - Enemy Detection, Pursuit, and Target Loss",
      "requirement": "After the movement component reports arrival at the last known position, EnemyTargetKnowledge enters a time-bounded wander/search state and periodically checks Detection Distance. Re-entering Detection Distance during that state reacquires the wizard and restores active pursuit."
    },
    {
      "criterion_id": "AC-005",
      "reference": "NSC-014 AC-005; GDD - Enemy Detection, Pursuit, and Target Loss",
      "requirement": "If the bounded wander/search interval completes without reacquisition, EnemyTargetKnowledge clears the current target and returns to its idle state without destroying, disabling, replacing, or reinitializing the enemy GameObject."
    },
    {
      "criterion_id": "AC-006",
      "reference": "NSC-014 AC-008; GDD - Floor-run restart ownership (Win and Loss Conditions)",
      "requirement": "EnemyTargetKnowledge exposes a public ResetTargetKnowledge() method that clears its current target, last-known position, search timer, and pursuit/search state. Assets/NoSafeCircle/DoorPrototype/Tests/EnemyTargetKnowledgePlayModeTests.cs must cover the target-state behavior owned by this component."
    }
  ],
