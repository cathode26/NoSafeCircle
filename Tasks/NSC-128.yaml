  "acceptance_criteria": [
    {
      "criterion_id": "AC-001",
      "reference": "Vincent 2026-09-25: 'In diablo you could press shift , hold it, and then shoot without moving'; SPELL_DECISIONS.md S1",
      "requirement": "Assets/InputSystem_Actions.inputactions gains exactly one new Button-type action in the existing Player action map, on the Keyboard&Mouse control scheme only, that responds to either physical Shift key. THE ACTION MUST BE READ BY COMMITTED CODE, AND THAT IS PART OF THIS CRITERION RATHER THAN AN IMPLEMENTATION DETAIL: this repository already carries WASD bindings in that same asset that ZERO code reads, so a binding present in the asset proves nothing about behaviour. No existing action, binding or control scheme is modified or removed."
    },
    {
      "criterion_id": "AC-002",
      "reference": "Vincent 2026-09-25, his words: 'press shift, HOLD it'",
      "requirement": "THE MODIFIER IS HELD, NOT TOGGLED. Movement is suppressed for exactly as long as the action is held down and is restored when it is released; a press-and-release leaves no lasting state. This is pinned because Vincent named the mechanism precisely and a toggle is a different control."
    },
    {
      "criterion_id": "AC-003",
      "reference": "PlayerMovement.RequestMovementRestriction / ReleaseMovementRestriction / IsMovementRestricted (delivered by NSC-019); SPELL_DECISIONS.md S2",
      "requirement": "SUPPRESSION USES THE EXISTING REFERENCE-COUNTED MOVEMENT RESTRICTION ON PlayerMovement AND INVENTS NO SECOND MECHANISM. PlayerMovement already exposes RequestMovementRestriction(), ReleaseMovementRestriction() and IsMovementRestricted, and Fireball's charge already holds one, so the two must compose rather than fight: exactly ONE restriction is held while the action is down and released exactly ONCE on release, so a charge held across a Shift press and release does not leave the wizard frozen or prematurely freed. The restriction is also released when gameplay input is suspended, so a title-screen transition mid-hold cannot strand it."
    },
    {
      "criterion_id": "AC-004",
      "reference": "SPELL_DECISIONS.md S1 (no hardware polling); NSC-007, NSC-008, NSC-009",
      "requirement": "ATTACKING IS UNAFFECTED. This task changes no spell component, no cast path, no mana cost, no cooldown and no targeting: 'shoot without moving' is achieved by removing the MOVEMENT, not by touching the shooting. It reads only its own Action and performs NO hardware polling - no Keyboard.current or Mouse.current - consistent with the standing rule for every other input this project binds."
    },
    {
      "criterion_id": "AC-005",
      "reference": "NSC-019 AC-001/AC-002 click-to-approach; PlayerInteractionController, called by PlayerMovement on a fresh press",
      "requirement": "THE KNOWN CONSEQUENCE IS STATED RATHER THAN HIDDEN: while the action is held, a fresh pointer press issues no destination, so CLICK-TO-APPROACH-A-DOOR IS ALSO SUPPRESSED for as long as it is held. That is faithful to the convention Vincent named - the modifier means act in place - and it is recorded here because NSC-019 is delivered and its click-to-approach behaviour gains a documented exception rather than a silent one. Releasing the action restores approach immediately, and a press made while held is NOT replayed or queued on release."
    }
  ],
  "completion_gates": [
    {
      "gate_id": "VAL-001",
      "reference": "CLAUDE.md: a binding present in the asset proves nothing about behaviour (WASD); assert the durable relation, not the value it has today",
      "requirement": "Play Mode coverage in Assets/NoSafeCircle/DoorPrototype/Tests/HoldPositionPlayModeTests.cs proves, with the real action rather than a simulated flag: that a fresh pointer press while the action is HELD leaves the wizard's world position unchanged over a fixed number of fixed steps, while the same press with the action RELEASED moves it - the two runs compared against each other, not against hard-coded coordinates; that releasing restores movement and replays no suppressed press; that a cast performed while held still spends mana and produces its projectile, which is AC-004's whole point; and that the restriction count returns to its starting value after a press-release cycle and after gameplay input is suspended mid-hold. A TEST THAT ONLY ASSERTS THE ACTION EXISTS IN THE ASSET DOES NOT SATISFY THIS GATE - that is exactly the assertion WASD would pass."
    }
