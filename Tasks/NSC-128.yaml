  "notes": "Authored 2026-09-25 by the GER Agent from Vincent's own words, typed while playing and relayed by the Documentation Agent: 'We need to upgrade our controls a little' and 'In diablo you could press shift , hold it, and then shoot without moving'. THAT IS THE WHOLE OF WHAT HE SAID. Everything else here is design, and the design deliberately resolves the open questions from HIS WORDS plus the committed control scheme rather than by asking him again: 'hold it' settles hold-versus-toggle, and 'without moving' settles that the change belongs to MOVEMENT and not to the spells. MEASURED BEFORE AUTHORING: there is no Shift binding and no hold-position concept anywhere under Assets/ (control: MoveToCursor appears in 7 files, a nonsense symbol in 0), and PlayerMovement ALREADY exposes a reference-counted movement restriction that Fireball's charge uses - so this needs no new mechanism, which is why AC-003 pins the existing one. HE SAID 'controls' PLURAL AND 'a little', so this may be the first of several; this task claims only the Shift modifier. THIS IS A FEATURE, NOT A DEFECT HE CAN SEE, so by his own standing ranking it is SECONDARY to sprint 1: authoring it costs the sprint nothing, and building it should not jump the queue.",
