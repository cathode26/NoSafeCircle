      "requirement": "Create Assets/NoSafeCircle/DoorPrototype/Scripts/ForceWave.cs and its Unity-generated Assets/NoSafeCircle/DoorPrototype/Scripts/ForceWave.cs.meta. ForceWave exposes a public TryCast() entry point and uses a serialized short-range radius centered on the wizard without reading cursor direction or selecting a target. Each TryCast() call discovers its candidate pool fresh by calling FindObjectsByType<EnemyStatusEffectMovement>(FindObjectsSortMode.None); ForceWave never builds or caches this list during Awake, Start, or any other initialization, so an EnemyStatusEffectMovement created, enabled, or activated after ForceWave initializes is still discoverable at the next TryCast(). Its base radial candidate set then considers only enabled EnemyStatusEffectMovement components on active GameObjects whose horizontal distance from the wizard is less than or equal to the radius and whose EnemyHealth component, when present, reports IsDefeated == false; a candidate at a different height whose horizontal distance is within the radius is included. ForceWave then excludes a candidate whose horizontal line from the wizard is blocked by a solid gameplay collider: a wall, an obstacle/prop collider (shelves, pews, columns, rubble), or any door whose doorway-blocker collider is enabled (sealed, locked, and broken doors, since a broken door keeps its one-way player blocker by design); only an open door the wizard has not yet crossed does not block. This uses a chest-height Physics.Raycast (or equivalent sweep) against non-trigger colliders, the same default-layer, trigger-ignoring query the ranged enemy caster's HasUnobstructedViewOfWizard already uses (EnemyFireballCaster on main; NSC-077 renames it EnemyLanternWispCaster, and either name satisfies this), ignoring colliders on the wizard's own CharacterController; no new layer, tag, collider, or query API is introduced. It does not require an enemy collider or prefab.",
