t, and target-knowledge ownership: capture State, CurrentTarget, and LastKnownPosition immediately before and after TryCast(), before another UpdateTargetKnowledge tick, and keep the displacement landing point inside LoseTargetDistance. (2) ForceWaveCastGatePlayModeTests covers the cast gate, mana and refusal availability (VAL-002): 25-mana success, successful no-target spending, insufficient-mana refusal through PlayerMana's existing CastDenied path, cooldown and suspension refusal BEFORE Spend is called, ForceWave.CastAvailability reading CoolingDown, Suspended and InsufficientMana in those three refusal cases, ForceWaveCooldownUI.DisplayedAvailability matching it and never reading Ready, and a refused cast starting no pulse (AC-012's IsPulseActive stays false) while the UI shows its unavailable/cooldown-refusal state. (3) ForceWaveLifecyclePlayModeTests covers lifecycle, suspension and menu flow (VAL-003): cooldown completion, ResetForceWave(), SuspendGameplayInput(), EnableGameplayInput(), IsGameplayEnabled, AC-012's IsPulseActive becoming true on a successful cast and false again after its serialized pulse duration elapses, the reset-during-pulse case, the door-opening attempt that continues through a cast, and AC-011's two menu-flow proofs. NO FIXTURE MAY ABSORB ANOTHER'S CASES: each of the three gates VAL-001, VAL-002 and VAL-003 names its own fixture by class name and must be satisfiable by running that fixture alone.",
