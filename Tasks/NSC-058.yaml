  "execution_scope": "single_agent",
  "execution_reason": "A shared hierarchy fader is a bounded reusable presentation utility with clear ownership and testable state-restoration behavior. It depends on the approved DOTween integration but does not change game design.",
  "decomposition_state": "concrete",
  "decomposition_reason": "The clean-room reference examples and engineering standard define the required abstraction and lifecycle behavior; additional game-design decisions are not required.",
  "parent": "NSC-056",
  "depends_on": [
    "NSC-057"
  ],
  "exclusive_resources": [
    "logical:shared-hierarchy-fader"
  ],
  "acceptance_criteria": [
    {
      "criterion_id": "AC-001",
      "reference": "Engineering Standards §5.4 Hierarchy fader",
      "requirement": "Provide a No Safe Circle-owned HierarchyFader abstraction that discovers or receives fade participants through a narrow IFadeTarget-style contract rather than hard-coding every supported renderer type into gameplay callers."
    },
    {
      "criterion_id": "AC-002",
      "reference": "Engineering Standards §5.4 DOTween",
      "requirement": "Use DOTween for normalized fade interpolation/sequencing while keeping participant discovery, original-state capture, restoration, and semantic fade ownership inside the fader layer."
    },
    {
      "criterion_id": "AC-003",
      "reference": "Sanitized SlotEngine gem: fading lifecycle",
      "requirement": "Support at least CanvasGroup, Unity UI Graphic, SpriteRenderer, and generic Renderer color fading without instantiating per-renderer materials; generic Renderer color changes use MaterialPropertyBlock or an equivalent non-material-cloning approach."
    },
    {
      "criterion_id": "AC-004",
      "reference": "Engineering Standards §2.3 Explicit ownership",
      "requirement": "Capture original visual state before the first owned fade and restore it exactly on explicit restore, cancellation/disable cleanup where restoration is requested, and after temporary presentation effects that promise restoration."
    },
    {
      "criterion_id": "AC-005",
      "reference": "Engineering Standards §6/§7 lifecycle and cancellation",
      "requirement": "Owned tweens are killed/cancelled deterministically when replaced or when their owner becomes invalid so no orphan tween continues mutating a disabled/destroyed hierarchy."
    },
    {
      "criterion_id": "AC-006",
      "reference": "Engineering Standards §5.4 presentation boundary",
      "requirement": "The fader controls presentation only. Gameplay state transitions may request or await a fade but do not use tween progress as authoritative gameplay state."
    }
  ],
  "completion_gates": [
    {
      "gate_id": "VAL-001",
      "reference": "Unity Edit/Play Mode validation",
      "requirement": "Automated coverage proves supported fade targets capture, fade, and restore original alpha/color state without creating persistent material instances."
    },
    {
      "gate_id": "VAL-002",
      "reference": "Unity lifecycle validation",
      "requirement": "Automated coverage proves replacing/cancelling a fade and disabling/destroying its owner leaves no still-running owned tween and produces the documented restore/terminal state."
    },
    {
      "gate_id": "VAL-003",
      "reference": "Human presentation inspection",
      "requirement": "Developer runs one representative hierarchy fade in Play Mode and confirms the abstraction behaves correctly without changing gameplay state."
    }
  ],
