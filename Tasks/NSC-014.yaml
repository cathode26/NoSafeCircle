  "acceptance_criteria": [
    {
      "reference": "Enemy Detection, Pursuit, and Target Loss",
      "requirement": "Detection Distance is strictly smaller than Lose Target Distance so acquisition/loss does not oscillate at one boundary.",
      "criterion_id": "AC-001"
    },
    {
      "reference": "Enemy Detection, Pursuit, and Target Loss",
      "requirement": "Entering Detection Distance acquires the wizard and begins pursuit; crossing an open doorway does not by itself clear an acquired target.",
      "criterion_id": "AC-002"
    },
    {
      "reference": "Enemy Detection, Pursuit, and Target Loss",
      "requirement": "Exceeding Lose Target Distance transitions to a search state directed at the player's last known position using the distance threshold, not randomness, to decide the transition.",
      "criterion_id": "AC-003"
    },
    {
      "reference": "Enemy Detection, Pursuit, and Target Loss",
      "requirement": "On reaching the last-known position without reacquisition, perform a short, bounded search/wander using controlled randomness over navigable points, periodically re-checking for the player; re-entering Detection Distance during this state reacquires the player.",
      "criterion_id": "AC-004"
    },
    {
      "reference": "Enemy Detection, Pursuit, and Target Loss",
      "requirement": "If bounded search completes without reacquisition, clear the target and return to local idle/wander; the enemy remains the same persistent object and is not despawned, replaced, or reset.",
      "criterion_id": "AC-005"
    },
    {
      "reference": "Door and Pursuit Rules",
      "requirement": "A pursuing/searching enemy can continue forward traversal through an open or broken doorway when the shared navigation/locomotion passability result permits it, without losing its target solely because of the crossing.",
      "criterion_id": "AC-006"
    },
    {
      "reference": "Runtime Implementation",
      "requirement": "Enemy locomotion consumes the shared gameplay navigation/locomotion layer's walkable movement representation rather than selecting or configuring navigation technology independently.",
      "criterion_id": "AC-007"
    },
    {
      "reference": "Floor-run restart ownership (Win and Loss Conditions)",
      "requirement": "Exposes an owner-controlled restart/reset entry point that returns the enemy to its authored encounter/spawn region and clears all target/last-known-position/search state, for consumption by the Floor Run/Restart Orchestrator (owned by a different domain).",
      "criterion_id": "AC-008"
    }
  ],
