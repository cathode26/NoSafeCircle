  "notes": "Authored 2026-09-25 by the GER Agent, the same evening the Art Director landed the crop this task depends on. NSC-126 AC-005 excluded wall_pilaster because it was 2.750 units high with pivot y 0.068182 and could not be placed correctly by anyone; that premise is now FALSE - c864aaf5 cropped it to 64x160 = 1.000 x 2.500 with pivot (0.5, 0), verified at source (sha256 3d65fd93). THIS TASK IS SEPARATE FROM NSC-126 ON PURPOSE. NSC-126 creates no new capability - it calls a helper NSC-120 already delivered - and is ready to run today; pilaster rhythm is NEW placement logic. Folding it into NSC-126 would slow the part that is already ready and would contradict NSC-126's own decomposition_reason. The two contend on the five room builders and will therefore SERIALIZE, which is the collision guard working as designed and is the correct order: NSC-126's role accents first, then this. AC-003 is unusual and deliberate: it REFUSES to pin an alignment number, because the Art Director measured that the committed wall triple and matching wall_straight's masonry base line cannot both hold for this sprite, and said that only an in-game render can settle which is right. Pinning a number now would pin the wrong one. *** GER REVISION 4, 2026-09-27: DO NOT DISPATCH THIS AS WRITTEN. AC-001's RHYTHM IS ALREADY IMPLEMENTED, IN THE RUNTIME ASSEMBLY, AND IMPLEMENTING THIS CONTRACT WOULD AUTHOR A SECOND COPY OF IT INTO A PATH THAT NO LONGER REACHES THE GAME. NOTES ONLY - no criterion is touched. *** THIS REVISION EXISTS TO BREAK THE `prepared` CONTROL RECORD'S PIN ON PURPOSE. That record was staged against revision 3 and a crew dispatched on it would spend a paid run producing duplicate code; a drifted pin is the cheapest available stop. Reported by the GAME AGENT, which owns the runtime code; verified at source by me rather than taken on trust. *** WHAT IS ALREADY THERE: Scripts/World/Rooms/WallPiecePass.cs - the RUNTIME assembly, not Editor - declares `public const int PilasterInterval = 4` and its own comment at :30 says 'NSC-127 AC-001 fixes the rhythm at EVERY FOURTH CELL of the one-unit wall grid and forbids anything denser, so PilasterInterval is the contract's number, not a tuning choice.' IsPilasterSlot implements the run-based rule this contract specifies, including the run being measured between a corner and a door's collider edge and the first and last slot keeping the straight tile so a pilaster never abuts a post or jamb. It emits WallPieceKind.Pilaster. Tests/WallSpawnerPlayModeTests.cs re-derives the rhythm at :302 and carries an explicit non-vacuity assertion at :463 that the rhythm must place something on a 28-slot run. SO AC-001 IS DISCHARGED BY DIFFERENT CODE IN A DIFFERENT PLACE, and this contract cites itself as that code's authority. *** AND THIS CONTRACT'S OWN INT-002 ALREADY PREDICTED THE FAILURE, WHICH IS WHY IT IS WORTH READING: it states that nothing this task places appears in the game 'UNTIL THE FIVE ROOM SOURCE SCENES UNDER Assets/Scenes/Rooms/ ARE REBUILT AND THE CANONICAL SCENE IS RECOMPOSED'. Those scenes were DELETED at fe4c95ad and Assets/Scenes/Rooms/ now holds only .gitkeep. The obligation's precondition can no longer be met by anyone, so AC-001's Editor helper - called by the five committed room builders - would place pilasters into scenes that are never saved and never played. The obligation was written as a warning about a delay; it has become a proof that the route is closed. *** WHAT THE FULL RE-SCOPE MUST DO, AND WHY I HAVE NOT DONE IT IN THIS REVISION: AC-001 through AC-005 and VAL-001 all name the Editor helper, the five committed builders, or a committed scene, so they must be rewritten TOGETHER onto the runtime path - fix a clause whole or not at all. That rewrite needs one answer this contract cannot supply: WHETHER THE FIVE Editor/Rooms/*SceneBuilder.cs RETAIN ANY PURPOSE now that the world is built at Play by the spawners. That is an architecture question in the GAME AGENT's lane and it is larger than this task - NSC-045, NSC-046, NSC-047 and NSC-048 are all DELIVERED against those builders. Answer it and the rewrite is mechanical. AC-003 and AC-004 are unaffected either way: the pilaster-versus-wall_straight base-line difference is still an open ART DIRECTOR call to be settled by a render, and this contract still declines to bake a compensating offset. *** NOT ESTABLISHED: I ran no Unity. I did NOT verify that the runtime pass applies wall_pilaster.png itself rather than only classifying the slot, nor that AC-002's walkability neutrality or AC-005's idempotence hold of the runtime path - those are exactly what a re-scope must assert rather than assume. I am recording that AC-001's RHYTHM is implemented, not that this whole contract is satisfied. *** GER REVISION 5, 2026-09-27 21:5xZ HOST-CLOCK: RE-SCOPED ONTO THE RUNTIME PATH, BECAUSE THE ART IS ALREADY IN THE WORLD THE PLAYER SEES. THIS TASK NEEDS A DELIVERY RECORD, NOT AN IMPLEMENTATION. *** The A/B behind revision 4 is answered by the GAME AGENT: the five Editor room builders are LIVE, but only their IN-MEMORY half, which EditMode fixtures call and on which NSC-045/046/047/048's delivery rests. Their SAVING half is dead - spot-verified by me at source rather than taken on trust: ChapelOfAshSceneBuilder.cs:21 sets ScenePath to Assets/Scenes/Rooms/ChapelOfAsh.unity and :68 BuildAndSave ends at :85 in EditorSceneManager.SaveScene(scene, ScenePath), and that path was deleted at fe4c95ad. NO RUNTIME CODE CALLS THESE BUILDERS AT ALL. So revision 3's Editor helper would have run only in EditMode fixtures and asset generation, never in the shipped world. *** THE CHAIN THAT MAKES THIS A DELIVERY QUESTION, VERIFIED BY GUID RATHER THAN BY PATH, because Unity references are GUIDs: wall_pilaster.png (guid 49f4e5ab64b64abeab5ca9087c96b359) is referenced by Content/Environment/WallPilaster.prefab - once, with wall_straight's guid appearing ZERO times in that prefab as the control - and WallPilaster.prefab (guid efdf0b6eba2624de72d6fe2dd33d96c3) is wired into Resources/Spawners/WallSpawner.prefab, which is the runtime spawner. WallSpawner.PrefabFor at :245-246 maps WallPieceKind.Pilaster to that prefab in enum order, and WallPiecePass.IsPilasterSlot emits that kind at PilasterInterval = 4. SO THE PILASTER ART REACHES THE PLAYED WORLD TODAY. *** THIS IS THE NSC-126 SHAPE THAT CLAUDE.md ALREADY RECORDS: merged, materialized, on screen and still not_delivered. The remedy is a delivery record, which is the GAME AGENT's and needs a Unity run. *** WHAT CHANGED AND WHAT DID NOT: AC-001, AC-002, AC-005 and VAL-001 are repointed from the Editor helper and the five committed builders to the runtime path; their SUBSTANCE is unchanged and nothing is weakened - the four-cell minimum, the colonnade prohibition, the no-walkability-change rule, determinism, the independent expectation and the non-vacuity assertion all survive, and VAL-001 gains the unfiltered-suite requirement this project already applies elsewhere. AC-003 and AC-004 ARE UNTOUCHED: the pilaster-versus-wall_straight base-line difference is still an open ART DIRECTOR call to be settled by a render, and this contract still refuses to bake a compensating offset. exclusive_resources drops four files that were never written and the five builders this task no longer touches, and claims only Tests/WallSpawnerPlayModeTests.cs - measured unowned by any contract, alongside WallPiecePass.cs, WallSpawner.cs and WallPilaster.prefab (control: NSC-072's fixture has exactly one owner, so the query works). I DELIBERATELY DO NOT CLAIM WallPiecePass.cs OR WallSpawner.cs: nothing in them needs changing, and claiming a file to gain write authority over it is the shape this contract's own INT-001 rejects. *** NOT ESTABLISHED: I RAN NO UNITY. I did not execute WallSpawnerPlayModeTests tonight, so 'already satisfies VAL-001' is read from its source and its assertions, not from a green run - the delivery record is what must prove it. I did not verify