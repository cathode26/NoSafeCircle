  "notes": "This scope establishes reusable architectural authoring only; it excludes the five named room layouts and encounter content. Gameplay geometry remains authoritative and independently defined; Tilemap visuals may align to that geometry but must never define collider, walkability, trigger, door-state, or pursuit transforms. Persistent reusable architectural Tile assets are owned by this task through logical:isometric-architectural-tile-assets; exact placeholder asset filenames and appearance remain implementation details. Human-approved testability seam: the production scene builder may expose a narrow non-saving test entry point that constructs the current in-memory scene while using a caller-supplied temporary AssetDatabase folder for persistent architectural Tile assets. The seam must not open or save Assets/Scenes/DoorPrototype.unity, must preserve the normal production Build() behavior and canonical generated-asset location, and must not transfer gameplay ownership into the Tilemap. Tests using the seam must create and remove their temporary assets and leave the repository clean.",
