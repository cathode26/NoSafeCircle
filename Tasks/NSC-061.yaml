  "acceptance_criteria": [
    {
      "criterion_id": "AC-001",
      "reference": "GDD — Development-time generative art and character presentation",
      "requirement": "Use the approved PixelLab MCP capability to generate source pixel art covering masculine and feminine wizard presentations with both light/White and dark/Black skin representation. Preserve the accepted generated files in the repository and record the reproducible PixelLab prompts, model/tool settings, dimensions, direction convention, and any selected generation identifiers in Docs/Art/Wizard/PIXELLAB_GENERATION.md. If PixelLab is unavailable, report the task blocked rather than substituting hand-authored placeholder art."
    },
    {
      "criterion_id": "AC-002",
      "reference": "Human-approved art direction, 2026-09-12",
      "requirement": "Present readable adult wizard options for a dark-but-cute horror-comedy with masculine and feminine presentation and respectful light/White and dark/Black skin representation. Every combination has rugged pulp-horror-survivor energy, weathered practical adventuring clothes combined with unmistakable wizard details, an expressive endearingly overconfident or put-upon face, and a strong silhouette at gameplay scale. The options belong to the same visual world without making the feminine or Black wizard a token recolor, stereotype, or lower-detail afterthought. The result should feel spooky, battered, funny, and charming rather than solemn, gruesome, sexualized, or grotesque. Evoke the requested archetype without reproducing an actor's recognizable likeness, franchise costume, logos, chainsaw, or shotgun."
    },
    {
      "criterion_id": "AC-003",
      "reference": "GDD — isometric directional sprites",
      "requirement": "For every supported presentation and skin-tone combination, provide cohesive transparent-background pixel-art animation for the four gameplay-facing diagonal directions (north-east, north-west, south-east, and south-west), with a looping idle and looping walk animation for every direction. Each character's identity, proportions, skin palette, lighting, equipment, frame dimensions, ground-contact pivot, and animation cadence remain consistent across all directions and frames, and all options use compatible scale and timing."
    },
    {
      "criterion_id": "AC-004",
      "reference": "Unity pixel-art import integration",
      "requirement": "Import the PixelLab output as ordinary local Unity assets with deterministic slicing or frame extraction, transparency, point filtering, no lossy texture compression, consistent pixels-per-unit, and a feet/ground-contact pivot compatible with the existing world-sprite convention. The built game has no PixelLab, network, credential, or generative-AI runtime dependency."
    },
    {
      "criterion_id": "AC-005",
      "reference": "NSC-039 world-space SpriteRenderer and sorting convention",
      "requirement": "Replace Player/Visual's generated purple placeholder silhouette with two independent serialized choices: masculine/feminine presentation and light/White or dark/Black skin representation. All four combinations must resolve to complete approved art and animation sets. Switching either choice changes presentation only and preserves the established world-space SpriteRenderer sorting layer/order, feet-origin convention, Player root, CharacterController, gameplay colliders, movement behavior, and interaction components. A runtime character-selection menu is outside this task."
    },
    {
      "criterion_id": "AC-006",
      "reference": "Player visual animation behavior",
      "requirement": "A focused player-owned presentation component independently selects the configured gender-presentation and skin-tone options, then drives idle versus walk and the four directional facings from actual player motion. It retains the last meaningful facing while idle, avoids rapid direction flicker near zero velocity, and does not take ownership of movement, input, collision, health, mana, spells, or interaction state."
    },
    {
      "criterion_id": "AC-007",
      "reference": "DoorPrototypeSceneBuilder repeatability",
      "requirement": "DoorPrototypeSceneBuilder.Build installs the persistent wizard art and animation wiring idempotently. Rebuilding the scene must not restore the procedural purple silhouette, destroy imported PixelLab source art, duplicate components or child objects, lose clip/controller references, or hand-edit generated Unity YAML."
    },
    {
      "criterion_id": "AC-008",
      "reference": "Human visual review boundary",
      "requirement": "Automated checks may prove import, animation, wiring, and sorting invariants, but they must not claim that the wizard looks good. The exact integrated candidate remains pending until the developer visually approves it in the DoorPrototype scene."
    }
  ],
  "completion_gates": [
    {
      "gate_id": "VAL-001",
      "reference": "Editor validation",
      "requirement": "Automated Editor tests verify all four presentation/skin combinations have complete directional idle/walk frame sets, use consistent dimensions and ground pivots, have the required pixel-art import settings, and are bound to the player presentation/animation controller without missing references."
    },
    {
      "gate_id": "VAL-002",
      "reference": "Builder regression validation",
      "requirement": "Automated coverage runs the supported builder seam repeatedly and proves Player/Visual retains the imported wizard assets, one animation driver, the NSC-039 sorting convention, and the existing player gameplay components without duplicated hierarchy objects."
    },
    {
      "gate_id": "VAL-003",
      "reference": "Play Mode animation validation",
      "requirement": "Play Mode coverage proves nontrivial movement selects a directional walk animation, stopping selects the matching directional idle animation, the last facing is retained while idle, and near-zero movement does not flicker repeatedly between directions."
    },
    {
      "gate_id": "VAL-004",
      "reference": "Unity project validation",
      "requirement": "Unity 6000.1.8f1 imports and compiles the project without errors, the relevant Editor and Play Mode tests pass, and DoorPrototypeSceneBuilder.Build completes successfully on the candidate."
