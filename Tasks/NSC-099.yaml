  "kind": "implementation",
  "notes": "Created 2026-09-18 at Vincent's request (\"We need a task to add them in\"). The art is already generated and approved, so this task spends nothing: the batch cost 72 generations of his approved cap of 90, verified from both recorded reading pairs - remaining 4381 -> 4309 and used 618 -> 690, each giving 72. The eight are one look per kind after the Art Director compared round 1 with round 2 on the four contested looks; round 2 won three and round 1 won one, and that single reversal (brute dismembered) came from measuring the colour-locked files rather than assuming the newer re-roll was better - round 2 had lost the severed arm entirely and read as a dropped weapon. Those are the Art Director's measured recommendations; if Vincent picks differently on any contested look before this dispatches, the remedy is a revision naming the other file, not a crew substituting one. Scope boundary that matters: NSC-015 owns the death-look MECHANISM - selection rule, alignment requirement, no-collision-once-defeated - and this task owns only the identity of the sprites and their assignment. The wraith four land committed-but-unwired on purpose, with NSC-055 named as owner in INT-001, because all twelve candidates were colour-locked and ground-line aligned as one batch and splitting the import across two tasks would risk two palettes and two pivots. Revision 2, 2026-09-18: Vincent replaced the one-look-per-kind selection with \"So we want all of the art\" plus a kill-history rule, so all twelve import and the four contested looks become variants rather than discarded alternatives. The destination path and filenames follow the Art Director's restaged package (Art/Enemies/Source/Death, death_brute_* and death_wraith_*), replacing the r1/r2 names an earlier draft of this revision used. The wraith's two upright-cloak looks were renamed for what they show - hollowed and draining - rather than for the round they came from, and they are the rarer variants because an upright cloak can read as a live wraith for a beat at gameplay scale. The selection rule itself lives in NSC-015 revision 13; this task owns identity, tags and weights.",
