  "notes": "This task establishes the first screen and transition only. NSC-067 owns choosing a wizard and entering gameplay. Keep the implementation small and inside the current canonical scene unless a later human-approved design changes scene ownership. Revision 2, 2026-09-15/17: replaced the opaque full-screen title backdrop with a transparent raycast blocker and a left-stacked layout, and added a title-only TitleScreenChaseBackdrop cycling all 4 wizard identities against the Dungeon Brute and Lantern Wraith, per NSC-066_REV2_DECISIONS.md T1-T6. NSC-077 (enemy walk controllers) and NSC-075 (wizard walk animation) were NOT added to depends_on: doing so would create a dependency cycle (NSC-066 -> NSC-075 -> NSC-068 -> NSC-067 -> NSC-066, and equivalently through NSC-077 -> NSC-075); see CONFLICTS in this revision's change-log. The chase actors' generated Animator Controllers (MeleeEnemyAnimator.controller, LanternWraithAnimator.controller) do not yet exist even on NSC-077's current branch as of this draft; they are expected from NSC-077's own delivery, not this task. Decomposition (2026-09-17): the chase backdrop's dependency on NSC-075 and NSC-077 would create a cycle through NSC-067 and NSC-068, so the work is split into a layout child and a chase-backdrop child; see decomposition_reason. Revision 3, 2026-09-17: per the Codex closure review of revision 2 and NSC-066_REV2_DECISIONS.md U1-U4, replaced the i%4/i%2 pairing formula with an explicit eight-pairing wizard-pursuer sequence (AC-006, VAL-004), replaced the fixed Z=-20 lane and off-screen spawn/despawn wording with a builder-computed inset lane and fade-based spawn/despawn along the starting camera's screen-horizontal direction (AC-006, VAL-004), documented the chase backdrop's serialized-reference build-time wiring (AC-008), and reallocated BuildTitleScreen wiring and backdrop assertions from the layout child to the chase child so both children compile and pass independently (decomposition_reason). U4 keeps the NSC-067 dependency-narrowing sentence unchanged. Revision 4, 2026-09-17: the closure review of revision 3 found the midpoint viewport check held only near a 16:9 aspect, because the builder-computed segment runs from the view center almost to the room's east bound (midpoint viewport x 0.9475 at 16:9, 0.997 at 16:10). Per the GER Agent's decision U5, the builder stores that floor segment and TitleScreenChaseBackdrop clips it at each pairing start to Camera.main viewport x [0.1, 0.9], skipping a pairing when less than 6 world units remain (AC-006, AC-008); VAL-004 pins the aspect with a 1920x1080 targetTexture and repeats the checks at 1440x1080 and 360x1080. Revision 5, 2026-09-17: the revision 4 closure review found that the new clip put the lane midpoint at viewport x about 0.5, exactly the boundary AC-001 allows the title text and button to reach, while VAL-004 never tested the \"not behind the title text\" clause. Per decision U6 the lane is clipped to viewport x [0.55, 0.9] instead, which clears that column by construction, and VAL-004 now asserts at every step that no actor's screen rect overlaps a saying or the Start Game button, and records the resulting lane lengths (about 10 world units at 16:9, about 7 at 4:3, under the 6-unit minimum at 1:3). DEPENDENCIES DECLARED AND THE INVERTED ONES SCOPED OUT, 2026-09-23 rev 6. The Pipeline Runner reported that the 2026-09-12 crew returned contract_review_required with AC-002 and VAL-001 flagged requires_declared_dependency naming NSC-003/007/008/009/019, that depends_on was still empty, and that it would not spend a re-dispatch on a known-identical failure - the right call. IT ALSO NAMED THE TRAP IN ITS OWN REPORT: the record LOOKS re-dispatchable and the contract HAS moved three revisions since the pin, which is exactly what makes a live blocker read as cleared. THE CREW'S FINDING IS HALF RIGHT AND THE HALF IT GOT WRONG IS THE EXPENSIVE ONE. NSC-003 and NSC-019 are genuine prerequisites - their input owners must exist to be suspended - and both are conformant, so declaring them blocks nothing. NSC-007, NSC-008 and NSC-009 run the OTHER WAY: this task creates the title flow and claims TitleScreenController.cs; those three each claim TitleScreenController.cs and WizardGameEntryController.cs and add their own optional reference to it, and all three already require that a missing reference must not fail HasValidReferences(). Declaring them would have inverted the direction and parked this task behind three undelivered tasks for a suspension that is vacuous when the component is absent. NOT CLEARANCE, AND THIS MATTERS MORE THAN THE FINDING: NSC-066 is execution_scope needs_execution_decomposition with ZERO children, so it cannot dispatch whatever its dependencies say. That gate is a paid decompose on Vincent's own word and is not touched here. A worker-control record pinned to the old contract hash is staled by this revision; prepared_refresh re-pins both the HEAD and the contract hash, so that is recoverable rather than terminal - stated because the Pipeline Runner owns that record and should not discover it.",
