      "criterion_id": "AC-001",
      "reference": "Human-approved game-entry flow, 2026-09-12; owner revision 2026-09-15 (SpaceInvaders lobby direction)",
      "requirement": "Entering the canonical game scene first displays the title reading over the live gameplay scene rather than an opaque overlay: DoorPrototypeGlobalSceneBuilder's TitleScreen Image component has its alpha channel set to 0 (the Color32(16, 10, 23, 255) full-screen fill from revision 1 is removed) while raycastTarget stays true so title clicks never reach gameplay. No UI element behind the title text and Start Game button, including any background analogous to revision 1's centered TitleCard panel, renders as a solid opaque fill; an optional left-side gradient or vignette Image is allowed only if its alpha does not exceed 0.6 at the screen's left edge and reaches 0 before the horizontal screen midpoint (viewport x = 0.5). The three sayings \"WELCOME, TINY WIZARD\", \"NO SAFE CIRCLE\", and \"Cute wizards. Terrible odds.\" are present with exactly this text, stacked on the left side of the screen (each text element's RectTransform anchorMax.x <= 0.5), and a chunky Start Game button is stacked below them on the left (its RectTransform anchorMax.x <= 0.5), keeping its existing colors and hover/pressed ColorBlock states and remaining readable at the canonical 1920x1080 reference resolution."
    },
    {
      "criterion_id": "AC-002",
      "reference": "Human-approved game-entry flow, 2026-09-12",
      "requirement": "Before Start Game is activated, normal player movement, spell, and door-interaction input cannot affect gameplay. The implementation uses existing owner-controlled input or gameplay-enable boundaries where available rather than mutating unrelated systems' internal state. The title-only chase backdrop plays no part in this suspension and carries no input component of its own. THE GAMEPLAY-INPUT OWNERS IN SCOPE ARE THOSE THAT EXIST AT THIS TASK'S OWN COMMIT, AND SPELL COMPONENTS ARE EXPLICITLY NOT AMONG THEM. This task declares NSC-003 (mouse-directed player movement) and NSC-019 (cursor-targeted door opening) as dependencies, because those input owners must exist in order to be suspended; both are conformant on main. IT DOES NOT DEPEND ON NSC-007, NSC-008 OR NSC-009, AND THE DEPENDENCY RUNS THE OTHER WAY: this task CREATES the title flow and claims TitleScreenController.cs, while each of those three separately claims TitleScreenController.cs AND WizardGameEntryController.cs and adds its OWN optional serialized reference to the flow built here. All three already require that a missing reference must not make WizardGameEntryController's private HasValidReferences() check fail - measured on main 2026-09-23, all three carry that clause in words. A CONTRACT-LOCALITY CHECK THAT READS \"spell input cannot affect gameplay\" AS REQUIRING A DECLARED DEPENDENCY ON THE SPELL TASKS HAS INVERTED THE DIRECTION, and the 2026-09-12 crew did exactly that. WHERE A SPELL COMPONENT DOES NOT EXIST AT THE COMMIT UNDER TEST THERE IS NO SPELL INPUT TO SUSPEND, AND THAT IS A PASS, NOT A GAP. Suspend the owner-controlled boundaries present at that commit and no others; do not add a reference to a spell component here, and do not wait for one to land."
