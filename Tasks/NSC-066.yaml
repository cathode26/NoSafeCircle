      "criterion_id": "AC-006",
      "reference": "Owner revision 2026-09-15 (T3: pairing and cycling)",
      "requirement": "TitleScreenChaseBackdrop runs only while TitleScreenController.IsTitleScreenVisible is true. After a random interval between 10 and 20 seconds (the first pairing may appear sooner, within 3 seconds of the title screen showing), it spawns one pairing just off-screen on a randomly chosen side: a fleeing wizard using WizardAnimationController.ApplyPresentation, followed about 2.5 world units behind by a pursuer using EnemyAnimationController.Initialize. Both walk at about 1.5 world units per second along a fixed lane at world Z = -20, from X = -14 (west) to X = 14 (east) or the reverse, each actor facing its travel direction, and each is destroyed the frame its X coordinate reaches or passes the far bound (14 heading east, -14 heading west) so no actor's tracked position is recorded outside the Ruined Entry floor bounds X[-14,14] Z[-26,0]. For pairing index i starting at 0, the wizard is WizardSelectionDefinitions[i % 4] in selection order (Ember Wizard, Ash Wizard, Frost Wizard, Dusk Wizard) and the pursuer is the Dungeon Brute (EnemyAnimationKind.MeleeEnemy) when i % 2 == 0 or the Lantern Wraith (EnemyAnimationKind.LanternWraith) when i % 2 == 1, so all 8 identity-and-pursuer combinations appear within 8 pairings. At world position X = 0, Z = -20 (mid-path), both actors' Camera.main.WorldToViewportPoint has viewport x and y each within [0,1], and viewport x >= 0.5 (right of the title text's left-anchored half of the screen)."
    },
    {
      "criterion_id": "AC-007",
