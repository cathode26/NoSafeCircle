    {
      "criterion_id": "AC-005",
      "reference": "DoorPrototypeGlobalSceneBuilder repeatability; owner revision 2026-09-15 (T1)",
      "requirement": "DoorPrototypeGlobalSceneBuilder.BuildTitleScreen, invoked through DoorPrototypeSceneBuilder.Build, installs the title screen, its TitleScreenController, and exactly one TitleScreenChaseBackdrop idempotently in Assets/Scenes/DoorPrototype.unity without duplicating the Canvas, EventSystem, title panel, button, listeners, controller, or backdrop component when Build is run repeatedly."
    },
    {
      "criterion_id": "AC-006",
      "reference": "Owner revision 2026-09-17 (U1: pairing order; U2: chase geometry; U5: runtime viewport clip; U6: the lane clears the title text column); closure reviews of revisions 2 (blocking), 3 (blocking) and 4 (major)",
      "requirement": "TitleScreenChaseBackdrop runs only while TitleScreenController.IsTitleScreenVisible is true. After a random interval between 10 and 20 seconds (the first pairing may appear sooner, within 3 seconds of the title screen showing), it starts one pairing at a randomly chosen endpoint of the chase lane: a fleeing wizard using WizardAnimationController.ApplyPresentation, followed about 2.5 world units behind by a pursuer using EnemyAnimationController.Initialize, both walking along the lane at about 1.5 world units per second. DoorPrototypeGlobalSceneBuilder.BuildTitleScreen computes a floor segment deterministically as the longest straight segment, in the starting camera's screen-horizontal world direction normalize(1,0,1) (screen right is X+Z for the camera's fixed (30,-45,0) Euler rotation set in BuildCamera), that passes through the starting camera's view-center ground point and stays inside the Ruined Entry floor bounds X[-14,14] Z[-26,0] inset 1.5 units from every bound; it stores the two floor-segment endpoints on TitleScreenChaseBackdrop. When a pairing starts, TitleScreenChaseBackdrop clips that floor segment to the part whose Camera.main.WorldToViewportPoint x lies within [0.55, 0.9] for the camera's current aspect, keeping the whole lane clear of the title text and button column, whose RectTransforms AC-001 caps at anchorMax.x 0.5; the segment's viewport y is 0.5 along its whole length because it runs along the camera's screen-horizontal direction through the view center. The clipped segment is the chase lane and its two ends are the lane endpoints. If the clipped lane is shorter than 6 world units, that pairing is skipped and the next interval starts. Each actor fades in over 0.5 seconds as it starts moving from its pairing's start endpoint and fades out over 0.5 seconds before reaching the far endpoint, then is destroyed; the pursuer starts at the start endpoint 2.5 / 1.5 seconds after the wizard so neither actor's tracked position ever falls outside the clipped lane. For pairing index k starting at 0, the sequence is: k=0 Ember Wizard (WizardSelectionDefinitions[0]) with the Dungeon Brute (EnemyAnimationKind.MeleeEnemy); k=1 Ash Wizard (WizardSelectionDefinitions[1]) with the Lantern Wraith (EnemyAnimationKind.LanternWraith); k=2 Frost Wizard (WizardSelectionDefinitions[2]) with the Dungeon Brute; k=3 Dusk Wizard (WizardSelectionDefinitions[3]) with the Lantern Wraith; k=4 Ember Wizard with the Lantern Wraith; k=5 Ash Wizard with the Dungeon Brute; k=6 Frost Wizard with the Lantern Wraith; k=7 Dusk Wizard with the Dungeon Brute; the sequence then repeats from k=0. This covers all 8 wizard-pursuer combinations within 8 pairings. At the lane midpoint, both actors are fully opaque and inside the starting camera's viewport (Camera.main.WorldToViewportPoint viewport x and y each within [0.05,0.95]) and right of the title text and button column: no actor's screen rect overlaps any title saying's or the Start Game button's screen rect at any step, which the [0.55, 0.9] lane guarantees."
    },
    {
      "criterion_id": "AC-007",
      "reference": "Owner revision 2026-09-15 (T3: nothing gameplay-facing)",
      "requirement": "Every TitleScreenChaseBackdrop actor carries only presentation components: a SpriteRenderer/Visual and either a WizardAnimationController or an EnemyAnimationController and its Animator. No actor has a NavMeshAgent, a Collider, an EnemyTargetKnowledge, an attack component, a health component, a registry component, or an input component. No actor ever registers with ActiveEnemyRegistry or reads or touches the Player GameObject or PlayerMovement."
    },
    {
      "criterion_id": "AC-008",
      "reference": "Owner revision 2026-09-15 (T3); owner revision 2026-09-17 (U3: serialized data)",
      "requirement": "TitleScreenChaseBackdrop exposes a public Tick(float deltaTime) method that advances spawn timing and actor movement by exactly that delta, plus a serialized seed or an injectable interval selector and side selector, so play mode tests can drive and predict spawn timing, side choice, and pairing order without depending on real time or Unity's own Update loop. DoorPrototypeGlobalSceneBuilder.BuildTitleScreen assigns TitleScreenChaseBackdrop's runtime inputs as serialized references or values at build time -- the four wizard identities' animator controllers or override data and display order, the MeleeEnemyAnimator and LanternWraithAnimator controllers, the floor-segment endpoints, and the interval bounds and speeds -- because WizardSelectionDefinitions is private and Editor-only and the animator controllers are not runtime-loadable resources; TitleScreenChaseBackdrop itself never calls Editor APIs or Resources.Load."
    }
  ],
