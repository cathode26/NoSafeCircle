      "requirement": "Entering the canonical game scene first displays the title reading over the live gameplay scene rather than an opaque overlay: DoorPrototypeGlobalSceneBuilder's TitleScreen Image component has its alpha channel set to 0 (the Color32(16, 10, 23, 255) full-screen fill from revision 1 is removed) while raycastTarget stays true so title clicks never reach gameplay. No UI element behind the title text and Start Game button, including any background analogous to revision 1's centered TitleCard panel, renders as a solid opaque fill; an optional left-side gradient or vignette Image is allowed only if its alpha does not exceed 0.6 at the screen's left edge and reaches 0 before the horizontal screen midpoint (viewport x = 0.5). The three sayings \"WELCOME, TINY WIZARD\", \"NO SAFE CIRCLE\", and \"Cute wizards. Terrible odds.\" are present with exactly this text, stacked on the left side of the screen (each text element's RectTransform anchorMax.x <= 0.5), and a chunky Start Game button is stacked below them on the left (its RectTransform anchorMax.x <= 0.5), keeping its existing colors and hover/pressed ColorBlock states and remaining readable at the canonical 1920x1080 reference resolution."
