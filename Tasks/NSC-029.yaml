      "requirement": "Five named tactical spaces are required: 1. Ruined Entry — open space, broad rubble route, teaches circling a melee enemy and safe Fireball charging. 2. Bone Archive — narrow shelf lanes/chokepoints enabling Frost Field lane-slow-and-cluster tactics but risking the player being trapped. 3. Chapel of Ash — pews/columns provide line-of-sight breaks against the newly introduced Ranged Enemy (with Melee support), central aisle vs. side-route cover/distance tradeoff. 4. Lower Vault — incomplete loops; player must watch both the current encounter and the previous doorway because surviving enemies breaking through are the same persistent pursuers, not new spawns. 5. Final Room — comparatively open chamber with one central obstacle, populated by both Melee and Ranged Enemies, requiring combined use of movement, Frost Field, Force Wave, and Fireball for the final escape window."
