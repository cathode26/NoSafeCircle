      "reference": "Docs/GDD/No_Safe_Circle_GDD.md:65,75-76,566",
      "requirement": "Expose a deterministic public Tick(float) time seam on Fireball so tests do not depend on wall-clock frames. A quick press-and-release before a configurable positive tap/hold threshold is the tap cast; holding past it builds partial charge up to a configurable full-charge duration. The tap tier starts at 20 mana, 25 damage, 12 units/second projectile speed, a 3 second lifetime, and a 0.9 unit flat horizontal contact radius, and Fireball's cast cooldown starts at 0.5 seconds, matching the values the playable build's DemoRunFlow fireball already used so first-playable feel does not regress. Configured mana cost, enemy damage, and impact area increase monotonically from tap through partial charge to full charge, all serialized; a full charged impact can damage multiple clustered enemies.",
