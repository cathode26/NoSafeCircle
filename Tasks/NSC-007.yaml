    {
      "reference": "Docs/GDD/No_Safe_Circle_GDD.md:65,75-76,92",
      "requirement": "Create Assets/NoSafeCircle/DoorPrototype/Scripts/Fireball.cs and Assets/NoSafeCircle/DoorPrototype/Scripts/FireballProjectile.cs. Fireball owns tap, charge, cast, reset, and suspension state and every projectile it creates. FireballProjectile owns one runtime-created in-flight shot; this contract introduces no Fireball prefab asset.",
      "criterion_id": "AC-001"
