    },
    {
      "reference": "Docs/GDD/No_Safe_Circle_GDD.md:64-65,89,677,683",
      "requirement": "Fireball reads PlayerMovement.PointerWorldTarget only when PlayerMovement.HasPointerWorldTarget is true and never polls pointer hardware or performs a second screen-to-world projection. Aim is direction-only: the direction from the wizard to that pointer target on the gameplay plane. Without a valid pointer target at the moment a charge would start or a cast would fire, Fireball spends no mana, creates no projectile, applies no damage, and clears the pending cast attempt (AC-005 covers the charging case). Once launched, FireballProjectile flies in a straight line at its configured speed until it detonates on contact (AC-007) or reaches its serialized maximum lifetime, at which point it fizzles in place and deals no damage. This contract does not add cursor-destination/ground-point detonation.",
      "criterion_id": "AC-003"
    },
    {
      "reference": "Docs/GDD/No_Safe_Circle_GDD.md:64-65,89,692; Tasks/NSC-008.yaml; Tasks/NSC-009.yaml",
      "requirement": "Assets/InputSystem_Actions.inputactions gains one dedicated Button-type Fireball action in the existing Player action map, bound to <Mouse>/rightButton in the Keyboard&Mouse control scheme only. Fireball.cs consumes Fireball's press, hold, and release state through Unity Input System callbacks or action state rather than direct Mouse, Keyboard, or other hardware polling; it never polls Mouse.current or Keyboard.current. Press starts a charge if the tap cost is affordable, hold charges it, and release casts; a quick press-and-release is the tap cast. No Fireball binding path is also bound to Player/MoveToCursor or to FrostField's or ForceWave's action. The stock Attack action is left untouched and no spell reads it; there is no gamepad binding for any spell in this contract.",
      "criterion_id": "AC-004"
    },
    {
      "reference": "Docs/GDD/No_Safe_Circle_GDD.md:65,89,602,692; Assets/NoSafeCircle/DoorPrototype/Scripts/PlayerMovement.cs; Assets/NoSafeCircle/DoorPrototype/Scripts/DoorInteractable.cs; Assets/NoSafeCircle/DoorPrototype/Scripts/PlayerInteractionController.cs",
      "requirement": "While charging (holding past the tap/hold threshold), Fireball calls PlayerMovement.RequestMovementRestriction() exactly once and tracks that it owns one outstanding request; a tap cast never requests or releases a restriction. PlayerHealth.Damaged cancels an active charge: Fireball releases its owned restriction exactly once, spends no mana, and creates no projectile. A move click or a door click during a charge does not cancel it - PlayerMovement's own click-to-destination/door-approach handling applies the latest click once movement is unrestricted - and Fireball never calls PlayerMovement.RequestDestination, PlayerMovement.CancelRequestedDestination, or any PlayerInteractionController or DoorInteractable method. There is no separate abort-without-cast input. Fireball also releases its owned restriction, at most once, on: a cast attempt that finds no valid pointer target when it would fire, successful fire, a refused cast, ResetFireball(), SuspendGameplayInput(), component disable, or destruction. Casting or charging Fireball while PlayerInteractionController is running a door-opening attempt never resets or interferes with that attempt: PlayerInteractionController.IsInteracting stays true, PlayerInteractionController.PendingDoor remains the same door, and DoorInteractable.Progress never drops and keeps increasing as DoorInteractable.Tick advances.",
      "criterion_id": "AC-005"
    },
    {
      "reference": "Docs/GDD/No_Safe_Circle_GDD.md:65,75,87,602,692; Assets/NoSafeCircle/DoorPrototype/Scripts/PlayerMana.cs",
      "requirement": "At press, a charge starts only if PlayerMana.CurrentMana covers the configured tap cost; otherwise the press calls PlayerMana.Spend(tap cost), which returns false and raises PlayerMana.CastDenied, and starts no charge, restriction, or projectile state. While charging, the reached tier grows with hold time but is capped at the highest tier PlayerMana.CurrentMana can currently pay, so visible charge growth stops when mana runs short. At release, Fireball calls PlayerMana.Spend(float) exactly once, for the reached tier's cost; every configured cost is greater than zero. If that Spend call returns false (only possible if mana fell below the tap cost during the charge), PlayerMana.CastDenied fires and nothing launches.",
      "criterion_id": "AC-006"
    },
    {
      "reference": "Docs/GDD/No_Safe_Circle_GDD.md:23,40,522,541-543,602,686; Assets/NoSafeCircle/DoorPrototype/Scripts/Enemies/EnemyFireballCaster.cs",
      "requirement": "Solid gameplay colliders block Fireball's projectile: walls, obstacle and prop colliders (shelves, pews, columns, rubble), and any door whose doorway-blocker collider is enabled (sealed, locked, and broken doors, since a broken door keeps its one-way player blocker by design); only an open door the wizard has not yet crossed does not block. FireballProjectile tests this each Tick with a chest-height Physics.Raycast (or equivalent sweep) against non-trigger colliders, using the same default-layer, trigger-ignoring query the ranged enemy caster's HasUnobstructedViewOfWizard already uses (EnemyFireballCaster on main; NSC-077 renames it EnemyLanternWispCaster, and either name satisfies this), and ignoring colliders on the wizard's own CharacterController; no new layer, tag, collider, or query API is introduced. Fireball never collides with or damages the wizard who cast it. Ranged enemies are valid Fireball targets like any other enemy: an enemy carrying EnemyFireballCaster (EnemyLanternWispCaster after NSC-077) has no special immunity and takes damage through EnemyHealth.TakeDamage(float) exactly like a melee enemy. Enemies carry no colliders, so contact is a flat horizontal distance test against active, non-defeated EnemyHealth objects within the projectile's configured contact radius, matching DemoRunFlow's existing enemy-contact pattern; this contract does not add enemy colliders. On contact with an enemy or a blocking collider, the projectile detonates: it damages the contacted enemy and, for tiers above tap, every other active, non-defeated enemy within that tier's configured area radius that has an unobstructed line (the same raycast rule) from the detonation point, damaging each enemy at most once per cast. Nothing behind a wall or a closed door is damaged. Damage goes only through EnemyHealth.TakeDamage(float).",
