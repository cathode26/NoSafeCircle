    {
      "reference": "Docs/GDD/No_Safe_Circle_GDD.md:65,75-76,566",
      "requirement": "Expose a deterministic public Tick(float) time seam on Fireball so tests do not depend on wall-clock frames. A quick press-and-release before a configurable positive tap/hold threshold is the tap cast; holding past it builds partial charge up to a configurable full-charge duration. The tap tier starts at 20 mana, 25 damage, 12 units/second projectile speed, a 3 second lifetime, and a 0.9 unit flat horizontal contact radius, and Fireball's cast cooldown starts at 0.5 seconds, matching the values the playable build's DemoRunFlow fireball already used so first-playable feel does not regress. Configured mana cost, enemy damage, and impact area increase monotonically from tap through partial charge to full charge, all serialized; a full charged impact can damage multiple clustered enemies.",
      "criterion_id": "AC-002"
    },
    {
      "reference": "Docs/GDD/No_Safe_Circle_GDD.md:64-65,89,677,683",
      "requirement": "Fireball reads PlayerMovement.PointerWorldTarget only when PlayerMovement.HasPointerWorldTarget is true and never polls pointer hardware or performs a second screen-to-world projection. Aim is direction-only: the direction from the wizard to that pointer target on the gameplay plane. Without a valid pointer target at the moment a charge would start or a cast would fire, Fireball spends no mana, creates no projectile, applies no damage, and clears the pending cast attempt (AC-005 covers the charging case). Once launched, FireballProjectile flies in a straight line at its configured speed until it detonates on contact (AC-007) or reaches its serialized maximum lifetime, at which point it fizzles in place and deals no damage. This contract does not add cursor-destination/ground-point detonation.",
      "criterion_id": "AC-003"
    },
    {
      "reference": "Docs/GDD/No_Safe_Circle_GDD.md:64-65,89,692; Tasks/NSC-008.yaml; Tasks/NSC-009.yaml",
      "requirement": "Assets/InputSystem_Actions.inputactions gains one dedicated Button-type Fireball action in the existing Player action map, bound to <Mouse>/rightButton in the Keyboard&Mouse control scheme only. Fireball.cs consumes Fireball's press, hold, and release state through Unity Input System callbacks or action state rather than direct Mouse, Keyboard, or other hardware polling; it never polls Mouse.current or Keyboard.current. Press starts a charge if the tap cost is affordable, hold charges it, and release casts; a quick press-and-release is the tap cast. No Fireball binding path is also bound to Player/MoveToCursor or to FrostField's or ForceWave's action. The stock Attack action is left untouched and no spell reads it; there is no gamepad binding for any spell in this contract.",
      "criterion_id": "AC-004"
    },
    {
      "reference": "Docs/GDD/No_Safe_Circle_GDD.md:65,89,602,692; Assets/NoSafeCircle/DoorPrototype/Scripts/PlayerMovement.cs",
      "requirement": "While charging (holding past the tap/hold threshold), Fireball calls PlayerMovement.RequestMovementRestriction() exactly once and tracks that it owns one outstanding request; a tap cast never requests or releases a restriction. PlayerHealth.Damaged cancels an active charge: Fireball releases its owned restriction exactly once, spends no mana, and creates no projectile. A move click or a door click during a charge does not cancel it - PlayerMovement's own click-to-destination/door-approach handling applies the latest click once movement is unrestricted - and Fireball never calls PlayerMovement.RequestDestination, PlayerMovement.CancelRequestedDestination, or any PlayerInteractionController or DoorInteractable method. There is no separate abort-without-cast input. Fireball also releases its owned restriction, at most once, on: a cast attempt that finds no valid pointer target when it would fire, successful fire, a refused cast, ResetFireball(), SuspendGameplayInput(), component disable, or destruction.",
      "criterion_id": "AC-005"
    },
    {
      "reference": "Docs/GDD/No_Safe_Circle_GDD.md:65,75,87,602,692; Assets/NoSafeCircle/DoorPrototype/Scripts/PlayerMana.cs",
      "requirement": "At press, a charge starts only if PlayerMana.CurrentMana covers the configured tap cost; otherwise the press calls PlayerMana.Spend(tap cost), which returns false and raises PlayerMana.CastDenied, and starts no charge, restriction, or projectile state. While charging, the reached tier grows with hold time but is capped at the highest tier PlayerMana.CurrentMana can currently pay, so visible charge growth stops when mana runs short. At release, Fireball calls PlayerMana.Spend(float) exactly once, for the reached tier's cost; every configured cost is greater than zero. If that Spend call returns false (only possible if mana fell below the tap cost during the charge), PlayerMana.CastDenied fires and nothing launches.",
      "criterion_id": "AC-006"
    },
    {
      "reference": "Docs/GDD/No_Safe_Circle_GDD.md:23,40,522,541-543,602,686; Assets/NoSafeCircle/DoorPrototype/Scripts/Enemies/EnemyFireballCaster.cs",
      "requirement": "Solid gameplay colliders block Fireball's projectile: walls, obstacle and prop colliders (shelves, pews, columns, rubble), and any door whose doorway-blocker collider is enabled (sealed, locked, and broken doors, since a broken door keeps its one-way player blocker by design); only an open door the wizard has not yet crossed does not block. FireballProjectile tests this each Tick with a chest-height Physics.Raycast (or equivalent sweep) against non-trigger colliders, using the same default-layer, trigger-ignoring query the ranged enemy caster's HasUnobstructedViewOfWizard already uses (EnemyFireballCaster on main; NSC-077 renames it EnemyLanternWispCaster, and either name satisfies this), and ignoring colliders on the wizard's own CharacterController; no new layer, tag, collider, or query API is introduced. Fireball never collides with or damages the caster. Enemies carry no colliders, so contact is a flat horizontal distance test against active, non-defeated EnemyHealth objects within the projectile's configured contact radius, matching DemoRunFlow's existing enemy-contact pattern; this contract does not add enemy colliders. On contact with an enemy or a blocking collider, the projectile detonates: it damages the contacted enemy and, for tiers above tap, every other active, non-defeated enemy within that tier's configured area radius that has an unobstructed line (the same raycast rule) from the detonation point, damaging each enemy at most once per cast. Nothing behind a wall or a closed door is damaged. Damage goes only through EnemyHealth.TakeDamage(float).",
      "criterion_id": "AC-007"
    },
    {
      "reference": "Docs/GDD/No_Safe_Circle_GDD.md:92,98-104,556,566,690-692",
      "requirement": "Fireball exposes public ResetFireball(), SuspendGameplayInput(), and EnableGameplayInput() methods plus read-only charging state and normalized charge progress. ResetFireball clears charge and cast state, releases Fireball's restriction if held, removes every FireballProjectile it owns, and re-enables input. SuspendGameplayInput performs the same active-operation cleanup but keeps Fireball suspended; new input is rejected until EnableGameplayInput() or ResetFireball() runs. A programmer-placeholder colored primitive or simple generated sprite for the charge, the in-flight projectile, and the detonation is acceptable for the first playable; no art asset beyond this task's listed files is introduced.",
      "criterion_id": "AC-008"
    },
    {
      "reference": "Docs/GDD/No_Safe_Circle_GDD.md:624; Assets/NoSafeCircle/DoorPrototype/Editor/DoorPrototypeSceneBuilder.cs; Assets/NoSafeCircle/DoorPrototype/Editor/World/DoorPrototypeGlobalSceneBuilder.cs BuildPlayer",
      "requirement": "Create Assets/NoSafeCircle/DoorPrototype/Tests/Editor/FireballCommittedSceneConformanceTests.cs. Update DoorPrototypeGlobalSceneBuilder.BuildPlayer to add Fireball to the Player and assign it the existing PlayerMovement, PlayerMana, and InputActionAsset references, and update DoorPrototypeSceneBuilder.cs to route the Fireball reference needed by the title/entry wiring in AC-010. The production Door Prototype builder materializes this wiring in Assets/Scenes/DoorPrototype.unity; implementation code and tests do not hand-edit or reconstruct the serialized scene.",
      "criterion_id": "AC-009"
