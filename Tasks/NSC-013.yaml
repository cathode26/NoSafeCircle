      "reference": "Section 2 — Spell and Enemy Interactions (Frost Field row)",
      "requirement": "Frost Field slowdown modifies an affected enemy's locomotion/repositioning speed only; it must never suppress, pause, or slow a Ranged Enemy's attack execution/timing."
    },
    {
      "reference": "Section 5 — Runtime Implementation",
      "requirement": "Frost slowdown is restored (movement speed returns to normal) when the effect ends, with no permanent slowdown remaining."
    },
    {
      "reference": "Section 5 — Runtime Implementation (enemy movement paragraph)",
      "requirement": "Applies forced displacement requested by an ability (e.g. Force Wave's radial knockback selection) to the affected enemy while preserving valid movement/navigation state."
    },
    {
      "reference": "Section 5 — Runtime Implementation",
      "requirement": "After displacement or Frost slowdown ends, returns the affected enemy to the appropriate pursuit/search movement state per the pursuit/search state contract, rather than defining a second enemy-state machine."
    },
    {
      "reference": "Section 2 — Spell-local state ownership",
      "requirement": "Exposes an owner-controlled reset entry point that clears any active Frost slowdown or displacement state for floor restart, invoked by the Floor Run/Restart Orchestrator."
    }
  ],
  "validation_requirements": [
    {
      "reference": "Section 5 — Runtime Implementation",
      "requirement": "Verify Frost Field slowdown applies to a pursuing enemy's movement speed and is fully restored when the effect ends, with no permanent slowdown remaining (Unity Validation Agent concern in Section 4)."
    },
    {
      "reference": "Section 5 — Runtime Implementation (enemy movement paragraph)",
      "requirement": "Verify forced displacement (e.g. Force Wave knockback) moves an affected enemy while preserving valid navigation/movement state and that the enemy resumes appropriate pursuit/search behavior afterward rather than becoming stuck."
    },
    {
      "reference": "Section 2 — Spell and Enemy Interactions (Frost Field row)",
      "requirement": "Verify a Ranged Enemy under active Frost slowdown continues executing its telegraphed attack on schedule while only its repositioning speed is reduced."
    },
    {
      "reference": "Section 2 — Floor-run restart ownership",
      "requirement": "Verify floor restart clears any active Frost slowdown or displacement state on all enemies through the owner-controlled reset entry point."
    }
