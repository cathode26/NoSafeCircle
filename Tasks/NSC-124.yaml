      "criterion_id": "AC-001",
      "reference": "Tasks/NSC-015.yaml: acceptance_criteria AC-001; Docs/GDD/No_Safe_Circle_GDD.md:511-520, 526-532",
      "requirement": "Create MeleeEnemyAttack.cs and its Unity sidecar. MeleeEnemyAttack starts one serialized wind-up, impact, and cooldown cycle only while EnemyTargetKnowledge is Pursuing, its CurrentTarget is inside the serialized close attack range, and EnemyHealth is not defeated. At impact, recheck the same target, Pursuing state, range, and defeat state; an invalid impact completes without damage. Expose the current cycle phase through read-only state so EnemyPursuitMovement can hold translation during wind-up. MeleeEnemyAttack must not move the enemy or modify locomotion state directly."
    },
    {
      "criterion_id": "AC-002",
      "reference": "Tasks/NSC-015.yaml: acceptance_criteria AC-002; Docs/GDD/No_Safe_Circle_GDD.md:522, 686-693",
      "requirement": "For one valid impact, call PlayerHealth.TakeDamage exactly once with a serialized positive damage value on EnemyTargetKnowledge.CurrentTarget. Do not maintain duplicate player-health state or apply per-frame contact damage. If CurrentTarget has no PlayerHealth, allow the readable swipe to complete without damage, exceptions, destruction, disabling, or other modification of that target."
    },
    {
      "criterion_id": "AC-003",
      "reference": "Tasks/NSC-015.yaml: acceptance_criteria AC-003; Docs/GDD/No_Safe_Circle_GDD.md:687-695",
      "requirement": "Expose public ResetAttack(), which cancels an early or late wind-up and any pending impact, clears cooldown, returns MeleeEnemyAttack to its initial idle state, prevents delayed damage from the cancelled cycle, and permits a later valid cycle to begin normally."
    }
  ],
