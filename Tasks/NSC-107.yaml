      "requirement": "When TitleScreenController.StartGame runs and the title panel is hidden, TitleScreenChaseBackdrop destroys every actor it spawned that same frame and starts no further pairing for the rest of the session. It reads the controller's existing public state and event and does not change TitleScreenController."
