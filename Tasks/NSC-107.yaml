      "criterion_id": "AC-001",
      "reference": "NSC-066 AC-006 (runtime half); owner revision 2026-09-17 (U1, U2, U5, U6)",
      "requirement": "Create Assets/NoSafeCircle/DoorPrototype/Scripts/TitleScreenChaseBackdrop.cs. It runs only while TitleScreenController.IsTitleScreenVisible is true. After a random interval between 10 and 20 seconds - the first pairing may appear sooner, within 3 seconds of the title screen showing - it starts one pairing at a randomly chosen endpoint of the chase lane: a fleeing wizard set up through WizardAnimationController.ApplyPresentation, followed about 2.5 world units behind by a pursuer set up through EnemyAnimationController.Initialize, both walking the lane at about 1.5 world units per second. At each pairing start it clips the floor segment supplied by the builder to the part whose Camera.main.WorldToViewportPoint x lies within [0.55, 0.9] for the camera's current aspect; that clipped segment is the chase lane and its two ends are the lane endpoints. The [0.55, 0.9] band keeps the whole lane clear of the title text and Start Game Button column. If the clipped lane is shorter than 6 world units, skip that pairing and start the next interval. Each actor fades in over 0.5 seconds as it starts moving from its pairing's start endpoint and fades out over 0.5 seconds before reaching the far endpoint, then is destroyed; the pursuer starts at the start endpoint 2.5 / 1.5 seconds after the wizard, so neither actor's tracked position ever falls outside the clipped lane. For pairing index k starting at 0 the sequence is: k=0 Ember Wizard with the Dungeon Brute (EnemyAnimationKind.MeleeEnemy); k=1 Ash Wizard with the Lantern Wraith (EnemyAnimationKind.LanternWraith); k=2 Frost Wizard with the Dungeon Brute; k=3 Dusk Wizard with the Lantern Wraith; k=4 Ember Wizard with the Lantern Wraith; k=5 Ash Wizard with the Dungeon Brute; k=6 Frost Wizard with the Lantern Wraith; k=7 Dusk Wizard with the Dungeon Brute; then repeat from k=0, covering all 8 wizard-pursuer combinations within 8 pairings. At the lane midpoint both actors are fully opaque and inside the camera's viewport, with WorldToViewportPoint x and y each within [0.05, 0.95]."
    },
    {
      "criterion_id": "AC-002",
      "reference": "NSC-066 AC-007; owner revision 2026-09-15 (T3)",
      "requirement": "Every actor this component spawns carries only presentation components: a SpriteRenderer/Visual and either a WizardAnimationController or an EnemyAnimationController with its Animator. No actor has a NavMeshAgent, a Collider, an EnemyTargetKnowledge, an attack component, a health component, a registry component, or an input component. No actor ever registers with ActiveEnemyRegistry, and the component never reads or touches the Player GameObject or PlayerMovement. It adds no gameplay, targeting, or AI behavior."
    },
    {
      "criterion_id": "AC-003",
      "reference": "NSC-066 AC-008 (component half); owner revision 2026-09-17 (U3)",
      "requirement": "TitleScreenChaseBackdrop exposes a public Tick(float deltaTime) that advances spawn timing and actor movement by exactly that delta, plus a serialized seed or an injectable interval selector and side selector, so Play Mode tests can drive and predict spawn timing, side choice, and pairing order without depending on real time or Unity's Update loop. All runtime inputs - the four wizard identities' animator controllers or override data and display order, the MeleeEnemyAnimator and LanternWraithAnimator controllers, the two floor-segment endpoints, and the interval bounds and speeds - are serialized fields the builder assigns; the component itself never calls Editor APIs and never calls Resources.Load."
    },
    {
      "criterion_id": "AC-004",
