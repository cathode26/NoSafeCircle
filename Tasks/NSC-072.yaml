  "notes": "Bounded GER refinement; no execution, readiness or delivery is claimed. NO DESIGN DECISION IS OUTSTANDING FOR THIS TASK, and an earlier revision was wrong to say otherwise - it gated completion on three questions for Vincent, and a fresh re-audit found each already settled by existing authority. The budget-versus-representative-path question belongs to NSC-030 VAL-005/VAL-007 and NSC-054 tuning. The absent production WispOrigin question is dissolved rather than answered: AC-003 now specifies 0.75 and 2.0 unconditionally, so nothing waits on NSC-055. The non-enemy-occupiable geometric origin is permitted by GDD line 379, which lets the validation choose one representative path, with encounter-position geometry checked separately by NSC-030 VAL-005. FOR AWARENESS AND NOT BLOCKING: at speed 3 and lifetime 5 a Lantern Wraith projectile flies at most 15 units while the enlarged Chapel is 36 by 34, so whether that range feels right is a playtest judgement for NSC-030 VAL-007 and NSC-054 tuning, not a precondition here. The prescribed low origin is a geometry probe, not an authored encounter spawn. PRECONDITION, not a contract defect: NSC-046 has not been delivered, the snapshot's ChapelOfAshLayout.MaximumZ is still 42f and the saved scene still carries baseline collision objects and cube visuals, so the fixture's canary will correctly fail until NSC-046 lands - THE FIXTURE MUST NEVER ADAPT ITSELF TO THE BASELINE ROOM. This task writes only its test file and metadata; it does not edit scenes, builders, layout, catalog, runtime code, prefab assets, art, asmdefs, packages or project settings. Missing or stale revised Chapel content is reported to NSC-046. PLAYMODE ORDER-DEPENDENCE CLOSED PROSPECTIVELY, 2026-09-23. The Pipeline Runner measured and reproduced an order-dependence in the PlayMode suite: one fixture running before another makes three of the latter's tests fail, reproduced down to an eleven-test run. ITS CONSEQUENCE IS AIMED AT THE EVIDENCE SYSTEM RATHER THAN AT ANY ONE TEST - a scoped green can pass precisely because the filter excluded the polluter, which is the check-that-answers-from-a-copy shape applied to delivery records. MEASURED ON THE CONTRACT AXIS, WHICH IS THE HALF NOBODY HAD DONE: sixteen filter-gates across thirteen contracts; ONLY NSC-047's VAL-003 required a broader-suite run, and only of the Edit Mode suite; five gates touch PlayMode and four of those had no broader-suite clause. ALL FOUR WERE UNDELIVERED WITH NO SELECTED RECORD, SO NO EXISTING DELIVERY RECORD WAS EXPOSED THROUGH A CONTRACT GATE AND THE RISK WAS PROSPECTIVE - which is exactly when closing it costs nothing to re-verify. THE FIRST SWEEP OF THIS WAS MY OWN AND IT WAS WRONG: it tested for the phrase \"complete suite\" and NSC-047 says \"complete Edit Mode suite\", so it reported zero broader-suite clauses where there was one. Caught by opening the gate text rather than trusting the pattern, which is the only reason the NSC-047 conclusion below is not also wrong. NSC-047 IS NOT EDITED: its gate evidence is an Edit Mode fixture and the measured pollution is PlayMode-to-PlayMode, so it is insulated twice, and VAL-003 is a completion gate - editing it would un-deliver the only conformant room for a clause it does not need. THE ADDED CLAUSE COSTS ONE FULL PLAYMODE RUN PER DELIVERY on these four tasks; Unity time is the scarce resource in this fleet and that cost lands on the Game Agent, which has been told rather than left to discover it. ORDER-DEPENDENCE REPAIRED AT SOURCE WITHIN THE HOUR; THE OBLIGATION KEPT AND ITS PREMISE CORRECTED, 2026-09-23. The Game Agent fixed the leak at 1989950fa - verified here as an ancestor of main, with the cleanup scene present in the offending fixture - taking the full unfiltered PlayMode suite from eight failures to one, and bisected rather than reasoned: 258 to 14 to 11 tests all reproduced the same three failures, and excluding only the three scene-loading tests took that group to 8/8. IT ASKED WHETHER THE DOUBLING I ADDED AN HOUR EARLIER WAS NOW UNNECESSARY AND LEFT THE CALL WITH ME, WHILE ARGUING AGAINST ITS OWN FIX by naming the two unowned test files that no gate can catch. THE CLAUSE I WROTE ASSERTED A DURABLE PROPERTY AND JUSTIFIED IT WITH A DATED FACT, AND THE FACT WENT STALE IN ABOUT AN HOUR - which is my own recorded rule that a gate encoding a fact goes stale silently, firing on my own text. So the factual sentence is now stated as history with the repair named, and the requirement stands on three grounds that do not depend on the fixed defect: filtering can always hide a polluter; the scene-restore house pattern is followed by seven of eight fixtures and enforced on none, so a ninth can reintroduce it; and two of the test files involved are owned by no contract at all. THE COST IS UNCHANGED at one full PlayMode run per delivery on this task, and it is now a run that passes rather than one that would have failed. CLAUSE MADE STATE-INDEPENDENT, 2026-09-23 - THIRD REVISION OF IT IN ONE SESSION AND DELIBERATELY THE LAST. It bound itself to a world-state twice: revision one asserted the PlayMode suite \"has been measured order-dependent\", which was false within the hour once the Game Agent repaired it; revision two asserted the scene-restore pattern was \"ENFORCED ON NONE\", which the same agent was in the act of falsifying by writing a convention guard. THE REMEDY FOR A CLAUSE THAT KEEPS GOING STALE IS NOT A THIRD CORRECTION OF THE SAME KIND, IT IS TO STOP ASSERTING STATES. Both remaining present-tense world-facts are now a DATED OBSERVATION plus a DURABLE CONDITIONAL, so the requirement holds whatever the enforcement and ownership states turn out to be, and a future change to either no longer requires editing this gate. THE GAME AGENT DID NOT ASK FOR THIS and said explicitly it was not arguing the hedge away; it supplied the material for the new second ground by naming what its own guard cannot reach - a fixture polluting by other means, a helper loading a scene on a fixture's behalf, and files no contract owns - and it broke its guard on purpose against the pre-fix commit before trusting it, asserting a minimum population inside the guard because its first probe reported zero single-loaders from a broken subprocess call rather than a clean codebase. That is the haystack check this file's own rules ask for, carried inside the guard instead of remembered.",
