 and neither needing any lifetime extension: the low control runs from (3, 0.75, 37) to (-8, 0.75, 37), about 11 units; the high control runs from (-1, 2.0, 37) to (8, 2.0, 37), about 9 units, where the sphere bottom at 1.92 clears the 1.25 pew tops and the columns at Z 28 and Z 40 are clear of Z 37. NSC-046 VAL-001's reachable lateral-opening points are the targets. An earlier draft used the north edge of the next pew row north as the control origin; that path crosses C4's X range at about x 13.3 while reaching its top face, so the control was blocked by construction and needed about 19.8 units besides. Resolve the expected saved BoxCollider under the loaded room's GameplayGeometry by its layout bounds, require a unique enabled non-trigger match, and record its hierarchy path. Do not lower an origin, enlarge a collider, or substitute a different pocket to hide a failing branch. Unavailable cover at the specified height, or contact beyond the unmodified flight budget, is a reported failure. NSC-030 VAL-005 separately validates authored encounter-position linecasts."
