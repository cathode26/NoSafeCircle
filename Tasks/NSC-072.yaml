      "requirement": "On the exact candidate run the Unity Editor Play Mode fixture NoSafeCircle.DoorPrototype.Tests.ChapelOfAshProjectileCoverPlayModeTests, then repeat the fixture to check cleanup and repeatability. Produce one consolidated evidence report containing both executions and the VAL-001/VAL-002 outcomes, not separate runs per behavioral gate. Both required cases must be discovered and executed in each run. Record the actual command and filter, Unity executable/version, candidate commit/tree, exit codes, external XML and log paths, parsed total/passed/failed/skipped/result, selected height and origin source, observed projectile configuration, and repository state before and after. Zero selected tests, ignored or skipped required Editor cases, unexpected errors, changed source-scene bytes, changed HEAD or any tracked or untracked repository mutation fail validation. Preserve failures without resetting or hiding changes. A non-Editor ignored run cannot satisfy this gate. State proof limits explicitly. A change to the prescribed probe, origin, height or expected behaviour still requires a revised contract before a passing completion claim. This gate no longer waits on any outstanding decision: the earlier wording made completion depend on Vincent's decisions being recorded, and every one of those is already settled by existing authority - GDD line 379, the NSC-054 notes, NSC-046 INT-004, and NSC-030 VAL-005/VAL-007. A FILTERED GREEN IS NOT EVIDENCE OF ORDER-INDEPENDENCE, AND THIS GATE IS NOT SATISFIED BY ONE. THE PLAYMODE SUITE WAS MEASURED ORDER-DEPENDENT ON 2026-09-23 AND WAS REPAIRED AT SOURCE THE SAME DAY, at 1989950fa: one fixture loaded the composed scene with LoadSceneMode.Single in three of its tests and never restored an empty one, so every fixture after it ran inside the five-room floor, and the full unfiltered PlayMode suite went from eight failures to one - the survivor being main's separately documented NSC-101 redness. THAT SPECIFIC DEFECT IS GONE AND THIS REQUIREMENT STAYS, FOR THREE REASONS THAT DO NOT DEPEND ON IT. FIRST, A SCOPED RUN CAN PASS PRECISELY BECAUSE THE FILTER EXCLUDED A POLLUTER - that is a property of filtering itself, true before this defect existed and true after its repair, and it is what this gate guards against. SECOND, THE SCENE-RESTORE PATTERN IS A CONVENTION, AND ANY ENFORCEMENT OF A CONVENTION COVERS THE SHAPE IT WAS WRITTEN FOR RATHER THAN THE GENERAL CASE. Observed 2026-09-23: eight fixtures loaded that scene the same way and seven restored an empty one, and a source-level guard for that exact shape was being added, whose own author named what it cannot reach - a fixture that pollutes by some other means, a helper that loads a scene on a fixture's behalf, and test files no contract owns. SO A GREEN CONVENTION GUARD DOES NOT DISCHARGE THIS REQUIREMENT, WHETHER ONE EXISTS TODAY OR NOT: it narrows the ways a filtered run can mislead; it does not turn a filtered run into evidence of order-independence. THIRD, A PLAYMODE FIXTURE MAY HAVE NO OWNING CONTRACT AT ALL, AND FOR ANY SUCH FIXTURE NO TASK'S GATES CAN EVER CATCH A REGRESSION IN IT, SO AN UNFILTERED RUN IS THE ONLY CHECK THERE IS. Observed 2026-09-23, measured against every contract's exclusive_resources rather than by a flat grep: 29 of 62 test files were claimed by no contract, including DoorPassabilityConnectionPlayModeTests.cs and DoorInteractionFeedbackPlayModeTests.cs, both involved in the defect above - and note the split, since a source file and its test file are owned separately. THIS DOES NOT DEPEND ON WHICH FILES ARE UNOWNED ON ANY GIVEN DAY: whenever that set is non-empty, this requirement is doing work nothing else does, and if it is ever empty the requirement costs one run and proves the same property anyway. The run is real, it passes, and it is not asking the question this record would claim. THEREFORE THE SAME PLAYMODE FIXTURES NAMED ABOVE MUST ALSO PASS IN A RUN THAT INCLUDES THE FULL PLAYMODE SUITE, and the evidence must record BOTH runs with their totals and exit codes, stating explicitly which was filtered and which was not. IF THE TWO DISAGREE, THE UNFILTERED RESULT GOVERNS and this gate fails, however green the filtered run was. THIS DELIBERATELY DOES NOT NAME THE POLLUTING FIXTURE: a gate that named it would encode a fact and go stale the moment the suite is repaired, whereas the property asserted here - that these fixtures pass alongside the rest of the PlayMode suite - stays true and stays checkable either way. It is the same broader-suite compatibility evidence NSC-047's VAL-003 already requires of the Edit Mode suite, extended to PlayMode; this is that contract's existing convention rather than a new one."
