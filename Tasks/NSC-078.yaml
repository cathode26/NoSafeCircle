      "reference": "NSC-078_DECISIONS.md D-1 and AC-003; Docs/Art/Environment/NSC-078_ART_PLAN.md sections 3 and 4a",
      "requirement": "Create Docs/Art/Environment/NSC-078_STYLE_LOCK.md and generate the four named review PNGs with Pipeline/Art/render_dungeon_prop_contact_sheets.py. Before any family acquisition, Vincent reviews NSC-078-StylePilotContactSheet.png containing the plan's five-source style-lock pilot: shared_bone_pile_a, ba_collapsed_reading_table_z, ca_candelabra_tall, re_broken_masonry_blocks, and lv_iron_rail_x, generated with create_object_pro_flash text prompts only (no style_image). An optional five-generation create_image_pixflux side test of the same five sources may run alongside it. Each pilot and final family sheet has three labeled panels: native pixels; world scale beside the four approved south-east standing wizard sprites at their approved 2x2-unit camera-facing box (about 135 px at 1080p, per Vincent's density decision B) and the 3.0-world-unit door-opening proxy; and gameplay-camera pixel density from orthographic size 8 and Vincent's recorded Game view pixel resolution. Confirm the global prompt clause's upper-left key light direction against the door family and wizard highlights during the pilot and record the confirmed direction, the approved 64-pixels-per-world-unit density, palette, pivot rule, sorting-anchor rule, and pilot candidate commit in NSC-078_STYLE_LOCK.md. No family acquisition proceeds until Vincent approves the exact pilot."
