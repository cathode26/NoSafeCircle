    {
      "criterion_id": "AC-001",
      "reference": "NSC-078_DECISIONS.md D-4 and 'Other contract changes' AC-001; GDD development-time asset tools",
      "requirement": "Use PixelLab as the only generative source-art tool. The style-lock pilot (AC-003) uses text prompts only. For family acquisition after the pilot, style_image and color_image inputs to create_object_pro_flash are allowed only from Vincent-approved NSC-078 pilot sources, recorded by SHA-256; R01 through R17 and any other franchise screenshot, copied asset, or traced image are never PixelLab inputs at any stage. If PixelLab is unavailable, stop as blocked. The style-lock pilot stops and asks Vincent before exceeding 120 PixelLab generations, counted from this task's own call log - every call with its identifier and cost, recorded alongside the prompts and settings - and cross-checked by reading get_balance before and after with the job queue empty. The printed per-call estimates under-report, measured at about 37% on the 2026-09-17 wizard run, so a gap of roughly a third between the printed total and the meter is expected rather than a defect, and no per-tool price is established. The prop families beyond the pilot carry no generation cap in this revision: the pilot exists to measure real per-object cost, and a family cap set from the plan's printed quotes would repeat that under-report. A later revision sets the family caps from the pilot's measured numbers, and Vincent's separate spend go is still required before the pilot runs. Record prompts, every exposed setting, generation identifiers, canvas dimensions, perspective, and palette direction in Docs/Art/Environment/PROPS_PIXELLAB_GENERATION.md, Docs/Art/Environment/ARCHITECTURE_MODULES_PIXELLAB_GENERATION.md, and Docs/Art/Environment/HAZARD_ROUTE_PIXELLAB_GENERATION.md, split by family. Record 'not exposed by PixelLab metadata' for unavailable values. Allowed post-selection edits are: lossless crop or pad, recorded as a pixel offset (dx, dy); PixelLab's own inpaint_image or inpaint_image_pro_flash with a recorded repair_mask, a list of axis-aligned rectangles (x, y, width, height) in selected-image pixels whose union covers every repaired pixel, proven byte-exact outside that mask; PixelLab's own reduce_colors; and edit_image_pro_flash or create_object_state to make a matching variant from an approved source. A repair whose changed pixels are not a union of rectangles is not allowed. No hand-painted, scripted, or other non-PixelLab pixel edit is permitted. Commit every selected PNG's raw PixelLab export under Docs/Art/Environment/Props/Raw/<family>/<id>.png with no .meta companion, even when it is byte-identical to the selected file. Record raw_sha256, selected_sha256, the crop/pad offset, and any repair_mask rectangles in the family inventory. Rejected candidates are never committed on this task's branch or on main. They are committed from a clone of main, with an .invalid author identity, on the local branch art-rejects/NSC-078 as Docs/Art/Environment/Candidates/NSC-078/<id>__rNN.png; the Game Agent fetches that branch into the canonical repository; it is never merged into main, never pushed without Vincent, and never deleted (Vincent, 2026-09-17, recorded in nsc-art-director-guide.md). The family inventory records each reject's file name, SHA-256, prompt, and rejects-branch commit."
    },
    {
      "criterion_id": "AC-002",
      "reference": "NSC-078_DECISIONS.md D-2 and AC-002; Docs/Art/Environment/NSC-078_ART_PLAN.md sections 1a, 1b, and 1c",
      "requirement": "Acquire Docs/Art/Environment/NSC-078_ART_PLAN.md's 45-entry first-wing catalog: the plan's section 1a list (35 entries) plus the section 1b rows moved to NSC-078 unchanged under D-2 (ba_shelf_bank_z_start, ba_shelf_bank_z_middle, ba_shelf_bank_z_end, ca_pew_x_start, ca_pew_x_middle, ca_pew_x_end, shared_stone_column, lv_barrel, lv_crate, shared_rubble_pile_a). Every entry records source_owner_task_id 'NSC-078'. The catalog covers every first-wing identity noun per room in the plan's section 1c coverage table: Ruined Entry (broken masonry, webs, vegetation or slime, debris, introductory landmark, comedy); Bone Archive (shelf-bank segments, bone piles, collapsed furniture, books or scrolls, archival clutter, archive landmark, comedy); Chapel of Ash (pews, altar or ritual focus, candle cluster, ash accent, sigil, gothic vertical shape, chapel landmark, comedy); Lower Vault (barrels, crates, rails, water or slime edge, cliff or platform, vault landmark, comedy), subject to AC-006; Final Room (benches, recognizable furniture, ritual detail, bounded-hazard framing, dramatic landmark, comedy). Provide at least two visually distinct entries for the bone_pile and web identity_category values and three for debris_rubble (shared_rubble_scatter_b, re_debris_broken_handcart, shared_rubble_pile_a), and exactly one room-appropriate spooky_comedy_detail entry for each of the five named rooms. No entry uses lava, chasm, or horn-trim vocabulary; that vocabulary stays FutureExpansion-only (AC-006)."
    },
