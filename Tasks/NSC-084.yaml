  "notes": "This task produces a content-only handoff package and must not write the canonical scene or room scenes. Governing visual direction: Docs/Art/Environment/DUNGEON_ART_DIRECTION.md, Vincent-approved project direction dated 2026-09-13. The supplied images are inspiration only; all art and layouts must be original. TEST FIXTURE NAMESPACE IS CONSTRAINED, AND IT IS DELIBERATELY NOT THE DIRECTORY NAME. The fixture Assets/NoSafeCircle/DoorPrototype/Tests/Editor/Environment/FirstWingContentIntegrationPackageTests.cs MUST declare namespace NoSafeCircle.DoorPrototype.Tests.Editor.RoomDressing. It MUST NOT declare NoSafeCircle.DoorPrototype.Tests.Editor.Environment, which is what mirroring the directory would produce. THE DIRECTORY STAYS Tests/Editor/Environment/ and the authoritative_validation_policy.json EditMode filter for this task was moved to NoSafeCircle.DoorPrototype.Tests.Editor.RoomDressing.FirstWingContentIntegrationPackageTests in this same commit, so the contract and the policy agree. WHY, MEASURED ON MAIN: a namespace segment named Environment under NoSafeCircle.DoorPrototype.Tests.Editor captures the bare identifier Environment across the Tests assembly, shadowing System.Environment, because namespace lookup walks outward from the innermost scope and beats the using System import. 22 unqualified uses - Environment.GetEnvironmentVariable and Environment.NewLine - across ComposedFloorCaptureTests, BoneArchiveCameraReviewTests, ChapelOfAshCameraReviewTests, FinalRoomCameraReviewTests, LowerVaultSceneTests and RuinedEntrySceneTests would fail CS0234, and those files belong to other tasks this one may not edit. The Tests assembly then fails to compile, and a candidate that does not compile fails materialization into the NSC-045 unrecoverable state rather than a failed merge. The same trap was paid for once already on the builder side and fixed at 003bac69b. THIS TASK IS ONE OF SIX BOUND TO THAT NAMESPACE - NSC-079, 080, 081, 082, 083 and this one - AND THE FIRST TO LAND SPRINGS IT FOR THE REST, which is why the constraint is on all six rather than on the dressing five alone. NO .cs DECLARES THE NAMESPACE TODAY, so the trap is real and unsprung. THIS NOTE CONSTRAINS THE FIXTURE NAMESPACE ONLY and changes nothing about this task's builder, whose requirements are unchanged; door_prototype_materialization.py:109 governs the five DRESSING_ROOMS builders and does not name this task. *** GER REVISION 4, 2026-09-27: THE MISSING AC-004 IS NOT A DEFECT AND MUST NOT BE 'FIXED' BY RENUMBERING. *** The criterion ids run AC-001, AC-002, AC-003, AC-005. Measured at main: NOTHING anywhere in the repository cites 'NSC-084 AC-004', so the gap breaks no reference and satisfies nothing less. RENUMBERING AC-005 TO AC-004 WOULD BE THE ACTUAL DEFECT: it is a criteria rewrite, which un-delivers a delivered task, and it silently changes what 'AC-005' names in every coverage record, evidence package and message that already used it - the id would keep pointing at a criterion while meaning a different one. A GAP IN AN ID SEQUENCE IS A SCAR FROM A WITHDRAWN CRITERION AND IS WORTH MORE THAN A TIDY SEQUENCE. Raised by the Game Agent as a possible defect, which is the right instinct; this note exists so the next reader stops here instead of renumbering. NOT ESTABLISHED: I found no provenance record of AC-004 being withdrawn, so I cannot say what it required or when it went - only that nothing depends on it today.",
