 slow ends through EnemyStatusEffectMovement's own countdown no later than one configured slowdown duration after its last refresh; NSC-013's reset/pursuit path restores its speed. FrostField never sets NavMeshAgent.speed or calls NavMeshAgent.Warp directly, and never reads or writes EnemyTargetKnowledge, CurrentTarget, LastKnownPosition, or Ranged Enemy attack-timing state.",
