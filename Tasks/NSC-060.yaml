  "acceptance_criteria": [
    {
      "criterion_id": "AC-001",
      "reference": "PlayerHealth.cs / PlayerHealthUI.cs current implementation",
      "requirement": "Player Health exposes an owner-local observable health-changed notification covering damage, restore, and reset mutations, and PlayerHealthUI subscribes/unsubscribes symmetrically so its fill no longer requires per-frame polling."
    },
    {
      "criterion_id": "AC-002",
      "reference": "Engineering Standards §5.1/§5.3",
      "requirement": "Preserve the existing Damaged and Died semantics and the direct/local PlayerInteractionController damage subscription. Do not route this owner-local relationship through the global deVoid signal bus merely to use the new library."
    },
    {
      "criterion_id": "AC-003",
      "reference": "PlayerManaUI.cs current denied-cast feedback",
      "requirement": "Replace PlayerManaUI's manual deniedFlashTimeRemaining presentation countdown with an owned DOTween tween/sequence that restarts deterministically on repeated denied casts and restores the captured normal color when completed or disabled."
    },
    {
      "criterion_id": "AC-004",
      "reference": "PlayerMana.cs continuous regeneration behavior",
      "requirement": "Preserve correct continuous mana-bar fill during regeneration. Per-frame fill refresh may remain because mana can change every frame; do not dispatch a global signal every frame solely to eliminate Update."
    },
    {
      "criterion_id": "AC-005",
      "reference": "Engineering Standards §6 lifecycle",
      "requirement": "Remove the need to call PlayerManaUI.RefreshBindings every frame by using deterministic lifecycle binding or an explicit initialization/rebind boundary compatible with scene-builder wiring."
    },
    {
      "criterion_id": "AC-006",
      "reference": "Historical NSC-004/NSC-005 behavior",
      "requirement": "Do not change health/mana maxima, damage, restore, spend, regeneration, post-cast delay, or denied-cast gameplay rules; this task is presentation/event-lifecycle refactoring only."
    }
  ],
  "completion_gates": [
    {
      "gate_id": "VAL-001",
      "reference": "Regression coverage",
      "requirement": "Existing Player Health, Player Mana, and door-damage interruption behavior remains covered and passes after the refactor."
    },
    {
      "gate_id": "VAL-002",
      "reference": "New event-lifecycle coverage",
      "requirement": "Automated coverage proves the health-changed notification updates UI after damage, restore, and reset and does not leave duplicate subscriptions after enable/disable cycles."
    },
    {
      "gate_id": "VAL-003",
      "reference": "New DOTween lifecycle coverage",
      "requirement": "Automated coverage proves repeated denied casts restart/replace the owned feedback tween safely and disabling the UI kills the tween and restores the expected normal color."
    },
    {
      "gate_id": "VAL-004",
      "reference": "Human Play Mode inspection",
      "requirement": "Developer verifies health fill, mana regeneration fill, and insufficient-mana feedback remain readable and behaviorally unchanged in Play Mode."
    }
  ],
