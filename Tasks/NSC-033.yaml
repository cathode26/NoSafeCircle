    },
    {
      "criterion_id": "AC-003",
      "reference": "Floor-run restart ownership",
      "requirement": "Enemy reset consumes an enemy-owned restart/reset operation that returns each persistent enemy to its authored encounter/spawn region and initial pursuit/search/attack state, with no retained target, search, status-effect, or displacement state; the orchestrator does not write enemy Transform/locomotion internals itself."
    },
    {
      "criterion_id": "AC-004",
      "reference": "Floor-run restart ownership; downstream_integration_obligations from NSC-007, NSC-008, NSC-009, NSC-015, NSC-017, NSC-020, NSC-030, NSC-041, NSC-053, and NSC-054",
      "requirement": "Beyond the reset entry points already required by AC-001, the Floor Run/Restart Orchestrator invokes every reset entry point that another task's downstream_integration_obligations assign to NSC-033: Fireball.ResetFireball() (NSC-007 INT-002); FrostField.ResetFrostField() (NSC-008 INT-001); ForceWave.ResetForceWave() (NSC-009 INT-001, whose scenario now includes an active pulse); MeleeEnemyAttack.ResetAttack() and MeleeEnemyDefeatResponse.ResetDefeatResponse() (NSC-015 INT-001); EnemyPursuitMovement.ResetPursuit() and EnemyLockedDoorAttack.ResetAttack() (NSC-017 INT-002); DoorInteractable.ResetDoor() (NSC-020 INT-003, already required by AC-001); for every enemy GameObject in a production encounter activation component's ActivatedEnemies record, EnemyHealth.ResetHealth() and EnemyPursuitMovement.ResetPursuit(), then that activation component's own public reset method, then ActiveEnemyRegistry.ResetRegistry(), then EncounterAdmissionController.ResetAdmissionState() (NSC-030 INT-001); RangedEnemyKeepDistanceMovement.ResetKeepDistanceMovement() and EnemyStatusEffectMovement.ResetStatusEffects() (NSC-053 INT-003); RangedEnemyAttack.ResetAttack() (NSC-054 INT-002); SpectralDecoy.ResetSpectralDecoy() (NSC-088 INT-001); LanternWraithDefeatResponse.ResetDefeatResponse() (NSC-055 INT-003); and DoorInteractionFeedback.ResetFeedback() (NSC-041, already required by AC-001)."
    },
    {
      "criterion_id": "AC-005",
      "reference": "Floor-run restart ownership; NSC-007 INT-002; NSC-030 AC-009 and INT-001",
      "requirement": "The orchestrator's reset call order satisfies: (1) Fireball.ResetFireball(), FrostField.ResetFrostField(), ForceWave.ResetForceWave(), and SpectralDecoy.ResetSpectralDecoy() run before PlayerMovement.ResetMovement(), because ResetMovement zeroes the shared movement-restriction counter (NSC-007 INT-002); SpectralDecoy.ResetSpectralDecoy() also runs before the enemy-owned EnemyPursuitMovement.ResetPursuit() call for every activated enemy in item (2), so every redirected enemy leaves its decoy redirect through EnemyTargetKnowledge's owner API (SpectralDecoy.ResetSpectralDecoy() calling EnemyTargetKnowledge.EndSpectralDecoyRedirect) before its pursuit state resets; (2) the enemy-owned resets EnemyHealth.ResetHealth(), EnemyPursuitMovement.ResetPursuit(), EnemyLockedDoorAttack.ResetAttack(), MeleeEnemyAttack.ResetAttack(), MeleeEnemyDefeatResponse.ResetDefeatResponse(), LanternWraithDefeatResponse.ResetDefeatResponse(), RangedEnemyAttack.ResetAttack(), RangedEnemyKeepDistanceMovement.ResetKeepDistanceMovement(), and EnemyStatusEffectMovement.ResetStatusEffects() are invoked only for a persistent enemy whose GameObject was activated during the failed run; for an encounter-admitted enemy that set is exactly the members of its activation component's ActivatedEnemies record (NSC-030 AC-009). An enemy GameObject never activated during the failed run, whether pending or cancelled at the moment of restart, receives no reset call and keeps its authored transform, because EnemyPursuitMovement.Awake never captured a spawn position for it (NSC-030 INT-001); (3) for production encounter-admitted enemies the order is: (a) the enemy-owned resets above for every enemy GameObject in each activation component's ActivatedEnemies record; (b) each encounter activation component's public reset method, which deactivates every one of its configured enemy GameObjects; (c) ActiveEnemyRegistry.ResetRegistry(); (d) EncounterAdmissionController.ResetAdmissionState() (NSC-030 INT-001)."
    },
    {
      "criterion_id": "AC-006",
      "reference": "DemoRunFlow retirement (death path); GER Orchestrator decisions, RESTART_VICTORY_DECOY_DECISIONS.md 'DemoRunFlow retirement' and 'NSC-033 revision 9' R1",
      "requirement": "The integration child retires the death path from Assets/NoSafeCircle/DoorPrototype/Scripts/DemoRunFlow.cs. It removes the playerHealth.Died += HandlePlayerDied subscription in Start and the matching -= unsubscribe in OnDestroy, the private lost field, and the HandlePlayerDied() method. It removes the \"YOU DIED\" branch of DrawEndScreen's won ternary text and color. If NSC-086 has already removed DemoRunFlow's won field, the HandleFinalDoorCrossed subscription, and the \"YOU ESCAPED\" text by the time this child lands, this child also removes Update's if (won || lost) return; early return, DrawEndScreen, and the \"Press R to play again\" SceneManager.LoadScene reload entirely, since DemoRunFlow then owns neither end state. If NSC-086 has not yet landed, this child narrows Update's early return to if (won) return;, keeps DrawEndScreen and the R-to-restart reload for the win path only, and DrawEndScreen shows \"YOU ESCAPED\" unconditionally. DemoRunFlow's enemy contact damage (ApplyEnemyContactDamage), enemy health bars (DrawEnemyHealthBars), and player status HUD (DrawPlayerStatus) are unchanged and keep running every frame no win state is active. This child claims repo-file:Assets/NoSafeCircle/DoorPrototype/Scripts/DemoRunFlow.cs in exclusive_resources, a resource group shared with NSC-007 and NSC-086. Zero health restarts the floor through the Floor Run/Restart Orchestrator only; no manual R-reload gates the death path."
    }
