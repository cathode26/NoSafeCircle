yKeepDistanceMovement and RangedEnemyAttack are re-enabled and its NavMeshAgent resumes (NSC-055 INT-003), with LanternWraithDefeatResponse.ResetDefeatResponse() invoked in AC-005 step (3)(a) before the encounter activation reset deactivates it."
