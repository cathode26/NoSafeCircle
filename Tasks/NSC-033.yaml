      "criterion_id": "AC-001",
      "reference": "Floor-run restart ownership",
      "requirement": "Extends the same orchestrator used by the bootstrap stage to additionally invoke reset entry points for every implemented persistent owner beyond the bootstrap set, including DoorInteractionFeedback.ResetFeedback alongside DoorInteractable.ResetDoor and PlayerInteractionController.ResetInteraction, without redesigning the orchestration contract. One integration child owns every edit to the shared Floor Run/Restart Orchestrator, DoorPrototypeSceneBuilder.cs, and DoorPrototype.unity. Existing domain owners remain responsible for their owner-local reset operations; NSC-033 children may validate or adapt those existing operations within their assigned scope and consume them without editing the owner domains or shared integration surfaces."
    },
    {
      "criterion_id": "AC-002",
      "reference": "Floor-run restart ownership",
      "requirement": "Full closure is not considered complete while any implemented run-persistent owner does not yet expose/participate in a reset entry point."
    },
    {
      "criterion_id": "AC-003",
      "reference": "Floor-run restart ownership",
      "requirement": "Enemy reset consumes an enemy-owned restart/reset operation that returns each persistent enemy to its authored encounter/spawn region and initial pursuit/search/attack state, with no retained target, search, status-effect, or displacement state; the orchestrator does not write enemy Transform/locomotion internals itself."
    },
    {
      "criterion_id": "AC-004",
      "reference": "Floor-run restart ownership; downstream_integration_obligations from NSC-007, NSC-008, NSC-009, NSC-015, NSC-017, NSC-020, NSC-030, NSC-041, NSC-053, and NSC-054",
      "requirement": "Beyond the reset entry points already required by AC-001, the Floor Run/Restart Orchestrator invokes every reset entry point that another task's downstream_integration_obligations assign to NSC-033: Fireball.ResetFireball() (NSC-007 INT-002); FrostField.ResetFrostField() (NSC-008 INT-001); ForceWave.ResetForceWave() (NSC-009 INT-001); MeleeEnemyAttack.ResetAttack() and MeleeEnemyDefeatResponse.ResetDefeatResponse() (NSC-015 INT-001); EnemyPursuitMovement.ResetPursuit() and EnemyLockedDoorAttack.ResetAttack() (NSC-017 INT-002); DoorInteractable.ResetDoor() (NSC-020 INT-003, already required by AC-001); for every enemy GameObject in a production encounter activation component's ActivatedEnemies record, EnemyHealth.ResetHealth() and EnemyPursuitMovement.ResetPursuit(), then that activation component's own public reset method, then ActiveEnemyRegistry.ResetRegistry(), then EncounterAdmissionController.ResetAdmissionState() (NSC-030 INT-001); RangedEnemyKeepDistanceMovement.ResetKeepDistanceMovement() and EnemyStatusEffectMovement.ResetStatusEffects() (NSC-053 INT-003); RangedEnemyAttack.ResetAttack() (NSC-054 INT-002); and DoorInteractionFeedback.ResetFeedback() (NSC-041, already required by AC-001)."
    },
    {
      "criterion_id": "AC-005",
      "reference": "Floor-run restart ownership; NSC-007 INT-002; NSC-030 AC-009 and INT-001",
      "requirement": "The orchestrator's reset call order satisfies: (1) Fireball.ResetFireball(), FrostField.ResetFrostField(), and ForceWave.ResetForceWave() run before PlayerMovement.ResetMovement(), because ResetMovement zeroes the shared movement-restriction counter (NSC-007 INT-002); (2) the enemy-owned resets EnemyHealth.ResetHealth(), EnemyPursuitMovement.ResetPursuit(), EnemyLockedDoorAttack.ResetAttack(), MeleeEnemyAttack.ResetAttack(), MeleeEnemyDefeatResponse.ResetDefeatResponse(), RangedEnemyAttack.ResetAttack(), RangedEnemyKeepDistanceMovement.ResetKeepDistanceMovement(), and EnemyStatusEffectMovement.ResetStatusEffects() are invoked only for a persistent enemy whose GameObject was activated during the failed run; for an encounter-admitted enemy that set is exactly the members of its activation component's ActivatedEnemies record (NSC-030 AC-009). An enemy GameObject never activated during the failed run, whether pending or cancelled at the moment of restart, receives no reset call and keeps its authored transform, because EnemyPursuitMovement.Awake never captured a spawn position for it (NSC-030 INT-001); (3) for production encounter-admitted enemies the order is: (a) the enemy-owned resets above for every enemy GameObject in each activation component's ActivatedEnemies record; (b) each encounter activation component's public reset method, which deactivates every one of its configured enemy GameObjects; (c) ActiveEnemyRegistry.ResetRegistry(); (d) EncounterAdmissionController.ResetAdmissionState() (NSC-030 INT-001)."
    }
  ],
