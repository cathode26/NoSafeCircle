g else in this criterion changed; in particular the subset rule immediately following, that every later task must tolerate the metas' pre-existence and must not assert that it adds them, was already correct and is untouched. DESIGN-BRIEF WINDOW, 2026-09-23: AC-003 now states that any design brief this task's crew is expected to read must be on main BEFORE prepare. Learned on NSC-082, whose brief was merged at 71abc67d1 as the last commit before its prepare because that was the only window left: materialization reads the task at the candidate's frozen commit and VAL-001 runs from a clean checkout, so a candidate ref is unreadable from both, and admission pins HEAD twice plus the contract hash - merging afterwards reaches nothing. candidate/art-director/ruined-entry-dressing-design already exists, so this repeats for the remaining rooms rather than being a one-off. Also fixed here: an ambiguity I wrote into NSC-082 rev 9, which said a brief may be cited 'by path AND blob hash' without saying which of the two hashes - the sha256 of the committed LF blob is the one contract gates use; the git object id is a different number for the same file. FLOOR/WALL SCOPE, 2026-09-23: this contract now states that floor and wall tileset application is out of scope and unowned. Reported by the Art Director (C:/nscrev/reports/handoffs/ART-20260923-floor-wall-art-unowned.md) and verified here rather than taken: NSC-064 AC-005 explicitly excludes application, a describe-the-work sweep across all 103 contracts finds no task that applies the art, and the only tileset references in these five contracts are inside VAL-002's colour-band prose, which ASSUMES a frame mostly made of floor tileset and wall - an assumption that is false today. The dressing tasks cannot absorb it: they output a prefab of catalogued props, AC-002's selected_sha256 check cannot be satisfied by an uncatalogued PNG, and AC-003 forbids editing the blockout scene while applying tilesets means the scene or its builder. A