      "reference": "NSC-066 AC-002; Human-approved game-entry flow, 2026-09-12",
      "requirement": "Before Start Game is activated, player movement, spell, and door-interaction input cannot affect gameplay. TitleScreenController does this only through owner-controlled boundaries: at Awake it calls PlayerMovement.SuspendGameplayInput() and PlayerInteractionController.SuspendGameplayInput() and disables its serialized gameplayInputBehaviours, and it never writes another system's internal state. The gameplay-input owners in scope are those that exist at this child's own commit, and spell components are explicitly not among them: do not add a Fireball, FrostField, ForceWave, or SpectralDecoy reference here and do not wait for one to land. Each of those spells separately claims TitleScreenController.cs and adds its own optional reference to this flow, so the dependency runs the other way. Where a spell component does not exist at the commit under test there is no spell input to suspend, and that is a pass."
    },
    {
      "criterion_id": "AC-002",
      "reference": "NSC-066 AC-003; owner revision 2026-09-15",
      "requirement": "Activating Start Game exactly once hides the title panel, makes the Start Game Button non-interactable, and raises WizardSelectionRequested exactly once, even when the Button's onClick fires repeatedly or StartGame() is also called directly. IsTitleScreenVisible reports whether the serialized title panel GameObject is active. The controller does not bypass wizard selection, start multiple transitions, reload the scene, or create duplicate menu objects."
