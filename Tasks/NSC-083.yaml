  "acceptance_criteria": [
    {
      "criterion_id": "AC-001",
      "reference": "Approved Final Room blockout",
      "requirement": "Add the strongest visual contrast with recognizable benches, candle or timer motifs, rubble, webs, vegetation, and dark material variation while preserving the D5 opening, door countdown and candle/timer behavior, collision, and walkability."
    },
    {
      "criterion_id": "AC-002",
      "reference": "NSC-078 prop catalog",
      "requirement": "Use only catalogued original props and keep passages, alcoves, door approach, and player routes clear. THE PROPS THIS ROOM USES ARE ALREADY COMMITTED, AND NSC-078 IS REMOVED FROM depends_on FOR THAT REASON. Measured at main: all twelve catalog entries whose intended_rooms include FinalRoom are present under Assets/NoSafeCircle/DoorPrototype/Art/Environment/Props/Source/selected/ with BOTH their .png and their .png.meta, and PropCatalog.json carries all forty-five entries. NSC-078 is a forty-five entry task whose art review, 120-generation stop and spend approval are reserved to Vincent, so depending on it gated this room's dressing on decisions about GENERATING art rather than on the art's AVAILABILITY, which is settled. NSC-080 and NSC-081 already depend on their narrow publication tasks rather than on NSC-078, so this makes all five room-dressing tasks consistent rather than carving out an exception. NSC-078 KEEPS CATALOG AUTHORSHIP for all forty-five entries and this task still must not edit PropCatalog.json. THE DEPENDENCY IS REPLACED BY A CHECK RATHER THAN DROPPED, because a dependency on another task's review state never proved anything about the files. Before placing any prop, this task must confirm that the prop resolves to a committed entry in PropCatalog.json and that the file at that entry's path matches the entry's recorded selected_sha256, and must FAIL rather than place a prop that does not. That is strictly stronger than what the dependency asserted: it verifies the bytes this room dresses with, at the moment it dresses."
    },
    {
      "criterion_id": "AC-003",
      "reference": "Room ownership boundary",
      "requirement": "Own only this room's dressing prefab, catalog, builder, and focused tests; do not edit the blockout scene, common builders, another room, doors, navigation, or the canonical scene. EVERY OWNED ASSET'S .meta IS OWNED WITH IT, AND AN EARLIER REVISION LISTED ONLY THE FOUR ASSETS. Unity writes a .meta beside every asset it imports, so this task's four assets are eight committed files. The omission is not cosmetic and this is measured at source rather than argued: Pipeline/AssistantControl/unity_materialization.py's _generated_resource_roots admits a resource to the Unity builder's allowed roots ONLY when git cat-file -t reports a tree for it, so a resource list containing files alone derives an EMPTY root set - and the companion folder metas it would otherwise supply are computed only FROM those roots, so they are empty too. After that, any file generated beside the owned ones is fatal at materialization. That is the shape that nearly froze NSC-044. THE THREE OUTPUT DIRECTORIES DO NOT EXIST ON MAIN AND ARE DELIBERATELY NOT CLAIMED HERE. Measured: Art/Environment/RoomDressing, Editor/Environment and Tests/Editor/Environment are all absent, while their parent Art/Environment is present with its own .meta. So the FIRST of the five room-dressing tasks to land creates all three, and Unity generates a folder .meta for each. Five tasks claiming one path would be a resource collision, so only ONE claims them - AND IT IS NOT THIS TASK. NSC-082 OWNS ALL THREE FOLDER METAS as of its revision 7, commit 3e5bb5b0d: Art/Environment/RoomDressing.meta, Editor/Environment.meta and Tests/Editor/Environment.meta. THIS TASK MUST NOT CLAIM THEM AND MUST NOT BE REVISED TO. An earlier wording of this criterion said none of the five claimed them and told the first dressing task to dispatch to revise its contract to claim them at that time; that instruction is SPENT, because NSC-082 carried it out. A second dressing task following it now would claim three paths another contract already owns, and exclusive_resources is a contention lock, so that is a real collision at exactly the moment two dressing tasks could otherwise run in parallel. Commit shape, unchanged and still required of whoever creates them: proper folder assets - folderAsset: yes with DefaultImporter, never GUID-only stubs, which import as Cubemaps in Unity 6000.1 - the same shape as the prop folders committed at 9bd49c7ee. If dispatch order ever changes so that this task runs before NSC-082, moving the claim is a one-task revision on each side and not a redesign. EVERY LATER TASK MUST TOLERATE THEIR PRE-EXISTENCE AND MUST NOT ASSERT THAT IT ADDS THEM: a subset rule, not an equality rule, for exactly the reason NSC-102's VAL-003 had to be rewritten - a gate asserting that a task ADDS a path already on main becomes unsatisfiable the moment anyone else lands it. A DESIGN BRIEF THIS TASK'S CREW IS EXPECTED TO READ MUST BE ON MAIN BEFORE PREPARE, AND MERGING IT LATER DOES NOT REACH THE RUN. Materialization resolves this task at the CANDIDATE'S FROZEN COMMIT and VAL-001 runs from a clean checkout, so a brief sitting on a candidate ref is unreadable from both - and admission pins HEAD twice (admission.py:339, record[\"source_commit\"] AND the persisted scope[\"source_head\"]) as well as the contract hash (:348), so THE WINDOW CLOSES AT PREPARE, not at dispatch and not at admission. NSC-082 paid for this: its brief was merged at 71abc67d1 as the last commit before its prepare, because that was the only moment left. This is the NSC-078_DECISIONS.md failure caught one step earlier - there, nineteen citations to a document that had never been in any commit; here the document exists and is merely on the wrong side of the merge. WHOEVER DISPATCHES THIS TASK CHECKS FIRST that any brief the crew is meant to read resolves with `git cat-file -e main:<path>`, and if it does not, it is merged BEFORE prepare or the task runs without it. A BRIEF THAT LANDS IS PLACEMENT INTENT AND NEVER AUTHORITY: cite it by path AND by the sha256 of its committed LF blob (`git show <commit>:<path> | sha256sum`, the same form every contract hash gate here uses - NOT the git object id, which is a different number for the same file), and THIS CONTRACT GOVERNS WHERE THE TWO DISAGREE."
    },
    {
      "criterion_id": "AC-005",
      "reference": "Docs/Art/Environment/DUNGEON_ART_DIRECTION.md — Vincent-approved project direction, 2026-09-13",
      "requirement": "Create an original dramatic ritual or gothic focal structure plus at least two supporting clusters of recognizable benches/furniture, candles, rubble, webs, vegetation, and restrained bone details. Frame the open encounter area and D5 approach with bounded hazard accents or non-walkable background; preserve readable player, door, countdown, and candle silhouettes without copying or tracing a reference asset or layout."
    }
  ],
  "completion_gates": [
    {
      "gate_id": "VAL-001",
      "reference": "Final Room visual regression",
      "requirement": "Focused Unity EditMode tests prove deterministic prefab/catalog generation, stable sorting anchors, source-geometry compatibility, D5 approach clearance, visible bench/candle/timer compatibility metadata, bounded-hazard framing, and idempotent rebuild without opening or modifying FinalRoom.unity."
    },
    {
      "gate_id": "VAL-002",
      "reference": "Developer visual review",
      "requirement": "A gameplay-camera panel of the prefab staged against the approved blockout visibly shows the focal structure, open encounter lane, bounded-hazard frame, readable wizard, D5, candle and countdown silhouettes, and original no-copy art direction. THE EVIDENCE IS THE GAMEPLAY-DENSITY PANEL SPECIFICALLY, NOT A SCREENSHOT OR A CONTACT SHEET AT THE REVIEWER'S CHOICE. An earlier wording offered either, and the two answer different questions: a contact sheet is native 3x and exists to judge a single sprite, while whether a landmark reads AS a landmark is only answerable at gameplay density. An OR lets this gate be satisfied by the panel that cannot see the defect it is looking for. The Art Director's review renderer emits three panels - native 3x, world scale and gameplay density - for exactly that reason; this gate is judged on the third. THE ART DIRECTOR CERTIFIES THIS GATE. Decision provenance, recorded so it is not misattributed later: Documentation Agent, on Vincent's delegation, 2026-09-23 07:10Z - he asked for the call to be made rather than making it, so HIS OWN WORD ON THIS DOES NOT EXIST AND MUST NOT BE CLAIMED; if he later contradicts it, his word governs. From the gameplay-density panel the Art Director certifies that: (a) every dressing object is a prop from the committed PropCatalog, placed at its catalog pivot and pixels_per_unit, with no prop overriding either; (b) the dressing reads as the same material family as THAT ROOM'S OWN committed source sprites, judged against them and NOT against a fixed numeric band; (c) the focal structure reads as a landmark at gameplay camera distance rather than as another prop cluster; and (d) the other elements this gate names above are legible at that distance. ONLY (a) IS MECHANICALLY VERIFIABLE AND THIS CONTRACT SAYS SO RATHER THAN DRESSING JUDGEMENT AS MEASUREMENT - (b), (c) and (d) are the Art Director's judgement, which is what this gate is for. NO NUMERIC COLOUR BAND IS WRITTEN INTO THIS GATE, AND THE REASON IS A MEASUREMENT THAT WOULD HAVE BEEN WRONG HERE. The Art Director's 19-39 saturation band was measured on isolated prop sprites against transparency; this gate judges a frame that is mostly floor tileset, wall and lighting, so the distributions are not comparable and a correctly dressed room would fail a frame-level 19-39. Nor may a band be made global: Chapel of Ash is pale ash, Bone Archive is bone and Lower Vault is iron and wet, and NSC-064's five floor tilesets deliberately chain off one base flagstone so the rooms read as one dungeon while keeping their own character - one constant across five contracts fights that design. IF A MEASURABLE COLOUR CLAUSE IS EVER ADDED IT MUST CARRY A SATURATION TERM: three hue relations failed in one evening, each loose in a different way - blue>green passed a TEAL wall at 86.7, adding red>green passed MAGENTA rubble at 92.9, and a third omitted saturation entirely so a neon-mint floor at saturation 66.4 printed in band on the same day the pews failed on that very axis. A hue relation without a saturation term is not a band."
    }
  ],
