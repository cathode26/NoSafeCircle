      "gate_id": "VAL-002",
      "reference": "Developer visual review",
      "requirement": "A gameplay-camera panel of the prefab staged against the approved blockout visibly shows the focal structure, open encounter lane, bounded-hazard frame, readable wizard, D5, candle and countdown silhouettes, and original no-copy art direction. THE EVIDENCE IS THE GAMEPLAY-DENSITY PANEL SPECIFICALLY, NOT A SCREENSHOT OR A CONTACT SHEET AT THE REVIEWER'S CHOICE. An earlier wording offered either, and the two answer different questions: a contact sheet is native 3x and exists to judge a single sprite, while whether a landmark reads AS a landmark is only answerable at gameplay density. An OR lets this gate be satisfied by the panel that cannot see the defect it is looking for. The Art Director's review renderer emits three panels - native 3x, world scale and gameplay density - for exactly that reason; this gate is judged on the third. THE ART DIRECTOR CERTIFIES THIS GATE. Decision provenance, recorded so it is not misattributed later: Documentation Agent, on Vincent's delegation, 2026-09-23 07:10Z - he asked for the call to be made rather than making it, so HIS OWN WORD ON THIS DOES NOT EXIST AND MUST NOT BE CLAIMED; if he later contradicts it, his word governs. From the gameplay-density panel the Art Director certifies that: (a) every dressing object is a prop from the committed PropCatalog, placed at its catalog pivot and pixels_per_unit, with no prop overriding either; (b) the dressing reads as the same material family as THAT ROOM'S OWN committed source sprites, judged against them and NOT against a fixed numeric band; (c) the focal structure reads as a landmark at gameplay camera distance rather than as another prop cluster; and (d) the other elements this gate names above are legible at that distance. ONLY (a) IS MECHANICALLY VERIFIABLE AND THIS CONTRACT SAYS SO RATHER THAN DRESSING JUDGEMENT AS MEASUREMENT - (b), (c) and (d) are the Art Director's judgement, which is what this gate is for. NO NUMERIC COLOUR BAND IS WRITTEN INTO THIS GATE, AND THE REASON IS A MEASUREMENT THAT WOULD HAVE BEEN WRONG HERE. The Art Director's 19-39 saturation band was measured on isolated prop sprites against transparency; this gate judges a frame that is mostly floor tileset, wall and lighting, so the distributions are not comparable and a correctly dressed room would fail a frame-level 19-39. Nor may a band be made global: Chapel of Ash is pale ash, Bone Archive is bone and Lower Vault is iron and wet, and NSC-064's five floor tilesets deliberately chain off one base flagstone so the rooms read as one dungeon while keeping their own character - one constant across five contracts fights that design. IF A MEASURABLE COLOUR CLAUSE IS EVER ADDED IT MUST CARRY A SATURATION TERM: three hue relations failed in one evening, each loose in a different way - blue>green passed a TEAL wall at 86.7, adding red>green passed MAGENTA rubble at 92.9, and a third omitted saturation entirely so a neon-mint floor at saturation 66.4 printed in band on the same day the pews failed on that very axis. A hue relation without a saturation term is not a band."
    }
