  "notes": "Visual dressing may add presentation objects only; geometry, door, countdown, candle, and navigation behavior remain authoritative. Governing visual direction: Docs/Art/Environment/DUNGEON_ART_DIRECTION.md, Vincent-approved project direction dated 2026-09-13. The supplied images are inspiration only; all art and layouts must be original. RESOURCE-SHAPE REVISION, 2026-09-23: the four asset .meta paths are added to exclusive_resources and the folder-meta hazard is recorded in AC-003. Nothing else changed - no criterion or gate was added, removed or reworded beyond that clause, and the dressing design is untouched. Authored after a sweep found that all five room-dressing tasks - NSC-079, NSC-080, NSC-081, NSC-082 and NSC-083 - carried a file-only resource list, which derives an empty allowed-roots set and makes any generated sibling fatal at materialization. None of the five has ever run: there is no dressing prefab on main and none of them holds a candidate record, so this revision strands nothing. WORTH RECORDING BECAUSE IT WAS NEARLY MISSED IN THE OTHER DIRECTION: a sweep of the five room SCENES for references to the forty-five selected props returns zero, and that is the contract working rather than a gap - AC-003 forbids editing the blockout scene and VAL-001 requires proving it without opening the room's .unity file at all, because the dressing is a PREFAB. A measurement of the wrong artifact reads exactly like a missing feature. DEPENDENCY CARVE-OUT, 2026-09-23: NSC-078 removed from depends_on, replaced by a verification the task performs itself, recorded in AC-002. The room's blockout dependency is unchanged. Authorised as the second half of the option Vincent chose at 07:02Z - \"GER fixes the five that exist\" - which explicitly covered the carve-out and explicitly forbade new task IDs, so the NSC-102 and NSC-103 mechanism of a narrow publication task was not available here. Measured before acting: every prop this room needs is committed with its .