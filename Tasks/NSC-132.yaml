ON IS ABOUT COUNTS, NAMES AND SIZES AND NONE IS ABOUT WHO IS IN THE FRAME.** NSC-104 revision 2 corrects the ids and is the task that supplies the right frames; this task consumes what NSC-104 lands and generates nothing itself."
