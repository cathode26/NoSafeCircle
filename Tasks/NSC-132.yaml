  "notes": "AUTHORED 2026-09-27 on Vincent's request, routed by the Art Director Agent, whose brief is at C:/nscrev/reports/handoffs/ART-20260927-lantern-wraith-out-of-mana-melee.md. EVERY CITATION IN THAT BRIEF WAS VERIFIED AT SOURCE BEFORE THIS CONTRACT WAS WRITTEN and all of them held. TWO THINGS THE BRIEF DID NOT CARRY AND THIS CONTRACT DOES. FIRST, the literal 16 is pinned in TWO places in NSC-077 - AC-004 and VAL-002 - and asserted TWICE in EnemyArtIntegrationTests.cs at :142 and :143, so a fix touching only the test would leave the contract demanding 16; NSC-077 revision 15 replaced both with the relation. SECOND, NSC-077 AC-008 said 'Do not change pursuit, keep-distance movement, NavMeshAgent settings, the wraith's cast timing, range, sight test, mana', which if read as a standing freeze would make whoever implements NSC-077 after this task revert this feature; revision 15 marks it a scope fence on that task's own work. THE ART IS NOT BLOCKED ON THIS CONTRACT: the Art Director began generating eight facings, six frames, twelve frames per second, non-looping, matching the walk convention, before this was written, on the correct reasoning that the attack set is needed under every version of the feature. THE DESIGN CALL THAT WAS GENUINELY OPEN was whether a drained wraith may move, since EnemyLanternWispCaster calls itself stationary and says it needs no NavMesh and no pursuit components. Ruled YES, because Vincent's own words require reaching him and because NSC-077 AC-006 already has a drained wraith turning to watch the wizard from inside cast range - so without movement the feature is a wraith that stares and does nothing, which is what he described wanting fixed.",
