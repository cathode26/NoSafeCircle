  "notes": "Vincent, 2026-09-16 (density decision B): \"The wizard should be 128x128\". Vincent, NSC-077 playtest, 2026-09-17: \"the wizards dont look nearly as good sadly\"; \"Whatever you have done to make the enemy look great and in perspective, the wizards need that treatment.\" This task does not change art: it switches DoorPrototypeGlobalSceneBuilder's wizard import to NSC-095's approved 128 px source and its ground-line pivot, and leaves the classifier, movement, collision, lobby flow and gameplay untouched. Wizard source .png.meta values are NOT load-bearing, and this is worth stating because it has now been re-found once. ImportWizardSprite (Assets/NoSafeCircle/DoorPrototype/Editor/World/DoorPrototypeGlobalSceneBuilder.cs:581-603) calls AssetDatabase.ImportAsset with ForceUpdate and then sets every relevant field itself - textureType Sprite, textureShape Texture2D, spriteImportMode Single, filterMode Point, textureCompression Uncompressed, mipmapEnabled false, spritePixelsPerUnit, spriteAlignment Custom and spritePivot (0.5, 0) - clears the point-light cookie defaults a GUID-only .meta imports with, calls SaveAndReimport, and throws if the result is not a Sprite. Measured 2026-09-22 at main: the 224 metas under Art/Wizard/Source/PixelLab128 sit at Unity defaults (textureType 0, spriteMode 0, spritePixelsToUnits 100, filterMode Bilinear), while the 224 under the older Art/Wizard/Source/PixelLab read textureType 8, spriteMode 1, spritePixelsToUnits 180 and filterMode Point - which is exactly what ImportWizardSprite writes. The older set's values are the residue of having been through the builder, not hand-authored settings, and the 128 px set simply has not been through it yet. So the defaults here are expected and are NOT the defect class found on the NSC-097 door sprites, where AssetDatabase.LoadAssetAtPath<Sprite> reads committed metas with nothing to rewrite them and returns null. The one value that would otherwise be wrong for a 128 px source is the hard-coded spritePixelsPerUnit of 180, and AC-002 of this task already changes it to 64. PLAYMODE ORDER-DEPENDENCE CLOSED PROSPECTIVELY, 2026-09-23. The Pipeline Runner measured and reproduced an order-dependence in the PlayMode suite: one fixture running before another makes three of the latter's tests fail, reproduced down to an eleven-test run. ITS CONSEQUENCE IS AIMED AT THE EVIDENCE SYSTEM RATHER THAN AT ANY ONE TEST - a scoped green can pass precisely because the filter excluded the polluter, which is the check-that-answers-from-a-copy shape applied to delivery records. MEASURED ON THE CONTRACT AXIS, WHICH IS THE HALF NOBODY HAD DONE: sixteen filter-gates across thirteen contracts; ONLY NSC-047's VAL-003 required a broader-suite run, and only of the Edit Mode suite; five gates touch PlayMode and four of those had no broader-suite clause. ALL FOUR WERE UNDELIVERED WITH NO SELECTED RECORD, SO NO EXISTING DELIVERY RECORD WAS EXPOSED THROUGH A CONTRACT GATE AND THE RISK WAS PROSPECTIVE - which is exactly when closing it costs nothing to re-verify. THE FIRST SWEEP OF THIS WAS MY OWN AND IT WAS WRONG: it tested for the phrase \"complete suite\" and NSC-047 says \"complete Edit Mode suite\", so it reported zero broader-suite clauses where there was one. Caught by opening the gate text rather than trusting the pattern, which is the only reason the NSC-047 conclusion below is not also wrong. NSC-047 IS NOT EDITED: its gate evidence is an Edit Mode fixture and the measured pollution is PlayMode-to-PlayMode, so it is insulated twice, and VAL-003 is a completion gate - editing it would un-deliver the only conformant room for a clause it does not need. THE ADDED CLAUSE COSTS ONE FULL PLAYMODE RUN PER DELIVERY on these four tasks; Unity time is the scarce resource in this fleet and that cost lands on the Game Agent, which has been told rather than left to discover it. ORDER-DEPENDENCE REPAIRED AT SOURCE WITHIN THE HOUR; THE OBLIGATION KEPT AND ITS PREMISE CORRECTED, 2026-09-23. The Game Agent fixed the leak at 1989950fa - verified here as an ancestor of main, with the cleanup scene present in the offending fixture - taking the full unfiltered PlayMode suite from eight failures to one, and bisected rather than reasoned: 258 to 14 to 11 tests all reproduced the same three failures, and excluding only the three scene-loading tests took that group to 8/8. IT ASKED WHETHER THE DOUBLING I ADDED AN HOUR EARLIER WAS NOW UNNECESSARY AND LEFT THE CALL WITH ME, WHILE ARGUING AGAINST ITS OWN FIX by naming the two unowned test files that no gate can catch. THE CLAUSE I WROTE ASSERTED A DURABLE PROPERTY AND JUSTIFIED IT WITH A DATED FACT, AND THE FACT WENT STALE IN ABOUT AN HOUR - which is my own recorded rule that a gate encoding a fact goes stale silently, firing on my own text. So the factual sentence is now stated as history with the repair named, and the requirement stands on three grounds that do not depend on the fixed defect: filtering can always hide a polluter; the scene-restore house pattern is followed by seven of eight fixtures and enforced on none, so a ninth can reintroduce it; and two of the test files involved are owned by no contract at all. THE COST IS UNCHANGED at one full PlayMode run per delivery on this task, and it is now a run that passes rather than one that would have failed. CLAUSE MADE STATE-INDEPENDENT, 2026-09-23 - THIRD REVISION OF IT IN ONE SESSION AND DELIBERATELY THE LAST. It bound itself to a world-state twice: revision one asserted the PlayMode suite \"has been measured order-dependent\", which was false within the hour once the Game Agent repaired it; revision two asserted the scene-restore pattern was \"ENFORCED ON NONE\", which the same agent was in the act of falsifying by writing a convention guard. THE REMEDY FOR A CLAUSE THAT KEEPS GOING STALE IS NOT A THIRD CORRECTION OF THE SAME KIND, IT IS TO STOP ASSERTING STATES. Both remaining present-tense world-facts are now a DATED OBSERVATION plus a DURABLE CONDITIONAL, so the requirement holds whatever the enforcement and ownership states turn out to be, and a future change to either no longer requires editing this gate. THE GAME AGENT DID NOT ASK FOR THIS and said explicitly it was not arguing the hedge away; it supplied the material for the new second ground by naming what its own guard cannot reach - a fixture polluting by other means, a helper loading a scene on a fixture's behalf, and files no contract owns - and it broke its guard on purpose against the pre-fix commit before trusting it, asserting a minimum population inside the guard because its first probe reported zero single-loaders from a broken subprocess call rather than a clean codebase. That is the haystack check this file's own rules ask for, carried inside the guard instead of remembered.",
