  "completion_gates": [
    {
      "gate_id": "VAL-001",
      "reference": "GER Agent decision X7",
      "requirement": "NoSafeCircle.DoorPrototype.Tests.Editor.WizardArtIntegrationTests asserts 64 pixels per unit, the PixelLab128 source root, a 128x128 source size, and the AC-003 ground-line pivot for every imported wizard sprite. NoSafeCircle.DoorPrototype.Tests.Editor.WizardPixelLab128SourceAuditTests still passes, showing the import left the PNG bytes unchanged. NoSafeCircle.DoorPrototype.Tests.WizardAnimationPlayModeTests passes with NSC-075's Visual box assertions. The rebuilt Assets/Scenes/DoorPrototype.unity is proven by saved-scene tests, not byte identity. A FILTERED GREEN IS NOT EVIDENCE OF ORDER-INDEPENDENCE, AND THIS GATE IS NOT SATISFIED BY ONE. THE PLAYMODE SUITE WAS MEASURED ORDER-DEPENDENT ON 2026-09-23 AND WAS REPAIRED AT SOURCE THE SAME DAY, at 1989950fa: one fixture loaded the composed scene with LoadSceneMode.Single in three of its tests and never restored an empty one, so every fixture after it ran inside the five-room floor, and the full unfiltered PlayMode suite went from eight failures to one - the survivor being main's separately documented NSC-101 redness. THAT SPECIFIC DEFECT IS GONE AND THIS REQUIREMENT STAYS, FOR THREE REASONS THAT DO NOT DEPEND ON IT. FIRST, A SCOPED RUN CAN PASS PRECISELY BECAUSE THE FILTER EXCLUDED A POLLUTER - that is a property of filtering itself, true before this defect existed and true after its repair, and it is what this gate guards against. SECOND, THE SCENE-RESTORE PATTERN IS A CONVENTION, AND ANY ENFORCEMENT OF A CONVENTION COVERS THE SHAPE IT WAS WRITTEN FOR RATHER THAN THE GENERAL CASE. Observed 2026-09-23: eight fixtures loaded that scene the same way and seven restored an empty one, and a source-level guard for that exact shape was being added, whose own author named what it cannot reach - a fixture that pollutes by some other means, a helper that loads a scene on a fixture's behalf, and test files no contract owns. SO A GREEN CONVENTION GUARD DOES NOT DISCHARGE THIS REQUIREMENT, WHETHER ONE EXISTS TODAY OR NOT: it narrows the ways a filtered run can mislead; it does not turn a filtered run into evidence of order-independence. THIRD, A PLAYMODE FIXTURE MAY HAVE NO OWNING CONTRACT AT ALL, AND FOR ANY SUCH FIXTURE NO TASK'S GATES CAN EVER CATCH A REGRESSION IN IT, SO AN UNFILTERED RUN IS THE ONLY CHECK THERE IS. Observed 2026-09-23, measured against every contract's exclusive_resources rather than by a flat grep: 29 of 62 test files were claimed by no contract, including DoorPassabilityConnectionPlayModeTests.cs and DoorInteractionFeedbackPlayModeTests.cs, both involved in the defect above - and note the split, since a source file and its test file are owned separately. THIS DOES NOT DEPEND ON WHICH FILES ARE UNOWNED ON ANY GIVEN DAY: whenever that set is non-empty, this requirement is doing work nothing else does, and if it is ever empty the requirement costs one run and proves the same property anyway. The run is real, it passes, and it is not asking the question this record would claim. THEREFORE THE SAME PLAYMODE FIXTURES NAMED ABOVE MUST ALSO PASS IN A RUN THAT INCLUDES THE FULL PLAYMODE SUITE, and the evidence must record BOTH runs with their totals and exit codes, stating explicitly which was filtered and which was not. IF THE TWO DISAGREE, THE UNFILTERED RESULT GOVERNS and this gate fails, however green the filtered run was. THIS DELIBERATELY DOES NOT NAME THE POLLUTING FIXTURE: a gate that named it would encode a fact and go stale the moment the suite is repaired, whereas the property asserted here - that these fixtures pass alongside the rest of the PlayMode suite - stays true and stays checkable either way. It is the same broader-suite compatibility evidence NSC-047's VAL-003 already requires of the Edit Mode suite, extended to PlayMode; this is that contract's existing convention rather than a new one."
    },
