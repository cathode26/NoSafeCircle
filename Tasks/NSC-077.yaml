      "requirement": "Put the approved enemy art on the enemies that DoorPrototypeGlobalSceneBuilder.BuildChaseEnemies already builds into Assets/Scenes/DoorPrototype.unity, in place of their generated placeholder silhouettes. Every MeleeEnemy (NavMeshAgent, EnemyTargetKnowledge, EnemyPursuitMovement, EnemyHealth) uses the Melee Enemy (Dungeon Brute) art. Every ranged enemy, today a FireCasterEnemy with EnemyFireballCaster and EnemyHealth, becomes a Lantern Wraith (AC-007) and uses the Ranged Enemy (Lantern Wraith) art. Keep the Enemies root, spawn positions, counts, components and all gameplay tuning. Do not add prefabs, review-only enemies or room placements; the stationary review prefabs and review placement of contract revision 2 are dropped."
    },
    {
      "criterion_id": "AC-002",
      "reference": "NSC-063 idle stills in Art/Enemies/Source; NSC-093 walk frames and Art/Enemies/Source/Walk/inventory.json; NSC-075 import fixes 0d28b0bf5 and bf97d116c",
      "requirement": "EnemyAnimationAssetBuilder imports in place, without copying, exactly the 16 idle stills enemy_<melee|ranged>_<n|ne|e|se|s|sw|w|nw>_idle_00.png (128x128) and the 96 walk frames enemy_<melee|ranged>_<direction code>_walk_<00..05>.png (176x176). Direction codes map explicitly: n is north, ne north-east, e east, se south-east, s south, sw south-west, w west and nw north-west; never infer a direction from file order. For every source the builder sets the TextureImporter explicitly, as ImportWizardSprite does: Sprite texture type, Single sprite mode, Texture2D texture shape, point-light cookie defaults reset, uncompressed, and AC-003's pixels-per-unit, Point filter and no mipmaps. The pivot is centered horizontally and sits on the image's ground line: for walk frames the inventory's alpha_bottom_y_from_top (132 of 176, pivot y 0.25), and for each idle still the bottom edge of its lowest row that contains an opaque pixel, the same rule NSC-093 used to align the walk frames. Some Lantern Wraith stills have a lantern-staff tip 2 to 4 pixels below the feet; if Vincent sees a facing float or its feet jump between idle and walk, the builder may apply a whole-pixel pivot correction per enemy type and direction from one table in EnemyAnimationAssetBuilder, and the audit tests read the same table. A missing, duplicated, extra or wrongly sized source stops the build with an error that names the file. Under Art/Enemies/Source only .png.meta import settings may change; GUIDs, PNGs, inventory.json and documents stay unchanged. Do not bind exact PNG hashes."
    },
    {
      "criterion_id": "AC-003",
      "reference": "Vincent's pixel-density decision B, 2026-09-16 (art-director guide section 11 item 1 and the section 12 Pixel density row): characters are a 128x128 canvas at about 64 pixels per world unit in a camera-facing 2x2-unit box",
      "requirement": "All 112 enemy sprites import at one named pixels-per-unit constant of 64, with Point filter and no mipmaps, so a 128x128 idle still is 2x2 world units and a 176x176 walk frame is 2.75x2.75 world units with the same character pixel size; an enemy does not change size between idle and walk. Each enemy Visual is created through DoorPrototypeSceneBuilder.CreateWorldSpriteVisual with world size (1, 1), so its scale is uniform, and keeps the ground-contact position and NSC-039 sorting. The Visual's world rotation always equals the fixed isometric camera rotation, Euler (30, -45, 0) (DoorPrototypeGlobalSceneBuilder.IsometricCameraEulerAngles), whatever rotation the NavMeshAgent gives the enemy root: EnemyAnimationController restores it every frame after movement, so the sprite never leans, thins or turns edge-on. Changing NavMeshAgent settings to achieve this is not allowed. If Vincent asks for a different enemy size during VAL-008, change only the pixels-per-unit constant."
