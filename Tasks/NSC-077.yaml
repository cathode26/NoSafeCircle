7-stationary-enemies-20260914 may be read for its source-inventory check only; do not merge or copy its prefabs, review placement, copied PNGs or scene, and never delete it. Lessons: GUID-only stub .meta files import as Cube with point-light cookie defaults in Unity 6000.1 (NSC-075 fixes 0d28b0bf5 and bf97d116c), so set the texture shape and reset the cookie defaults explicitly; DoorPrototype.unity is binary, so rebuild it with the builder and never merge scene files; NSC-075 shipped with its screen-up axis inverted and its tests encoded the same mistake until Vincent saw it in Unity, which is why AC-005 spells out the mapping and VAL-008 requires his in-game check; Unity test filters are separated by semicolons. No .asmdef, ProjectSettings, DoorPrototypeSceneBuilder.cs or WizardAnimationController.cs change is authorized; stop and report if one is needed.",
