ets, so this contract records that decision as the ownership basis. Revision 5 carries the 2026-09-15 GER room decisions into this contract. INT-001 now states the settled 2-unit-per-side D1 wall jog against Bone Archive X [-12,+12] in place of the stale four-unit figure measured against Bone Archive's old X [-10,+10] bounds, and records decision 1's shared-boundary wall rule in place of the prior unresolved-choice wording. INT-002 now records that NSC-079 must keep D1 landmark dressing clear of the full 4.0-unit door-frame interval X [-2,+2] at Z 0 under decision 2, not only the 3.0-unit collider opening, without changing the recorded D1LandmarkWestDressingBounds or D1LandmarkEastDressingBounds envelopes. Separately, inspecting Assets/NoSafeCircle/DoorPrototype/Editor/Rooms/RuinedEntrySceneBuilder.cs confirms the Visuals Grid named IsometricZAsY never sets Grid.cellLayout and so saves with the default Rectangle value; this is by design, not a defect, because the Grid's own transform is identity and every wall Tilemap cell maps linearly to world X or Z with no isometric skew, with the isometric look coming from the fixed gameplay camera rather than from Unity's isometric cell layouts, and NSC-045, NSC-046, and NSC-048 already document and replicate this same Rectangle convention as the committed cross-room pattern. This revision changes no acceptance criterion or completion gate and requires no code change.",
