  "notes": "Exact durability totals, enemy door-hit timing and damage, crack thresholds, shake duration and magnitude, indicator styling, and audio mix are not fixed by the GDD. Tests use normalized remaining durability rather than canonizing the snapshot's 100-durability or 25-damage examples. The selected within-current-GDD visibility rule hides the indicator while sealed or open and shows it no later than the first accepted locked-door hit; an always-visible bar would require Vincent to reverse that choice. The assertable NSC-052 broken state uses the existing door-local cracks, indicator, and AudioSource and deliberately does not change the door SpriteRenderer; whether the door sprite itself should look open or broken and which task owns that appearance remains a Vincent decision. No off-screen marker or HUD cue is authorized. NSC-017 owns qualifying enemy locked-door attacks; NSC-049 owns D1-D5 composition; NSC-044 through NSC-048 and NSC-079 through NSC-084 own room geometry and dressing. DoorBreachFeedback.generatedBangClip is an intentional session-lifetime HideFlags.DontSave runtime object; tests must not depend on whether the shared clip already exists and must not create or expect a saved AudioClip asset. Vincent's controlled visual/audio review and the later real-enemy integration review remain required after automated tests pass.",
