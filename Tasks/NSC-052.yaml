      "requirement": "DoorBreachFeedback reads DoorInteractable.CurrentDurability and DoorInteractable.MaxDurability without writing either value. Across repeated accepted damage, the Image fill never increases as the remaining-durability ratio decreases, and active crack stages never regress. When DoorInteractable.Broken fires at zero durability, all crack GameObjects are active, the exhausted durability-indicator GameObject is inactive, and the final accepted hit's bang is allowed to play, producing an assertable door-local result distinct from a still-locked damaged door. Breach feedback never deactivates DoorVisual, disables the doorwayBlocker Collider, changes passability, or changes the DoorInteractable locked-to-broken transition. Exact crack thresholds, colors, shake values, and audio treatment remain implementation tuning."
