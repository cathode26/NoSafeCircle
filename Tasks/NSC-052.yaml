      "requirement": "In Assets/NoSafeCircle/DoorPrototype/Scripts/DoorBreachFeedback.cs, DoorBreachFeedback uses DoorInteractable.DamageTaken emitted by the public DoorInteractable.TakeDamage(float) method in Assets/NoSafeCircle/DoorPrototype/Scripts/DoorInteractable.cs. Every accepted positive hit while the door is locked plays the wired door-local AudioSource and updates the crack GameObjects and the world-space Image durability indicator; every accepted hit that leaves CurrentDurability above zero also shakes the presentation-only shake target, while the break result on DoorInteractable.Broken may cancel shake. The indicator GameObject is inactive while the door is sealed or open and becomes visible no later than the first accepted hit while locked; showing it immediately on DoorInteractable.Locked or on the first accepted hit remains implementation tuning. Calls rejected while sealed, open, already broken, or given non-positive damage produce no bang, shake, crack, indicator, or durability change. The shake target is the existing DoorRoot/DoorVisual/DoorSprite GameObject, which keeps that hierarchy path and its SpriteRenderer; the crack GameObjects are descendants of that shake target; and neither the shake target nor any descendant has a Collider."
