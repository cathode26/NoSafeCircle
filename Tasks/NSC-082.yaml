EAD: `Docs/Art/Environment/NSC-082_LOWER_VAULT_DRESSING.md`, sha256 `999c1ccaa39bda804e5d97af4db8ff9e165dcbcc5ab9a1e0f1aeb7e1013e9e0c`. An earlier revision of this contract deliberately refused to cite it while it sat on an unmerged candidate ref, because a ref is unreadable from the clean checkout where VAL-001 runs - the NSC-078_DECISIONS.md shape, nineteen-plus citations to a document never in any commit. That condition is now met and the refusal is withdrawn. IT IS PLACEMENT INTENT AND IT IS NOT AUTHORITY: where the brief and this contract disagree, THIS CONTRACT GOVERNS, and the brief's placement claims were not measured against the committed geometry by anyone - the agent who merged it said so explicitly and ran no Unity and no tests. CITE IT BY THE SHA256 ABOVE AND NOT BY A GIT OBJECT ID. An earlier wording here said 'by path AND blob hash' without saying which; the same file has two different numbers - a git object id `76cfaad13b5b8166a08d6f80b21e3b5e316d0894` and the sha256 of its committed LF blob, above. Every contract hash gate in this repository consumes the sha256 form (`git show <commit>:<path> | sha256sum`). Quoting the git object id as a contract hash is a broken citation of precisely the kind the paragraph above warns against. AND IF THIS TASK IS EVER RE-PREPARED AGAINST A BRIEF THAT IS NOT YET ON MAIN, THE WINDOW CLOSES AT `prepare`: materialization resolves this task at the candidate's frozen commit and admission pins both HEAD and the contract hash, so merging a brief afterwards reaches that run not at all. LV-N1 IS THE MOST EXPENSIVE PLACEMENT IN THE ROOM TO GET WRONG: it exists to prevent a second south-to-north path, so its dressing must read as unbroken collapsed structure - any visual gap there is an implied doorway and a player will walk at it. An earlier wording made the test \"a reviewer who looks at the shot and believes they could walk across something they cannot\" - that sentence is kept as the EXPLANATION of why the rule exists, and