  "notes": "Visual dressing may add presentation objects only; geometry and navigation remain authoritative. Governing visual direction: Docs/Art/Environment/DUNGEON_ART_DIRECTION.md, Vincent-approved project direction dated 2026-09-13. The supplied images are inspiration only; all art and layouts must be original. Revision 3 replaces AC-005's stale 'readable alternate route to D4' with 'readable alternate approach around LV-C1', and carries the same fix into VAL-001, VAL-002, and visual_direction_addendum, because the committed Lower Vault (Tasks/NSC-047.yaml revision 4, 2026-09-15) offers exactly one primary crossing to D4 at X [+7,+12] (NSC-047 AC-002) reached by two convergent lanes around LV-C1, per R-08 (NSC-047 GER re-audit) and NSC-047 INT-002, which already uses this wording for NSC-082. Revision 4, 2026-09-18: reconciled with the Lower Vault canon line committed at b7e46c320. Revision 3's AC-005 required dressing that \"visibly shapes the route into safe islands and a primary crossing\" and that \"Include a raised route\", and VAL-002 required a screenshot proving those were visible - so the contract mandated art promising three things NSC-047 revision 4 does not commit, and its own gate would have certified them. AC-005 also permitted chasm dressing, which canon reserves as FutureExpansion vocabulary; that is now excluded along with lava. Both criteria are written forward-compatibly: when a task commits a crossing or raised route with collision, the art may depict it as a fact and neither needs revising again. Vincent has asked for a real walkable ledge (\"it would be great if you could get on the ledge!\"), which is a geometry task and not this one - this revision keeps the dressing honest until that lands rather than pre-empting it. RESOURCE-SHAPE REVISION, 2026-09-23: the four asset .meta paths are added to exclusive_resources and the folder-meta hazard is recorded in AC-003. Nothing else changed - no criterion or gate was added, removed or reworded beyond that clause, and the dressing design is untouched. Authored after a sweep found that all five room-dressing tasks - NSC-079, NSC-080, NSC-081, NSC-082 and NSC-083 - carried a file-only resource list, which derives an empty allowed-roots set and makes any generated sibling fatal at materialization. None of the five has ever run: there is no dressing prefab on main and none of them holds a candidate record, so this revision strands nothing. WORTH RECORDING BECAUSE IT WAS NEARLY MISSED IN THE OTHER DIRECTION: a sweep of the five room SCENES for references to the forty-five selected props returns zero, and that is the contract working rather than a gap - AC-003 forbids editing the blockout scene and VAL-001 requires proving it without opening the room's .unity file at all, because the dressing is a PREFAB. A measurement of the wrong artifact reads exactly like a missing feature. DEPENDENCY CARVE-OUT, 2026-09-23: NSC-078 removed from depends_on, replaced by a verification the task performs itself, recorded in AC-002. The room's blockout dependency is unchanged. Authorised as the second half of the option Vincent chose at 07:02Z - \"GER fixes the five that exist\" - which explicitly covered the carve-out and explicitly forbade new task IDs, so the NSC-102 and NSC-103 mechanism of a narrow publication task was not available here. Measured before acting: every prop this room needs is committed with its .png and .png.meta, and the task holds no candidate record, so nothing is stranded. THE SHAPE WORTH KEEPING: the dependency was a PROXY for \"the props exist\", and it had stopped tracking the thing it stood for - the files landed while the task that owns them stayed un-reviewable behind gates about generating more art. Replacing a proxy with the check it was standing in for is the same move as making a gate read the imported sprite instead of the .meta. FOLDER-META CLAIM, 2026-09-23: this task now owns the three folder .meta files that the first room-dressing task to run must create - Art/Environment/RoomDressing.meta, Editor/Environment.meta and Tests/Editor/Environment.meta. Measured before claiming: all three are absent from main while their three parents exist as trees with their own metas, so this is the complete set and there is no fourth. Landed AHEAD of dispatch rather than as the last step before it, because nothing about the claim depends on NSC-047's delivery evidence and holding it back would have left two items on the critical path where one will do. NSC-082's only remaining blocker is that evidence, which is the Game Agent's work. VAL-002 CERTIFICATION, 2026-09-23: the visual approval on this gate is the Art Director's. Decision provenance is Documentation Agent on Vincent's delegation, 2026-09-23 07:10Z; his own word does not exist and is not claimed. Wording is the Art Director's own, since they hold the gate. TWO THINGS THEY REFUSED THAT I HAD OFFERED, both recorded because the refusals are the valuable part: their 19-39 saturation band, because it was measured on isolated prop sprites against transparency while this gate judges a gameplay frame of mostly floor, wall and lighting - a correctly dressed room would fail it; and any global band at all, because the five rooms have deliberately different palettes chained off one base flagstone under NSC-064. A true measurement promoted to a case nobody measured, baked into five contracts, would have failed later as an inexplicable red. The screenshot-or-contact-sheet choice is also gone: the two answer different questions and an OR lets the gate be satisfied by the panel that cannot see the defect. VAL-002 MECHANICAL TESTS, 2026-09-23: two pass/fail tests added to the legibility half - no rail with hazard on both sides, no ledge chunk surrounded by hazard. Offered by the Art Director, who explicitly did not ask for a criterion and said only that the tests exist; taken because the half they belong to had a principle and no mechanism, and these catch the bridge and stepping-stone readings without judgement. Scoped to this task alone, verified: the three props carry intended_rooms LowerVault and nothing else. THE ART DIRECTOR'S DESIGN BRIEF IS DELIBERATELY NOT CITED HERE - it sits on candidate/art-director/lower-vault-dressing-design and is NOT on main, and citing work that exists only on an unmerged candidate is the NSC-078_DECISIONS.md shape, named by its own author: nineteen citations, never in any commit, unreadable from the clean checkout where validation runs. When it lands it may be referenced as the Art Director's placement intent and never as authority, by path AND blob hash, because the contract governs where the two disagree. REVISION 10, 2026-09-23: the Art Director's placement brief landed on main at 71abc67d1 and VAL-002 may now cite it - by path and by the sha256 of its committed LF blob, as placement intent and never as authority, with this contract governing any disagreement. Rev 9 refused to cite it while it sat on a candidate ref and that refusal was right; the condition is met, so it is withdrawn rather than left standing. ALSO FIXED HERE, AND IT WAS MY AMBIGUITY: rev 9 said a brief may be cited 'by path AND blob hash' without saying which of the two different numbers the same file carries. The sha256 of the committed LF blob is what every contract hash gate here consumes; the git object id must never appear as a contract hash. NOTHING HERE ADDRESSES THE BUILDER GAP that currently prevents this task dispatching - no pipeline builder produces a prefab for a task with no room scene in scope, and that is a pipeline defect rather than a contract one. The prefab shape is correct and is what keeps the blockout scene untouched, which is what NSC-047 paid for; changing this contract to fit a builder registry keyed by scene path would be the expensive direction, and the agent that found the gap asked that it not be done. FLOOR/WALL SCOPE, 2026-09-23: this contract now states that floor and wall tileset application is out of scope and unowned. Reported by the Art Director (C:/nscrev/reports/handoffs/ART-20260923-floor-wall-art-unowned.md) and verified here rather than taken: NSC-064 AC-005 explicitly excludes application, a describe-the-work sweep across all 103 contracts finds no task that applies the art, and the only tileset references in these five contracts are inside VAL-002's colour-band prose, which ASSUMES a frame mostly made of floor tileset and wall - an assumption that is false today. The dressing tasks cannot absorb it: they output a prefab of catalogued props, AC-002's selected_sha256 check cannot be satisfied by an uncatalogued PNG, and AC-003 forbids editing the blockout scene while applying tilesets means the scene or its builder. AN APPLICATION TASK IS NEEDED AND IS NOT AUTHORED HERE, because its feasibility is unmeasured - whether the six wall modules tile correctly against the existing builders has never been tested, and the art has never been seen in place. Authoring a contract against unknown feasibility is how ungateable criteria get written. DIRECTORY PREMISE CORRECTED, 2026-09-23: AC-003 asserted that the three output directories do not exist on main. The Game Agent has since committed a .gitkeep into each, so all three are tracked trees and the assertion is false; the three folder .meta files are still absent, so the claim on them and the conclusion of the criterion are unchanged. Reported by the Art Director, which found it when Unity generated all three metas during an import run. WORTH RECORDING BECAUSE I HAD ALREADY RE-CHECKED THIS CRITERION AND PASSED IT: when the .gitkeep landed I verified the folder-meta premise and recorded that no contract change was needed, never reading the second factual claim sitting in the same paragraph. Two assertions, one checked. FOLDER METAS LANDED, AND A SENTENCE I MANGLED, 2026-09-23 09:1xZ: the Game Agent committed all three folder metas at 9ff000e7d, forty minutes after I revised AC-003 to say they were STILL ABSENT. That is the third rotation of this one paragraph in a day, so it is now written as what must hold with the measurement dated beside it, rather than as a standing claim about what exists. FOR NSC-082 THE STALE FACT WAS ALSO A DISPATCH BLOCKER: its AC-003 said the three metas were the complete set the task creates and told it to commit them, which would have made the criterion unsatisfiable by the very rule it cites two sentences later - a gate asserting a task ADDS a path already on main, the NSC-102 VAL-003 shape. SEPARATELY AND WORSE, MY OWN 09:0xZ EDIT LEFT A GRAMMATICAL ORPHAN IN ALL FIVE CONTRACTS. The anchor I replaced captured the clause \"THE THREE OUTPUT DIRECTORIES DO NOT EXIST ON MAIN\" out of the sentence \"...ON MAIN AND ARE DELIBERATELY NOT CLAIMED HERE\", so five contracts shipped \"...measured false AND ARE DELIBERATELY NOT CLAIMED HERE\" and lost the statement that the directories are unclaimed. Every guard passed, because every guard tested a string for presence or absence and none could see that the resulting sentence does not parse. A replacement anchor must span a whole sentence, or the guard must read the sentence back.",
