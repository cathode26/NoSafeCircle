  "notes": "Visual dressing may add presentation objects only; geometry and navigation remain authoritative. Governing visual direction: Docs/Art/Environment/DUNGEON_ART_DIRECTION.md, Vincent-approved project direction dated 2026-09-13. The supplied images are inspiration only; all art and layouts must be original. Revision 3 replaces AC-005's stale 'readable alternate route to D4' with 'readable alternate approach around LV-C1', and carries the same fix into VAL-001, VAL-002, and visual_direction_addendum, because the committed Lower Vault (Tasks/NSC-047.yaml revision 4, 2026-09-15) offers exactly one primary crossing to D4 at X [+7,+12] (NSC-047 AC-002) reached by two convergent lanes around LV-C1, per R-08 (NSC-047 GER re-audit) and NSC-047 INT-002, which already uses this wording for NSC-082. Revision 4, 2026-09-18: reconciled with the Lower Vault canon line committed at b7e46c320. Revision 3's AC-005 required dressing that \"visibly shapes the route into safe islands and a primary crossing\" and that \"Include a raised route\", and VAL-002 required a screenshot proving those were visible - so the contract mandated art promising three things NSC-047 revision 4 does not commit, and its own gate would have certified them. AC-005 also permitted chasm dressing, which canon reserves as FutureExpansion vocabulary; that is now excluded along with lava. Both criteria are written forward-compatibly: when a task commits a crossing or raised route with collision, the art may depict it as a fact and neither needs revising again. Vincent has asked for a real walkable ledge (\"it would be great if you could get on the ledge!\"), which is a geometry task and not this one - this revision keeps the dressing honest until that lands rather than pre-empting it.",
