  "notes": "Visual dressing may add presentation objects only; geometry and navigation remain authoritative. Governing visual direction: Docs/Art/Environment/DUNGEON_ART_DIRECTION.md, Vincent-approved project direction dated 2026-09-13. The supplied images are inspiration only; all art and layouts must be original. Revision 3 replaces AC-005's stale 'readable alternate route to D4' with 'readable alternate approach around LV-C1', and carries the same fix into VAL-001, VAL-002, and visual_direction_addendum, because the committed Lower Vault (Tasks/NSC-047.yaml revision 4, 2026-09-15) offers exactly one primary crossing to D4 at X [+7,+12] (NSC-047 AC-002) reached by two convergent lanes around LV-C1, per R-08 (NSC-047 GER re-audit) and NSC-047 INT-002, which already uses this wording for NSC-082. Revision 4, 2026-09-18: reconciled with the Lower Vault canon line committed at b7e46c320. Revision 3's AC-005 required dressing that \"visibly shapes the route into safe islands and a primary crossing\" and that \"Include a raised route\", and VAL-002 required a screenshot proving those were visible - so the contract mandated art promising three things NSC-047 revision 4 does not commit, and its own gate would have certified them. AC-005 also permitted chasm dressing, which canon reserves as FutureExpansion vocabulary; that is now excluded along with lava. Both criteria are written forward-compatibly: when a task commits a crossing or raised route with collision, the art may depict it as a fact and neither needs revising again. Vincent has asked for a real walkable ledge (\"it would be great if you could get on the ledge!\"), which is a geometry task and not this one - this revision keeps the dressing honest until that lands rather than pre-empting it. RESOURCE-SHAPE REVISION, 2026-09-23: the four asset .meta paths are added to exclusive_resources and the folder-meta hazard is recorded in AC-003. Nothing else changed - no criterion or gate was added, removed or reworded beyond that clause, and the dressing design is untouched. Authored after a sweep found that all five room-dressing tasks - NSC-079, NSC-080, NSC-081, NSC-082 and NSC-083 - carried a file-only resource list, which derives an empty allowed-roots set and makes any generated sibling fatal at materialization. None of the five has ever run: there is no dressing prefab on main and none of them holds a candidate record, so this revision strands nothing. WORTH RECORDING BECAUSE IT WAS NEARLY MISSED IN THE OTHER DIRECTION: a sweep of the five room SCENES for references to the forty-five selected props returns zero, and that is the contract working rather than a gap - AC-003 forbids editing the blockout scene and VAL-001 requires proving it without opening the room's .unity file at all, because the dressing is a PREFAB. A measurement of the wrong artifact reads exactly like a missing feature. DEPENDENCY CARVE-OUT, 2026-09-23: NSC-078 removed from depends_on, replaced by a verification the task performs itself, recorded in AC-002. The room's blockout dependency is unchanged. Authorised as the second half of the option Vincent chose at 07:02Z - \"GER fixes the five that exist\" - which explicitly covered the carve-out and explicitly forbade new task IDs, so the NSC-102 and NSC-103 mechanism of a narrow publication task was not available here. Measured before acting: every prop this room needs is committed with its .png and .png.meta, and the task holds no candidate record, so nothing is stranded. THE SHAPE WORTH KEEPING: the dependency was a PROXY for \"the props exist\", and it had stopped tracking the thing it stood for - the files landed while the task that owns them stayed un-reviewable behind gates about generating more art. Replacing a proxy with the check it was standing in for is the same move as making a gate read the imported sprite instead of the .meta. FOLDER-META CLAIM, 2026-09-23: this task now owns the three folder .meta files that the first room-dressing task to run must create - Art/Environment/RoomDressing.meta, Editor/Environment.meta and Tests/Editor/Environment.meta. Measured before claiming: all three are absent from main while their three parents exist as trees with their own metas, so this is the complete set and there is no fourth. Landed AHEAD of dispatch rather than as the last step before it, because nothing about the claim depends on NSC-047's delivery evidence and holding it back would have left two items on the critical path where one will do. NSC-082's only remaining blocker is that evidence, which is the Game Agent's work. VAL-002 CERTIFICATION, 2026-09-23: the visual approval on this gate is the Art Director's. Decision provenance is Documentation Agent on Vincent's delegation, 2026-09-23 07:10Z; his own word does not exist and is not claimed. Wording is the Art Director's own, since they hold the gate. TWO THINGS THEY REFUSED THAT I HAD OFFERED, both recorded because the refusals are the valuable part: their 19-39 saturation band, because it was measured on isolated prop sprites against transparency while this gate judges a gameplay frame of mostly floor, wall and lighting - a correctly dressed room would fail it; and any global band at all, because the five rooms have deliberately different palettes chained off one base flagstone under NSC-064. A true measurement promoted to a case nobody measured, baked into five contracts, would have failed later as an inexplicable red. The screenshot-or-contact-sheet choice is also gone: the two answer different questions and an OR lets the gate be satisfied by the panel that cannot see the defect.",
