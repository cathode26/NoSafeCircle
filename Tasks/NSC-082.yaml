G HERE. The Art Director's 19-39 saturation band was measured on isolated prop sprites against transparency; this gate judges a frame that is mostly floor tileset, wall and lighting, so the distributions are not comparable and a correctly dressed room would fail a frame-level 19-39. Nor may a band be made global: Chapel of Ash is pale ash, Bone Archive is bone and Lower Vault is iron and wet, and NSC-064's five floor tilesets deliberately chain off one base flagstone so the rooms read as one dungeon while keeping their own character - one constant across five contracts fights that design. IF A MEASURABLE COLOUR CLAUSE IS EVER ADDED IT MUST CARRY A SATURATION TERM: three hue relations failed in one evening, each loose in a different way - blue>green passed a TEAL wall at 86.7, adding red>green passed MAGENTA rubble at 92.9, and a third omitted saturation entirely so a neon-mint floor at saturation 66.4 printed in band on the same day the pews failed on that very axis. A hue relation without a saturation term is not a band."
