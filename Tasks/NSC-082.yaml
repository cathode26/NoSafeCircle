    {
      "criterion_id": "AC-001",
      "reference": "Approved Lower Vault blockout",
      "requirement": "Add darker material variation, puddle or slime accents, broken stone, webs, vegetation or roots, and readable debris while preserving bounds, D4 opening, rear-pressure clearance, collision, and walkability."
    },
    {
      "criterion_id": "AC-002",
      "reference": "NSC-078 prop catalog",
      "requirement": "Use only catalogued original props and keep passages, alcoves, door approach, and player routes clear. THE PROPS THIS ROOM USES ARE ALREADY COMMITTED, AND NSC-078 IS REMOVED FROM depends_on FOR THAT REASON. Measured at main: all ten catalog entries whose intended_rooms include LowerVault are present under Assets/NoSafeCircle/DoorPrototype/Art/Environment/Props/Source/selected/ with BOTH their .png and their .png.meta, and PropCatalog.json carries all forty-five entries. NSC-078 is a forty-five entry task whose art review, 120-generation stop and spend approval are reserved to Vincent, so depending on it gated this room's dressing on decisions about GENERATING art rather than on the art's AVAILABILITY, which is settled. NSC-080 and NSC-081 already depend on their narrow publication tasks rather than on NSC-078, so this makes all five room-dressing tasks consistent rather than carving out an exception. NSC-078 KEEPS CATALOG AUTHORSHIP for all forty-five entries and this task still must not edit PropCatalog.json. THE DEPENDENCY IS REPLACED BY A CHECK RATHER THAN DROPPED, because a dependency on another task's review state never proved anything about the files. Before placing any prop, this task must confirm that the prop resolves to a committed entry in PropCatalog.json and that the file at that entry's path matches the entry's recorded selected_sha256, and must FAIL rather than place a prop that does not. That is strictly stronger than what the dependency asserted: it verifies the bytes this room dresses with, at the moment it dresses."
    },
    {
      "criterion_id": "AC-003",
      "reference": "Room ownership boundary",
      "requirement": "Own only this room's dressing prefab, catalog, builder, and focused tests; do not edit the blockout scene, common builders, another room, doors, navigation, or the canonical scene. EVERY OWNED ASSET'S .meta IS OWNED WITH IT, AND AN EARLIER REVISION LISTED ONLY THE FOUR ASSETS. Unity writes a .meta beside every asset it imports, so this task's four assets are eight committed files. The omission is not cosmetic and this is measured at source rather than argued: Pipeline/AssistantControl/unity_materialization.py's _generated_resource_roots admits a resource to the Unity builder's allowed roots ONLY when git cat-file -t reports a tree for it, so a resource list containing files alone derives an EMPTY root set - and the companion folder metas it would otherwise supply are computed only FROM those roots, so they are empty too. After that, any file generated beside the owned ones is fatal at materialization. That is the shape that nearly froze NSC-044. THE THREE OUTPUT DIRECTORIES DO NOT EXIST ON MAIN AND ARE DELIBERATELY NOT CLAIMED HERE. Measured: Art/Environment/RoomDressing, Editor/Environment and Tests/Editor/Environment are all absent, while their parent Art/Environment is present with its own .meta. So the FIRST of the five room-dressing tasks to land creates all three, and Unity generates a folder .meta for each. Five tasks claiming one path would be a resource collision, so only the FIRST task to dispatch claims them - AND THIS TASK IS THAT TASK. NSC-082 now owns all three folder metas: Art/Environment/RoomDressing.meta, Editor/Environment.meta and Tests/Editor/Environment.meta. Their three parents already exist on main as trees with their own metas, so these three are the complete set this task creates and no fourth appears. THE OTHER FOUR ROOM-DRESSING CONTRACTS STILL SAY NONE OF THEM CLAIMS THESE PATHS; that sentence is superseded by this revision and NSC-082 is where they live. Commit them as proper folder assets - folderAsset: yes with DefaultImporter, never GUID-only stubs, which import as Cubemaps in Unity 6000.1 - the same shape as the prop folders committed at 9bd49c7ee. If dispatch order ever changes so that another dressing task runs first, moving the claim is a one-task revision on each side and not a redesign. EVERY LATER TASK MUST TOLERATE THEIR PRE-EXISTENCE AND MUST NOT ASSERT THAT IT ADDS THEM: a subset rule, not an equality rule, for exactly the reason NSC-102's VAL-003 had to be rewritten - a gate asserting that a task ADDS a path already on main becomes unsatisfiable the moment anyone else lands it."
    },
    {
      "criterion_id": "AC-005",
      "reference": "Docs/Art/Environment/DUNGEON_ART_DIRECTION.md:63-71, the Lower Vault canon line committed 2026-09-17 at b7e46c320 (\"Art must not out-promise the geometry\"), approved by Vincent; Tasks/NSC-047.yaml revision 4 INT-002 and the R-08 room review finding (2026-09-15)",
      "requirement": "Create an original vault landmark and dress the room with water or slime channels, corrupted ground, cliffs, barrels and crates, rails, and platform or ledge scenery, plus a readable alternate approach around LV-C1. **The art must not out-promise the geometry.** The dressing may depict a bridge, a ledge, a raised route or a stepping-stone island, but while NSC-047's committed layout contains none of them, that art is **scenery**: it must not read as walkable ground, a safe island, a crossing, or a change of elevation the player can use. Compose so the eye is drawn along the route the layout actually provides rather than across a painted crossing that does not exist. Hazards remain bounded surfaces or non-walkable background, never copied or traced reference art and never flat decoration. **Do not use chasms or lava**: canon reserves them, with horn trim, as FutureExpansion vocabulary until a task owns them, and none does. This criterion is forward-compatible by design - if and when a task commits a crossing, ledge or raised route with real collision, the art may then depict that feature as a fact and this criterion permits it without a further revision."
    }
  ],
  "completion_gates": [
    {
      "gate_id": "VAL-001",
      "reference": "Lower Vault visual regression",
      "requirement": "Focused Unity EditMode tests prove deterministic prefab/catalog generation, stable sorting anchors, source-geometry compatibility, safe-route and alternate-approach metadata, D4 approach clearance, and idempotent rebuild without opening or modifying LowerVault.unity."
    },
    {
      "gate_id": "VAL-002",
      "reference": "Developer visual review",
      "requirement": "A gameplay-camera panel of the prefab staged against the approved blockout visibly shows the vault landmark, the hazard dressing, the prop clusters and the readable alternate approach around LV-C1. An earlier wording ended \"and Vincent approves it\"; that reservation is withdrawn and the certification is the Art Director's, as set out below. The review explicitly checks the canon rule in the other direction as well, AND IT IS ANCHORED ON WHAT THE ART DEPICTS RATHER THAN ON WHAT A REVIEWER BELIEVES: the frame must contain no arrangement DEPICTING a walkable surface at a different elevation, a span across a gap, or a step up, because the committed layout provides none. That is checkable against the prefab's contents and the room's layout by anyone, with no appeal to taste. An earlier wording made the test \"a reviewer who looks at the shot and believes they could walk across something they cannot\" - that sentence is kept as the EXPLANATION of why the rule exists, and is no longer the test, because a reviewer's belief is the thing this clause is trying to get away from. If a later task commits such geometry, this gate instead confirms the art matches what the layout now has. THE EVIDENCE IS THE GAMEPLAY-DENSITY PANEL SPECIFICALLY, NOT A SCREENSHOT OR A CONTACT SHEET AT THE REVIEWER'S CHOICE. An earlier wording offered either, and the two answer different questions: a contact sheet is native 3x and exists to judge a single sprite, while whether a landmark reads AS a landmark is only answerable at gameplay density. An OR lets this gate be satisfied by the panel that cannot see the defect it is looking for. The Art Director's review renderer emits three panels - native 3x, world scale and gameplay density - for exactly that reason; this gate is judged on the third. THE ART DIRECTOR CERTIFIES THIS GATE. Decision provenance, recorded so it is not misattributed later: Documentation Agent, on Vincent's delegation, 2026-09-23 07:10Z - he asked for the call to be made rather than making it, so HIS OWN WORD ON THIS DOES NOT EXIST AND MUST NOT BE CLAIMED; if he later contradicts it, his word governs. From the gameplay-density panel the Art Director certifies that: (a) every dressing object is a prop from the committed PropCatalog, placed at its catalog pivot and pixels_per_unit, with no prop overriding either; (b) the dressing reads as the same material family as THAT ROOM'S OWN committed source sprites, judged against them and NOT against a fixed numeric band; (c) the vault landmark reads as a landmark at gameplay camera distance rather than as another prop cluster; and (d) the other elements this gate names above are legible at that distance. ONLY (a) IS MECHANICALLY VERIFIABLE AND THIS CONTRACT SAYS SO RATHER THAN DRESSING JUDGEMENT AS MEASUREMENT - (b), (c) and (d) are the Art Director's judgement, which is what this gate is for. NO NUMERIC COLOUR BAND IS WRITTEN INTO THIS GATE, AND THE REASON IS A MEASUREMENT THAT WOULD HAVE BEEN WRONG HERE. The Art Director's 19-39 saturation band was measured on isolated prop sprites against transparency; this gate judges a frame that is mostly floor tileset, wall and lighting, so the distributions are not comparable and a correctly dressed room would fail a frame-level 19-39. Nor may a band be made global: Chapel of Ash is pale ash, Bone Archive is bone and Lower Vault is iron and wet, and NSC-064's five floor tilesets deliberately chain off one base flagstone so the rooms read as one dungeon while keeping their own character - one constant across five contracts fights that design. IF A MEASURABLE COLOUR CLAUSE IS EVER ADDED IT MUST CARRY A SATURATION TERM: three hue relations failed in one evening, each loose in a different way - blue>green passed a TEAL wall at 86.7, adding red>green passed MAGENTA rubble at 92.9, and a third omitted saturation entirely so a neon-mint floor at saturation 66.4 printed in band on the same day the pews failed on that very axis. A hue relation without a saturation term is not a band."
    }
