      "criterion_id": "AC-001",
      "reference": "GDD Platform: Windows PC; NSC-037 configures the target and registers the scene",
      "requirement": "A new Editor menu command under No Safe Circle produces a Windows Standalone player from the canonical gameplay scene registered by NSC-037, using that registration as the scene source rather than a hard-coded path, so the build follows the registered scene if it changes. The command builds the StandaloneWindows64 target that NSC-037 already configures; this task does not change build target configuration, player settings, or the scene registration itself."
    },
    {
      "criterion_id": "AC-002",
      "reference": "CLAUDE.md: a status label names the outcome of the whole attempt, not the step it is named after",
      "requirement": "The command writes its output to a deterministic, repository-relative path that is not tracked by git, and reports that path on completion. The produced output is a complete Windows player: an executable plus the Unity data directory required to launch it. A build that returns success while producing no executable is a failure of this criterion."
    },
    {
      "criterion_id": "AC-003",
      "reference": "CLAUDE.md: never point Unity at canonical; a dirty canonical blocks every merge and decompose",
      "requirement": "The build command leaves HEAD, tracked files and untracked tracked-path state unchanged apart from its own output directory. It does not save, re-serialize or modify any scene, and it does not run against the canonical checkout's tracked scenes in a way that dirties them."
    },
    {
      "criterion_id": "AC-004",
      "reference": "CLAUDE.md: pushes, CI and github.io go to the Release Agent",
      "requirement": "PUBLICATION IS EXPLICITLY OUT OF SCOPE. This task produces a local artifact only. Uploading, releasing, hosting, github.io, CI wiring and any push to origin belong to the Release Agent and are not claimed here. WebGL is not in scope either; NSC-043 owns the browser bundle and its AC-005 restricts it to desktop-browser play."
    },
    {
      "criterion_id": "AC-005",
      "reference": "NSC-043 AC-004 and AC-005, read at main 05f823604",
      "requirement": "This contract was authored as a NEW task rather than as a revision of NSC-043 after reading NSC-043 at source. NSC-043 is 'Desktop WebGL Build Artifact': its AC-004 treats Windows-only APIs and native Windows-only plugins as a hazard the WebGL build must avoid, and its AC-005 restricts that artifact to desktop-browser play only. Folding a Windows player into it would require rewriting both exclusions, so the two targets stay in separate contracts."
    }
  ],
