      "criterion_id": "AC-001",
      "reference": "NSC-061 and NSC-062 wizard presentation choices",
      "requirement": "After Start Game, show a wizard-selection screen with all four integrated combinations: masculine/light skin, masculine/dark skin, feminine/light skin, and feminine/dark skin. Each option uses the exact approved and integrated wizard presentation rather than a placeholder or runtime-generated substitute."
    },
    {
      "criterion_id": "AC-002",
      "reference": "Human-approved wizard-selection flow, 2026-09-12",
      "requirement": "Each wizard option has a readable visual preview and respectful plain-language label. The four options receive equal visual prominence and are selectable through the project's supported pointer input."
    },
    {
      "criterion_id": "AC-003",
      "reference": "Human-approved wizard-selection flow, 2026-09-12",
      "requirement": "Selecting an option visibly marks exactly one wizard as selected. A clearly labeled confirmation action remains unavailable until a valid option is selected, then starts gameplay once with that exact presentation and skin choice."
    },
    {
      "criterion_id": "AC-004",
      "reference": "NSC-062 presentation-only boundary",
      "requirement": "The chosen wizard changes presentation only. It preserves the existing Player root, CharacterController, colliders, movement, health, mana, spells, interaction components, world position, four-direction animation behavior, and NSC-039 sorting convention."
    },
    {
      "criterion_id": "AC-005",
      "reference": "Game-entry state ownership",
      "requirement": "Gameplay input remains inactive throughout wizard selection. Confirming a valid choice hides the selection UI, applies the selected wizard through the presentation API established by NSC-062, enables gameplay through existing owner-controlled boundaries, and cannot create duplicate players or repeated start transitions."
    },
    {
      "criterion_id": "AC-006",
      "reference": "DoorPrototypeSceneBuilder repeatability",
      "requirement": "DoorPrototypeSceneBuilder.Build installs the wizard-selection panel, four option bindings, confirmation action, and controller idempotently without replacing approved source art, duplicating menu objects, or resetting the selected presentation during an active play session."
    }
  ],
