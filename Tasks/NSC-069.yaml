      "reference": "Approved proposal — Room scene contract",
      "requirement": "Define shared RoomId, DoorId, DoorAnchorRole, RoomContentMarker, and DoorAnchorMarker contracts. Each source scene has one identity-transform Room_<RoomId> root authored at canonical world coordinates, with separate Visuals, GameplayGeometry, DoorAnchors, and Editor-only Authoring children and no Player, camera, light, Canvas, EventSystem, run-state service, encounter population, or live DoorInteractable."
    },
    {
      "criterion_id": "AC-003",
      "reference": "Approved proposal — Door anchor identities and composition behavior",
      "requirement": "Represent D1-D4 with matching typed markers from their adjoining rooms and D5 with exactly one Exit marker. Validate 3.0-unit opening width, world-space center, opposing forward vectors, fixed room order, global-coordinate bounds, local serialized-reference ownership, and the approved TilemapRenderer/SpriteRenderer sorting convention before canonical composition can save."
    },
    {
      "criterion_id": "AC-004",
      "reference": "GDD — Runtime Implementation; approved proposal — Architecture decision",
      "requirement": "Implement deterministic Editor-time composition that clones only validated room-owned Visuals, GameplayGeometry, and DoorAnchors under World/ComposedRooms in Assets/Scenes/DoorPrototype.unity, closes every source scene without saving it, and leaves only the canonical DoorPrototype scene enabled for runtime builds. Production runtime code must not load or unload room scenes. At each shared north/south room boundary, the composed gameplay scene keeps the northern room's low (0.5-unit) wall visual cells and removes the southern room's full-height wall visual cells only over the span the northern room's low wall covers; the southern room's full-height wall cells outside that span stay. Exactly one 2.5-unit gameplay wall collider remains along each part of the boundary: where one room's boundary wall collider pieces lie entirely inside the span of the other room's boundary wall colliders, composition removes the contained pieces. Door openings stay open. Everything else in each room's categories is still cloned unchanged. NSC-049 implements this in RoomSceneComposer."
    },
    {
      "criterion_id": "AC-005",
      "reference": "Approved proposal — DoorPrototypeSceneBuilder migration",
      "requirement": "Keep DoorPrototypeSceneBuilder as the public menu and test facade, extract global camera/light/Player/UI/input construction behind DoorPrototypeGlobalSceneBuilder, replace whole-scene clearing with explicit builder-owned generated roots, retain BuildInMemoryForTests compatibility, and keep the existing canonical prototype environment playable until NSC-049 performs the final room-composition switch."
    },
    {
      "criterion_id": "AC-006",
      "reference": "Approved proposal — Exact code, data, and test ownership",
      "requirement": "Establish and validate the exact disjoint ownership seams consumed by NSC-044 through NSC-048. Each room task may create and save only its own scene, builder, layout data, tests, and generated .meta companions; it may not edit an asmdef, common contract, common composer, DoorPrototypeSceneBuilder, DoorPrototype.unity, or another room's files. As the one catalog exception (Vincent, 2026-09-14), a room task may edit its own room's RoomBounds entry and the center of its own exit door in RoomSceneCatalog.cs and regenerate RoomSceneCatalog.asset, within the GDD room size authority; room tasks take turns on those shared catalog files, and NSC-049 reconciles shared boundaries and door alignment during composition."
    }
