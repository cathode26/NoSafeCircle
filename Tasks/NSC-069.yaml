      "reference": "Vincent-approved Independent Room Scenes and Deterministic World Composition Proposal, 2026-09-12",
      "requirement": "Define the five stable room identities and authoring-scene paths in the shared catalog and contracts without creating or owning the room-specific scenes, builders, layouts, or tests. NSC-044 through NSC-048 each create their own room assets and deterministic Unity .meta companions within their exact task scope."
