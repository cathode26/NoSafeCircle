      "reference": "Vincent-approved Independent Room Scenes and Deterministic World Composition Proposal, 2026-09-12",
      "requirement": "Create stable Editor authoring assets at Assets/Scenes/Rooms/RuinedEntry.unity, BoneArchive.unity, ChapelOfAsh.unity, LowerVault.unity, and FinalRoom.unity, plus the approved room-specific builder, layout-data, and focused-test scaffolds. Commit every Unity companion .meta generated by the repository's deterministic Unity-meta identity tool; later room tasks must update the existing assets without deleting, recreating, or changing their GUIDs."
