      "requirement": "Represent D1-D4 with matching typed markers from their adjoining rooms and D5 with exactly one Exit marker. Validate 3.0-unit opening width, world-space center, opposing forward vectors, fixed room order, global-coordinate bounds, local serialized-reference ownership, and the approved TilemapRenderer/SpriteRenderer sorting convention before canonical composition can save."
    },
    {
      "criterion_id": "AC-004",
      "reference": "GDD — Runtime Implementation; approved proposal — Architecture decision",
      "requirement": "Implement deterministic Editor-time composition that clones only validated room-owned Visuals, GameplayGeometry, and DoorAnchors under World/ComposedRooms in Assets/Scenes/DoorPrototype.unity, closes every source scene without saving it, and leaves only the canonical DoorPrototype scene enabled for runtime builds. Production runtime code must not load or unload room scenes."
    },
    {
      "criterion_id": "AC-005",
      "reference": "Approved proposal — DoorPrototypeSceneBuilder migration",
      "requirement": "Keep DoorPrototypeSceneBuilder as the public menu and test facade, extract global camera/light/Player/UI/input construction behind DoorPrototypeGlobalSceneBuilder, replace whole-scene clearing with explicit builder-owned generated roots, retain BuildInMemoryForTests compatibility, and keep the existing canonical prototype environment playable until NSC-049 performs the final room-composition switch."
    },
    {
      "criterion_id": "AC-006",
      "reference": "Approved proposal — Exact code, data, and test ownership",
      "requirement": "Establish the exact disjoint ownership seams consumed by NSC-044 through NSC-048. A room builder may save only its own existing room scene and may not edit an asmdef, common contract, catalog, common composer, DoorPrototypeSceneBuilder, DoorPrototype.unity, or another room's builder, layout data, tests, or gameplay geometry."
    }
