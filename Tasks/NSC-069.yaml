      "requirement": "RoomSceneComposerTests.cs and RoomSceneContractTests.cs each declare part of the single Edit Mode fixture NoSafeCircle.DoorPrototype.Tests.Editor.World.RoomSceneCompositionFoundationTests, a partial class; those file names are not type names. That one fixture verifies catalog completeness/order, root and anchor contracts, source-scene immutability, local-reference ownership, build-settings exclusion, and composition failure before canonical save. Sorting is deliberately not among the clauses this gate proves. The project defines exactly one sorting layer, Default, and DoorPrototypeSceneBuilder.WorldSpriteSortingLayerName is that same layer, so RoomSceneComposer.ValidateSortingConvention cannot fail: Unity refuses every attempt to move a renderer off Default when no other layer exists, including assigning sortingLayerID directly (probed in Unity at 7a1bae97a). The guard stays in the code for the day a dedicated layer exists, and this gate claims only what it can prove today."
