  "notes": "This task establishes shared authoring and composition infrastructure only. NSC-044 through NSC-048 create the five room source scenes and their room-specific builders, layouts, tests, and Unity .meta files. It does not author tactical room layouts, encounters, D1-D5 live door instances, final global NavMesh, or victory behavior. Room source scenes are Editor-only inputs and must not be added to enabled build settings. NSC-049 owns the final canonical content switch. Vincent approved the room-task catalog exception in AC-006 on 2026-09-14 so Task Design GER room revisions can resize rooms within the GDD room size authority. Revision 7, 2026-09-17: VAL-001 and the validation policy named NoSafeCircle.DoorPrototype.Tests.Editor.World.RoomSceneCompositionFoundationTests, a fixture that has never existed on main, so a Unity run with that filter selected zero tests and NSC-069 could never become conformant - parking NSC-044 through NSC-048, which depend on it and nothing else. The gate now names the two fixtures that exist and that this task already claims, RoomSceneComposerTests and RoomSceneContractTests, and the policy filter is rebound to both. One clause was genuinely unproven rather than misnamed: AC-003 requires validating the approved sorting convention and RoomSceneComposer.ValidateSortingConvention implements it, but no test rejected a wrong sorting layer, so VAL-001 now requires that negative case alongside the existing ones. Revision 8, 2026-09-17: revision 7 asked for a negative sorting case; the Game Agent probed Unity at 7a1bae97a and showed one cannot be written - with only the Default layer defined, a SpriteRenderer stays on Default however the layer name or id is assigned, so ValidateSortingConvention is unreachable and any such test could not fail. VAL-001 therefore stops claiming sorting and says why, the guard stays in the code, and the design debt - a constant named WorldSpriteSortingLayerName that points at Default because a dedicated world-sprite layer was never created, plus sorting order going entirely unvalidated - is on Vincent's list as its own task. Everything VAL-001 still claims is covered by RoomSceneComposerTests and RoomSceneContractTests on main today. Revision 9, 2026-09-17: revisions 7 and 8 rested on a false premise. NoSafeCircle.DoorPrototype.Tests.Editor.World.RoomSceneCompositionFoundationTests does exist - it is a partial class declared in both RoomSceneComposerTests.cs and RoomSceneContractTests.cs, while no types named after those files exist - so the original filter was right and revision 7's two-fixture filter would have selected zero tests, the exact defect it claimed to fix. The premise came from searching the tree for a file named after the class, and was checked the same flawed way here; proving a type absent needs a content grep for its declaration. Revision 9 restores the fixture name in VAL-001 and the policy filter. Revision 8's sorting treatment stands on its own evidence and is unchanged, with INT-003 handing the sorting proof to the task that adds the dedicated layer.",
