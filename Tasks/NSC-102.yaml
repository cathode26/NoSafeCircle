      "requirement": "Commit the nine approved Bone Archive prop PNGs - ba_landmark_chained_grimoire_lectern, ba_book_and_scroll_stack, ba_spilled_scroll_basket, ba_collapsed_reading_table_z, ba_comedy_skull_with_spectacles, shared_bone_pile_a, shared_bone_pile_b, shared_web_corner_a, shared_web_drape_b - each at Assets/NoSafeCircle/DoorPrototype/Art/Environment/Props/Source/selected/<category>/<id>.png with its .meta, and its unmodified source copy at Docs/Art/Environment/Props/Raw/<category>/<id>.png. Categories are architecture for ba_landmark_chained_grimoire_lectern and furnishings for the other eight. Copy the approved bytes verbatim from the Art Director's quantized set; this task performs no PixelLab generation, no selection and no repair, and never edits a PNG's pixels.",
      "reference": "Art Director Agent keeper set, 2026-09-22; NSC-078 art plan intended_rooms column"
    },
    {
      "criterion_id": "AC-002",
      "requirement": "Each of the nine .meta files carries real Sprite import settings, not a GUID-only stub: TextureImporterType Sprite, spriteImportMode Single, spritePixelsPerUnit 64, filterMode Point, textureCompression None, alphaIsTransparency true, mipmapEnabled false, wrapMode Clamp, and textureShape TextureImporterShape.Texture2D. A GUID-only stub imports as Cube with point-cookie defaults in Unity 6000.1 rather than as a Sprite, which would land the PNGs in the repository while the room renders nothing. wrapMode Clamp is a deliberate divergence from the approved door_bonestone_* metas on main, which are Repeat, and is not an oversight to be reconciled to them: for a non-tiling sprite the two are visually identical, but the prop set includes tiling runs (ca_pew_x_start/middle/end and ba_shelf_bank_z_start/middle/end) where wrap mode is not cosmetic. Note that wrapU 0 is Repeat, not Clamp.",
      "reference": "NSC-078 AC-004 applied import settings; memory stub-meta-imports-as-cubemap"
    },
    {
      "criterion_id": "AC-003",
      "requirement": "Each .meta uses alignment 9 (Custom) with spritePivot x 0.5 and y equal to that prop's measured ground line - the count of fully transparent pixel rows below the drawn art divided by the canvas height - rather than the catalog's nominal bottom-contact pivot (0.5, 0). None of these props' art touches its canvas bottom, so a bottom-contact pivot floats the prop above its floor contact by that gap; at 64 pixels per unit a 15-pixel gap is 0.234 world units. This is the same defect as the wizard hover recorded in NSC-075 AC-008 and NSC-077 AC-002.",
      "reference": "Art Director Agent measurement, 2026-09-22; board H-20260917-24"
    },
    {
      "criterion_id": "AC-004",
      "requirement": "Add the Edit Mode fixture Assets/NoSafeCircle/DoorPrototype/Tests/Editor/BoneArchivePropImportTests.cs and its .meta, declaring NoSafeCircle.DoorPrototype.Tests.Editor.BoneArchivePropImportTests as a new sealed non-partial type distinct from every existing type in that assembly, so a test-path filter resolves to exactly this one file. Place it directly in Tests/Editor/, which already exists: Tests/Editor/Environment/ does not exist on main and its directory .meta is claimed by NSC-078, so creating it here would collide with that task.",
      "reference": "graph_controller._resolve_test_paths matches file stems and requires exactly one match; NSC-101 VAL-001 uses the same shape"
    }
