  "notes": "Created 2026-09-22 on Vincent's word, given to the Documentation Agent: \"Get me a room with art :)\" and \"If you need to make a task for that to happen, make a task.\" Re-targeted from the Ruined Entry to the Bone Archive after NSC-044 went needs_human on a compile error while NSC-045 passed on its first attempt; the reasoning is identical and the Ruined Entry version remains authorable if NSC-044 lands. Scope is the nine props the NSC-078 plan's intended_rooms column assigns to BoneArchive - not the ten or eleven proposed in discussion, which included shared_candle_cluster_a, a prop the plan assigns to neither room. TWO DEFECTS SHIP KNOWINGLY, recorded here rather than passed silently so a later fix has a handle, and both under Vincent's \"I dont care if it might look bad, we will fix it later\": none of the nine has had its facing judged against the plan's facing column, and the Art Director's tilt metric cannot judge blocky props at all. NOT ESTABLISHED BY THIS CONTRACT: that NSC-080 will pass, only that its dependency on NSC-078 is unnecessary; and the blockout states above are the Game Agent's measurement relayed through the Documentation Agent, which I could not confirm from the dispatch records visible to me.",
