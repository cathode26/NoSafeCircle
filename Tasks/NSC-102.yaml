    {
      "criterion_id": "AC-002",
      "requirement": "Each of the nine .meta files carries real Sprite import settings, not a GUID-only stub: TextureImporterType Sprite, spriteImportMode Single, spritePixelsPerUnit 64, filterMode Point, textureCompression None, alphaIsTransparency true, mipmapEnabled false, wrapMode Clamp, and textureShape TextureImporterShape.Texture2D. A GUID-only stub imports as Cube with point-cookie defaults in Unity 6000.1 rather than as a Sprite, which would land the PNGs in the repository while the room renders nothing. wrapMode Clamp is a deliberate divergence from the approved door_bonestone_* metas on main, which are Repeat, and is not an oversight to be reconciled to them: for a non-tiling sprite the two are visually identical, but the prop set includes tiling runs (ca_pew_x_start/middle/end and ba_shelf_bank_z_start/middle/end) where wrap mode is not cosmetic. Note that wrapU 0 is Repeat, not Clamp.",
      "reference": "NSC-078 AC-004 applied import settings; memory stub-meta-imports-as-cubemap"
    },
    {
      "criterion_id": "AC-003",
      "requirement": "Each .meta uses alignment 9 (Custom) with a pivot SELECTED PER ENTRY BY THE CATALOG'S pivot_rule FIELD, NOT BY ONE FLAT RULE. An entry marked lie_within takes the CENTRE of the alpha bounding box in both axes; anything else takes x 0.5 and y equal to that prop's measured ground line - the count of fully transparent pixel rows below the drawn art divided by the canvas height. THE CONTRACT READS THAT FIELD AND DOES NOT RE-DECIDE IT, and an entry whose pivot_rule is missing or unrecognised FAILS rather than defaulting to either branch. AN EARLIER REVISION REQUIRED THE GROUND LINE FOR ALL NINE PROPS AND THAT IS WITHDRAWN, MEASURED FALSE. Of this task's nine props exactly one, shared_bone_pile_b, is lie_within; the other eight are ground_line. Measured from the committed blob 2026-09-23: the PNG is 100x72 with alpha bounding box x 10, y 6, w 81, h 63, so the ground-line answer is (72-69)/72 = 0.041667 while the lie_within answer is 0.479167 - and the committed .meta carries exactly 0.479167. THE ASSET IS CORRECTLY IMPORTED AND THE FLAT RULE MISSES IT BY 31.5 PIXELS, so a faithful fixture would fail correct art and forcing the contract's pivot would undo the flat-art correction. WHY A PER-ENTRY FIELD AND NOT A DERIVATION, kept because it will be proposed again: no measurement and no category map produces this answer - shared_bone_pile_a and shared_bone_pile_b both carry identity_category bone_pile and classify differently. Across the catalog the split is 42 ground_line to 3 lie_within, so this is a real distinction and not one stray record. NSC-103's AC-003 already states this branch and this contract now matches it word for word rather than the catalog's nominal bottom-contact pivot (0.5, 0). None of these props' art touches its canvas bottom, so a bottom-contact pivot floats the prop above its floor contact by that gap; at 64 pixels per unit a 15-pixel gap is 0.234 world units. This is the same defect as the wizard hover recorded in NSC-075 AC-008 and NSC-077 AC-002.",
