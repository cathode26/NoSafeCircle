  "notes": "Created 2026-09-22 on Vincent's word, given to the Documentation Agent: \"Get me a room with art :)\" and \"If you need to make a task for that to happen, make a task.\" Re-targeted from the Ruined Entry to the Bone Archive after NSC-044 went needs_human on a compile error while NSC-045 passed on its first attempt; the reasoning is identical and the Ruined Entry version remains authorable if NSC-044 lands. Scope is the nine props the NSC-078 plan's intended_rooms column assigns to BoneArchive - not the ten or eleven proposed in discussion, which included shared_candle_cluster_a, a prop the plan assigns to neither room. TWO DEFECTS SHIP KNOWINGLY, recorded here rather than passed silently so a later fix has a handle, and both under Vincent's \"I dont care if it might look bad, we will fix it later\": none of the nine has had its facing judged against the plan's facing column, and the Art Director's tilt metric cannot judge blocky props at all. NOT ESTABLISHED BY THIS CONTRACT: that NSC-080 will pass, only that its dependency on NSC-078 is unnecessary; and the blockout states above are the Game Agent's measurement relayed through the Documentation Agent, which I could not confirm from the dispatch records visible to me. REVISION 3, 2026-09-22, NOTES ONLY - no criterion, gate, obligation or resource changed. KNOWN DEFECT IN A PUBLISHED ASSET, recorded so the committed set is not read as clean: ba_book_and_scroll_stack, on main under this task, carries an UNPROMPTED LANTERN. The cause is now understood and fixed upstream - NSC-078's global clause said \"warm lantern-glow highlights\" and was appended to every description, so the word lantern was in every prompt of the run that produced this art. NSC-078 revision 14 replaced it with \"warm amber glow highlights\", tested three for three on other props. THIS IS NOT A CONTRACT DEFECT AND NOTHING HERE NEEDS REVISING TO FIX IT: the gates this task sets - Sprite import, the nine importer values, the self-measuring pivot - all pass on the committed bytes regardless of what the sprite depicts, and they should, because depiction is the Art Director's judgement rather than an importer property. Replacing the sprite is an ART task against the corrected global clause, and it needs no change here: this task's VAL-003 is a subset rule, so a later candidate that re-publishes only this one path satisfies it. Flagged by the Art Director, who correctly declined to touch another task's committed asset. REVISION 4, 2026-09-22, NOTES ONLY - no criterion, gate, obligation or resource changed. SECOND KNOWN DEFECT IN A PUBLISHED ASSET, recorded for the same reason as the first: shared_bone_pile_b is committed under this task with pivot y 0.041667, the measured ground line, and the Art Director judges from the sprite that it should be CENTRE - it is drawn as a ribcage and loose bones lying flat and strewn across the floor, with no base, so the object LIES WITHIN its area rather than STANDING ON one. MEASURED FROM THE COMMITTED PNG RATHER THAN ESTIMATED, because whether this is worth fixing should be judged against a number: the canvas is 100x72, the alpha bounding box spans rows 6 to 68, so the centre-rule pivot would be 0.472222 against the committed 0.041667 - a difference of 31 pixels, which at 64 pixels per unit is 0.484 WORLD UNITS of displacement. For comparison the wizard-hover defect that produced NSC-075 AC-008 and NSC-077 AC-002 was 0.234 units, so this is roughly twice it and is NOT below the threshold of caring. THIS TASK'S GATE WAS NOT WRONG AND PASSED CORRECTLY: VAL-002 asserts the ground-line rule and the committed pivot satisfies it exactly. The defect is a classification - which branch this prop belongs in - and at the time it was published no catalog flag distinguished lying from standing props; that distinction was established later the same day, on NSC-103, and it is PropCatalog.json that must carry it. Fixing the sprite's pivot is an art and catalog task, not a contract change here: this task's VAL-003 is a subset rule, so a later candidate re-publishing only that one .meta satisfies it. Flagged by the Art Director, who correctly declined to touch another task's committed asset. See also the ba_book_and_scroll_stack lantern recorded in revision 3. PIVOT RULE MADE PER-ENTRY, 2026-09-23. AC-003 and VAL-002 required the measured ground line for all nine props. The committed catalog records pivot_rule PER ENTRY and assigns shared_bone_pile_b lie_within; the importer enforces that branch and the committed .meta is correct at 0.479167. The flat rule demanded 0.041667 - 31.5 pixels away on a 72-pixel canvas - so a faithful fixture would have failed correct art, and forcing the contract's pivot would have undone the flat-art correction. Reported by the Documentation Agent after an Astra audit and REPRODUCED HERE FROM THE COMMITTED BLOB rather than taken: canvas 100x72, alpha bbox x 10 y 6 w 81 h 63, both branches computed, meta matching lie_within to 0.00 pixels. Scope measured before editing: exactly one of the nine is affected, and the catalog splits 42 ground_line to 3 lie_within. The wording is copied from NSC-103's AC-003, which already carries this branch and the reason it cannot be derived - shared_bone_pile_a and shared_bone_pile_b share identity_category bone_pile and classify differently, so no category map separates them. SAME SHAPE AS NSC-100's AC-003 FIXED AN HOUR EARLIER FROM A DIFFERENT REPORTER: a flat rule with no per-category inference written over a domain that genuinely has two categories. NOT FIXED HERE AND NOT MINE: the style-lock document still carries the old all-ground-line wording and needs reconciling by its owner.",
