      "requirement": "Commit the nine approved Bone Archive prop PNGs - ba_landmark_chained_grimoire_lectern, ba_book_and_scroll_stack, ba_spilled_scroll_basket, ba_collapsed_reading_table_z, ba_comedy_skull_with_spectacles, shared_bone_pile_a, shared_bone_pile_b, shared_web_corner_a, shared_web_drape_b - each at Assets/NoSafeCircle/DoorPrototype/Art/Environment/Props/Source/selected/<category>/<id>.png with its .meta, and its unmodified source copy at Docs/Art/Environment/Props/Raw/<category>/<id>.png. Categories are architecture for ba_landmark_chained_grimoire_lectern and furnishings for the other eight. Copy the approved bytes verbatim from the Art Director's quantized set; this task performs no PixelLab generation, no selection and no repair, and never edits a PNG's pixels.",
