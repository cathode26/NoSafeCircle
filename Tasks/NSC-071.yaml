      "requirement": "On the committed Bone Archive geometry, the configured enemy must be able to traverse every lane NSC-045 INT-002 assigns to this task, and that obligation - not this contract and not the code on main today - IS THE AUTHORITY FOR THE SET. It names six: the A-to-B lane; the B-to-C lane including BA-1's 2.5-unit pinch; the western bypass including its W-1 narrowing; the eastern bypass including its E-1 narrowing; and the south and north cross-aisle connections. NSC-045 AC-001 and AC-002 carry the measured values - walkable bounds X -12 to +12 and Z 0 to 20, A-to-B and B-to-C clear at 3.5 with BA-1 reducing B-to-C to the deliberate 2.5 minimum, the W-1 narrowing at 3.0 spanning Z 7 to 15, the E-1 narrowing at 3.0 spanning Z 5.5 to 13.5, the entry area X -4 to +4 by Z 0.25 to 3.75, a south cross-aisle at least 3.5 deep before Z 4, and a north cross-aisle at least 3.5 deep over Z 16 to 19.75. THOSE FIGURES ARE CITED, NOT ADOPTED: if a later NSC-045 revision changes them, this task's expectations follow NSC-045 and this paragraph is the stale copy. REVISION 5'S FIVE-GAP LIST IS WITHDRAWN AND THE REASON MATTERS MORE THAN THE LIST. It named ShelfA-to-ShelfB 3.5, ShelfB-to-ShelfC 3.5, west bound-to-ShelfA 3.5, ShelfC-to-east bound 5.0, and CollapsedFurnitureBA1-to-ShelfC 2.5, every figure correctly re-derived from BoneArchiveLayout as committed. It was still the wrong set, because THIS TASK RUNS AFTER NSC-045 REWRITES THE ROOM: Shelf A moves to X -7.5 to -6.0, BA-1 moves to X -1.0 to 0 so the pinch falls in the B-to-C lane rather than beside Shelf C, and the new bays W-1 and E-1 occupy the very space the third and fourth of those gaps described. Proving that an authority exists does not establish that it is the right authority, and the right one for a task's geometry is the dependency that authors it. The enemy is the configured one and not a stand-in: the NavMesh agent configuration NSC-089 delivers, carrying NSC-025's navigation foundation, and the pursuit and search movement NSC-092 delivers, carrying NSC-014's detection foundation. A lane the configured enemy cannot traverse fails this criterion. The earlier wording \"every intended lane\" named no authority and \"an impassable APPROVED lane\" named none either; both are withdrawn, and the set is now NSC-045 INT-002's, so a seventh lane reaches this criterion by being added there. A synthetic corridor or test-only replacement geometry cannot stand in for the authored room. THE D1-TO-D2 ROUTE IS ASSERTED SEPARATELY AND PROVES NO LANE. NSC-045 AC-002 requires the direct segment from (0, 0.25) to (6, 19.75) to intersect Shelf C, forcing a route choice, so an end-to-end path is necessarily a detour through one of several lanes and cannot be evidence about any of them. It is required because a pursuing enemy must be able to cross the room at all, and for nothing else."
    }
