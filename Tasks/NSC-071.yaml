      "requirement": "On committed Bone Archive geometry, the configured enemy must be able to traverse the BA-1 2.5-unit pinch and each of the five lanes BoneArchiveLayout defines - not \"every intended lane\", which named no authority and is withdrawn by this revision. THE SET IS THE ONE COMMITTED CODE ALREADY ASSERTS, so that the two tests move together when a shelf moves: Assets/NoSafeCircle/DoorPrototype/Tests/Editor/Rooms/BoneArchiveSceneTests.cs, test Layout_PreservesLaneWidthsAndBypasses, enumerates exactly these five gaps, and every figure below is re-derived from BoneArchiveLayout's own members rather than copied - ShelfA to ShelfB 3.5, ShelfB to ShelfC 3.5, the west room bound to ShelfA 3.5, ShelfC to the east room bound 5.0, and CollapsedFurnitureBA1 to ShelfC 2.5, which IS the BA-1 pinch and equals BoneArchiveLayout.MinLaneWidth. The enemy is the configured one and not a stand-in: the NavMesh agent configuration NSC-089 delivers, carrying NSC-025's navigation foundation, and the pursuit and search movement NSC-092 delivers, carrying NSC-014's detection foundation. A lane the configured enemy cannot traverse fails this criterion; the earlier wording said an impassable APPROVED lane, and since nothing records which lanes are approved, that qualifier named no authority either and is withdrawn - the five above are the set, and a sixth lane reaches this criterion only by being added to BoneArchiveLayout and to the Edit Mode test that enumerates it. A synthetic corridor or test-only replacement geometry cannot stand in for the authored room. THE ROUTE THAT MATTERS MOST IS NOT A LANE AT ALL and is stated separately so it cannot be dropped: a pursuing enemy must be able to cross the room end to end, from door D1 to door D2, which no single lane assertion covers."
    }
