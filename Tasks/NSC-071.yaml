      "requirement": "Play Mode validation loads the committed Bone Archive scene asset - not a builder-produced in-memory scene and not a synthetic corridor, per NSC-045 INT-002 - and proves traversal with the NavMesh agent configuration NSC-089 delivers and the pursuit and search movement NSC-092 delivers. A COMPLETE PATH BETWEEN TWO POINTS DOES NOT PROVE THE LANE BETWEEN THEM, AND THIS ROOM IS DESIGNED SO THAT IT CANNOT. NSC-045 AC-002 requires the A-to-B and B-to-C lanes to each INDEPENDENTLY connect the entry area to the north cross-aisle, and adds a western and an eastern bypass, so parallel routes are a design requirement rather than an accident. If the bake severs BA-1's pinch, endpoints on either side of it stay connected around Shelf C and CalculatePath still returns PathComplete. An earlier revision of this gate asserted exactly that and so could not detect the severance it existed to detect. THEREFORE, FOR EACH LANE, THE GATE MUST PROVE THE PATH TRAVERSES THAT LANE and not merely that its endpoints are connected: assert that the returned NavMeshPath's corners remain within the lane's own X and Z envelope as NSC-045 AC-002 bounds it, so a route that escapes into a neighbouring aisle fails. ENDPOINTS COME FROM NSC-045's NAMED BOUNDARIES AND LONGITUDINAL EXTENTS, NEVER FROM THE MIDPOINT OF AN OBSTACLE PAIR. A midpoint rule picks points inside obstacles here: after NSC-045 lands, Shelf C's east face is X 4 and the eastern walkable bound is X 12, and their midpoint X 8 at Z 9 lies INSIDE E-1, whose footprint is X 7 to 11.75 by Z 5.5 to 13.5. Sampling must also be tight and checked: the committed door tests call NavMesh.SamplePosition with a 2-unit radius, which would silently relocate a rejected point onto a neighbouring route, after which every later assertion passes about the wrong place. Assert that each sampled position is still inside its intended lane before using it. For each of AC-001's six lanes and for the D1-to-D2 route, sample both endpoints onto the baked surface with NavMesh.SamplePosition and assert the agent's CalculatePath returns NavMeshPathStatus.PathComplete. PathPartial FAILS, and so does a true return value with a non-complete status - CalculatePath returning true means it produced a path, not that the path arrives, and asserting only the return value is the shape that passes on a severed NavMesh. This is the status DoorPassabilityConnectionPlayModeTests and DoorEnemyPassabilityPlayModeTests already assert, and EnemyPursuitMovement.cs itself acts on PathComplete, so the gate asserts the same condition the game depends on. THE SCENE CARRIES NO BAKED NAVMESH AND THE GATE MUST BUILD ONE. Assets/Scenes/Rooms/BoneArchive.unity holds NavMeshSettings with no NavMesh data, and NSC-045 AC-006 keeps navigation configuration out of the room scene, so loading the room alone leaves nothing to sample and every assertion above would fail for the wrong reason. Build a GameplayNavigationSurface over the loaded scene's committed GameplayGeometry colliders with ConfigureAndBuild, as the two door tests do - but over the COMMITTED colliders rather than over colliders the fixture creates, which is the distinction INT-002 draws. Because that API collects every collider present, state how the fixture isolates the room from any other loaded geometry, then ClearBakedData, destroy the fixture objects and unload the scene without saving. No production file has to change for this and none may be changed: this task owns one test file. THE GATE MUST NOT BE SATISFIED BY COMPARING WIDTHS, AND THE REASON IS ARITHMETIC RATHER THAN STYLE: ProjectSettings/NavMeshAreas.asset sets agentRadius 0.5, so a 1.0-diameter agent clears every lane above on arithmetic alone and clears the 2.5 pinch by 0.75 on each side. Every width comparison available here passes before the NavMesh is consulted, and NSC-045's own Edit Mode gates already make them. What can actually fail is the BAKE - erosion by the agent radius and voxel rounding can sever a gap the raw geometry clears - and proving the bake is the only thing this Play Mode gate can do that Edit Mode cannot. Record in the test output the agent radius the run used, so a later widening of the agent shows up here as a failure rather than as a silent change of what was proven."
    }
  ],
