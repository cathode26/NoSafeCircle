      "reference": "NSC-029 VAL-001; NSC-025 INT-001; NSC-014 INT-001; GDD — Approved Five-Room Spatial Layout Blockout §§6 and 12",
      "requirement": "Play Mode validation loads the committed Bone Archive scene asset - not a builder-produced in-memory scene and not a synthetic corridor - and proves traversal with the NavMesh agent configuration NSC-089 delivers and the pursuit and search movement NSC-092 delivers. FOR EACH OF AC-001's FIVE LANES AND FOR THE D1 TO D2 ROUTE, the gate samples both endpoints onto the baked surface with NavMesh.SamplePosition and asserts that the agent's CalculatePath returns a path whose status is NavMeshPathStatus.PathComplete. PathPartial FAILS, and so does a true return value with a non-complete status - CalculatePath returning true means it produced a path, not that the path arrives, and asserting only the return value is the shape that passes on a severed NavMesh. This is the pattern already committed in DoorPassabilityConnectionPlayModeTests and DoorEnemyPassabilityPlayModeTests, and EnemyPursuitMovement.cs itself acts on PathComplete, so the gate asserts the same condition the game depends on. THE GATE MUST NOT BE SATISFIED BY COMPARING WIDTHS, AND THE REASON IS ARITHMETIC RATHER THAN STYLE: ProjectSettings/NavMeshAreas.asset sets agentRadius 0.5, so a 1.0-diameter agent clears all five lanes with room to spare and the 2.5 pinch by 0.75 on each side. Every width comparison available here passes before the NavMesh is consulted, and the committed Edit Mode test Layout_PreservesLaneWidthsAndBypasses already makes them. WHAT CAN ACTUALLY FAIL IS THE BAKE - erosion by the agent radius and voxel rounding can leave a gap disconnected where the raw geometry is wide enough - and proving the bake is the only thing this Play Mode gate can do that Edit Mode cannot. Record in the test output the agent radius the run used, so a later widening of the agent shows up here as a failure rather than as a silent change of what was proven. Expectations are derived from BoneArchiveLayout at run time and never written in as literals: the Edit Mode test hardcodes the room bounds as plus and minus ten, which agrees with BoneArchiveLayout.RoomBounds today, and NSC-101 has already widened RoomBounds on other rooms, so a literal here would keep asserting against a room that no longer exists. BoneArchiveLayout.ClearWidthBetween may be used to measure a pair this contract names but never to DISCOVER lanes: it returns right.min.x minus left.max.x with no check that the two bounds overlap in Z, so for any pair that does not overlap it returns a number that is not a lane. The five pairs above were each verified to overlap in Z."
    }
  ],
