  "notes": "This follow-up validates committed room geometry with the delivered navigation agent and enemy movement; it does not edit the room scene, its builder, or its layout data. The one focused test closes NSC-025 INT-001 and NSC-014 INT-001 without treating synthetic geometry as equivalent proof. REVISION 5, 2026-09-22 - the design review this task never received. It and NSC-072 both fell out of the 2026-09-14 GER cohort and were reviewed by neither the released nor the active list for eight days. Two defects, both of them undefined sets, and both turned out to be citable rather than genuinely open: \"every intended lane\" and \"an impassable APPROVED lane\" named no authority, while BoneArchiveLayout and the committed Edit Mode test Layout_PreservesLaneWidthsAndBypasses enumerate exactly five lanes between them. Naming that set beats inventing one, because a test author faced with an undefined set invents a set and the gate then passes on whatever was invented. THE MORE IMPORTANT CHANGE IS WHAT THE GATE PROVES. With agentRadius 0.5 every lane here clears the agent arithmetically, so a width-comparing gate can never fail and the Edit Mode test already compares widths; the Play Mode gate now has to assert PathComplete on the baked surface, which is the only failure this task can actually detect. Pre-checked before revising: NSC-071 is not_delivered with no selected record and no committed delivery, baseline or revalidation evidence, so no revision here un-delivers anything. Its dependencies NSC-089 and NSC-092 are both conformant; NSC-045 is not, so this task waits on the Bone Archive blockout rather than on anything in this contract. NSC-025 and NSC-014 were verified to be live active tasks in conformant state, not superseded ids, so the references naming them stand. The em dash and section marks in the reference field are correct UTF-8 and were NOT repaired - they render as replacement characters in a Windows console, which is a reader artifact and not damage to the contract. REVISION 6, 2026-09-22, answering a \"revise\" verdict from the post-commit contract check on revision 5 - job codex-closure-NSC-071-rev5-20260922-2119, report at C:\\\\nscrev\\\\codex-jobs\\\\, run through the repaired run_closure_review.sh, which resolved Codex v0.155.0-alpha.9.2. It was the first live contract review through that script since its 2026-09-20 repair, and it returned three findings that were all real. Each was verified here at source before being acted on. TWO OF THEM ARE THE SAME MISTAKE SEEN FROM DIFFERENT SIDES. Revision 5 took the lane set from BoneArchiveLayout and the Edit Mode test on main, which is a real authority that exists and is checkable, and was pleased to have found it instead of inventing one. It is the WRONG authority: NSC-071 runs after NSC-045 rewrites this room, so the geometry that governs is the dependency's, and NSC-045 INT-002 had already named the six lanes this task must validate. Proving the haystack exists does not establish it is the right haystack. And revision 5's gate asserted PathComplete between the ends of each lane, in a room whose own acceptance criteria REQUIRE parallel independent routes - so a severed pinch would have routed around Shelf C and passed. A gate that cannot fail was the defect revision 5 was written to fix, and it reintroduced it one level up, in the mechanism instead of the measurement. DOWNSTREAM DEBT, recorded and deliberately not acted on: the check notes that NSC-025 INT-001 and NSC-089 INT-001 still carry the \"every intended lane\" wording. Both tasks are conformant, and revising a delivered task's obligation text risks its evidence, so that is a separate decision with a cost rather than a tidy-up to fold in here.",
