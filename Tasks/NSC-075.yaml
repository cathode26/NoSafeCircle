      "requirement": "DoorPrototypeSceneBuilder.Build remains the public materialization command and delegates wizard Animator construction to DoorPrototypeGlobalSceneBuilder. The global builder owns changed Animator controller and clip references and is idempotent across two runs: the second run changes no generated controller, clip, placeholder asset or .meta import setting. Assets/Scenes/DoorPrototype.unity is excluded from byte comparison because Unity regenerates its local fileIDs on every save; the scene content this task owns is proven by the saved-scene assertions of VAL-001 and VAL-006. The worker edits source and focused tests only; generated Animator assets and scene serialization are produced by the repository's Unity builder and are never hand-edited."
