    {
      "criterion_id": "AC-006",
      "reference": "GER Agent design decision W1, 2026-09-17: the NSC-077 AC-003 camera-facing Visual treatment applied to the wizard; Vincent, 2026-09-17: \"the wizards dont look nearly as good sadly\" and \"Whatever you have done to make the enemy look great and in perspective, the wizards need that treatment.\"",
      "requirement": "Give the Player's Visual child the same camera-facing treatment NSC-077 AC-003 gives the enemy Visual. DoorPrototypeGlobalSceneBuilder.BuildPlayer creates the wizard's Visual through DoorPrototypeSceneBuilder.CreateWorldSpriteVisual with Quaternion.Euler(IsometricCameraEulerAngles) and world size Vector2.one, as BuildChaseEnemy and BuildLanternWraith already do, instead of today's Quaternion.identity and (1, 2). The Visual's local scale is therefore a uniform (1, 1, 1), and a 180x180 frame imported at 90 pixels per unit (AC-003) spans the 2x2-world-unit character box. WizardAnimationController sets the Visual's world rotation to Quaternion.Euler(30, -45, 0) every frame, including after the Player root is rotated, so the sprite never leans, thins or turns edge-on. The rotation is WizardAnimationController's own runtime constant, not a reference to the Editor-only DoorPrototypeGlobalSceneBuilder field; an Edit Mode test in WizardArtIntegrationTests asserts that the constant equals DoorPrototypeGlobalSceneBuilder.IsometricCameraEulerAngles, the pattern NSC-077 AC-003 uses for EnemyAnimationController. The Visual's pivot stays at the wizard's floor-contact point: its world Y stays within 0.01 of the floor height under the wizard while idle and walking. AC-007 may change how that point is derived. Do not edit EnemyAnimationController.cs, which is NSC-077's resource."
    },
    {
      "criterion_id": "AC-007",
      "reference": "GER Agent design decision W3, 2026-09-17 (Vincent, 2026-09-17: \"The door wizard sorting order is wrong\"; his screenshot shows the D1 door sprite drawn over the wizard's upper body); DoorPrototypeSceneBuilder's NSC-039 sorting-convention comment and DoorPrototypeGlobalSceneBuilder.BuildCamera. The existing DoorPrototypeSceneBuilderTests.Build_PlayerAndDoorDepthKeysCrossAtTheDoorGroundPlane passes while the defect is visible, so sort keys alone do not prove the draw order.",
      "requirement": "In the production-built Assets/Scenes/DoorPrototype.unity under its gameplay camera, the wizard's Visual draws over D1's DoorRoot/DoorVisual/DoorSprite whenever the wizard's floor-contact point is on the camera side of that sprite's pivot (the Ruined Entry side, smaller world Z), with D1 closed or open, and DoorSprite draws over the wizard when the wizard is on the far side with D1 open. Vincent's 2026-09-17 report (the D1 door sprite drawn over the wizard's upper body) is reproduced by the VAL-007 test failing before the fix. Keep the NSC-039 sorting band unchanged: the shared sortingLayerName \"Default\" and sortingOrder 0 (DoorPrototypeSceneBuilder.WorldSpriteSortingLayerName and WorldSpriteSortingOrder), SpriteRenderer.spriteSortPoint Pivot, and BuildCamera's TransparencySortMode.CustomAxis with axis (0, 1, 0.26). Fix the defect only in WizardAnimationController.cs and the wizard-owned code in DoorPrototypeGlobalSceneBuilder.cs, for example how the Visual's floor-contact position is derived at runtime. If no VAL-007 placement fails before the fix, or the fix needs DoorPrototypeSceneBuilder.cs, the door's visuals, the camera's sort mode or axis, or another file this task does not claim, stop and escalate to the GER Agent with the test and its measurements instead of editing them. Wall sorting is outside this task."
