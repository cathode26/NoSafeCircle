n this task lands, each spawn moves into its intended room under the 2026-09-15 approved bounds and must pass the bounds/wall-inset, NavMesh, and collider-clearance checks nsc-33's NSC-077 review motivated. Revision 7 (2026-09-17): AC-005's placement intent is defined by deterministic oracles (counts, per-room distribution, door-line distances, opposite sides, Linecast sight lines, Final Room D4 coverage) and VAL-008 asserts them; the no-fixed-squad branch applies only when the builder no longer declares the squad arrays. Revision 8 (2026-09-17): sight lines target door approach points instead of the Bone Archive door-line midpoint, which lies inside Shelf C; the unreachable no-fixed-squad branch moves to a downstream obligation for NSC-030's materialization child.",
