  "notes": "This child integrates authored room and door content only; it does not implement encounter placement, door lifecycle internals, or victory coordination internals. The five Assets/Scenes/Rooms/*.unity files are immutable composition inputs: this task reads them, verifies their hashes are unchanged before and after composition, and never claims them as write resources. TaskGraph has no read-only context-path field, so this input boundary is enforced by exact write scope and validation evidence. Revision 5 carries the settled 2026-09-15 room table into this contract: Ruined Entry X [-14,+14] Z [-26,0], Bone Archive X [-12,+12] Z [0,20], Chapel of Ash X [-18,+18] Z [20,54], Lower Vault X [-20,+20] Z [54,76], and Final Room X [-15,+15] Z [76,104], with D1 (0,0), D2 (6,20), D3 (-8,54), D4 (4,76), and D5 (0,104). NSC-049 now owns Assets/NoSafeCircle/DoorPrototype/Tests/Editor/World/CommittedRoomSourceSceneConformanceTests.cs, which the four room contracts cite only as regression-only evidence for their own gates. The shared-boundary wall exclusion (AC-004) is composition-only: it never edits a room source scene, and it never removes a west or east perimeter wall. The batched refresh (AC-001, VAL-002) is triggered once NSC-046, NSC-047, and NSC-048 land their combined RoomSceneCatalog.cs and RoomSceneCatalog.asset changes together (GER room decision 4, 2026-09-15); it gates that landing rather than being gated by it, and NSC-044 through NSC-048's own completion gates do not wait for it. The door feedback proof (VAL-006) and the NSC-017 INT-003 check (VAL-007) are automated proofs only; they do not substitute for Vincent's gameplay-camera review (VAL-005) and do not authorize a different door-art or wall-tiling choice than NSC-065 and the room contracts already deliver. Revision 6 (2026-09-17) adds AC-005, AC-006 and VAL-008 to carry NSC-030 INT-006's fixed-squad reconciliation into this contract: if BuildChaseEnemies still builds its fixed melee/ranged squad when this task lands, each spawn moves into its intended room under the 2026-09-15 approved bounds and must pass the bounds/wall-inset, NavMesh, and collider-clearance checks nsc-33's NSC-077 review motivated. Revision 7 (2026-09-17): AC-005's placement intent is defined by deterministic oracles (counts, per-room distribution, door-line distances, opposite sides, Linecast sight lines, Final Room D4 coverage) and VAL-008 asserts them; the no-fixed-squad branch applies only when the builder no longer declares the squad arrays. Revision 8 (2026-09-17): sight lines target door approach points instead of the Bone Archive door-line midpoint, which lies inside Shelf C; the unreachable no-fixed-squad branch moves to a downstream obligation for NSC-030's materialization child. *** REVISION 10, 2026-09-27: THE OLD WORLD WAS DELETED AT fe4c95ad AND THIS CONTRACT ASSERTED AGAINST IT IN TWELVE PLACES. *** Six gates, two criteria and four owned resources, corrected in one revision because they are one fault. THE DEAD SET WAS TAKEN FROM THE DELETION COMMIT ITSELF - 40 paths, all 40 verified still absent from main, 6 scenes and 14 test fixtures - never from a text search. TWO OF THE SIX GATES REQUIRED A DELETED ARTIFACT WITHOUT NAMING ONE, and they failed in OPPOSITE directions: VAL-001 named no file at all and asked for \"committed-scene validation\" of scenes that no longer exist, while VAL-006 named a file that is ALIVE and loaded a scene that is DEAD. A filename matcher passes both. No predicate over gate text finds them; only reading does, which is why the published count of broken gates here went 3 to 5 to 7 across three measurements by two other agents before I read all eight myself. VAL-008 WAS A THIRD CATEGORY - DEGRADED, NEITHER DEAD NOR CLEAR. It offered a choice of two fixtures and one was deleted, so one peer's matcher flagged it and another peer's reading cleared it AND BOTH WERE CORRECT: it is still satisfiable, its stated choice is now a non-choice, and the surviving branch was never verified against the gate's own condition - which was the entire reason two were offered. The dead branch is dropped and the condition is now stated as something to DEMONSTRATE in the run rather than assume. VAL-002 IS UNTOUCHED AND WAS ALWAYS CLEAR. NOTHING IS REPOINTED AT Assets/Scenes/RuntimeWorld.unity, DELIBERATELY: it is 8,685 bytes with 13 components and 3 named objects - a Directional Light, a Main Camera and one unnamed - and zero colliders. Repointing would aim these gates at a three-object bootstrap. The world is assembled at runtime by GameBootstrap and the spawners, on Vincent's decision quoted in PropSpawner's header, so every rewritten gate asserts against THE WORLD THE RUNTIME BUILD PRODUCES and must assert it was built before measuring anything. The existing hook is GameBootstrap.HasBuilt via FiveRoomDoorSequencePlayModeTests.WaitForWorldBuilt; the gates require THE ASSERTION and not that member's name, so a rename cannot kill them again. WHAT IS ALREADY IMPLEMENTED, measured by the Pipeline Runner at main and confirmed by me at source: FiveRoomDoorSequencePlayModeTests.cs is 763 lines, loads RuntimeWorld at four sites each followed by WaitForWorldBuilt, carries ZERO [Explicit] and ZERO Assert.Ignore across 18 [UnityTest] methods, already implements VAL-007 at ComposedScene_BrokenDoor_NavMeshPathReconnectsAcrossDoorway with NavMesh.SamplePosition on both sides and PathComplete required, and already implements VAL-008 as nine separately named cases in a nested FixedSquadSpawnPositionTests fixture. SO VAL-007 AND VAL-008 ARE NOT REWRITE-FROM-SCRATCH. NOT ESTABLISHED, and it is the expensive limit: NOBODY HAS RUN ANY OF THIS AT CURRENT MAIN. No checkout is at main, the warm trees are hours behind, and advancing a prepared task's checkout is its own failure mode, so proving it costs a cold import. The gates are written to be satisfiable and none of them is claimed satisfied. ALSO NOT ESTABLISHED: whether the other tasks in the deletion census carry unnamed dependencies of the VAL-001 or VAL-006 shape. Given two of eight here, assume some do. *** AND THE VALIDATION POLICY WAS CARRYING THE SAME FAULT, CAUGHT BY contract_commit.py's DRY RUN AT THE MOMENT OF COMMITTING. *** The entry bound EditMode to NoSafeCircle.DoorPrototype.Tests.Editor.World.FiveRoomCompositionTests - THE FIXTURE DELETED AT fe4c95ad. A filter naming a class that does not exist DISCOVERS ZERO TESTS, AND ZERO DISCOVERED TESTS READ AS A PASS, so the rebind would have carried a silently-green EditMode platform forward into revision 10. The entry is now PlayMode only, bound to FiveRoomDoorSequencePlayModeTests, which exists and is 763 lines. I DID NOT INVENT AN EditMode CLASS NAME TO REPLACE IT: VAL-003 and VAL-004 deliberately no longer name a platform, so when an implementer gives them an EditMode home this contract needs a revision to add that platform and filter. Binding a guessed name would reproduce the exact fault being removed. THE DRY RUN IS WHY THIS WAS CAUGHT AND NOT SHIPPED - the plan line printed the filters, and reading it was the whole check. *** REVISION 11, 2026-09-27: AC-006 CARRIED A 0.1-UNIT LITERAL THAT FAILS A CORRECT SPAWN, AND IT IS THE SAME SHAPE AS THE NSC-120 DEFECT I RULED ON TWO HOURS EARLIER. *** NSC-120's AC-003 named an EDGE (Renderer bounds minimum); this named a DISTANCE (0.1 units). Both are literals, both were written before the world they measure existed, and both fail correct work while passing as careful. A criterion naming a MECHANISM is a literal wearing a verb, one naming an EDGE is a literal wearing a noun, and one naming a TOLERANCE is a literal wearing a measurement. THE FIX IS NOT A BIGGER NUMBER. Splitting the check into a HORIZONTAL condition, which is what this contract actually authored, and a VERTICAL one sourced from NavMesh.GetSettingsByIndex(0), which is a property of the bake, makes the two failure modes distinguishable - and they need opposite remedies. The old single distance reported an obstructed spawn and a too-tight tolerance identically. AND VAL-008's OPEN CONDITION IS NOW ANSWERED, which closes the question rev 10 deliberately left open: ComposedScene_BrokenDoor_NavMeshPathReconnectsAcrossDoorway PASSED in both runs, so the surviving fixture DEMONSTRABLY reaches the baked gameplay NavMesh and VAL-008's stated condition is met by the branch that survived the deletion. VAL-007's implementation passes as well. Rev 10 required this to be demonstrated by a query succeeding in the same run rather than asserted in a comment; it has been. WHAT THIS DOES NOT MEAN: VAL-008 IS NOT SATISFIED. Its surviving branch runs and FAILS 2 OF 9 ORACLES, so this task cannot pass that gate today - one failure is a real obstruction defect and the other was the contract's own tolerance. Fixing the criterion removes one of the two; the BoneArchive spawn remains genuine work. PROVENANCE OF THE FIGURES: the two test-results.xml parses are the Pipeline Runner's, taken from runs the Game Agent executed, and I did not re-run them - no checkout is at main and I said so in rev 10. I verified what I could reach: AC-006's 0.1 literal at source, and that NavMesh.GetSettingsByIndex(0) is already this project's single source for agent parameters across eight sites including the surviving fixture, so (b) names something real rather than something I invented. Both runs were on a warm tree whose sha was not captured.",
