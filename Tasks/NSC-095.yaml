  "notes": "Vincent, 2026-09-16 (density decision B): \"The wizard should be 128x128\"; on the one-facing trial he answered \"yes\" to option B, re-making characters at game size. Vincent, NSC-077 playtest, 2026-09-17: \"The enemies look great.\"; \"the wizards dont look nearly as good sadly\"; \"Whatever you have done to make the enemy look great and in perspective, the wizards need that treatment.\" This task does not claim Unity integration: it produces and audits source art only. Its identities, layout, provenance and audit are separate from NSC-096, the Game Agent crew task that switches DoorPrototypeGlobalSceneBuilder to consume this source. Vincent raised the cap three times on 2026-09-17, after the Art Director stopped at 96 generations and asked as AC-001 requires: \"raise the cap, cost doesnt matter much on art, raise it 40\" (140), then \"Raise the cap to 150\", then \"Then it needs more like 200\"; revision 3 sets 200. Counting rule and why: the per-call printed estimates under-report - one run printed 71 while the account meter moved about 25 more - but the meter is account-wide and other PixelLab tasks move it too, and the Art Director found that billing lags (two further calls printing 2 each moved the meter by only 2), so no per-tool price can be attributed from that gap. The cap therefore counts this task's own recorded calls, with meter readings kept beside them as the cross-check. The forecast for the four wizards is about 105 to 125.",
