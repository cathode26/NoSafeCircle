      "criterion_id": "AC-001",
      "reference": "GER Agent decision X2; Vincent's density decision B, 2026-09-16, and his NSC-077 playtest note, 2026-09-17",
      "requirement": "Use PixelLab only to remake the four approved wizard identities (masculine-light, masculine-dark, feminine-light, feminine-dark) as transparent 128x128 PNGs: for each identity, one standing frame per screen facing (north, north-east, east, south-east, south, south-west, west, north-west) plus a six-frame walk cycle in each of those eight facings, exactly 4 x (8 + 48) = 224 files, at Assets/NoSafeCircle/DoorPrototype/Art/Wizard/Source/PixelLab128/<key>/selected/standing/<direction>.png and .../selected/walk/<direction>/frame_000.png through frame_005.png. Preserve each identity's hat and band, hair or beard, face, coat or robe, belt book, boots, and the absence of a staff, as far as the approved 180 px source facing shows them; list per-facing exceptions in source-inventory.json with the reason, for Vincent to approve in VAL-002. For example masculine-dark's approved south shows no belt book at all, so create_character v3 had none to rotate. Follow the per-wizard production path: image_to_pixelart (faithful) from the approved standing/south.png; create_character v3 using that result as the reference image; review the 8 rotations against the approved 180 px standing sprites and repair defects with masked inpaint before animating; animate_character v3 once per direction with frame_count 6 and keep_first_frame false, so exactly six frames are stored instead of v3's default reference pose plus six; losslessly centre the raw frames onto 128x128, since v3 returns a different raw canvas per direction (148, 152, 156 and 160 px in the first batch), recording the offset per frame and refusing the step if any opaque pixel would fall outside the 128x128 canvas. The 2026-09-16 trial character 1d1cd21e-dd13-4bcc-9e0d-4c56f84e5e80 may seed masculine-light if its rotations pass review, but its south-east walk's loop-seam feet jump must be re-rolled or given a custom start frame. If PixelLab is unavailable, stop as blocked rather than substituting another generator or hand-edited pixels; a lossless crop or pad is allowed only if recorded. Stop and ask Vincent before exceeding 200 PixelLab generations. Count them from this task's own call log in the generation record - every PixelLab call with its identifier and its measured cost - not from the account balance meter, which other PixelLab tasks also move, and not from the per-call printed estimates, which under-report. Read the meter before and after each batch as the cross-check that reveals that under-reporting, and record both."
    },
    {
      "criterion_id": "AC-002",
      "reference": "GER Agent decision X3; the NSC-078 raw-export precedent",
      "requirement": "Record, per selected frame, the key, direction, frame index, PixelLab character ID, animation or job ID, prompt and settings, raw_size, raw_alpha_bbox, padding_offset, raw_sha256 and selected_sha256 in Assets/NoSafeCircle/DoorPrototype/Art/Wizard/Source/PixelLab128/source-inventory.json. Place raw PixelLab exports under Docs/Art/Wizard/Raw128/<key>/... with no .meta files. Record generation identifiers, prompts, settings and the running generation count against the 200-generation cap, taken from this task's own call log with the balance meter readings beside it in Docs/Art/Wizard/PIXELLAB_128_GENERATION.md, along with the rejects branch name. Commit rejected candidates only on a local art-rejects/NSC-095 branch, never on the task branch."
    },
    {
      "criterion_id": "AC-003",
      "reference": "GER Agent decision X4",
      "requirement": "Leave the approved 180 px sources under Assets/NoSafeCircle/DoorPrototype/Art/Wizard/Source/PixelLab/ (PNGs, .meta files and source-inventory.json) and Docs/Art/Wizard/PIXELLAB_GENERATION.md byte-identical. Make no change to DoorPrototypeGlobalSceneBuilder.cs, any other builder or script, animation clip, Animator controller, prefab or scene, and change no import setting. Every PNG under PixelLab128 has a committed .meta importing it as a 2D texture (TextureImporterShape.Texture2D), either the pipeline's deterministic default TextureImporter meta or a Unity-minted meta committed by exact path in its own commit before any integration binds to it; never a GUID-only stub, which imports as a cubemap. Sprite type, pivot and pixels-per-unit belong to NSC-096."
    },
    {
      "criterion_id": "AC-004",
      "reference": "GER Agent decisions X10-X11 (Art Director option 1 refinement, 2026-09-17)",
      "requirement": "Normalize every facing's standing frame and its six walk frames for one wizard and direction (a group) together, by one whole-pixel shift per group, never per frame, so the group's planted row -- the lower median of the six walk frames' lowest opaque row -- lands on that wizard's single ground_line_y_from_top row, and the standing still's lowest opaque row equals it too. The deepest frame in a group may sit below that line by up to the inventory's recorded max_dip_below_ground_line pixels, at most 6 pixels at 128x128; re-roll a walk cycle that exceeds it. source-inventory.json records ground_line_y_from_top per wizard, alpha_bottom_y_from_top per frame, and per group the median row, the deepest row, and the dip."
    }
  ],
