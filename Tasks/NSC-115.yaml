    {
      "criterion_id": "AC-001",
      "reference": "GDD Section 3 goals name Frost Field slowing a breach",
      "requirement": "An enemy that is inside an active Frost Field reduces a locked door's durability at a lower rate than the same enemy outside one. The reduction is applied at the point where enemy attacks damage door durability, driven by the slow condition NSC-008 already requests, so a single source of truth decides whether an enemy is slowed."
    },
    {
      "criterion_id": "AC-002",
      "reference": "GDD: locked doors provide recovery time, not permanent safety",
      "requirement": "The breach-rate multiplier is a serialized tunable with a stated default rather than a literal buried in the damage path, so balance changes need no contract revision. THE EXACT VALUE IS NOT PINNED BY THIS CONTRACT. What is pinned is the durable relation: slowed breach rate is strictly lower than unslowed, and never zero, because a Frost Field must buy recovery time rather than make a door permanently safe."
    },
    {
      "criterion_id": "AC-003",
      "reference": "NSC-008 owns Frost Field placement and the enemy slow request",
      "requirement": "When the Frost Field expires, is left, or is otherwise no longer affecting the enemy, the breach rate returns to its unslowed value. No residual slow survives the field, and an enemy that never entered a field is unaffected by this task."
    },
    {
      "criterion_id": "AC-004",
      "reference": "NSC-052 AC-005, read at main 05f823604",
      "requirement": "THIS TASK DOES NOT MODIFY DoorBreachFeedback. NSC-052 AC-005 states that door breach feedback is observational only and does not decide enemy attack timing; that boundary is deliberate and is preserved here. The banging, shaking, cracks and durability indicator continue to reflect whatever damage occurs, at whatever rate it occurs, without being taught about Frost Field."
    },
    {
      "criterion_id": "AC-005",
      "reference": "CLAUDE.md: before calling a gap a gap, check whether something specifies it",
      "requirement": "This contract was authored as a NEW task rather than as a revision of NSC-052 after reading NSC-052 at source. Folding this behaviour into NSC-052 would have required deleting or rewriting its AC-005, which exists to keep feedback out of the enemy attack decision. The absence the Producer measured is that boundary working, not a gap in it."
    }
  ],
