      "gate_id": "VAL-001",
      "reference": "CLAUDE.md: assert the durable relation, not the value it has today",
      "requirement": "In Play Mode, FrostFieldDoorBreachPlayModeTests places a locked door and an enemy that breaches it, and measures durability lost over a fixed number of fixed steps in two runs from the same starting durability: one with an active Frost Field covering the enemy, one without. The test asserts the slowed run loses strictly less durability than the unslowed run and strictly more than zero, comparing the two measured runs against each other rather than against a hard-coded expected value, so retuning the multiplier does not break the test. A third run lets the field expire mid-breach and asserts the rate returns to the unslowed figure. The test drives the real NSC-008 slow request rather than setting a slow flag directly, and asserts DoorBreachFeedback's observable state is untouched by this task beyond reflecting the damage that actually occurred."
    }
