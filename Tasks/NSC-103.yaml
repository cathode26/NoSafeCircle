  "notes": "Authored 2026-09-22 on the NSC-102 pattern so NSC-081 can dress NSC-046 without waiting for NSC-078's full forty-five entries. NSC-078 revision 12 released these twenty-one paths FIRST, at dd3ea3cfe: creating the task before the release produces resource groups owned by both tasks, which is contention rather than resolution. THE ONE THING THAT DOES NOT TRANSFER FROM NSC-102 IS THE PIVOT GATE. NSC-102's gate derives the expected pivot from the alpha bounding box's bottom row, which is correct there only because every Bone Archive prop is a standing prop; the NSC-102 design record said in as many words that this reasoning would not hold for the Chapel of Ash, and this is why - ca_sigil_floor_mark is flat floor art whose pivot is the centre. Copying the Bone Archive gate would fail a correct asset. The fixture is flat in Tests/Editor/ rather than Tests/Editor/Environment/, because that directory does not exist on main and NSC-078 owns its .meta - the contended thing is the DIRECTORY. This task claims no PropCatalog.json, no inventory JSON, no directory .meta and no postprocessor; each is in NSC-078's set and claiming any of them recreates the contention that makes a room-by-room split impossible. REVISION 4, 2026-09-22, after the NSC-078 prop family merged at main 16b7972a9: this is a citation repair and nothing else - no resource, dependency, criterion-set or gate-set change. Revision 3 told the implementer to branch on the entry's catalog classification. THERE IS NO SUCH FIELD, measured rather than assumed, and a contract that points at an authority which does not exist invites the reader to invent one; the likeliest substitute here is the footprint height, the exact rule revision 3 was written to withdraw. The operative branch was always the named assignment inside the same gate, so nothing was unsatisfiable and the Chapel chain was never blocked - the defect is that the stated reason pointed nowhere, and the reason is what the next contract gets copied from. The same measurement turned up a real defect in a published asset: ca_sigil_floor_mark, the one entry this contract classifies as lying, ships a ground-line pivot 0.594 world units from where AC-003 puts it, and its .meta is this task's to repair. Reported to the Art Director Agent with fr_ritual_bone_candle_ring at 0.648 and shared_bone_pile_b at 0.492, both of which are other tasks' entries. REVISION 5, 2026-09-22, an hour after revision 4 and for the same underlying reason seen from the other side: revision 4 repaired a citation to something that never existed, and this one withdraws a stated ABSENCE that stopped being true while the contract sat on main. VAL-001 said DungeonPropImportPostprocessor.cs was not on main and that no AssetPostprocessor existed. Both were true when written and both were falsified by the NSC-078 prop-family merge at 16b7972a9, which landed that file at 2708669ba. Verified at source before revising, not taken on report: the file is on main, it is still the only AssetPostprocessor in the repository, its own header states the pivot is the drawn ground line, and it reads no classification at all. A NEGATIVE FACT IS THE EASIEST KIND TO LET ROT, because nothing about it changes when the world does - the sentence keeps reading correctly long after it stopped being true, and this one was written deliberately as a measured absence precisely so a reader would rely on it. The consequence runs opposite to the original warning: there IS an automatic path now, and it does not fail to correct a wrong pivot, it enforces the ground line over any .meta that disagrees. That makes AC-003's centre pivot for ca_sigil_floor_mark unreachable by this task alone until the postprocessor branches on a recorded per-entry classification, which is NSC-078's to land. Found by the Art Director Agent, who edited a .meta to the centre value, ran Unity, and got the committed value back with git reporting no change - and who noticed it because a verifier passed when they expected it to fail. A pass you did not expect is as suspicious as a failure. REVISION 6, 2026-09-22, when candidate/art-director/flat-prop-pivots merged and the trigger this task had been holding fired. Verified at main before revising rather than taken on report: pivot_rule is on all forty-five catalog entries, forty-two ground_line and three lie_within; the three carry centre pivots 0.49, 0.526042 and 0.479167 with their sorting anchors following; the three committed .meta files carry those same values; and DungeonPropImportPostprocessor.cs reads the field and branches on lie_within. THE REAL LESSON IS ABOUT THIS CONTRACT'S OWN DRAFTING AND IT COST FOUR REVISIONS IN ONE EVENING. Revision 3 cited a classification that did not exist. Revision 4 corrected that by stating, as a measurement, that no such field existed - and pinned the branch to a named entry. Revision 5 recorded that the postprocessor had landed and read no classification, so the centre pivot was unreachable. EVERY ONE OF THOSE WAS TRUE WHEN WRITTEN AND FALSE WITHIN TWO HOURS, because each described the state of things OUTSIDE this task's own resources, and that state was being actively worked on by another agent while the contract sat on main. A snapshot of someone else's work has a half-life; the fact that it is correctly measured and correctly dated does not extend it. So revision 6 states the RELATIONSHIP - the gate reads the catalog's per-entry pivot_rule, and an unclassified entry fails - which stays true whatever the catalog says next, and the archaeology moves into these notes where going stale costs nothing. Acceptance criteria and gates should assert what must HOLD; notes are where what was TRUE belongs.",
