      "criterion_id": "AC-003",
      "requirement": "THE PIVOT RULE BRANCHES, AND APPLYING ONE BRANCH TO BOTH KINDS OF PROP FAILS A CORRECT ASSET. For a standing prop the pivot is the MEASURED GROUND LINE: alignment Custom with spritePivot y equal to the number of fully transparent rows below the drawn art divided by the canvas height, and x at the drawn figure's horizontal centre. The catalog's bottom-contact rule assumes the art touches the canvas bottom and these do not, so a constant (0.5, 0) floats a prop above its floor contact - at 64 pixels per unit, fifteen transparent rows is 0.234 world units of hover, which is the wizard-hover defect again. THE FLAT CASE IS SELECTED BY A COMPUTABLE TEST, NOT BY A NAMED LIST: an entry is flat when its art-plan footprint_world_size has h == 0, and a flat entry's pivot is the CENTRE of the alpha bounding box in both axes. For this task's seven that selects exactly one prop, ca_sigil_floor_mark at footprint 2, 2, 0 - the only h == 0 row in all forty-five manifest entries, swept and verified. THE TEST MATTERS MORE THAN THE ANSWER: a prop with zero vertical extent IS the ground plane, so its alpha bounding box has no bottom edge to stand on and the centre is the only meaningful anchor, while anything with h > 0 stands up from the floor however slightly and takes bottom contact. Six entries sit at h between 0.2 and 0.4 - ca_comedy_offering_plate_sock, shared_bone_pile_b, fr_ritual_bone_candle_ring, re_comedy_thumbs_up_skeleton_hand, ba_comedy_skull_with_spectacles and ca_ash_heap - and every one of them would be misjudged by eye as flat. A named list would also need editing each time a prop is added, whereas the height test classifies a future entry automatically and an unclassifiable entry is one whose footprint was never filled in, which is worth failing on. NSC-078's AC-004 and VAL-003 describe the same split as bottom-center for standing props and center for the flat floor-art entries the catalog marks, citing ca_sigil_floor_mark and fr_ritual_bone_candle_ring AS EXAMPLES rather than as a closed set; an earlier wording of this criterion read that as exactly two entries and that over-reading is withdrawn. NOTE THE OPEN CONFLICT, WHICH IS NOT THIS TASK'S TO RESOLVE: fr_ritual_bone_candle_ring has h == 0.3, so the height test makes it bottom-contact while NSC-078 offers it as a centre example. It is a Final Room prop and not among this task's seven, so nothing here depends on the answer, but PropCatalog.json must state which governs before that prop is published. This task does not own PropCatalog.json and must not claim it. Applying the standing-prop rule to ca_sigil_floor_mark would compute an expectation the correct asset cannot meet.",
