      "gate_id": "VAL-002",
      "requirement": "THE PIVOT GATE COMPUTES ITS OWN EXPECTATION FROM THE COMMITTED IMAGE AND BRANCHES ON THE PROP KIND. For each of the seven, decode the committed PNG, compute the alpha bounding box, and derive the expected pivot: for the six standing props, expected y is the canvas height minus the bounding box's bottom row divided by the canvas height, with x at the bounding box's horizontal centre; for ca_sigil_floor_mark, expected pivot is the bounding box's centre in both axes. Assert the imported sprite's pivot equals the expected value within one pixel. THE EXPECTED VALUE IS COMPUTED FROM THE COMMITTED IMAGE AND IS NEVER WRITTEN INTO THE TEST AS A CONSTANT: a gate asserting a fixed (0.5, 0) would pass a floating prop and fail a correct one, and a gate applying the standing-prop formula to the flat entry would fail a correct one. The branch is selected by the entry's pivot_rule in the committed PropCatalog.json - lie_within takes the alpha-box centre, anything else the measured ground line - and NOT by any measurement the gate takes for itself. That field is on main for all forty-five entries. Two earlier wordings are withdrawn and both are recorded so neither is reintroduced: one sent the implementer to a catalog classification that did not yet exist, and its replacement pinned the branch to the single entry this contract names, which was correct only while the field was missing and does not generalise to a prop nobody has drawn yet. A gate written to read a missing field substitutes a proxy, and the likeliest proxy here is the footprint height - precisely the rule this task withdrew in its own revision three. A footprint height of zero is sufficient evidence of lying and may be relied on; a non-zero height proves nothing either way, because an object whose parts rise can still lie within its area. An entry this contract does not name, or one whose footprint cannot be resolved, must FAIL the gate rather than default to either branch: a default silently hands the next author the standing-prop rule, which is the gate-enforces-the-bug shape this gate exists to prevent.",
