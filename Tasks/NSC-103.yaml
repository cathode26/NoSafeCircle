      "criterion_id": "AC-003",
      "requirement": "THE PIVOT RULE BRANCHES, AND APPLYING ONE BRANCH TO BOTH KINDS OF PROP FAILS A CORRECT ASSET. For a standing prop the pivot is the MEASURED GROUND LINE: alignment Custom with spritePivot y equal to the number of fully transparent rows below the drawn art divided by the canvas height, and x at the drawn figure's horizontal centre. The catalog's bottom-contact rule assumes the art touches the canvas bottom and these do not, so a constant (0.5, 0) floats a prop above its floor contact - at 64 pixels per unit, fifteen transparent rows is 0.234 world units of hover, which is the wizard-hover defect again. THE FLAT CASE IS SELECTED BY WHAT THE ART DEPICTS, AND THE CATALOG RECORDS THAT JUDGEMENT PER ENTRY IN pivot_rule. An entry marked lie_within takes the CENTRE of the alpha bounding box in both axes; anything else takes the measured ground line. THE GATE READS THAT FIELD AND DOES NOT RE-DECIDE IT, and an entry whose pivot_rule is missing or unrecognised FAILS rather than defaulting to either branch. WHY A PER-ENTRY FIELD AND NOT A DERIVATION, which is the part worth keeping because it will be proposed again: no measurement and no category map can produce this answer. shared_bone_pile_a and shared_bone_pile_b both carry identity_category bone_pile and classify differently, so no mapping from category can separate them. A footprint height of zero is sufficient evidence of lying but is not necessary - fr_ritual_bone_candle_ring has h == 0.3 because its candles rise, yet the OBJECT lies, its bottom edge being the near rim of a foreshortened ellipse rather than a base, so anchoring there would shove the whole ring behind its layout point. And there is no threshold to retreat to: ranking all forty-five by h divided by z gives a continuum rather than a break - sigil 0.00, ring 0.20, shared_rubble_scatter_b 0.33, shared_bone_pile_b 0.37, ca_ash_heap 0.40 - so any cut would be tuned to whichever cases its author happened to examine. It is a per-entry art judgement, which is why it is recorded rather than derived. The question is whether the object LIES WITHIN an area - a mark, a ring, bones strewn across the floor - or STANDS ON a base: a heap, a plate, a column. A lying object's pivot is the CENTRE of the alpha bounding box in both axes; a standing object's is the measured ground line. A FOOTPRINT HEIGHT OF ZERO IS SUFFICIENT FOR LYING BUT IS NOT NECESSARY, and an earlier revision of this criterion made it the whole test, which was wrong: fr_ritual_bone_candle_ring has h == 0.3 because its candles rise, yet the OBJECT lies - its bottom edge is the near rim of a foreshortened ellipse rather than a base, so anchoring there would shove the whole ring behind its layout point. THERE IS NO THRESHOLD TO RETREAT TO: ranking all forty-five entries by h divided by z gives a continuum and not a break - sigil 0.00, ring 0.20, shared_rubble_scatter_b 0.33, shared_bone_pile_b 0.37, ca_ash_heap 0.40 - so any cut would be tuned to whichever cases the author happened to examine. For this task's seven the two rules agree and ca_sigil_floor_mark (footprint 2, 2, 0) is the only lying entry, but the contract states the real discriminator rather than the coincidence, because the height test would misclassify a future prop while reporting nothing. For this task's seven that selects exactly one prop, ca_sigil_floor_mark at footprint 2, 2, 0 - the only h == 0 row in all forty-five manifest entries, swept and verified. THE TEST MATTERS MORE THAN THE ANSWER: a prop with zero vertical extent IS the ground plane, so its alpha bounding box has no bottom edge to stand on and the centre is the only meaningful anchor, while anything with h > 0 stands up from the floor however slightly and takes bottom contact. Six entries sit at h between 0.2 and 0.4 - ca_comedy_offering_plate_sock, shared_bone_pile_b, fr_ritual_bone_candle_ring, re_comedy_thumbs_up_skeleton_hand, ba_comedy_skull_with_spectacles and ca_ash_heap - and every one of them would be misjudged by eye as flat. A named list would also need editing each time a prop is added, whereas the height test classifies a future entry automatically and an unclassifiable entry is one whose footprint was never filled in, which is worth failing on. NSC-078's AC-004 and VAL-003 describe the same split as bottom-center for standing props and center for the flat floor-art entries the catalog marks, citing ca_sigil_floor_mark and fr_ritual_bone_candle_ring AS EXAMPLES rather than as a closed set; an earlier wording of this criterion read that as exactly two entries and that over-reading is withdrawn. NOTE THE OPEN CONFLICT, WHICH IS NOT THIS TASK'S TO RESOLVE: fr_ritual_bone_candle_ring has h == 0.3, so the height test makes it bottom-contact while NSC-078 offers it as a centre example. It is a Final Room prop and not among this task's seven, so nothing here depends on the answer, but PropCatalog.json must state which governs before that prop is published. This task does not own PropCatalog.json and must not claim it. Applying the standing-prop rule to ca_sigil_floor_mark would compute an expectation the correct asset cannot meet. THE PIVOTS AND THE IMPORTER NOW AGREE AND THIS CRITERION IS SATISFIABLE; three earlier statements here described a world that has since changed and are withdrawn rather than reworded. They said, correctly at the time, that no catalog field recorded this classification, that ca_sigil_floor_mark shipped a ground-line pivot 0.594 world units from where this criterion puts it, and that the centre pivot was UNREACHABLE because DungeonPropImportPostprocessor.cs applied the ground-line rule to every asset under its prop root and overwrote any .meta that disagreed - so the task must not be dispatched expecting AC-003 to be satisfiable. ALL THREE WERE OVERTAKEN when the flat-prop-pivot work merged: the catalog carries pivot_rule on all forty-five entries, the postprocessor reads it and honours lie_within, and the three affected .meta files carry their centre pivots. NOTHING HERE WAS EVER A GATE DEFECT - NSC-102's and NSC-078's gates assert the ground-line rule and their files satisfied it exactly; the classification simply did not exist when they were written. INT-002's condition is now met rather than merely triggered: re-importing these seven is a no-op, because the settings the postprocessor applies are the ones this task proves.",
