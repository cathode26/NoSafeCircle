  "notes": "Authored 2026-09-22 on the NSC-102 pattern so NSC-081 can dress NSC-046 without waiting for NSC-078's full forty-five entries. NSC-078 revision 12 released these twenty-one paths FIRST, at dd3ea3cfe: creating the task before the release produces resource groups owned by both tasks, which is contention rather than resolution. THE ONE THING THAT DOES NOT TRANSFER FROM NSC-102 IS THE PIVOT GATE. NSC-102's gate derives the expected pivot from the alpha bounding box's bottom row, which is correct there only because every Bone Archive prop is a standing prop; the NSC-102 design record said in as many words that this reasoning would not hold for the Chapel of Ash, and this is why - ca_sigil_floor_mark is flat floor art whose pivot is the centre. Copying the Bone Archive gate would fail a correct asset. The fixture is flat in Tests/Editor/ rather than Tests/Editor/Environment/, because that directory does not exist on main and NSC-078 owns its .meta - the contended thing is the DIRECTORY. This task claims no PropCatalog.json, no inventory JSON, no directory .meta and no postprocessor; each is in NSC-078's set and claiming any of them recreates the contention that makes a room-by-room split impossible.",
