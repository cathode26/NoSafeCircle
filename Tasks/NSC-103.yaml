    {
      "gate_id": "VAL-002",
      "requirement": "THE PIVOT GATE COMPUTES ITS OWN EXPECTATION FROM THE COMMITTED IMAGE AND BRANCHES ON THE PROP KIND. For each of the seven, decode the committed PNG, compute the alpha bounding box, and derive the expected pivot: for the six standing props, expected y is the canvas height minus the bounding box's bottom row divided by the canvas height, with x at the bounding box's horizontal centre; for ca_sigil_floor_mark, expected pivot is the bounding box's centre in both axes. Assert the imported sprite's pivot equals the expected value within one pixel. THE EXPECTED VALUE IS COMPUTED FROM THE COMMITTED IMAGE AND IS NEVER WRITTEN INTO THE TEST AS A CONSTANT: a gate asserting a fixed (0.5, 0) would pass a floating prop and fail a correct one, and a gate applying the standing-prop formula to the flat entry would fail a correct one. The branch selection is computed from the art plan's footprint_world_size - h == 0 selects the centre branch, h > 0 selects bottom contact - rather than read from a list in this contract, so a prop added later is classified automatically. An entry whose footprint cannot be resolved, or which the catalog marks flat while its footprint says otherwise, must FAIL the gate rather than default to either branch: a default silently hands the next author the standing-prop rule, which is the gate-enforces-the-bug shape this gate exists to prevent.",
