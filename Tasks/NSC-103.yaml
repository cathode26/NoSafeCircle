      "requirement": "From a clean candidate checkout the Edit Mode fixture NoSafeCircle.DoorPrototype.Tests.Editor.ChapelOfAshPropImportTests runs and passes. This task owns that file and its .meta, so a validation filter naming the fixture resolves to exactly one type. For each of the seven props the fixture loads the asset through AssetDatabase and asserts that the loaded object IS a Sprite - not merely that the file exists - then asserts each of the AC-002 importer values. THAT ABSENCE IS WITHDRAWN AND THE SITUATION IS NOW THE OPPOSITE ONE. An earlier revision of this gate recorded, correctly at the time, that NSC-078's DungeonPropImportPostprocessor.cs did not exist on main and that no other AssetPostprocessor did either, so nothing automatic could correct a wrong .meta and this fixture was the only check in existence. BOTH HALVES STOPPED BEING TRUE when the NSC-078 prop family merged at 16b7972a9, which carried that file in at 2708669ba; it is now on main at Assets/NoSafeCircle/DoorPrototype/Editor/Art/DungeonPropImportPostprocessor.cs and it is still the only AssetPostprocessor in the repository. THE CORRECTION MATTERS IN THE OPPOSITE DIRECTION TO THE ORIGINAL WARNING: the automatic path does not fail to correct a wrong .meta, it ACTIVELY ENFORCES ONE VALUE. It matches every asset under its prop root and writes spriteAlignment Custom with the pivot it computes, AND IT NOW READS PropCatalog.json's per-entry pivot_rule to choose the branch, honouring lie_within with the alpha-box centre and taking the measured ground line otherwise. An earlier revision recorded that it read no classification at all, which was true when written and is withdrawn. THE FIXTURE MUST THEREFORE ASSERT AGREEMENT RATHER THAN A VALUE IT CARRIES ITSELF: the imported pivot must equal what the committed catalog's pivot_rule implies for that entry, so that a future divergence between the importer and the catalog fails here instead of shipping. So the importer, not the committed .meta, is what decides the pivot of every prop this task publishes, and this fixture measures the result of that importer rather than the bytes of the .meta.",
