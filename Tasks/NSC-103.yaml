  "notes": "Authored 2026-09-22 on the NSC-102 pattern so NSC-081 can dress NSC-046 without waiting for NSC-078's full forty-five entries. NSC-078 revision 12 released these twenty-one paths FIRST, at dd3ea3cfe: creating the task before the release produces resource groups owned by both tasks, which is contention rather than resolution. THE ONE THING THAT DOES NOT TRANSFER FROM NSC-102 IS THE PIVOT GATE. NSC-102's gate derives the expected pivot from the alpha bounding box's bottom row, which is correct there only because every Bone Archive prop is a standing prop; the NSC-102 design record said in as many words that this reasoning would not hold for the Chapel of Ash, and this is why - ca_sigil_floor_mark is flat floor art whose pivot is the centre. Copying the Bone Archive gate would fail a correct asset. The fixture is flat in Tests/Editor/ rather than Tests/Editor/Environment/, because that directory does not exist on main and NSC-078 owns its .meta - the contended thing is the DIRECTORY. This task claims no PropCatalog.json, no inventory JSON, no directory .meta and no postprocessor; each is in NSC-078's set and claiming any of them recreates the contention that makes a room-by-room split impossible. REVISION 4, 2026-09-22, after the NSC-078 prop family merged at main 16b7972a9: this is a citation repair and nothing else - no resource, dependency, criterion-set or gate-set change. Revision 3 told the implementer to branch on the entry's catalog classification. THERE IS NO SUCH FIELD, measured rather than assumed, and a contract that points at an authority which does not exist invites the reader to invent one; the likeliest substitute here is the footprint height, the exact rule revision 3 was written to withdraw. The operative branch was always the named assignment inside the same gate, so nothing was unsatisfiable and the Chapel chain was never blocked - the defect is that the stated reason pointed nowhere, and the reason is what the next contract gets copied from. The same measurement turned up a real defect in a published asset: ca_sigil_floor_mark, the one entry this contract classifies as lying, ships a ground-line pivot 0.594 world units from where AC-003 puts it, and its .meta is this task's to repair. Reported to the Art Director Agent with fr_ritual_bone_candle_ring at 0.648 and shared_bone_pile_b at 0.492, both of which are other tasks' entries. REVISION 5, 2026-09-22, an hour after revision 4 and for the same underlying reason seen from the other side: revision 4 repaired a citation to something that never existed, and this one withdraws a stated ABSENCE that stopped being true while the contract sat on main. VAL-001 said DungeonPropImportPostprocessor.cs was not on main and that no AssetPostprocessor existed. Both were true when written and both were falsified by the NSC-078 prop-family merge at 16b7972a9, which landed that file at 2708669ba. Verified at source before revising, not taken on report: the file is on main, it is still the only AssetPostprocessor in the repository, its own header states the pivot is the drawn ground line, and it reads no classification at all. A NEGATIVE FACT IS THE EASIEST KIND TO LET ROT, because nothing about it changes when the world does - the sentence keeps reading correctly long after it stopped being true, and this one was written deliberately as a measured absence precisely so a reader would rely on it. The consequence runs opposite to the original warning: there IS an automatic path now, and it does not fail to correct a wrong pivot, it enforces the ground line over any .meta that disagrees. That makes AC-003's centre pivot for ca_sigil_floor_mark unreachable by this task alone until the postprocessor branches on a recorded per-entry classification, which is NSC-078's to land. Found by the Art Director Agent, who edited a .meta to the centre value, ran Unity, and got the committed value back with git reporting no change - and who noticed it because a verifier passed when they expected it to fail. A pass you did not expect is as suspicious as a failure. REVISION 6, 2026-09-22, when candidate/art-director/flat-prop-pivots merged and the trigger this task had been holding fired. Verified at main before revising rather than taken on report: pivot_rule is on all forty-five catalog entries, forty-two ground_line and three lie_within; the three carry centre pivots 0.49, 0.526042 and 0.479167 with their sorting anchors following; the three committed .meta files carry those same values; and DungeonPropImportPostprocessor.cs reads the field and branches on lie_within. THE REAL LESSON IS ABOUT THIS CONTRACT'S OWN DRAFTING AND IT COST FOUR REVISIONS IN ONE EVENING. Revision 3 cited a classification that did not exist. Revision 4 corrected that by stating, as a measurement, that no such field existed - and pinned the branch to a named entry. Revision 5 recorded that the postprocessor had landed and read no classification, so the centre pivot was unreachable. EVERY ONE OF THOSE WAS TRUE WHEN WRITTEN AND FALSE WITHIN TWO HOURS, because each described the state of things OUTSIDE this task's own resources, and that state was being actively worked on by another agent while the contract sat on main. A snapshot of someone else's work has a half-life; the fact that it is correctly measured and correctly dated does not extend it. So revision 6 states the RELATIONSHIP - the gate reads the catalog's per-entry pivot_rule, and an unclassified entry fails - which stays true whatever the catalog says next, and the archaeology moves into these notes where going stale costs nothing. Acceptance criteria and gates should assert what must HOLD; notes are where what was TRUE belongs. REVISION 7, 2026-09-22: the Game Agent, merging the flat-prop-pivot work, found that the postprocessor's catalog read is import-order dependent and recorded it in the merge as not-proven rather than blocking on it - correctly, since on main those props were wrong every time and this is strictly better. Verified at source here rather than taken on report, and it is four paths rather than one: catalog not yet imported, id not found, no pivot_rule after the id, and a pivot_rule belonging to a later entry, each returning false and so each yielding the ground line. THE REASON THIS REACHES THE CONTRACT AT ALL is that VAL-002 asserts a pivot, and a gate that fails intermittently invites a repair that makes it stop failing rather than one that makes the defect stop happening. Naming the wrong repairs is the point of the clause: a reimport loop, a retry, an import-ordering trick inside the fixture, or a loose assertion would each turn a shipped wrong pivot into a green check. The defect itself is NSC-078's, because NSC-078 owns both the postprocessor and PropCatalog.json; nothing here asks this task to fix it, only to fail honestly and say which branch was taken. Worth recording alongside the Game Agent's own retraction in the same merge: it had returned this candidate twice on prop-test failures, and both runs shared an uncontrolled variable - the catalog was reimporting alongside the PNGs - so twice was the same experiment run twice rather than a repetition. That is the same import-order interaction seen from the other side, and it is why this clause is about honest failure rather than about suppressing a flake. REVISION 8, 2026-09-22: revision 7 called a cold first import the likeliest trigger, which understated it. The mechanism is structural rather than timing-dependent - AssetDatabase.LoadAssetAtPath returns null inside OnPreprocessTexture because the database is mid-import - so the classification fails on every import and succeeds on every direct call from a test. That asymmetry is the durable fact worth carrying, independent of any particular repair: it means this gate can be satisfied by a fixture that never touches the failing context, which would be a green check over a wrong pivot in every build. Found in the Art Director's own source comment while checking whether a fix was already in flight, rather than reported to me. A fix IS in flight and is deliberately not cited here, because it is not on main and this contract may only cite what is. REVISION 9, 2026-09-22: revision 8 required the pivot to be read back from the imported sprite rather than computed in test code, and that was necessary and NOT sufficient. AssetImporter.GetAtPath returns the STORED value, so a fixture that reads the imported sprite without forcing a reimport asserts hand-edited bytes against themselves - the same answers-from-a-copy defect one layer down from the one revision 8 closed. The evidence is that it already happened to the equivalent gate: NSC-078's DungeonPropImportSettingsTests reported 5/5 while the three lie-within props imported on their ground line. Revision 9 requires the forced import and cites the committed pattern. ALSO CORRECTED: revision 8's note said the postprocessor fix was in flight and deliberately uncited because it was not on main. IT MERGED WHILE THAT REVISION WAS BEING WRITTEN, at main 7fb5259b5 - resolved here rather than copied, since the sha as relayed to me carried a duplicated pair and was forty-two characters. So the catalog is now read off disk with File.ReadAllText instead of through AssetDatabase, and the every-import failure this contract described is fixed at source. The gate's requirement stands regardless: it constrains how the fixture proves the pivot, not whether this particular importer bug exists. REVISION 10, 2026-09-22: revision 8's stated MECHANISM was wrong and is withdrawn; its requirements were right and stand. It said LoadAssetAtPath returns null inside OnPreprocessTexture as a matter of course, so the read failed on every import while a direct call from a test always succeeded - one function, two contexts, two answers. The Art Director counted their own mutation log and it is not that: forty-five imports SUCCEEDED inside that callback and forty-five failed, the difference being whether PropCatalog.json was in the same StartAssetEditing batch, with Unity importing it last though it was requested first. Verified here rather than accepted: the log holds exactly forty-five 'cannot read' lines, a clean PNG-only run from line 534, a failing run from line 618, and the catalog's own import at line 3453. WHERE I GOT IT: from the fix candidate's own source comment, relayed by the Game Agent, and I treated it as a measurement because it sat in code rather than in prose. A CODE COMMENT IS A CLAIM LIKE ANY OTHER, and checking that the comment existed is not checking that it was true - the same one-proxy-two-readers error as confirming a script was current because the part of it I had tested worked. The author corrected their own comment against their own log, which is the only reason it was caught. The requirements this gate imposes did not move: read the pivot back from the imported sprite, force the import first, and now keep the catalog out of that batch. Only the reason moved - and the reason is what the next importer gets written from.",
