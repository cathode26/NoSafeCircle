  "acceptance_criteria": [
    {
      "reference": "Section 2 — Close and Lock",
      "requirement": "After doorway-crossing-state confirms forward-side crossing, the door automatically closes and locks with no additional player input."
    },
    {
      "reference": "Section 2 — Player Health ownership",
      "requirement": "Completing the automatic close/lock requests the small fixed health restoration through the Player Health owner-controlled restore interface (clamped to max health); this component never writes Player Health state directly."
    },
    {
      "reference": "Section 3 — Door and Pursuit Rules",
      "requirement": "Once locked, the door cannot be reopened, unlocked, or crossed again by the player; the floor is a forward-only escape sequence, including after any door has broken."
    },
    {
      "reference": "Section 3 — Locked-door attack and durability ownership",
      "requirement": "Exposes runtime durability and an owner-controlled damage-receive interface that other systems (e.g., enemy locked-door attacks) call to reduce durability; owns the locked-to-broken state transition; requesting systems never write durability or semantic door state directly."
    },
    {
      "reference": "Section 3 — Door and Pursuit Rules",
      "requirement": "When durability reaches zero the door breaks; a broken door remains open and cannot be closed or relocked for the remainder of the run, permits forward enemy traversal, and is not a return path for the player."
    },
    {
      "reference": "Section 3 — Door passability contract",
      "requirement": "Publishes semantic door state (sealed/open/locked/broken) through the shared navigation-owned passability interface so sealed/locked blocks enemy traversal and open/broken permits it; this component does not directly manipulate NavMesh or doorway passability itself."
    },
    {
      "reference": "Section 2 — Door feedback",
      "requirement": "Provides required player-facing breach feedback — banging, shaking, cracks, and a durability indicator — as the door nears breaking; this is implementation behavior, not validation-only prose."
    },
    {
      "reference": "Section 2 — Floor-run restart ownership",
      "requirement": "Exposes an owner-controlled reset entry point for door lifecycle/crossing/durability state, consumed by the Floor Run/Restart Orchestrator."
    },
    {
      "reference": "Section 4 — Dungeon Encounter Agent",
      "requirement": "Exposes a per-door authorable/serialized durability value so Dungeon Encounter can configure it per door, without Dungeon Encounter owning runtime durability state, damage intake, or the locked-to-broken transition."
    }
  ],
