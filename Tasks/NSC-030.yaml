  "notes": "Assets/Scenes/DoorPrototype.unity is the only canonical runtime scene for encounter population. Encounter content must not be added to Assets/Scenes/Rooms/*.unity because those scenes are immutable composition inputs and NSC-069 excludes encounter population from them. NSC-030 owns the authored activation policy that calls the delivered admission component; AC-006's cancel-on-exit and retry-when-capacity-frees policy needs a room-batch admission-cancellation API on Assets/NoSafeCircle/DoorPrototype/Scripts/EncounterAdmissionController.cs, which NSC-028 owns. D1B.2's owner-authorized prerequisite child (1B) adds that API and its focused Play Mode tests; it is the only encounter child permitted to edit that file, and only for this API, and NSC-028 continues to own the file's existing request-order admission and fifteen-enemy cap unchanged. Encounter children 7 and 9 depend on child (1B). It does not own room bounds, RoomSceneCatalog, room source scenes, visual dressing, enemy behavior or prefabs, ActiveEnemyRegistry bookkeeping, DoorInteractable runtime durability, or the Floor Run/Restart Orchestrator. Future children that change objects generated through DoorPrototypeSceneBuilder must lock that builder and Assets/Scenes/DoorPrototype.unity, use No Safe Circle/Build Door Prototype Scene for materialization, and name every new or modified script, asset, scene, test, and Unity .meta companion in the owning child acceptance criterion and exclusive_resources. NSC-015 is not yet decomposed; future children should depend on its delivered Melee Enemy prefab child once that child ID exists, and on NSC-055 for the assembled Ranged Enemy prefab. Per-room D1B.2 starting values, tuned by VAL-007 rather than fixed canon: rosters Ruined Entry 3 Melee, Bone Archive 4 Melee, Chapel of Ash 3 Melee + 2 Ranged, Lower Vault 2 Melee + 1 Ranged, Final Room 2 Melee + 2 Ranged plus survivors; one trigger per room, at Bone Archive's D1 entry area (NSC-045 AC-002), Chapel's D2 landing (NSC-046 AC-001), Lower Vault's D3 apron (NSC-047 AC-002), a new ~4x4 Final Room landing on D4, and inside Ruined Entry's own loop away from PlayerStart; each spawn/reset region is that room's walkable interior minus obstacles, door openings, and exit-side staging rectangles, with spawn positions at least 6 units from the entry door center or PlayerStart; starting DoorSequenceBuilder durability D1 60, D2 80, D3 100, D4 120, D5 exempt (crossing it ends gameplay). Until child 7 lands, DoorPrototypeGlobalSceneBuilder.BuildChaseEnemies' fixed enemy positions assume the pre-2026-09-15 room table, so the rebuild of Bone Archive through Final Room must keep each of those enemies inside its intended room, or land together with child 7 (INT-006). NSC-049 needs a matching follow-up contract revision to record this composed-scene reconciliation; NSC-030 does not edit NSC-049. Rosters, triggers, regions and durability values are GER owner decisions made under Vincent's 2026-09-15 delegation (C:\\nscrev\\ger-contract-revisions-20260916\\encounters\\NSC-030_DECISIONS.md); VAL-007 tunes them.",
