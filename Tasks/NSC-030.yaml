  "notes": "Assets/Scenes/DoorPrototype.unity is the only canonical runtime scene for encounter population. Encounter content must not be added to Assets/Scenes/Rooms/*.unity because those scenes are immutable composition inputs and NSC-069 excludes encounter population from them. NSC-030 owns the authored activation policy that calls the delivered admission component; AC-006's cancel-on-exit and retry-when-capacity-frees policy needs a room-batch admission-cancellation API on Assets/NoSafeCircle/DoorPrototype/Scripts/EncounterAdmissionController.cs, which NSC-028 owns. D1B.2's owner-authorized prerequisite child (1B) adds that API and its focused Play Mode tests; it is the only encounter child permitted to edit that file, and only for this API, and NSC-028 continues to own the file's existing request-order admission and fifteen-enemy cap unchanged. Encounter children 7 and 9 depend on child (1B). It does not own room bounds, RoomSceneCatalog, room source scenes, visual dressing, enemy behavior or prefabs, ActiveEnemyRegistry bookkeeping, DoorInteractable runtime durability, or the Floor Run/Restart Orchestrator. Future children that change objects generated through DoorPrototypeSceneBuilder must lock that builder and Assets/Scenes/DoorPrototype.unity, use No Safe Circle/Build Door Prototype Scene for materialization, and name every new or modified script, asset, scene, test, and Unity .meta companion in the owning child acceptance criterion and exclusive_resources. NSC-015 is not yet decomposed; future children should depend on its delivered Melee Enemy prefab child once that child ID exists, and on NSC-055 for the assembled Ranged Enemy prefab. Per-room D1B.2 starting values, tuned by VAL-007 rather than fixed canon: rosters Ruined Entry 3 Melee, Bone Archive 4 Melee, Chapel of Ash 3 Melee + 2 Ranged, Lower Vault 2 Melee + 1 Ranged, Final Room 2 Melee + 2 Ranged plus survivors; one trigger per room, at Bone Archive's D1 entry area (NSC-045 AC-002), Chapel's D2 landing (NSC-046 AC-001), Lower Vault's D3 apron (NSC-047 AC-002), a new ~4x4 Final Room landing on D4, and inside Ruined Entry's own loop away from PlayerStart; each spawn/reset region is that room's walkable interior minus obstacles, door openings, and exit-side staging rectangles, with spawn positions at least 6 units from the entry door center or PlayerStart; starting DoorSequenceBuilder durability D1 60, D2 80, D3 100, D4 120, D5 exempt (crossing it ends gameplay). Until child 7 lands, DoorPrototypeGlobalSceneBuilder.BuildChaseEnemies' fixed enemy positions assume the pre-2026-09-15 room table, so the rebuild of Bone Archive through Final Room must keep each of those enemies inside its intended room, or land together with child 7 (INT-006). NSC-049 needs a matching follow-up contract revision to record this composed-scene reconciliation; NSC-030 does not edit NSC-049. Rosters, triggers, regions and durability values are GER owner decisions made under Vincent's 2026-09-15 delegation (C:\\nscrev\\ger-contract-revisions-20260916\\encounters\\NSC-030_DECISIONS.md); VAL-007 tunes them. 2026-09-17 revision 6 follow-up: owner decisions D21-D23 (C:/nscrev/ger-contract-revisions-20260916/encounters/NSC-030_REV6_DECISIONS.md) give the production encounter activation component ownership of restart deactivation through a new ActivatedEnemies record (AC-009), fix the NSC-033 reset call order to reset only previously activated enemies (INT-001), and extend VAL-006 to prove the mixed admitted/pending/cancelled restart case. 2026-09-17 revision 7 follow-up: owner decisions D24-D25 (C:/nscrev/ger-contract-revisions-20260916/encounters/NSC-030_REV6_DECISIONS.md) replace VAL-006's single-room three-batch setup, which AC-005's one-request-per-room rule could not construct, with a two-room (X/Y) setup, and require ActivatedEnemies to record enemies admitted later by ProcessPendingAdmissions, not only enemies admitted during the initial RequestAdmission call (AC-009). 2026-09-17 revision 8 follow-up: owner decisions D26a-D26d (C:/nscrev/ger-contract-revisions-20260916/encounters/NSC-030_REV6_DECISIONS.md, \"NSC-030 revision 8\") drop VAL-006's cascading second Y defeat, narrow AC-009's EncounterAdmissionController.cs edit prohibition to the encounter activation component/child while preserving child 1B's sole edit authority, correct VAL-006's registration wording (EnemyHealth.Initialize only wires the registry; EncounterAdmissionController.RequestAdmission registers admitted enemies), and recast VAL-006's capacity fillers as test scaffolding admitted by one test-made RequestAdmission call and destroyed before the second run. Owner decision D27 (GER Orchestrator, 2026-09-17, from the NSC-009 revision 4 Codex check, C:/nscrev/codex-jobs/codex-contract-check-NSC-009-rev4-20260917.report.md) extends VAL-007 to enumerate the Force Wave checks NSC-009 INT-004 assigns it, so VAL-007 explicitly discharges that obligation. 2026-09-17 revision 9: records NSC-088 revision 4's INT-004/INT-005 (encounter-admitted Lantern Wraith instances carry the components needed to chase and fire at a redirected CurrentTarget) and INT-006 (VAL-007 adds the room-level Spectral Decoy review), and adds NSC-088 to depends_on because VAL-007 reviews the full spell kit; decomposition narrows that dependency to the VAL-007 review child and, for AC-005's component check, the canonical-scene materialization child. 2026-09-17 revision 10 (from the NSC-030 revision 9 Codex check, RESTART_VICTORY_DECOY_DECISIONS.md 'NSC-030 revision 10' C1-C4): C1 narrows AC-005's canonical-scene materialization child to committed-scene conformance (exact EnemyTargetKnowledge, EnemyPursuitMovement, RangedEnemyKeepDistanceMovement, RangedEnemyAttack, NavMeshAgent and EnemyHealth counts on every encounter-admitted Lantern Wraith instance) plus a committed-scene Play Mode redirect-and-fire check, moves prefab-level redirected-target behavior to NSC-055 (NSC-088 INT-004), and narrows the materialization child's NSC-088 dependency to its enemy-redirect child. C2: NSC-015 revision 11 (5a6b29cd4) makes MeleeEnemyAttack safe against a CurrentTarget without PlayerHealth (AC-002/VAL-001, split 1); VAL-007's review child depends on NSC-015's split 1 (the attack child) through NSC-030's existing NSC-015 dependency, so the room-by-room Spectral Decoy review can safely let a Melee Enemy reach a decoy phantom. C3: VAL-007 gains a committed-scene Play Mode assertion in Chapel of Ash proving a column/pew collider stops a redirected Lantern Wraith's projectile while CurrentTarget and IsRedirectedToSpectralDecoy stay on the decoy; Vincent's human review keeps route quality and cooldown dominance judgment only. C4: NSC-006, NSC-086, NSC-087, and NSC-015 are already revised on main (commits 187706c6c, 661ce495b, a34c52211, 5a6b29cd4); NSC-033 is revised alongside this task (NSC-033 revision 9).",
