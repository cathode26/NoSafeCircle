      "reference": "Section 2 — Active Enemy Registry and Encounter Admission",
      "requirement": "The registry tracks active persistent enemies under a hard fifteen-enemy cap; the Dungeon Encounter system consumes the registry before activating new encounter enemies, and if activation would exceed fifteen, new encounter enemies are delayed or reduced first while existing persistent pursuers are never removed to make room. This bookkeeping/admission foundation is explicitly reusable and does not require the exact five-room encounter layouts, placements, or trigger authoring to be known first."
