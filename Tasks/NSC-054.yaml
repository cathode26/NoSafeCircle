    {
      "criterion_id": "AC-008",
      "reference": "Unity Testing Policy; NSC-054 VAL-001 through VAL-009",
      "requirement": "Create Assets/NoSafeCircle/DoorPrototype/Tests/RangedEnemyAttackPlayModeTests.cs and Assets/NoSafeCircle/DoorPrototype/Tests/RangedEnemyAttackPlayModeTests.cs.meta as a Play Mode behavior-test fixture. It uses temporary GameObjects and the real EnemyTargetKnowledge, EnemyStatusEffectMovement, NavMeshAgent, RangedEnemyAttack, RangedEnemyProjectile, Collider, Renderer, and PlayerHealth components without opening or saving a canonical scene. Where NavMeshAgent speed is tested, it may build and clean up a temporary GameplayNavigationSurface through the existing ConfigureAndBuild pattern. The fixture may configure serialized references and tuning values, but it does not set attack phase, cooldown progress, projectile position, ownership collections, target state, or damage state directly. On each deterministic attack step, the fixture calls EnemyTargetKnowledge.UpdateTargetKnowledge(float) once before RangedEnemyAttack.Tick(float); RangedEnemyAttack never advances target knowledge itself. Where a gate compares Tick counts, the fixture makes those Tick calls without yielding frames between them so MonoBehaviour Update adds no unscripted time; the fixture does not disable RangedEnemyAttack to suppress Update, because disabling triggers AC-007 cleanup."
    }
