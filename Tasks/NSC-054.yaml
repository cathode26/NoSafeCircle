      "criterion_id": "AC-001",
      "reference": "NSC-016 AC-002 and AC-003; GDD — Required Enemy Roster; Enemy Detection, Pursuit, and Target Loss",
      "requirement": "Create Assets/NoSafeCircle/DoorPrototype/Scripts/Enemies/RangedEnemyAttack.cs and Assets/NoSafeCircle/DoorPrototype/Scripts/Enemies/RangedEnemyAttack.cs.meta. RangedEnemyAttack has serialized RangedEnemyProjectile projectileTemplate, Transform projectileOrigin, and GameObject windUpFeedback references; exposes read-only bool IsWindingUp and public Tick(float deltaTime); and delegates its normal Update timing to Tick. It reads EnemyTargetKnowledge.State and EnemyTargetKnowledge.CurrentTarget from a serialized EnemyTargetKnowledge targetKnowledge reference that falls back to GetComponent<EnemyTargetKnowledge>() in Awake, starts no attack while that reference is missing, starts attacks only while the wizard is the actively pursued target, activates windUpFeedback containing an enabled Renderer for a configured nonzero wind-up, and then launches a slow projectile. Beginning or completing the wind-up does not apply instant PlayerHealth damage. RangedEnemyAttack never calls EnemyTargetKnowledge.UpdateTargetKnowledge, ReportArrivedAtLastKnownPosition, or ResetTargetKnowledge. If target knowledge leaves Pursuing during wind-up, it cancels the wind-up without launching a projectile."
    },
    {
      "criterion_id": "AC-002",
      "reference": "NSC-016 AC-002 and AC-003; NSC-072 AC-001; GDD — Required Enemy Roster; Chapel of Ash cover requirement",
      "requirement": "Create Assets/NoSafeCircle/DoorPrototype/Scripts/Enemies/RangedEnemyProjectile.cs and Assets/NoSafeCircle/DoorPrototype/Scripts/Enemies/RangedEnemyProjectile.cs.meta. RangedEnemyProjectile exposes public Launch(Vector3 origin, Vector3 direction, RangedEnemyAttack owner) and public Tick(float deltaTime), with normal Update movement delegated to Tick. Launch places the projectile at origin, records its launching owner, throws ArgumentNullException when owner is null, and uses a normalized horizontal direction. The projectile remains in the horizontal plane at the height of the Launch origin (RangedEnemyAttack passes its serialized projectileOrigin position), keeps the release direction without homing or re-aiming, moves visibly over multiple Play Mode frames through an enabled Renderer, and stops or despawns when its finite lifetime ends or its owner resets, disables, or is destroyed. Each RangedEnemyProjectile.Tick(float deltaTime) evaluates cover and player contact along the whole horizontal segment travelled during that step, so consecutive Tick calls made within one Play Mode frame detect contact without waiting for a physics step, and one large step cannot carry the projectile through a collider."
    },
    {
      "criterion_id": "AC-003",
      "reference": "NSC-016 AC-003 and AC-004; GDD — Required Enemy Roster; Player Health ownership; Door and Pursuit Rules",
      "requirement": "On contact with a non-trigger Collider that is not part of the projectile, its launching enemy hierarchy, another RangedEnemyProjectile, or an enemy hierarchy containing EnemyTargetKnowledge, RangedEnemyProjectile stops or despawns. Trigger colliders are never cover and do not stop or despawn the projectile. If the contacted non-trigger Collider is on the same GameObject as PlayerHealth, the projectile calls PlayerHealth.TakeDamage(float) exactly once before stopping or despawning. A Collider on a parent or child of a GameObject that has PlayerHealth, but not on that GameObject itself, is ignored rather than treated as cover or a damage target. Neither ranged component stores or mutates a second copy of player-health state, and the projectile cannot damage the player through or after a blocking wall, pew, column, or other qualifying cover collider."
    },
