  "notes": "This revision preserves the current approved fire-into-cover behavior: a pursuing Ranged Enemy does not require a clear pre-fire line of sight, and a spawned projectile is stopped by qualifying non-trigger cover. Cover collision never changes EnemyTargetKnowledge; target loss remains distance-based. Enemy-body collision, friendly fire, firing during search, predictive aim, homing, stored shots, and a pre-release hold-fire gate are not added. Enemy colliders are ignored pending any later design decision. Exact wind-up, cooldown, damage, projectile speed, lifetime, collider footprint, and visual/audio treatment remain implementation and playtesting values. Production projectile-origin height is a tuning hypothesis bounded by committed geometry: above the floor and below the current Chapel pew top of 1.25 units, with NSC-072 providing committed-room proof. The automated Renderer checks prove enabled feedback, not gameplay-camera readability; human Play Mode review remains required after production presentation exists. Test fixtures supply temporary primitive visuals. NSC-054 creates no prefab, room asset, encounter placement, physics layer, tag, package, scene, catalog, builder, pool, or production art asset. NSC-072 owns committed Chapel collision validation, NSC-030 owns encounter placement, and NSC-033 owns restart-orchestrator integration. Production projectile-template, origin, feedback, and prefab-resource ownership must be assigned through an approved NSC-055 revision or another approved task before assembled-prefab work begins.",
