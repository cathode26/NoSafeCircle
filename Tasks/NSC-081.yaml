  "notes": "Visual dressing may add presentation objects only; geometry and navigation remain authoritative. Governing visual direction: Docs/Art/Environment/DUNGEON_ART_DIRECTION.md, Vincent-approved project direction dated 2026-09-13. The supplied images are inspiration only; all art and layouts must be original. DEPENDENCY REPOINTED 2026-09-22 (contract revision 3): depends_on moves from NSC-078 to NSC-103. NSC-078 is a forty-five entry catalog task for all five rooms; NSC-103 publishes the seven ready Chapel of Ash props this task actually needs, so the dressing no longer waits on four other rooms' art. Same move NSC-080 made to NSC-102. WHAT THIS TASK CAN DRESS WITH, counted rather than assumed: the plan assigns THIRTEEN props to ChapelOfAsh. Three are already on main - shared_bone_pile_a and shared_web_corner_a from NSC-102, and ca_candelabra_tall as a style-lock pilot source. NSC-103 publishes seven more. The remaining three are ca_pew_x_start/middle/end, a coupled tiling run under the art plan's D-7 whose rotation Vincent has not selected; they follow in their own task. AC-005 IS SATISFIABLE WITHOUT THEM AND I CHECKED THE WORDING RATHER THAN ASSUMING: it says matched candle, pew, column or arch groupings MAY frame the centre - an optional list joined by 'or', not a conjunct - and both shared_candle_cluster_a and shared_stone_column are in NSC-103's set, with ca_altar_ash_bowl_x, ca_sigil_floor_mark and ca_landmark_cracked_bell_frame_x available as the required altar, sigil or ritual-focus landmark. This task still reads NSC-078's PropCatalog description of those entries; it simply no longer waits for NSC-078 to deliver. RESOURCE-SHAPE REVISION, 2026-09-23: the four asset .meta paths are added to exclusive_resources and the folder-meta hazard is recorded in AC-003. Nothing else changed - no criterion or gate was added, removed or reworded beyond that clause, and the dressing design is untouched. Authored after a sweep found that all five room-dressing tasks - NSC-079, NSC-080, NSC-081, NSC-082 and NSC-083 - carried a file-only resource list, which derives an empty allowed-roots set and makes any generated sibling fatal at materialization. None of the five has ever run: there is no dressing prefab on main and none of them holds a candidate record, so this revision strands nothing. WORTH RECORDING BECAUSE IT WAS NEARLY MISSED IN THE OTHER DIRECTION: a sweep of the five room SCENES for references to the forty-five selected props returns zero, and that is the contract working rather than a gap - AC-003 forbids editing the blockout scene and VAL-001 requires proving it without opening the room's .unity file at all, because the dressing is a PREFAB. A measurement of the wrong artifact reads exactly like a missing feature. VAL-002 CERTIFICATION, 2026-09-23: the visual approval on this gate is the Art Director's. Decision provenance is Documentation Agent on Vincent's delegation, 2026-09-23 07:10Z; his own word does not exist and is not claimed. Wording is the Art Director's own, since they hold the gate. TWO THINGS THEY REFUSED THAT I HAD OFFERED, both recorded because the refusals are the valuable part: their 19-39 saturation band, because it was measured on isolated prop sprites against transparency while this gate judges a gameplay frame of mostly floor, wall and lighting - a correctly dressed room would fail it; and any global band at all, because the five rooms have deliberately different palettes chained off one base flagstone under NSC-064. A true measurement promoted to a case nobody measured, baked into five contracts, would have failed later as an inexplicable red. The screenshot-or-contact-sheet choice is also gone: the two answer different questions and an OR lets the gate be satisfied by the panel that cannot see the defect. FOLDER-META OWNER NAMED, 2026-09-23: AC-003 said none of the five dressing tasks claims the three folder .meta files and told the first one to dispatch to revise itself and claim them. NSC-082 did exactly that at its revision 7, commit 3e5bb5b0d, so the instruction is spent and this criterion now names NSC-082 as the owner instead of leaving the question open. NSC-082's own notes recorded that these four contracts were superseded, which was true and unreachable from here - a reader of this contract has no reason to open that one. Nothing else in this criterion changed; in particular the subset rule immediately following, that every later task must tolerate the metas' pre-existence and must not assert that it adds them, was already correct and is untouched. DESIGN-BRIEF WINDOW, 2026-09-23: AC-003 now states that any design brief this task's crew is expected to read must be on main BEFORE prepare. Learned on NSC-082, whose brief was merged at 71abc67d1 as the last commit before its prepare because that was the only window left: materialization reads the task at the candidate's frozen commit and VAL-001 runs from a clean checkout, so a candidate ref is unreadable from both, and admission pins HEAD twice plus the contract hash - merging afterwards reaches nothing. candidate/art-director/ruined-entry-dressing-design already exists, so this repeats for the remaining rooms rather than being a one-off. Also fixed here: an ambiguity I wrote into NSC-082 rev 9, which said a brief may be cited 'by path AND blob hash' without saying which of the two hashes - the sha256 of the committed LF blob is the one contract gates use; the git object id is a different number for the same file. FLOOR/WALL SCOPE, 2026-09-23: this contract now states that floor and wall tileset application is out of scope and unowned. Reported by the Art Director (C:/nscrev/reports/handoffs/ART-20260923-floor-wall-art-unowned.md) and verified here rather than taken: NSC-064 AC-005 explicitly excludes application, a describe-the-work sweep across all 103 contracts finds no task that applies the art, and the only tileset references in these five contracts are inside VAL-002's colour-band prose, which ASSUMES a frame mostly made of floor tileset and wall - an assumption that is false today. The dressing tasks cannot absorb it: they output a prefab of catalogued props, AC-002's selected_sha256 check cannot be satisfied by an uncatalogued PNG, and AC-003 forbids editing the blockout scene while applying tilesets means the scene or its builder. AN APPLICATION TASK IS NEEDED AND IS NOT AUTHORED HERE, because its feasibility is unmeasured - whether the six wall modules tile correctly against the existing builders has never been tested, and the art has never been seen in place. Authoring a contract against unknown feasibility is how ungateable criteria get written.",
