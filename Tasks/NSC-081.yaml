  "notes": "Visual dressing may add presentation objects only; geometry and navigation remain authoritative. Governing visual direction: Docs/Art/Environment/DUNGEON_ART_DIRECTION.md, Vincent-approved project direction dated 2026-09-13. The supplied images are inspiration only; all art and layouts must be original. DEPENDENCY REPOINTED 2026-09-22 (contract revision 3): depends_on moves from NSC-078 to NSC-103. NSC-078 is a forty-five entry catalog task for all five rooms; NSC-103 publishes the seven ready Chapel of Ash props this task actually needs, so the dressing no longer waits on four other rooms' art. Same move NSC-080 made to NSC-102. WHAT THIS TASK CAN DRESS WITH, counted rather than assumed: the plan assigns THIRTEEN props to ChapelOfAsh. Three are already on main - shared_bone_pile_a and shared_web_corner_a from NSC-102, and ca_candelabra_tall as a style-lock pilot source. NSC-103 publishes seven more. The remaining three are ca_pew_x_start/middle/end, a coupled tiling run under the art plan's D-7 whose rotation Vincent has not selected; they follow in their own task. AC-005 IS SATISFIABLE WITHOUT THEM AND I CHECKED THE WORDING RATHER THAN ASSUMING: it says matched candle, pew, column or arch groupings MAY frame the centre - an optional list joined by 'or', not a conjunct - and both shared_candle_cluster_a and shared_stone_column are in NSC-103's set, with ca_altar_ash_bowl_x, ca_sigil_floor_mark and ca_landmark_cracked_bell_frame_x available as the required altar, sigil or ritual-focus landmark. This task still reads NSC-078's PropCatalog description of those entries; it simply no longer waits for NSC-078 to deliver. RESOURCE-SHAPE REVISION, 2026-09-23: the four asset .meta paths are added to exclusive_resources and the folder-meta hazard is recorded in AC-003. Nothing else changed - no criterion or gate was added, removed or reworded beyond that clause, and the dressing design is untouched. Authored after a sweep found that all five room-dressing tasks - NSC-079, NSC-080, NSC-081, NSC-082 and NSC-083 - carried a file-only resource list, which derives an empty allowed-roots set and makes any generated sibling fatal at materialization. None of the five has ever run: there is no dressing prefab on main and none of them holds a candidate record, so this revision strands nothing. WORTH RECORDING BECAUSE IT WAS NEARLY MISSED IN THE OTHER DIRECTION: a sweep of the five room SCENES for references to the forty-five selected props returns zero, and that is the contract working rather than a gap - AC-003 forbids editing the blockout scene and VAL-001 requires proving it without opening the room's .unity file at all, because the dressing is a PREFAB. A measurement of the wrong artifact reads exactly like a missing feature.",
