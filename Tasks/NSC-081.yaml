      "criterion_id": "AC-001",
      "reference": "Approved Chapel of Ash blockout",
      "requirement": "Add candle or candelabra groupings, ash, webs, dark material accents, rubble, and cute spooky details while preserving bounds, D3 opening, projectile cover, collision, and walkability. FLOOR AND WALL TILESET APPLICATION IS OUT OF SCOPE FOR THIS TASK AND IS CURRENTLY OWNED BY NOBODY. State plainly rather than left as an absence, because an unowned gap and a deliberate deferral look identical from inside a contract. Committed and unused on main: five floor tilesets under Art/Environment/Source/floors/ and six wall modules under Art/Environment/Source/walls/. NO ROOM SCENE REFERENCES ANY OF THEM - measured by guid, with a passing sanity probe - and every room renders code-drawn brick and a flat floor. NSC-064 generated and selected that art and its AC-005 EXPLICITLY EXCLUDES APPLYING IT: \"This task does not create Unity Tile assets, edit the scene or builder, alter collision/navigation, or author room layouts.\" The successor that would create the Tile assets and apply them was never authored. THIS TASK MUST NOT ABSORB THAT WORK: it produces a PREFAB of catalogued props, it is forbidden by AC-003 from editing the blockout scene, and applying floors and walls means Unity Tile assets and the room scene or its builder - a different artifact under a different owner. SO PASSING THIS TASK DOES NOT MEAN THE ROOM STOPS LOOKING LIKE A BLOCKOUT, and nobody reviewing VAL-002 should expect it to. NOTE THAT VAL-002'S OWN COLOUR REASONING BELOW ASSUMES A FRAME THAT IS \"mostly floor tileset, wall and lighting\" - that assumption is currently FALSE and is the clearest evidence the gap is real rather than theoretical."
