      "criterion_id": "AC-001",
      "reference": "NSC-088 AC-001; Docs/GDD/No_Safe_Circle_GDD.md:528-535,601,610-611,656; NSC-091 (owner of EnemyTargetKnowledge)",
      "requirement": "Modify Assets/NoSafeCircle/DoorPrototype/Scripts/Enemies/EnemyTargetKnowledge.cs. Create Assets/NoSafeCircle/DoorPrototype/Tests/SpectralDecoyEnemyTargetKnowledgePlayModeTests.cs and its .meta. EnemyTargetKnowledge gains three public members that it controls: TryRedirectToSpectralDecoy(Transform), EndSpectralDecoyRedirect(Transform), and a read-only IsRedirectedToSpectralDecoy. This child is the only one that edits EnemyTargetKnowledge.cs. It does not edit EnemyPursuitMovement.cs, EnemyLockedDoorAttack.cs, RangedEnemyKeepDistanceMovement.cs, RangedEnemyAttack.cs, RangedEnemyProjectile.cs, EnemyHealth.cs or PlayerHealth.cs. It adds no spell code. External callers never write CurrentTarget, LastKnownPosition, pursuit or search state, or the leash directly."
    },
    {
      "criterion_id": "AC-002",
      "reference": "NSC-088 AC-002; Docs/GDD/No_Safe_Circle_GDD.md:528-535",
      "requirement": "TryRedirectToSpectralDecoy returns true only when every one of these holds: the Transform is non-null; the component is active and enabled; any EnemyHealth on the same GameObject is not defeated; State is Pursuing; CurrentTarget is the initialized wizard Transform; and the enemy is not already redirected. There is no separate decoy attraction radius. An enemy outside DetectionDistance but still inside LoseTargetDistance is eligible. An enemy that is Idle, SearchingLastKnownPosition, Wandering, defeated, disabled, already redirected, or targeting something other than the wizard does not switch. On success, the component records the wizard position at that moment, keeps State as Pursuing, and assigns CurrentTarget to the exact decoy Transform."
    },
    {
      "criterion_id": "AC-003",
      "reference": "NSC-088 AC-003; EnemyTargetKnowledge.UpdateTargetKnowledge, IsBeyondPursuitLeash and requiresLineOfSight",
      "requirement": "While the enemy is redirected, UpdateTargetKnowledge skips only the normal check of wizard distance against LoseTargetDistance. The existing maximum-pursuit-distance-from-start leash stays active. If the leash is exceeded, the enemy ends the redirect and clears its saved decoy data. It restores the wizard as its retained target when the wizard is available, records its start position as LastKnownPosition, and enters SearchingLastKnownPosition, exactly as the current leash branch does. The requiresLineOfSight option still applies only to fresh acquisition. It is never consulted to keep a redirect or to restore pursuit when the decoy ends. ResetTargetKnowledge() also clears the redirect flag, the decoy reference and the saved wizard position."
    },
    {
      "criterion_id": "AC-004",
      "reference": "NSC-088 AC-004; Docs/GDD/No_Safe_Circle_GDD.md:528-535",
      "requirement": "EndSpectralDecoyRedirect does nothing unless the Transform passed in is this enemy's exact current decoy target. When it does act, it clears all redirect bookkeeping. If the wizard exists and is at or inside LoseTargetDistance, measured with the component's normal distance calculation, CurrentTarget returns to the wizard and State stays Pursuing, with no line-of-sight check. If the wizard is beyond LoseTargetDistance, the method sets LastKnownPosition to the wizard position saved when the redirect began and enters SearchingLastKnownPosition. If the wizard is unavailable, it restores the wizard target where one still exists and does the same. Ending a redirect never clears target knowledge by itself."
    }
  ],
