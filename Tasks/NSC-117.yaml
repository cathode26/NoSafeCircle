      "criterion_id": "AC-001",
      "reference": "NSC-007 AC-003; GDD §2 Fireball",
      "requirement": "Create FireballProjectile.cs, a MonoBehaviour that owns one runtime-created Fireball shot. Add no prefab. Expose a public launch method, called by Fireball, that sets the shot's start position, gameplay-plane direction, speed, maximum lifetime, flat contact radius, damage, area radius and the casting wizard's CharacterController. Expose public Tick(float), and have Update call only Tick(Time.deltaTime). Each Tick moves the shot in a straight line at its configured speed. When maximum lifetime elapses without contact, destroy the shot in place and deal no damage. Never detonate at a cursor or ground point."
    },
    {
      "criterion_id": "AC-002",
      "reference": "NSC-007 AC-007; GDD §2 Fireball; GDD §3 Enemy health and defeat ownership",
      "requirement": "Each FireballProjectile Tick casts a chest-height Physics.Raycast, or equivalent sweep, against non-trigger Colliders on the default gameplay layers, using the same trigger-ignoring query as the Ranged Enemy caster's HasUnobstructedViewOfWizard and ignoring the caster's CharacterController. Walls, prop and obstacle Colliders, and enabled doorway-blocker Colliders for sealed, locked and broken doors stop the shot. An open door that the wizard has not crossed does not. The shot never hits its caster. Because enemies have no Colliders, test contact using flat horizontal distance against active, non-defeated EnemyHealth Components inside the contact radius, including a Ranged Enemy carrying EnemyFireballCaster or EnemyLanternWispCaster. Contact with an enemy or blocking Collider detonates the shot and calls EnemyHealth.TakeDamage(float) on the contacted enemy. For tiers above tap, also call TakeDamage on every other active, non-defeated enemy inside the area radius with an unobstructed line from the detonation point under the same raycast rule. Damage each enemy at most once per shot and damage nothing behind a wall or blocked doorway. Add no enemy Collider, layer, tag or new query API."
    }
  ],
