      "gate_id": "VAL-001",
      "reference": "NSC-007 VAL-001",
      "requirement": "FireballCastAndChargePlayModeTests uses InputTestFixture with the temporary in-memory Player map, real PlayerMovement, PlayerMana and EnemyHealth Components, and a valid shared pointer target. A tap through the Fireball action must raise PlayerMana.ManaSpent once with amount 20 and leave no movement restriction. It must launch one shot aimed from the shared target that advances at 12 units per Tick second and fizzles without damage after 3 seconds. With Tick steps moving the shot no more than 0.05 units, a target 0.85 units from the path must take 25 damage and a target 0.95 units away must not. A second tap within 0.5 seconds of a completed cast must spend no mana, raise no CastDenied and launch nothing. A tap after Tick advances the cooldown by 0.5 seconds must cast normally."
    },
    {
      "gate_id": "VAL-002",
      "reference": "NSC-007 VAL-002",
      "requirement": "FireballCastAndChargePlayModeTests drives tap, partial and full holds through the temporary Fireball action and Tick(float). Cost, damage and impact area must increase monotonically, and a full charge must damage at least two clustered EnemyHealth targets without damaging any target twice. Count ManaSpent and CastDenied events. A press below the tap cost must raise CastDenied exactly once and start no charge, restriction or projectile. With mana for only an intermediate tier, normalized progress must stop at that tier. Calling PlayerMana.Spend directly mid-charge to drop mana below the tap cost must make release raise CastDenied exactly once, launch nothing and release the restriction once. A normal release must raise ManaSpent exactly once for the reached tier's cost."
    },
    {
      "gate_id": "VAL-003",
      "reference": "NSC-007 VAL-006",
      "requirement": "FireballCastAndChargePlayModeTests starts a real door-opening attempt using a DoorInteractable in range and PlayerInteractionController.BeginInteraction or its approach flow. Advance DoorInteractable.Tick until Progress is above zero, then cast through the Fireball action, once as a tap and separately as a held-and-released charge. As DoorInteractable.Tick continues, PlayerInteractionController.IsInteracting must stay true, PendingDoor must remain the same door, and Progress must never drop and must keep increasing. Fireball must call no PlayerInteractionController or DoorInteractable method."
    },
    {
      "gate_id": "VAL-004",
      "reference": "NSC-007 VAL-003",
      "requirement": "FireballLifecyclePlayModeTests begins a charge through the temporary Fireball action and separately exercises a refused mana spend, missing pointer target, ResetFireball(), SuspendGameplayInput(), component disable and destruction. Every path must release only Fireball's own movement restriction at most once, remove launched projectiles, leave no delayed damage, and reject input while suspended until re-enable or reset. For reset, suspension, disable and destruction, a separate case starts with a shot already in flight and verifies it is removed and later Tick calls deal no damage. A real PlayerHealth.TakeDamage during a charge must cancel it with zero ManaSpent events and zero projectiles. One case must hold an additional test-owned PlayerMovement restriction so IsMovementRestricted remains true until the test releases it; a second case without that restriction must make IsMovementRestricted false immediately after cancellation. With real TitleScreenController and WizardGameEntryController instances and assigned Fireball references, Fireball input must spend no mana and start no charge before EnterWorld and must cast normally afterward. With both references unassigned, HasValidReferences() must remain true and EnterWorld must complete."
    }
  ],
