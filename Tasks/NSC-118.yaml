{
  "acceptance_criteria": [
    {
      "criterion_id": "AC-001",
      "reference": "NSC-007 AC-002; GDD §2 Fireball",
      "requirement": "Fireball exposes public Tick(float) as its deterministic time seam. A press released before a serialized positive tap/hold threshold fires the tap tier. Holding past that threshold builds partial charge up to a serialized full-charge duration. The tap tier starts at 20 mana, 25 damage, 12 world units per second, a 3-second maximum projectile lifetime and a 0.9-unit flat contact radius. Fireball's cast cooldown starts at 0.5 seconds. Serialized mana cost, enemy damage and impact-area radius increase monotonically from tap through partial to full charge, and a full-charge impact can damage several clustered enemies."
    },
    {
      "criterion_id": "AC-002",
      "reference": "NSC-007 AC-003; GDD §2 Player Movement ownership",
      "requirement": "Fireball reads PlayerMovement.PointerWorldTarget only while PlayerMovement.HasPointerWorldTarget is true. It never polls pointer hardware or makes its own screen-to-world projection. It aims by the gameplay-plane direction from the wizard to that target. If no valid pointer target exists when a charge would start or a cast would fire, Fireball spends no mana, launches nothing, deals no damage and clears the pending attempt. A successful cast calls FireballProjectile's public launch method with that direction and the reached tier's speed, lifetime, contact radius, damage and area radius. Fireball adds no cursor-point or ground-point detonation."
    },
    {
      "criterion_id": "AC-003",
      "reference": "NSC-007 AC-005; GDD §2 Player Movement ownership; door interaction rules",
      "requirement": "Once a hold passes the tap/hold threshold, Fireball calls PlayerMovement.RequestMovementRestriction() exactly once and records that it holds one request. A tap never requests or releases a restriction. PlayerHealth.Damaged cancels an active charge: Fireball releases its own request exactly once, spends no mana and launches nothing. A move click or door click during a charge does not cancel it; PlayerMovement applies the latest click once movement is unrestricted. Fireball never calls PlayerMovement.RequestDestination(), PlayerMovement.CancelRequestedDestination(), or any PlayerInteractionController or DoorInteractable method, and it adds no separate abort input. Fireball releases its request at most once, whichever of these ends the charge first: firing, a missing pointer target at fire time, a refused cast, ResetFireball(), SuspendGameplayInput(), component disable or destruction. Charging or casting never resets or replaces an active door-opening attempt."
    },
    {
      "criterion_id": "AC-004",
      "reference": "NSC-007 AC-006; GDD §2 Player Mana ownership",
      "requirement": "On press, a charge starts only if PlayerMana.CurrentMana covers the tap cost. Otherwise Fireball calls PlayerMana.Spend(tap cost) once, which returns false and raises PlayerMana.CastDenied, and starts no charge, restriction or projectile. While charging, the reached tier is capped at the highest tier CurrentMana can currently pay. On release, Fireball calls PlayerMana.Spend(float) exactly once for the reached tier's positive cost. If that call fails because mana dropped below the tap cost, CastDenied fires and nothing launches."
    },
    {
      "criterion_id": "AC-005",
      "reference": "NSC-007 AC-008; GDD §2 restart and victory ownership",
      "requirement": "Fireball exposes public ResetFireball(), SuspendGameplayInput() and EnableGameplayInput() methods, plus read-only charging state and normalized charge progress. ResetFireball clears charge and cast state, releases Fireball's movement restriction if held, destroys every FireballProjectile it launched and re-enables input. SuspendGameplayInput performs the same active-operation cleanup but rejects new Fireball input until EnableGameplayInput() or ResetFireball() runs. Component disable and destruction also release the restriction and destroy launched projectiles. This child may create only programmer-placeholder charge feedback and adds no authored art."
    },
    {
      "criterion_id": "AC-006",
      "reference": "NSC-007 AC-004 (runtime input handling); GDD §2 Move and Aim",
      "requirement": "Fireball has a serialized InputActionAsset reference. It reads press, hold and release from the Player map's Fireball action through Unity Input System callbacks or action state and never polls Mouse.current, Keyboard.current or other hardware. Press starts an affordable charge, holding advances it, and release casts; a quick press and release is the tap cast. This child does not edit Assets/InputSystem_Actions.inputactions. Its tests build a temporary in-memory InputActionAsset whose Player map contains PointerPosition, MoveToCursor and a Button-type Fireball action."
    },
    {
      "criterion_id": "AC-007",
      "reference": "NSC-007 AC-010 (controller references); GDD §2 Victory/input-shutdown ownership",
      "requirement": "Add an optional serialized Fireball reference to TitleScreenController and WizardGameEntryController. When assigned, TitleScreenController.SuspendGameplayInput() calls Fireball.SuspendGameplayInput(). WizardGameEntryController.EnterWorld calls Fireball.EnableGameplayInput() immediately after enabling PlayerMovement and PlayerInteractionController. A missing Fireball reference must not make WizardGameEntryController.HasValidReferences() fail. Never add Fireball to TitleScreenController's gameplayInputBehaviours array, and make no other change to title, selection or game-entry behavior."
    }
  ],
  "basis": "Direct GDD authority and the NSC-007, NSC-003, NSC-004, NSC-005 and NSC-019 contracts.",
  "completion_gates": [
