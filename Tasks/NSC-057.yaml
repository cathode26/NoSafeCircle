  "notes": "This task establishes availability, not mandatory use. Engineering agents still apply the consider-don't-force rules in ENGINEERING_STANDARDS.md. *** GER REVISION 2, 2026-09-27: TWO CLAUSES STOPPED DESCRIBING THIS PROJECT, AND A NEWER NUMBER WOULD NOT HAVE FIXED THEM. *** AC-003 and VAL-002 both named Unity 6000.1.8f1. That was TRUE WHEN WRITTEN and true when satisfied - THIRD_PARTY_DEPENDENCIES.md records Vincent completing DOTween's interactive Utility Panel setup in 6000.1.8f1 on 2026-09-14 - but ProjectSettings/ProjectVersion.txt at main 97524d12 reads 6000.6.3f1, so both clauses had come to attest an editor this project no longer runs. A SATISFIED CLAUSE ABOUT A DEAD VERSION PROVES NOTHING ABOUT THE SHIPPED PROJECT, which is why this is a correction rather than housekeeping. NO NEWER LITERAL IS WRITTEN HERE AND THAT IS THE POINT: bumping 6000.1.8f1 to 6000.6.3f1 would be stale again at the next upgrade, by exactly the route that produced this one. Both clauses now name ProjectSettings/ProjectVersion.txt (m_EditorVersion) as the single live source, so the requirement follows the project instead of a date. THE SUBSTANCE IS UNCHANGED - the libraries must resolve, and the project must compile after integration - and there is no scope, resource, dependency or gate-platform change; the validation policy keeps its EditMode ThirdPartyDependencyAvailabilityTests filter, which is declared on main. WHAT IS ALREADY DONE AND IS NOT A CONTRACT MATTER: both libraries are integrated (Assets/Plugins/Demigiant/DOTween v1.3.030, Assets/Plugins/deVoid/Signals at upstream commit b1969caa) and AC-001, AC-002 and VAL-001 are recorded in Docs/Engineering/THIRD_PARTY_DEPENDENCIES.md. This task has ZERO evidence records, so it is done-and-unrecorded; the delivery record is the Game Agent's and needs a Unity run. NOT ESTABLISHED: I ran no Unity for this revision, so whether both libraries resolve under 6000.6.3f1 is INFERRED from the project compiling for other work today and