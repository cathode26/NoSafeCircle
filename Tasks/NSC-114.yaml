  "id": "NSC-114",
  "kind": "implementation",
  "notes": "AUTHORED FROM agent-state/intent-NSC-114-enemy-awareness-indicator.md. THE INTENT ASKED WHETHER THIS SHOULD BE ONE CONTRACT OR TWO, ART AND BUILDER. IT IS ONE, DELIBERATELY. Splitting the icon into its own task would create a contract owning only a binary asset plus a test, which is exactly the NSC-102/NSC-103 shape that CANNOT produce a scope plan - the crew predicate needs at least one implementation path and asset-only tasks have none. Rather than author a task nothing can schedule, the art is left to the Art Director to deliver directly and hand over, which is the route CLAUDE.md already records as working. AC-003 makes that boundary explicit so the split is visible to the next reader. The two contract hits the Producer found were verified false positives by reading them: NSC-040 is about visual/simulation desync and NSC-072 uses 'awareness' in an ordinary English sense. NOT ESTABLISHED: the exact public surface NSC-091's EnemyTargetKnowledge exposes was not read field by field at authoring time; if it turns out no read-only accessor exists, adding one is this task's work and does not need a revision, provided AC-001's read-only constraint still holds.",
