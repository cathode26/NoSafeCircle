{
  "acceptance_criteria": [
    {
      "criterion_id": "AC-001",
      "reference": "NSC-091 owns EnemyTargetKnowledge; this task owns only its display",
      "requirement": "EnemyAwarenessIndicator reads the enemy detection state owned by NSC-091's EnemyTargetKnowledge through its existing public surface and renders whether the enemy has currently detected the wizard. It READS ONLY: it never writes, clears or advances detection state, never changes pursuit, search or last-known-position behaviour, and never influences when an enemy attacks."
    },
    {
      "criterion_id": "AC-002",
      "reference": "GDD Section 3 success criteria: failure is readable",
      "requirement": "The indicator distinguishes at least the undetected and detected conditions, and updates within one fixed step of the underlying state changing in either direction, including back to undetected when the enemy loses the wizard. A one-way indicator that latches on detection is not acceptable, because the GDD's readability goal is about the player understanding their current exposure."
    },
    {
      "criterion_id": "AC-003",
      "reference": "CLAUDE.md: all 2D art goes to the Art Director, which decides visual picks",
      "requirement": "THE ICON ARTWORK IS NOT OWNED BY THIS CONTRACT AND MUST NOT BE AUTHORED HERE. The indicator binds whatever sprite it is given through a serialized reference, and the visual itself is the Art Director's to choose and deliver, including its .meta import settings. This task is complete with a placeholder sprite bound; swapping in the final art requires no change to this contract."
    },
    {
      "criterion_id": "AC-004",
      "reference": "CLAUDE.md: 80 percent is the bar, appearance is fixable afterwards",
      "requirement": "The indicator is readable at the normal gameplay camera without obscuring the wizard, the enemy it belongs to, or usable cursor-target floor. Exact placement, size and styling are implementation-time choices and are not pinned by this contract, so tuning them later needs no revision."
    }
  ],
  "basis": "direct_gdd",
  "completion_gates": [
    {
      "gate_id": "VAL-001",
      "reference": "CLAUDE.md: a green test can pass on a stub; assert the durable relation",
      "requirement": "In Play Mode, EnemyAwarenessIndicatorPlayModeTests drives an enemy through NSC-091's real detection path - not by setting a field through reflection - from undetected to detected and back, and asserts the indicator reflects each transition within one fixed step in both directions. The test asserts the indicator never writes detection state, by reading that state before and after rendering and requiring it unchanged. It also asserts that with no sprite bound the component fails visibly rather than silently rendering nothing, so a missing art binding cannot be mistaken for an enemy that has not noticed the wizard. Whether the final artwork reads well at gameplay scale is NOT claimed by this gate; that is the Art Director's visual call and is not recorded here as a human review."
    }
  ],
