name: Host Tools

# The host tool suites under Tools/Host had no CI at all until 2026-09-20: no
# workflow referenced that tree, so 330 tests ran only when somebody remembered
# to run them by hand. Thirty-eight of them could not be run by hand correctly
# either - the ArtReview suites need their package root importable and fail on
# ModuleNotFoundError otherwise, which an earlier pass misread as passing.
#
# run_tool_tests.py owns how each suite is invoked and refuses to call a suite
# green unless it printed a `Ran N tests` line, exited 0, and N > 0. That is the
# whole point: a suite that runs nothing must fail here rather than report a
# green.

on:
  pull_request:
    paths:
      - ".github/workflows/host-tools.yml"
      - "Tools/Host/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/host-tools.yml"
      - "Tools/Host/**"
  workflow_dispatch:

permissions:
  contents: read

# actions/checkout inherits these Git configuration entries, so they must be set at
# workflow level. Tracked paths under Docs/AI-Pipeline/Historical-Context-Sessions/reports/
# exceed the default Windows Git path limit once the runner's workspace root is prepended.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: "true"

jobs:
  host-tool-suites:
    name: Host tool suites
    runs-on: windows-latest
    # 20 was enough for 330 tests and no mutation step. This branch takes it to
    # 847 tests plus a harness that re-runs a whole suite per mutation, measured
    # at 231s and 419s on a developer machine - about eleven minutes together,
    # and a hosted runner is slower than this machine, not faster. Raised rather
    # than left to be discovered as a red build whose cause is a clock.
    timeout-minutes: 40
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile the host tools
        run: python -m compileall -q Tools/Host

      # No pytest: this machine class does not have it and the suites are plain
      # unittest. Installing it would hide that they must stay runnable with the
      # interpreter alone, which is what the F: validation checkout gets.
      # A skipped test is reported by unittest inside OK. The cases that skip here
      # are the guard cases - they need a real shallow directory - so on a runner
      # a skip means the guard was not exercised, and that must be a failure.
      - name: Run every host tool suite
        env:
          NSC_TOOL_TESTS_NO_SKIPS: "1"
        run: python -B Tools/Host/run_tool_tests.py

      # A guard with green tests proves nothing until you have seen the tests
      # fail. Two mutation harnesses existed before today and NEITHER ran in any
      # workflow, so the one instrument that could show a test was vacuous went
      # unobserved - and it turned out to score a crash as a kill, which put
      # every count it had ever produced in doubt.
      #
      # It runs here rather than through run_tool_tests.py because it is not a
      # unittest suite: it prints no "Ran N tests" line, which that runner
      # requires, and teaching it to print one would weaken the rule that catches
      # a suite running nothing.
      #
      # 419 seconds for 45 mutations on a developer machine, and it grows with
      # every mutation because each one re-runs a whole suite. Two of them run
      # the shell suite, which is the slow one. An earlier version of this
      # comment said ninety seconds: true when it was written, not when it was
      # read, which is the argument for a measured number over a round one.
      - name: Every guard must be provably testable
        run: python -B Tools/Host/jobs/tests/mutation_check.py

      # The suites must not depend on this runner's drive letters. Any absolute
      # C:/ or F:/ path they leave behind in fixtures is a relocation bug, and
      # a Linux-style path would mean a fixture escaped the temp directory.
      - name: Fail if a suite wrote outside the temp directory
        shell: pwsh
        run: |
          $stray = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Force `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'nsc-run-job-tests|run-job\\tests' }
          if ($stray) {
            Write-Host "Test fixtures landed inside the checkout:"
            $stray | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }
          Write-Host "No fixtures inside the checkout."
