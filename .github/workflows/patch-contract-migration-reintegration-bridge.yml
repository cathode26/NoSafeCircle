name: Patch Contract Migration Reintegration Bridge

on:
  push:
    branches:
      - fix/contract-migration-reintegration-bridge
    paths:
      - ".github/workflows/patch-contract-migration-reintegration-bridge.yml"
      - "Pipeline/Migrations/patch_contract_migration_reintegration_bridge.py"

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out bridge branch
        uses: actions/checkout@v4
        with:
          ref: fix/contract-migration-reintegration-bridge
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply reintegration bridge patch
        run: python Pipeline/Migrations/patch_contract_migration_reintegration_bridge.py

      - name: Configure deterministic Git identity
        shell: pwsh
        run: |
          git config --global user.name "TaskReviewAgent Tests"
          git config --global user.email "task-review-agent-tests@example.invalid"

      - name: Run focused resilience tests
        run: python Pipeline/TaskReviewAgent/tests/downstream_resilience_smoke_test.py

      - name: Run mainline integration compatibility tests
        run: python Pipeline/TaskReviewAgent/tests/mainline_reintegration_smoke_test.py

      - name: Run scene path policy tests
        run: python Pipeline/TaskReviewAgent/tests/scene_path_contract_migration_smoke_test.py

      - name: Validate TaskGraph
        run: python Pipeline/TaskGraph/taskcontrol.py validate

      - name: Compile TaskReviewAgent
        run: python -m compileall -q Pipeline/TaskReviewAgent

      - name: Check whitespace
        run: git diff --check

      - name: Commit and push code and tests
        shell: pwsh
        run: |
          git config user.name "No Safe Circle Reintegration Bridge"
          git config user.email "reintegration-bridge@users.noreply.github.com"
          git add Pipeline/TaskReviewAgent/downstream_resilience.py Pipeline/TaskReviewAgent/tests/downstream_resilience_smoke_test.py
          git commit -m "Bridge verified contract migrations into later mainline integration"
          git push origin HEAD:fix/contract-migration-reintegration-bridge
