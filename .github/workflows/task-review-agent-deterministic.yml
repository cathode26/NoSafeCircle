name: TaskReviewAgent Deterministic Validation

# CORE suite: contracts, actor/public-trust authorization, committed task
# loading, completed-Issue protection, GitHub Issue workflow state, exclusive
# resource reservation, real/durable/resumable checkout, workflow runtime
# compatibility, real read-only observation, and Git identity safety.
#
# Branch protection depends on this exact workflow name and the windows-smoke
# job id, so the trigger below fires on every PR touching
# Pipeline/TaskReviewAgent/**, Pipeline/ExecutionCrew/**, or
# Pipeline/AgentRuntime/** (no owned path is excluded from the trigger itself):
# an unrecognized future file must still make this legacy check appear.
#
# Within the job, "Determine Core suite relevance" decides whether the
# expensive Core regression steps actually run. When every changed file is
# Supervisor-owned or Delivery-owned (see that step's file list, which
# mirrors Supervisor/Delivery workflow ownership), the Core steps are skipped
# and this check succeeds cheaply -- Supervisor/Delivery Validation cover
# those files instead.
on:
  pull_request:
    paths:
      - ".github/workflows/task-review-agent-deterministic.yml"
      - "Pipeline/TaskGraph/**"
      - "Pipeline/Testing/**"
      - "Tasks/**"
      - "Pipeline/TaskReviewAgent/**"
      - "Gauntlet/SoftwareArchitectAcceptance/**"
      - "Pipeline/ExecutionCrew/**"
      - "Pipeline/AgentRuntime/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine Core suite relevance
        id: scope
        shell: pwsh
        run: |
          # Files owned exclusively by Supervisor or Delivery Validation.
          # Kept identical to their paths: blocks in
          # task-review-agent-supervisor.yml / task-review-agent-delivery.yml.
          # A future/unknown file is never in this list, so it fails safe by
          # keeping the full Core suite selected.
          $ownedByOtherSuites = @(
            "Pipeline/TaskReviewAgent/codex_supervisor.py",
            "Pipeline/TaskReviewAgent/codex_supervisor_turn.py",
            "Pipeline/TaskReviewAgent/goal_loop_guard.py",
            "Pipeline/TaskReviewAgent/operator_logging.py",
            "Pipeline/TaskReviewAgent/Start-GameTaskAgent.ps1",
            "Pipeline/TaskReviewAgent/NativeCommand.ps1",
            "Pipeline/TaskReviewAgent/openai_downstream.py",
            "Pipeline/TaskReviewAgent/openai_pipeline.py",
            "Pipeline/TaskReviewAgent/delivery_review.py",
            "Pipeline/TaskReviewAgent/downstream_action_grounding.py",
            "Pipeline/TaskReviewAgent/downstream_determinism.py",
            "Pipeline/TaskReviewAgent/downstream_issue.py",
            "Pipeline/TaskReviewAgent/downstream_pipeline.py",
            "Pipeline/TaskReviewAgent/downstream_resilience.py",
            "Pipeline/TaskReviewAgent/downstream_runtime.py",
            "Pipeline/TaskReviewAgent/mainline_reintegration.py",
            "Pipeline/TaskReviewAgent/merge_closeout_check_repoll.py",
            "Pipeline/TaskReviewAgent/production_pipeline.py",
            "Pipeline/TaskReviewAgent/candidate_integration.py",
            "Pipeline/TaskReviewAgent/execution_bridge.py",
            "Pipeline/TaskReviewAgent/pipeline_scope.py",
            "Pipeline/TaskReviewAgent/pull_request_check_authority.py",
            "Pipeline/TaskReviewAgent/tests/codex_supervisor_smoke_test.py",
            "Pipeline/TaskReviewAgent/tests/codex_supervisor_turn_smoke_test.py",
            "Pipeline/TaskReviewAgent/tests/compose_supervisor_volume_smoke_test.py",
            "Pipeline/TaskReviewAgent/tests/progress_logging_smoke_test.py",
            "Pipeline/TaskReviewAgent/tests/goal_loop_guard_smoke_test.py",
            "Pipeline/TaskReviewAgent/tests/native_command_smoke_test.ps1",
            "Pipeline/TaskReviewAgent/tests/delivery_review_smoke_test.py",
            "Pipeline/TaskReviewAgent/tests/downstream_action_grounding_smoke_test.py",
            "Pipeline/TaskReviewAgent/tests/downstream_determinism_smoke_test.py",
            "Pipeline/TaskReviewAgent/tests/downstream_issue_smoke_test.py",
            "Pipeline/TaskReviewAgent/tests/downstream_resilience_smoke_test.py",
            "Pipeline/TaskReviewAgent/tests/downstream_smoke_test.py",
            "Pipeline/TaskReviewAgent/tests/mainline_reintegration_smoke_test.py",
            "Pipeline/TaskReviewAgent/tests/merge_closeout_check_repoll_smoke_test.py",
            "Pipeline/TaskReviewAgent/tests/production_controller_smoke_test.py",
            "Pipeline/TaskReviewAgent/tests/production_pipeline_smoke_test.py",
            "Pipeline/TaskReviewAgent/tests/scene_path_contract_migration_smoke_test.py"
          )

          # Ordinary task delivery changes game/content surfaces plus immutable
          # TaskGraph evidence, not the TaskReviewAgent implementation. The
          # always-on split-regression, compile, and whitespace steps below
          # still run, and D1B.2 independently validates persistent TaskGraph
          # evidence. Keep this prefix list narrow: Tasks/**, pipeline code,
          # workflow changes, and every unknown path still select full Core.
          $ordinaryDeliveryPrefixes = @(
            "Assets/",
            "Pipeline/TaskGraph/evidence/"
          )

          $baseSha = "${{ github.event.pull_request.base.sha }}"
          if ([string]::IsNullOrWhiteSpace($baseSha)) {
            Write-Host "No PR base SHA (e.g. workflow_dispatch); running the full Core suite."
            $runFullCore = $true
          } else {
            $changed = git diff --name-only "$baseSha...HEAD"
            $runFullCore = $false
            foreach ($path in $changed) {
              $ordinaryDelivery = $false
              foreach ($prefix in $ordinaryDeliveryPrefixes) {
                if ($path.StartsWith($prefix, [System.StringComparison]::Ordinal)) {
                  $ordinaryDelivery = $true
                  break
                }
              }
              if (
                $ownedByOtherSuites -notcontains $path -and
                -not $ordinaryDelivery
              ) {
                Write-Host "Core-relevant change: $path"
                $runFullCore = $true
              }
            }
          }

          if ($runFullCore) {
            Write-Host "Running the full Core regression suite."
          } else {
            Write-Host "Every changed file is suite-owned or ordinary task delivery; skipping the expensive Core suite cheaply."
          }
          "run_full_core=$($runFullCore.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Configure deterministic Git fixture identity
        run: |
          git config --global user.name "TaskReviewAgent Tests"
          git config --global user.email "task-review-agent-tests@example.invalid"

      - name: Enforce non-attributable automation Git identities
        if: steps.scope.outputs.run_full_core == 'true'
        shell: pwsh
        run: |
          $test = "Pipeline/TaskReviewAgent/tests/git_identity_guard_smoke_test.py"
          if (Test-Path -LiteralPath $test -PathType Leaf) {
            python $test
            if ($LASTEXITCODE -ne 0) {
              throw "Automation Git-identity guard tests failed."
            }
          } else {
            Write-Host "Legacy exact PR head predates the Git-identity guard; existing immutable history is grandfathered."
          }

      - name: Run completed Issue duplicate guard tests
        if: steps.scope.outputs.run_full_core == 'true'
        shell: pwsh
        run: |
          $test = "Pipeline/TaskReviewAgent/tests/completed_issue_guard_smoke_test.py"
          if (Test-Path -LiteralPath $test -PathType Leaf) {
            python $test
            if ($LASTEXITCODE -ne 0) {
              throw "Completed Issue duplicate guard tests failed."
            }
          } else {
            Write-Host "Legacy exact PR head predates completed-Issue duplicate prevention."
          }

      - name: Run actor authorization and public-trust boundary tests
        if: steps.scope.outputs.run_full_core == 'true'
        shell: pwsh
        run: |
          $test = "Pipeline/TaskReviewAgent/tests/actor_authorization_smoke_test.py"
          if (Test-Path -LiteralPath $test -PathType Leaf) {
            python $test
            if ($LASTEXITCODE -ne 0) {
              throw "Actor authorization tests failed."
            }
          } else {
            Write-Host "Legacy exact PR head predates the committed actor authorization policy."
          }

      - name: Run TaskGraph review Issue materialization tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/taskgraph_review_issue_materialization_smoke_test.py

      - name: Run committed task contract loader tests
        if: steps.scope.outputs.run_full_core == 'true'
        shell: pwsh
        run: |
          $test = "Pipeline/TaskReviewAgent/tests/committed_task_loader_smoke_test.py"
          if (Test-Path -LiteralPath $test -PathType Leaf) {
            python $test
            if ($LASTEXITCODE -ne 0) {
              throw "Committed task loader tests failed."
            }
          } else {
            Write-Host "Legacy exact PR head predates the shared committed-task loader."
          }

      - name: Run exclusive resource reservation tests
        if: steps.scope.outputs.run_full_core == 'true'
        shell: pwsh
        run: |
          $test = "Pipeline/TaskReviewAgent/tests/resource_reservation_smoke_test.py"
          if (Test-Path -LiteralPath $test -PathType Leaf) {
            python $test
            if ($LASTEXITCODE -ne 0) {
              throw "Resource reservation tests failed."
            }
          } else {
            Write-Host "Legacy exact PR head predates open-Issue resource reservation."
          }

      - name: Run Unity evidence log hygiene tests
        if: steps.scope.outputs.run_full_core == 'true'
        shell: pwsh
        run: |
          $test = "Pipeline/Testing/unity_log_hygiene_smoke_test.py"
          if (Test-Path -LiteralPath $test -PathType Leaf) {
            python $test
            if ($LASTEXITCODE -ne 0) {
              throw "Unity evidence-log hygiene tests failed."
            }
          } else {
            Write-Host "Legacy PR head predates Unity evidence-log hygiene; compatibility whitespace policy still applies."
          }

      - name: Run deterministic TaskReviewAgent smoke tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/task_review_agent_smoke_test.py

      - name: Run durable Issue workflow smoke tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/issue_workflow_smoke_test.py

      - name: Run pending-transition label-event smoke tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/pending_transition_label_event_smoke_test.py

      - name: Run software architect preflight smoke tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/architect_preflight_smoke_test.py

      - name: Run architect session lifecycle owner smoke tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/architect_session_owner_smoke_test.py

      - name: Run Software Architect adapter constructor-contract tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Gauntlet/SoftwareArchitectAcceptance/scheduler_adapter_contract_smoke_test.py

      - name: Run polling orchestrator smoke tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/polling_orchestrator_smoke_test.py

      - name: Run autonomous graph controller smoke tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/autonomous_graph_run_smoke_test.py

      - name: Run production graph snapshot smoke tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/production_graph_snapshot_smoke_test.py

      - name: Run autonomous graph CLI smoke tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/autonomous_graph_cli_smoke_test.py

      - name: Run autonomous graph launcher smoke tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/autonomous_graph_launcher_smoke_test.py

      - name: Run execution routing and worker-boundary smoke tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/execution_routing_smoke_test.py

      - name: Run provider-session pool state-machine smoke tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/ExecutionCrew/tests/session_pool_smoke_test.py

      - name: Run pooled ExecutionCrew role smoke tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/ExecutionCrew/tests/pooled_run_crew_smoke_test.py

      - name: Run production ExecutionCrew pool-owner smoke tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/execution_session_pool_smoke_test.py

      - name: Run decomposition validation policy audit smoke tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/decomposition_policy_audit_smoke_test.py

      - name: Run host decomposition lifecycle smoke tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/host_decomposition_launcher_smoke_test.py

      - name: Run synthetic gauntlet setup smoke tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/prepare_synthetic_gauntlet_smoke_test.py

      - name: Run private synthetic gauntlet approver smoke tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/synthetic_gauntlet_approver_smoke_test.py

      - name: Run muffcabbage single-task end-to-end acceptance test
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/muffcabbage_end_to_end_smoke_test.py

      - name: Run automated synthetic evidence event smoke tests
        if: steps.scope.outputs.run_full_core == 'true'
        shell: pwsh
        run: |
          python Pipeline/TaskReviewAgent/tests/automated_validation_event_smoke_test.py
          if ($LASTEXITCODE -ne 0) { throw "Automated validation event tests failed." }
          python Pipeline/TaskReviewAgent/tests/automated_decomposition_event_smoke_test.py
          if ($LASTEXITCODE -ne 0) { throw "Automated decomposition event tests failed." }

      - name: Run ephemeral Git-ref claim tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/claim_refs_smoke_test.py

      - name: Run real checkout boundary smoke tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/real_checkout_smoke_test.py

      - name: Run durable cross-agent checkout resume test
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/durable_checkout_smoke_test.py

      - name: Run resume after unrelated mainline progress test
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/resumable_checkout_smoke_test.py

      - name: Run contract migration checkout resume test
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/contract_migration_checkout_smoke_test.py

      - name: Run workflow runtime compatibility tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/workflow_runtime_smoke_test.py

      - name: Run real read-only observation CLI
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/run_agent.py --task-id NSC-050 --mode observe-real --source .

      - name: Run Stage 2 deterministic dispatch-plan tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/dispatch_plan_smoke_test.py

      - name: Run Stage 3 fresh-dispatch mutation boundary tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/fresh_dispatch_smoke_test.py

      - name: Run Stage 4 contention-retry tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: python Pipeline/TaskReviewAgent/tests/contention_retry_smoke_test.py

      - name: Run launcher admission and guarded reset tests
        if: steps.scope.outputs.run_full_core == 'true'
        run: |
          python Pipeline/TaskReviewAgent/tests/launcher_preflight_smoke_test.py
          python Pipeline/TaskReviewAgent/tests/human_action_wait_smoke_test.py
          python Pipeline/TaskReviewAgent/tests/reset_task_smoke_test.py

      - name: Run decomposition authorization binder tests
        if: steps.scope.outputs.run_full_core == 'true'
        shell: pwsh
        run: |
          $test = "Pipeline/TaskReviewAgent/tests/decomposition_authorization_smoke_test.py"
          if (Test-Path -LiteralPath $test -PathType Leaf) {
            python $test
            if ($LASTEXITCODE -ne 0) {
              throw "Decomposition authorization binder tests failed."
            }
          } else {
            Write-Host "Legacy exact PR head predates the decomposition authorization binder."
          }

      - name: Run Core/Supervisor/Delivery CI split regression tests
        run: python Pipeline/TaskReviewAgent/tests/ci_workflow_split_smoke_test.py

      - name: Compile TaskReviewAgent
        run: python -m compileall -q Pipeline/TaskReviewAgent

      - name: Change whitespace check
        shell: pwsh
        run: |
          $baseSha = "${{ github.event.pull_request.base.sha }}"
          $evidenceLogExclusion = ":(exclude)Pipeline/TaskGraph/evidence/**/artifacts/*.log"
          if ([string]::IsNullOrWhiteSpace($baseSha)) {
            git diff --check HEAD^...HEAD -- . $evidenceLogExclusion
          } else {
            git diff --check "$baseSha...HEAD" -- . $evidenceLogExclusion
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Whitespace validation failed."
          }
