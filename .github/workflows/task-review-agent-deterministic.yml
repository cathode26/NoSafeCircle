name: TaskReviewAgent Deterministic Validation

on:
  pull_request:
    paths:
      - ".github/workflows/task-review-agent-deterministic.yml"
      - "Pipeline/TaskReviewAgent/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic TaskReviewAgent smoke tests
        run: python Pipeline/TaskReviewAgent/tests/task_review_agent_smoke_test.py

      - name: Run real read-only observation CLI
        run: python Pipeline/TaskReviewAgent/run_agent.py --task-id NSC-050 --mode observe-real --source .

      - name: Compile TaskReviewAgent
        run: python -m compileall -q Pipeline/TaskReviewAgent

      - name: Change whitespace check
        shell: pwsh
        run: |
          $baseSha = "${{ github.event.pull_request.base.sha }}"
          if ([string]::IsNullOrWhiteSpace($baseSha)) {
            git diff --check HEAD^...HEAD
          } else {
            git diff --check "$baseSha...HEAD"
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Whitespace validation failed."
          }

      - name: Verify clean checkout
        shell: pwsh
        run: |
          $status = git status --porcelain=v1 --untracked-files=all
          if ($status) {
            git status --short --untracked-files=all
            throw "Deterministic validation changed the checkout."
          }
