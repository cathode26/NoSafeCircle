name: TaskReviewAgent Deterministic Validation

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "compose.override.yaml"
      - "Pipeline/TaskReviewAgent/**"
      - "Pipeline/TaskGraph/**"
      - "Pipeline/Testing/**"
      - "Tasks/**"
      - "Docs/AI-Pipeline/ISSUE_WORKFLOW_STATE_MACHINE.md"
      - "Docs/AI-Pipeline/GITHUB_TICKET_ORCHESTRATION_MVP.md"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure deterministic Git fixture identity
        run: |
          git config --global user.name "TaskReviewAgent Tests"
          git config --global user.email "task-review-agent-tests@example.invalid"

      - name: Enforce non-attributable automation Git identities
        shell: pwsh
        run: |
          $test = "Pipeline/TaskReviewAgent/tests/git_identity_guard_smoke_test.py"
          if (Test-Path -LiteralPath $test -PathType Leaf) {
            python $test
            if ($LASTEXITCODE -ne 0) {
              throw "Automation Git-identity guard tests failed."
            }
          } else {
            Write-Host "Legacy exact PR head predates the Git-identity guard; existing immutable history is grandfathered."
          }

      - name: Parse Game Task Agent PowerShell launcher
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "Pipeline/TaskReviewAgent/Start-GameTaskAgent.ps1").Path,
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "Game Task Agent PowerShell parsing failed."
          }

      - name: Run Windows PowerShell native stderr smoke test
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File "Pipeline/TaskReviewAgent/tests/native_command_smoke_test.ps1"
          if ($LASTEXITCODE -ne 0) {
            throw "Windows PowerShell native stderr smoke test failed."
          }

      - name: Verify external Codex credential volume declaration
        run: python Pipeline/TaskReviewAgent/tests/compose_supervisor_volume_smoke_test.py

      - name: Run API-key-free Codex supervisor smoke tests
        run: python Pipeline/TaskReviewAgent/tests/codex_supervisor_smoke_test.py

      - name: Run strict Codex supervisor turn smoke tests
        run: python Pipeline/TaskReviewAgent/tests/codex_supervisor_turn_smoke_test.py

      - name: Run live progress logging smoke tests
        run: python Pipeline/TaskReviewAgent/tests/progress_logging_smoke_test.py

      - name: Run checkout circuit-breaker smoke tests
        run: python Pipeline/TaskReviewAgent/tests/goal_loop_guard_smoke_test.py

      - name: Run mainline reintegration smoke tests
        run: python Pipeline/TaskReviewAgent/tests/mainline_reintegration_smoke_test.py

      - name: Run canonical scene path and contract migration smoke tests
        run: python Pipeline/TaskReviewAgent/tests/scene_path_contract_migration_smoke_test.py

      - name: Run downstream PASS carry-forward and rejection guard tests
        run: python Pipeline/TaskReviewAgent/tests/downstream_resilience_smoke_test.py

      - name: Run downstream authority and deterministic routing tests
        run: python Pipeline/TaskReviewAgent/tests/downstream_determinism_smoke_test.py

      - name: Run downstream action grounding tests
        run: python Pipeline/TaskReviewAgent/tests/downstream_action_grounding_smoke_test.py

      - name: Run merge-closeout check repoll tests
        shell: pwsh
        run: |
          $test = "Pipeline/TaskReviewAgent/tests/merge_closeout_check_repoll_smoke_test.py"
          if (Test-Path -LiteralPath $test -PathType Leaf) {
            python $test
            if ($LASTEXITCODE -ne 0) {
              throw "Merge-closeout check repoll tests failed."
            }
          } else {
            Write-Host "Legacy exact PR head predates merge-closeout check repolling."
          }

      - name: Run completed Issue duplicate guard tests
        shell: pwsh
        run: |
          $test = "Pipeline/TaskReviewAgent/tests/completed_issue_guard_smoke_test.py"
          if (Test-Path -LiteralPath $test -PathType Leaf) {
            python $test
            if ($LASTEXITCODE -ne 0) {
              throw "Completed Issue duplicate guard tests failed."
            }
          } else {
            Write-Host "Legacy exact PR head predates completed-Issue duplicate prevention."
          }

      - name: Run actor authorization and public-trust boundary tests
        shell: pwsh
        run: |
          $test = "Pipeline/TaskReviewAgent/tests/actor_authorization_smoke_test.py"
          if (Test-Path -LiteralPath $test -PathType Leaf) {
            python $test
            if ($LASTEXITCODE -ne 0) {
              throw "Actor authorization tests failed."
            }
          } else {
            Write-Host "Legacy exact PR head predates the committed actor authorization policy."
          }

      - name: Run committed task contract loader tests
        shell: pwsh
        run: |
          $test = "Pipeline/TaskReviewAgent/tests/committed_task_loader_smoke_test.py"
          if (Test-Path -LiteralPath $test -PathType Leaf) {
            python $test
            if ($LASTEXITCODE -ne 0) {
              throw "Committed task loader tests failed."
            }
          } else {
            Write-Host "Legacy exact PR head predates the shared committed-task loader."
          }

      - name: Run exclusive resource reservation tests
        shell: pwsh
        run: |
          $test = "Pipeline/TaskReviewAgent/tests/resource_reservation_smoke_test.py"
          if (Test-Path -LiteralPath $test -PathType Leaf) {
            python $test
            if ($LASTEXITCODE -ne 0) {
              throw "Resource reservation tests failed."
            }
          } else {
            Write-Host "Legacy exact PR head predates open-Issue resource reservation."
          }

      - name: Run Unity evidence log hygiene tests
        shell: pwsh
        run: |
          $test = "Pipeline/Testing/unity_log_hygiene_smoke_test.py"
          if (Test-Path -LiteralPath $test -PathType Leaf) {
            python $test
            if ($LASTEXITCODE -ne 0) {
              throw "Unity evidence-log hygiene tests failed."
            }
          } else {
            Write-Host "Legacy PR head predates Unity evidence-log hygiene; compatibility whitespace policy still applies."
          }

      - name: Run deterministic TaskReviewAgent smoke tests
        run: python Pipeline/TaskReviewAgent/tests/task_review_agent_smoke_test.py

      - name: Run durable Issue workflow smoke tests
        run: python Pipeline/TaskReviewAgent/tests/issue_workflow_smoke_test.py

      - name: Run downstream Issue transition smoke tests
        run: python Pipeline/TaskReviewAgent/tests/downstream_issue_smoke_test.py

      - name: Run delivery review proposal smoke tests
        run: python Pipeline/TaskReviewAgent/tests/delivery_review_smoke_test.py

      - name: Run real checkout boundary smoke tests
        run: python Pipeline/TaskReviewAgent/tests/real_checkout_smoke_test.py

      - name: Run durable cross-agent checkout resume test
        run: python Pipeline/TaskReviewAgent/tests/durable_checkout_smoke_test.py

      - name: Run resume after unrelated mainline progress test
        run: python Pipeline/TaskReviewAgent/tests/resumable_checkout_smoke_test.py

      - name: Run contract migration checkout resume test
        run: python Pipeline/TaskReviewAgent/tests/contract_migration_checkout_smoke_test.py

      - name: Run production scope ExecutionCrew commit push test
        run: python Pipeline/TaskReviewAgent/tests/production_pipeline_smoke_test.py

      - name: Run connected Issue to human handoff test
        run: python Pipeline/TaskReviewAgent/tests/production_controller_smoke_test.py

      - name: Run downstream delivery and closeout smoke tests
        run: python Pipeline/TaskReviewAgent/tests/downstream_smoke_test.py

      - name: Run workflow runtime compatibility tests
        run: python Pipeline/TaskReviewAgent/tests/workflow_runtime_smoke_test.py

      - name: Run real read-only observation CLI
        run: python Pipeline/TaskReviewAgent/run_agent.py --task-id NSC-050 --mode observe-real --source .

      - name: Compile TaskReviewAgent
        run: python -m compileall -q Pipeline/TaskReviewAgent

      - name: Change whitespace check
        shell: pwsh
        run: |
          $baseSha = "${{ github.event.pull_request.base.sha }}"
          $evidenceLogExclusion = ":(exclude)Pipeline/TaskGraph/evidence/**/artifacts/*.log"
          if ([string]::IsNullOrWhiteSpace($baseSha)) {
            git diff --check HEAD^...HEAD -- . $evidenceLogExclusion
          } else {
            git diff --check "$baseSha...HEAD" -- . $evidenceLogExclusion
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Whitespace validation failed."
          }
