name: Apply Unity Evidence Whitespace Hygiene

on:
  push:
    branches:
      - fix/unity-evidence-whitespace-premerge

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out installer branch
        uses: actions/checkout@v4
        with:
          ref: fix/unity-evidence-whitespace-premerge
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Git identity
        shell: pwsh
        run: |
          git config user.name "No Safe Circle Pipeline"
          git config user.email "pipeline@users.noreply.github.com"

      - name: Repair generated-source escaping
        run: python Pipeline/Migrations/repair_unity_evidence_installer.py

      - name: Install deterministic evidence hygiene
        run: python Pipeline/Migrations/install_unity_evidence_whitespace_hygiene.py

      - name: Run Unity evidence-log hygiene tests
        run: python Pipeline/Testing/unity_log_hygiene_smoke_test.py

      - name: Parse authoritative Unity runner
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "Pipeline/Testing/run_unity_tests_clean.ps1").Path,
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "Authoritative Unity runner PowerShell parsing failed."
          }

      - name: Run TaskDelivery tests
        run: python Pipeline/TaskDelivery/tests/task_delivery_smoke_test.py

      - name: Run downstream closeout tests
        run: python Pipeline/TaskReviewAgent/tests/downstream_smoke_test.py

      - name: Validate TaskGraph
        run: python Pipeline/TaskGraph/taskcontrol.py validate

      - name: Check resulting whitespace
        shell: pwsh
        run: git diff --check

      - name: Keep workflow changes for authenticated follow-up
        shell: pwsh
        run: |
          git restore --source=HEAD --worktree --staged -- .github/workflows/d1b2-core-deterministic.yml
          git restore --source=HEAD --worktree --staged -- .github/workflows/task-review-agent-deterministic.yml
          git rm -f Pipeline/Migrations/install_unity_evidence_whitespace_hygiene.py
          git rm -f Pipeline/Migrations/repair_unity_evidence_installer.py

      - name: Commit and push installed non-workflow fix
        shell: pwsh
        run: |
          git add -A
          if (git diff --cached --quiet) {
            throw "Installer produced no non-workflow changes."
          }
          git commit -m "Normalize Unity evidence logs before merge"
          git push origin HEAD:fix/unity-evidence-whitespace-premerge
