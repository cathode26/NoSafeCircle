services:
  # The goal supervisor receives no repository or host tool authority. Host Python
  # sends one state/action prompt on stdin and validates the returned JSON action.
  codex-supervisor:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    stdin_open: true
    tty: false
    environment:
      CODEX_HOME: /home/agent/.codex
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "true"
      GIT_CONFIG_KEY_1: core.filemode
      GIT_CONFIG_VALUE_1: "false"
    volumes:
      - .:/workspace:ro
      - task-supervisor-codex-config:/home/agent/.codex
    command: ["bash"]

volumes:
  # Explicit volume identity lets the task agent reuse an already-authenticated
  # Codex CLI login regardless of the Compose project name used by older runs.
  task-supervisor-codex-config:
    name: ${NSC_TASK_SUPERVISOR_CODEX_VOLUME:-nosafecircle_codex-config}
