services:
  # Host Python sends one deterministic state/action prompt on stdin. Codex
  # returns one structured next action and receives no direct host tool authority.
  codex-supervisor:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    stdin_open: true
    tty: false
    environment:
      CODEX_HOME: /home/agent/.codex
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "true"
      GIT_CONFIG_KEY_1: core.filemode
      GIT_CONFIG_VALUE_1: "false"
    volumes:
      - .:/workspace:ro
      - task-supervisor-codex-config:/home/agent/.codex
    command: ["bash"]

volumes:
  # The launcher selects an already-authenticated Codex CLI volume and exports
  # its exact name. This avoids copying or exposing the stored credential.
  task-supervisor-codex-config:
    name: ${NSC_TASK_SUPERVISOR_CODEX_VOLUME:-nosafecircle_codex-config}
