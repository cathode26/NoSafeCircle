services:
  # Host Python sends one deterministic state/action prompt on stdin. Codex
  # returns one structured next action and receives no direct host tool authority.
  codex-supervisor:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    stdin_open: true
    tty: false
    environment:
      CODEX_HOME: /home/agent/.codex
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "true"
      GIT_CONFIG_KEY_1: core.filemode
      GIT_CONFIG_VALUE_1: "false"
    volumes:
      - .:/workspace:ro
      - task-supervisor-codex-config:/home/agent/.codex
    command: ["bash"]

  # The Claude supervisor route. Same contract as codex-supervisor: one
  # deterministic state/action prompt on stdin, one structured next action out,
  # no direct host tool authority, and the repository mounted read-only. It
  # authenticates from the Claude CLI volume, so a Claude-only run never needs
  # the operator's Codex credentials.
  claude-supervisor:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    stdin_open: true
    tty: false
    environment:
      CLAUDE_CONFIG_DIR: /home/agent/.claude
      DISABLE_AUTOUPDATER: "1"
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "true"
      GIT_CONFIG_KEY_1: core.filemode
      GIT_CONFIG_VALUE_1: "false"
    volumes:
      - .:/workspace:ro
      - task-supervisor-claude-config:/home/agent/.claude
    command: ["bash"]

volumes:
  # The launcher selects an already-authenticated Codex CLI volume and exports
  # its exact name. It is external because the selected volume may belong to an
  # older Compose project (for example nosafecircle-m2a); this avoids ownership
  # warnings while preserving the credential bytes in place.
  task-supervisor-codex-config:
    external: true
    name: ${NSC_TASK_SUPERVISOR_CODEX_VOLUME:-nosafecircle_codex-config}

  # The equivalent Claude store. It is external for the same reason: the
  # authenticated volume may belong to an older Compose project.
  task-supervisor-claude-config:
    external: true
    name: ${NSC_TASK_SUPERVISOR_CLAUDE_VOLUME:-nosafecircle_claude-config}
